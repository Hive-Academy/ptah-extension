<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Get started - Command deck | Ptah</title><link rel="stylesheet" href="tokens.css"><style>.identity{text-align:center;margin-bottom:29px}.identity .logo-medal{width:92px;height:92px;display:grid;place-items:center;margin:0 auto 12px;border-radius:28px;background:var(--glass2);border:1px solid var(--stroke);box-shadow:0 0 45px color-mix(in srgb,var(--gold) 22%,transparent)}.identity h1{font-size:31px;letter-spacing:-.04em;margin:0;color:var(--gold2)}.identity p{font-size:12px;color:var(--muted);margin:3px 0}.section-title{font-size:13px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;color:var(--gold2);margin:0 0 16px}.category{border-radius:20px;color:var(--ink);padding:11px 4px;min-height:99px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-size:12px;font-weight:700}.category .medal{width:44px;height:44px;border-radius:15px}.category .medal svg{width:21px;height:21px}.category[aria-selected=true]{background:color-mix(in srgb,var(--gold) 22%,var(--glass2));box-shadow:inset 0 0 0 1px var(--gold),0 12px 32px color-mix(in srgb,var(--gold) 24%,transparent);transform:translateY(-3px)}.prompt{text-align:left;color:var(--ink);padding:18px;display:flex;align-items:center;gap:13px;min-height:112px;transition:transform .2s,box-shadow .2s}.prompt:hover{transform:translateY(-3px)}.prompt .medal{width:42px;height:42px;border-radius:13px}.prompt .medal svg{width:19px;height:19px}.prompt-text{flex:1;min-width:0}.prompt strong{display:block;font-size:14px}.prompt small{display:block;margin-top:4px;color:var(--muted);font-size:12px}.arrow{color:var(--gold2);font-size:20px;opacity:0;transform:translateX(-6px);transition:.2s}.prompt:hover .arrow,.prompt:focus-visible .arrow{opacity:1;transform:none}#selection{font-size:11px;color:var(--muted);overflow-wrap:anywhere;min-height:16px;margin:14px 0}.glyph{text-align:center;color:var(--gold2);opacity:.6;letter-spacing:1em;margin-top:22px}.empty-layout{display:grid;grid-template-columns:148px 1fr;gap:12px}.category-rail{display:grid;gap:8px;align-content:start}.category-rail .category{min-height:72px;flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px}.category-rail .medal{width:39px;height:39px}.prompt-zone{min-width:0}.prompts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.prompts .prompt{min-height:137px;flex-direction:column;align-items:flex-start;justify-content:space-between}.prompts .prompt:first-child{grid-column:span 2;min-height:130px;flex-direction:row;align-items:center}.prompts .prompt:first-child .medal{width:56px;height:56px}.prompt .arrow{align-self:flex-end}@media(max-width:650px){.empty-layout{grid-template-columns:1fr}.category-rail{grid-template-columns:repeat(3,1fr)}.category-rail .category{min-height:80px;flex-direction:column;justify-content:center;gap:4px}.prompts{grid-template-columns:1fr 1fr}}@media(max-width:450px){.prompts{grid-template-columns:1fr}.prompts .prompt:first-child{grid-column:auto}}</style></head><body><div class="scene"><div class="aurora brand" aria-hidden="true"><span class="lights"></span></div><div class="dev"><a href="index.html">Gallery</a><button type="button" id="theme">Light theme</button></div><main><div class="chat"><div class="identity"><div class="logo-medal"><img class="logo" src="ptah-icon.png" alt="Ptah"></div><h1>Ptah</h1><p>Ancient Wisdom &#8226; Master Craftsman</p></div><h2 class="section-title">Get started</h2><div class="empty-layout"><div class="category-rail" role="tablist" aria-label="Prompt categories"><button type="button" class="category glass" role="tab" aria-selected="true" data-category="build"><span class="medal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5L12 2Z"/></svg></span><span>Build</span></button><button type="button" class="category glass" role="tab" aria-selected="false" data-category="fix"><span class="medal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8a9 9 0 1 0 1 6m0-11v5h-5M12 8v4l3 2"/></svg></span><span>Fix</span></button><button type="button" class="category glass" role="tab" aria-selected="false" data-category="review"><span class="medal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 7v5c0 5 4 8 9 10 5-2 9-5 9-10V7l-9-4Zm-4 9 3 3 5-5"/></svg></span><span>Review</span></button><button type="button" class="category glass" role="tab" aria-selected="false" data-category="agents"><span class="medal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M4 9h16v11H4V9Zm4 5h.01M16 14h.01M8 20v2m8-2v2"/></svg></span><span>Agents</span></button><button type="button" class="category glass" role="tab" aria-selected="false" data-category="explore"><span class="medal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm6-2 5 5"/></svg></span><span>Explore</span></button><button type="button" class="category glass" role="tab" aria-selected="false" data-category="creative"><span class="medal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h2a2 2 0 0 0 1-4 2 2 0 0 1 1-4h2a3 3 0 0 0 3-3 9 9 0 0 0-9-7ZM7 10h.01M10 7h.01M15 7h.01"/></svg></span><span>Creative</span></button></div><div class="prompt-zone"><div class="prompts" id="prompts" role="tabpanel" aria-live="polite"></div><p id="selection" aria-live="polite"></p></div></div><div class="glyph" aria-hidden="true">&#10022; &#10022; &#10022;</div></div></main></div><script>document.getElementById('theme').onclick=()=>{let h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';document.getElementById('theme').textContent=h.dataset.theme==='dark'?'Light theme':'Dark theme'};document.addEventListener('pointermove',v=>{let e=v.target.closest('.glass');if(e){let r=e.getBoundingClientRect();e.style.setProperty('--x',(v.clientX-r.left)+'px');e.style.setProperty('--y',(v.clientY-r.top)+'px')}});const prompts={
build:[['Orchestrate a feature','Plan, implement, review','/orchestrate Build [describe your feature] with full workflow orchestration'],['Bootstrap SaaS workspace','Nx + NestJS + Angular','/saas-workspace-initializer Initialize a new SaaS project with Nx, NestJS, and Angular'],['Design NestJS feature','Controller-service-Prisma','/nestjs-backend-patterns Design a NestJS feature module for [domain] with provider pattern and Prisma'],['Add Angular component','Signals, OnPush, split','/angular-frontend-patterns Add a new Angular component with signals, OnPush, and smart/dumb split'],['Generate project harness','Setup wizard scan','Open the Setup Wizard, scan this workspace, analyze the project, and generate a harness.']],
fix:[['Fix a bug','Diagnose, fix, verify',"/orchestrate BUGFIX: Fix [describe the bug you're seeing]"],['Run fix fleet','Multi-agent bugfix batch','/orchestrate TASK_A TASK_B Run a multi-agent fix fleet'],['Humanize messy library','Refactor for readability','/humanize-library Refactor [library path] into single-responsibility files with clear names and no duplication'],['Extract UI feature','Move feature to component','/extract-and-relocate-angular-component-feature Move [feature] from [source component] into a new self-contained component in [destination]']],
review:[['Code quality review','Style, patterns, best practices','/review-code'],['Logic correctness review','Business logic & edge cases','/review-logic'],['Security vulnerability scan','OWASP top 10, auth, injection','/review-security'],['Code review tribunal','Multi-vendor cited verdict','/tribunal Review [module] with a multi-vendor panel and synthesize a cited verdict'],['Audit UX','Accessibility and hierarchy','/impeccable Audit the UX of [page/component] for accessibility, visual hierarchy, and performance']],
agents:[['Spawn CLI agent lane','Background implementation worker','/agent-lanes Spawn a background CLI agent lane to implement [task]'],['Run headless Ptah','JSON-RPC CI pipeline','/ptah-cli-usage Run a headless Ptah CLI session over JSON-RPC to [execute task/serve MCP]'],['Start tribunal panel','Council, Forge, or Crucible','/tribunal Start a tribunal panel for [topic] and render a cited verdict'],['Deploy fix fleet','Parallel agent task swarm','/orchestrate TASK_A TASK_B Coordinate a fix fleet with judge and commit']],
explore:[['Analyze architecture','Dependency graph deep dive','/orchestrate RESEARCH: Analyze the codebase architecture, map the dependency graph, and document key patterns and boundaries'],['Index workspace','Symbols and quality metrics','Use Workspace Indexing to scan this workspace and report symbols, dependencies, and code quality metrics.'],['View task board','.ptah/specs statuses','Show the .ptah/specs task board and report tasks grouped by status.'],['Browse marketplace','Plugins and skills','Open the Ptah Marketplace and list available plugins or skills for [category].'],['Search memory','Prior decisions','Search the Memory Curator for prior decisions and context about [topic].']],
creative:[['Design landing page','Brand discovery and tokens','/ui-ux-designer Design a landing page for [product] with brand discovery and design tokens'],['Add 3D scene','Three.js Angular scene','/angular-3d-scene-crafter Create a 3D hero scene with neon lights and floating geometric shapes'],['Add scroll animation','GSAP ScrollTrigger effects','/angular-gsap-animation-crafter Add scroll-triggered animations with parallax to [section]'],['Write technical content','Blog grounded in code','/technical-content-writer Write a technical blog post about [topic] grounded in our codebase'],['Record video showcase','Narrated product demo','/video-showcase Record a narrated marketing demo of [feature]']]};const panel=document.getElementById('prompts');function render(k){panel.replaceChildren();for(const [title,subtitle,command] of prompts[k]){const b=document.createElement('button');b.className='glass prompt';b.type='button';b.setAttribute('aria-label',title+': '+subtitle);const icon=document.createElement('span');icon.className='medal';icon.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5L12 2Z"/></svg>';const text=document.createElement('span');text.className='prompt-text';const strong=document.createElement('strong'),small=document.createElement('small');strong.textContent=title;small.textContent=subtitle;text.append(strong,small);const arr=document.createElement('span');arr.className='arrow';arr.textContent='?';b.append(icon,text,arr);b.onclick=()=>{document.getElementById('selection').textContent=command};panel.append(b)}}render('build');document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-category]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));render(b.dataset.category);document.getElementById('selection').textContent=''})</script></body></html>
