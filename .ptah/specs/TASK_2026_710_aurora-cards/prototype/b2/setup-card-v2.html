<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Get ready - Atelier | Ptah</title><link rel="stylesheet" href="tokens.css"><style>.top{text-align:right;margin-bottom:16px}.setup-v2{display:grid;grid-template-columns:190px 1fr;gap:12px}.setup-v2 .readiness{min-height:100%;padding:25px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between}.setup-v2 .readiness h1{font-size:30px;margin:8px 0}.setup-v2 .readiness p{font-size:13px;line-height:1.5;color:var(--muted)}.setup-v2 .ring{width:102px;height:102px}.setup-v2 .ring::before{width:78px;height:78px}.setup-stack{display:grid;gap:12px}.setup-stack .setup-tile{display:grid;grid-template-columns:52px 1fr;gap:10px 14px;align-items:center;min-height:145px}.setup-stack .setup-tile h3{margin:0 0 3px}.setup-stack .setup-tile .btn{grid-column:2;justify-self:start;margin:0}.setup-v2 .tools{grid-column:1/-1}[hidden].setup-stack{display:none}@media(max-width:620px){.setup-v2{grid-template-columns:1fr}.setup-v2 .readiness{flex-direction:row;align-items:center;gap:12px}.setup-v2 .ring{flex:none}}</style></head><body><div class="scene"><div class="aurora" aria-hidden="true"><span class="lights"></span></div><div class="dev"><a href="index.html" aria-label="Prototype gallery">Gallery</a><button type="button" id="theme">Light theme</button><button type="button" id="state">0 of 2 ready</button></div><main><div class="chat"><div class="top"><button class="btn" type="button">+ New session</button></div><div class="setup-v2"><section class="glass beam readiness"><div><span class="eyebrow">Before you begin</span><h1 id="readiness">Get ready</h1><p>Prepare your skills and agents so Ptah can understand your workspace.</p><span class="badge">0 of 2 ready</span></div><div class="ring" style="--pct:0%"><span>0<small>/2</small></span></div></section><div class="setup-stack"><article class="glass tile setup-tile"><div class="medal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h6v18H6a2 2 0 0 0-2 2V5Zm8-2h6a2 2 0 0 1 2 2v18a2 2 0 0 0-2-2h-6V3Z"/></svg></div><div><h3>Skills</h3><p class="status" data-kind="book">No skills enabled</p></div><button class="btn ghost" type="button">Open Library</button></article><article class="glass tile setup-tile"><div class="medal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v3m-6 7h12m-9 5h.01M15 17h.01M5 9h14v11H5V9Z"/></svg></div><div><h3>Agents</h3><p class="status" data-kind="bot">Not configured</p></div><button class="btn ghost" type="button">Configure</button></article><article class="glass tile setup-tile"><div class="medal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5h4m8 0h4v4M4 15v4h4m8 0h4v-4M7 12h10"/></svg></div><div><h3>Project scan</h3><p class="status" data-kind="scan">Run setup to scan this workspace</p></div><button class="btn ghost" type="button">Run setup</button></article></div><div class="tools"><span>Setup tools</span><button type="button">Generate agents</button><button type="button">Project guidance</button></div></div><p class="ready-note" hidden>Ready. <button class="btn ghost" type="button">Run setup</button></p></div></main></div><script>document.getElementById('theme').onclick=()=>{let h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';document.getElementById('theme').textContent=h.dataset.theme==='dark'?'Light theme':'Dark theme'};document.querySelectorAll('.glass').forEach(e=>e.addEventListener('pointermove',v=>{let r=e.getBoundingClientRect();e.style.setProperty('--x',(v.clientX-r.left)+'px');e.style.setProperty('--y',(v.clientY-r.top)+'px')}));let n=0;document.getElementById('state').onclick=()=>{n=(n+1)%3;let all=n===2;document.getElementById('state').textContent=n+' of 2 ready';document.querySelector('.ring').style.setProperty('--pct',(n*50)+'%');document.querySelector('.ring span').innerHTML=n+'<small>/2</small>';document.getElementById('readiness').textContent=all?'Ready':'Get ready';document.querySelectorAll('[data-kind]').forEach(e=>{let k=e.dataset.kind;e.textContent=k==='book'&&n>=1?'Ready':k==='bot'&&n>=2?'1 agent configured':k==='book'?'No skills enabled':k==='bot'?'Not configured':'Run setup to scan this workspace'});document.querySelector('[data-kind=book]').closest('article').querySelector('button').textContent='Open Library';document.querySelector('[data-kind=bot]').closest('article').querySelector('button').textContent=n===2?'Update':'Configure';document.querySelector('.badge').textContent=n+' of 2 ready';document.querySelector('.setup-stack').hidden=all;document.querySelector('.ready-note').hidden=!all};</script></body></html>
