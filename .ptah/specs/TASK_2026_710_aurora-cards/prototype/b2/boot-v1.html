<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boot - Halo | Ptah</title><link rel="stylesheet" href="tokens.css"><style>.boot{max-width:1000px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:auto;padding:80px 22px 40px;text-align:center}.boot-logo{width:112px;height:112px;display:grid;place-items:center;border-radius:35px;background:var(--glass2);border:1px solid var(--stroke);box-shadow:0 0 75px color-mix(in srgb,var(--gold) 28%,transparent)}.boot-logo .logo{width:77px;height:77px}.boot h1{font-size:44px;letter-spacing:-.05em;margin:16px 0 0}.headline{font-size:15px;color:var(--gold2);min-height:22px}.boot .ring{margin:23px 0 4px;width:120px;height:120px}.boot .ring::before{width:92px;height:92px}.elapsed{font-size:12px;color:var(--muted)}.stage-track{list-style:none;padding:0;margin:40px 0 0;width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.stage-track li{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted);font-size:12px}.stage-track li:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 25px);width:calc(100% - 35px);height:2px;background:var(--stroke)}.step-dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--glass2);border:1px solid var(--stroke);font-size:11px;font-weight:800}.step[data-state=done] .step-dot{background:var(--ok);color:var(--button-ink)}.step[data-state=active]{color:var(--ink)}.step[data-state=active] .step-dot{color:var(--button-ink);background:var(--gold);box-shadow:0 0 26px var(--gold)}@media(max-width:620px){.stage-track{grid-template-columns:1fr;text-align:left;max-width:320px}.stage-track li{flex-direction:row}.stage-track li:not(:last-child)::after{display:none}}</style></head><body><div class="scene"><div class="aurora brand" aria-hidden="true"><span class="lights"></span></div><div class="dev"><a href="index.html">Gallery</a><button id="theme" type="button">Light theme</button><button id="next" type="button">Next stage</button></div><main><div class="boot"><div class="boot-logo"><img class="logo" src="ptah-icon.png" alt="Ptah"></div><h1>Ptah</h1><p id="headline" class="headline" aria-live="polite">Syncing the agent harness</p><div class="ring" style="--pct:60%"><span>60%</span></div><span id="stage" hidden></span><p class="elapsed">00:03 elapsed</p><ol class="stage-track" aria-label="Startup stages"><li class="step" data-state="pending"><span class="step-dot">01</span><span>Starting up</span></li><li class="step" data-state="pending"><span class="step-dot">02</span><span>Opening the database</span></li><li class="step" data-state="pending"><span class="step-dot">03</span><span>Syncing the agent harness</span></li><li class="step" data-state="pending"><span class="step-dot">04</span><span>Importing sessions</span></li><li class="step" data-state="pending"><span class="step-dot">05</span><span>Indexing the workspace</span></li></ol></div></main></div><script>document.getElementById('theme').onclick=()=>{let h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';document.getElementById('theme').textContent=h.dataset.theme==='dark'?'Light theme':'Dark theme'};const steps=['Starting up','Opening the database','Syncing the agent harness','Importing sessions','Indexing the workspace'];let at=2;function paint(){document.getElementById('headline').textContent=steps[at];document.getElementById('stage').textContent=steps[at];document.querySelectorAll('.step').forEach((e,i)=>{e.dataset.state=i<at?'done':i===at?'active':'pending';e.setAttribute('aria-current',i===at?'step':'false')});document.querySelector('.ring').style.setProperty('--pct',((at+1)*20)+'%');document.querySelector('.ring span').textContent=((at+1)*20)+'%'}document.getElementById('next').onclick=()=>{at=(at+1)%steps.length;paint()};paint();</script></body></html>
