<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boot - Sequence | Ptah</title><link rel="stylesheet" href="tokens.css"><style>.boot-split{width:min(100% - 40px,1000px);min-height:100vh;margin:auto;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:34px;padding:80px 0}.boot-focus{padding:46px;min-height:550px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}.boot-focus .boot-logo{width:108px;height:108px;display:grid;place-items:center;border-radius:30px;background:var(--glass2);border:1px solid var(--stroke)}.boot-focus .logo{width:74px;height:74px}.boot-focus h1{font-size:56px;letter-spacing:-.06em;margin:20px 0 3px}.headline{font-size:19px;color:var(--gold2)}.boot-focus .ring{margin:20px 0 0}.elapsed{color:var(--muted);font-size:12px}.stage-pane{padding:35px;min-height:550px;display:flex;flex-direction:column;justify-content:center}.stage-pane h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);margin:0 0 20px}.stage-track{list-style:none;margin:0;padding:0;display:grid;gap:12px}.step{min-height:66px;display:flex;align-items:center;gap:15px;padding:10px 14px;border-radius:16px;color:var(--muted);font-size:13px}.step-dot{width:38px;height:38px;display:grid;place-items:center;border-radius:13px;background:var(--glass2);border:1px solid var(--stroke);font-size:11px;font-weight:800}.step[data-state=done] .step-dot{color:var(--button-ink);background:var(--ok)}.step[data-state=active]{background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--ink)}.step[data-state=active] .step-dot{color:var(--button-ink);background:var(--gold);box-shadow:0 0 22px var(--gold)}@media(max-width:780px){.boot-split{grid-template-columns:1fr}.boot-focus,.stage-pane{min-height:unset;padding:28px}.boot-focus{align-items:center;text-align:center}.stage-track{grid-template-columns:1fr 1fr}.step{min-height:60px}}@media(max-width:480px){.stage-track{grid-template-columns:1fr}}</style></head><body><div class="scene"><div class="aurora brand" aria-hidden="true"><span class="lights"></span></div><div class="dev"><a href="index.html">Gallery</a><button id="theme" type="button">Light theme</button><button id="next" type="button">Next stage</button></div><main><div class="boot-split"><section class="glass beam boot-focus"><div class="boot-logo"><img class="logo" src="ptah-icon.png" alt="Ptah"></div><h1>Ptah</h1><p id="headline" class="headline" aria-live="polite">Syncing the agent harness</p><div class="ring" style="--pct:60%"><span>60%</span></div><p class="elapsed">00:03 elapsed</p></section><section class="glass stage-pane"><h2>Startup sequence</h2><ol class="stage-track" aria-label="Startup stages"><li class="step" data-state="pending"><span class="step-dot">01</span><span>Starting up</span></li><li class="step" data-state="pending"><span class="step-dot">02</span><span>Opening the database</span></li><li class="step" data-state="pending"><span class="step-dot">03</span><span>Syncing the agent harness</span></li><li class="step" data-state="pending"><span class="step-dot">04</span><span>Importing sessions</span></li><li class="step" data-state="pending"><span class="step-dot">05</span><span>Indexing the workspace</span></li></ol><p id="stage" class="muted" aria-live="polite"></p></section></div></main></div><script>document.getElementById('theme').onclick=()=>{let h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';document.getElementById('theme').textContent=h.dataset.theme==='dark'?'Light theme':'Dark theme'};const steps=['Starting up','Opening the database','Syncing the agent harness','Importing sessions','Indexing the workspace'];let at=2;function paint(){document.getElementById('headline').textContent=steps[at];document.getElementById('stage').textContent=steps[at];document.querySelectorAll('.step').forEach((e,i)=>{e.dataset.state=i<at?'done':i===at?'active':'pending';e.setAttribute('aria-current',i===at?'step':'false')});document.querySelector('.ring').style.setProperty('--pct',((at+1)*20)+'%');document.querySelector('.ring span').textContent=((at+1)*20)+'%'}document.getElementById('next').onclick=()=>{at=(at+1)%steps.length;paint()};paint();</script></body></html>
