<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starting Ptah · prototype</title><link rel="stylesheet" href="tokens.css"><style>
.boot-wrap{min-height:calc(100vh - 84px);display:grid;place-items:center;padding:28px 24px 95px}.boot-stack{width:min(100%,540px);text-align:center}.boot-logo{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 0 21px var(--aurora-gold));margin-bottom:12px}.boot-wordmark{font-size:31px;font-weight:760;letter-spacing:-.06em;margin:0}.boot-kicker{color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:.24em;font-weight:800;margin:5px 0 32px}.boot-card{text-align:left;padding:31px 36px 27px}.boot-head{display:flex;align-items:center;gap:15px;padding-bottom:21px;border-bottom:1px solid var(--line)}.boot-head .icon-box{width:42px;height:42px}.boot-head .eyebrow{margin-bottom:3px}.boot-head h2{font-size:20px;letter-spacing:-.03em;line-height:1.2;margin:0}.step-list{list-style:none;padding:15px 0 3px;margin:0}.step{display:flex;align-items:center;gap:14px;min-height:45px;color:var(--muted);font-size:13px}.step .marker{width:21px;height:21px;border-radius:50%;border:1px solid var(--glass-border);display:grid;place-items:center;flex:none}.step .marker svg{display:none;width:13px;height:13px}.step.done{color:var(--ink)}.step.done .marker{color:var(--success);border-color:var(--success);background:var(--aurora-teal)}.step.done .marker svg{display:block}.step.active{color:var(--ink);font-weight:700}.step.active .marker{border-color:var(--gold);box-shadow:0 0 0 4px var(--aurora-gold),0 0 16px var(--aurora-gold);background:var(--gold)}.step.active .marker::after{content:"";width:5px;height:5px;background:var(--button-ink);border-radius:50%}.step .line{flex:1;height:1px;background:var(--line)}.step:last-child .line{display:none}.boot-bottom{display:flex;justify-content:space-between;gap:12px;padding-top:18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.boot-bottom span:last-child{font-variant-numeric:tabular-nums}.boot-caption{font-size:11px;color:var(--muted);margin:22px 0 8px}.boot-controls{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}.boot-controls button{width:32px;height:32px;background:var(--glass-soft);color:var(--muted);border:1px solid var(--glass-border);border-radius:10px}.boot-controls button[aria-pressed="true"]{background:var(--aurora-gold);color:var(--gold-strong);border-color:var(--glass-border-strong)}.boot-detail{font-size:11px;color:var(--muted);min-height:18px;margin:16px 0 0}.boot-wrap[data-readiness="degraded"] .boot-head h2,.boot-wrap[data-readiness="failed"] .boot-head h2{color:var(--gold-strong)}@media(max-width:600px){.boot-card{padding:24px 21px}.boot-wrap{padding:35px 16px 65px}}
</style></head><body><div class="scene"><div class="aurora" aria-hidden="true"></div><header class="chrome"><a class="brand" href="index.html"><img src="ptah-icon.png" alt="">Ptah</a><div class="chrome-actions"><span class="crumb">Desktop / Boot</span><button class="theme-toggle" id="theme" type="button" aria-label="Switch theme"><svg data-icon="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></svg><svg data-icon="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg><span>Theme</span></button></div></header><main class="boot-wrap" id="boot" data-readiness="ready"><div class="boot-stack" role="status" aria-live="polite"><img class="boot-logo" src="ptah-icon.png" alt=""><h1 class="boot-wordmark">Ptah</h1><p class="boot-kicker">Shaping your workspace</p><section class="glass boot-card" aria-label="Startup progress"><div class="boot-head"><span class="icon-box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/></svg></span><div><div class="eyebrow">Preparing your environment</div><h2 id="headline">Syncing the agent harness</h2></div></div><ol class="step-list" id="steps"><li class="step" data-phase="starting"><span class="marker"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></span>Starting up<span class="line"></span></li><li class="step" data-phase="database"><span class="marker"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></span>Opening the database<span class="line"></span></li><li class="step" data-phase="harness"><span class="marker"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></span>Syncing the agent harness<span class="line"></span></li><li class="step" data-phase="sessions"><span class="marker"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></span>Importing sessions<span class="line"></span></li><li class="step" data-phase="index"><span class="marker"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></span>Indexing the workspace<span class="line"></span></li></ol><div class="boot-bottom"><span id="phase-label">Stage 03 / 05</span><span id="elapsed">0s elapsed</span></div></section><p class="boot-detail" id="detail"></p><p class="boot-caption">Preview the five startup phases</p><div class="boot-controls" role="group" aria-label="Preview boot phase"><button type="button" data-index="0" aria-label="Starting up" aria-pressed="false">1</button><button type="button" data-index="1" aria-label="Opening the database" aria-pressed="false">2</button><button type="button" data-index="2" aria-label="Syncing the agent harness" aria-pressed="true">3</button><button type="button" data-index="3" aria-label="Importing sessions" aria-pressed="false">4</button><button type="button" data-index="4" aria-label="Indexing the workspace" aria-pressed="false">5</button></div></div></main></div><script>
const labels=['Starting up','Opening the database','Syncing the agent harness','Importing sessions','Indexing the workspace'];const steps=[...document.querySelectorAll('.step')];function show(i){steps.forEach((s,n)=>{s.classList.toggle('done',n<i);s.classList.toggle('active',n===i);s.dataset.state=n<i?'done':n===i?'active':'pending'});document.getElementById('headline').textContent=labels[i];document.getElementById('phase-label').textContent='Stage '+String(i+1).padStart(2,'0')+' / 05';document.querySelectorAll('[data-index]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.index)===i)))}show(2);document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>show(Number(b.dataset.index)));const start=Date.now();setInterval(()=>document.getElementById('elapsed').textContent=Math.floor((Date.now()-start)/1000)+'s elapsed',1000);document.getElementById('theme').onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'};
</script></body></html>
