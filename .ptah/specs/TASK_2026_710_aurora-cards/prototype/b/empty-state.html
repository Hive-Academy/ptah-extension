<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Get started · Ptah prototype</title><link rel="stylesheet" href="tokens.css"><style>
.chat-layout{display:grid;grid-template-columns:220px minmax(0,760px) 1fr;min-height:calc(100vh - 84px);gap:32px}.context-rail{border-right:1px solid var(--line);padding:54px 20px 0 0}.rail-title{font-size:11px;color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-weight:780}.rail-item{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px;margin-top:18px}.rail-item svg{width:15px;height:15px}.chat-column{padding:35px 0 65px;max-width:760px}.chat-hero{text-align:center;margin-bottom:31px}.logo-orbit{position:relative;width:100px;height:100px;display:grid;place-items:center;margin:0 auto 8px}.logo-orbit::before{content:"";position:absolute;inset:10px;border-radius:50%;border:1px solid var(--glass-border-strong);box-shadow:0 0 50px var(--aurora-gold),inset 0 0 23px var(--aurora-gold)}.logo-orbit::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px dashed var(--glass-border);animation:orbit 40s linear infinite}.logo-orbit img{width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 4px 18px var(--aurora-gold))}@keyframes orbit{to{transform:rotate(360deg)}}.chat-hero h1{font-size:28px;color:var(--gold);margin:0;letter-spacing:-.05em}.chat-hero p{color:var(--muted);font-size:12px;margin:2px 0}.prompt-panel{padding:26px 28px 28px}.prompt-panel .section-topline{margin-bottom:18px}.categories{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.category{min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);background:var(--glass-soft);border:1px solid var(--glass-border);border-radius:var(--radius-md);font-size:11px;font-weight:720;transition:transform .2s,background .2s,border-color .2s,box-shadow .2s}.category svg{width:20px;height:20px}.category:hover{transform:translateY(-3px);color:var(--ink);border-color:var(--glass-border-strong)}.category[aria-selected="true"]{color:var(--gold-strong);background:var(--aurora-gold);border-color:var(--glass-border-strong);box-shadow:inset 0 1px rgba(255,255,255,.18),0 8px 24px var(--aurora-gold)}.prompt-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:18px}.prompt-card{text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:70px;padding:13px 15px;background:var(--glass-soft);border:1px solid var(--line);border-radius:12px;color:var(--ink);transition:transform .2s,border-color .2s,background .2s}.prompt-card:hover{transform:translateY(-2px);border-color:var(--glass-border-strong);background:var(--base-3)}.prompt-card strong{display:block;font-size:12px;line-height:1.3}.prompt-card small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.prompt-card svg{color:var(--gold);width:15px;height:15px}.chat-foot{text-align:center;color:var(--gold);opacity:.5;font-size:11px;letter-spacing:.5em;margin-top:25px}.selected-prompt{min-height:22px;color:var(--muted);font-size:11px;text-align:center;margin:13px 0 0}.right-rail{border-left:1px solid var(--line)}@media(max-width:1050px){.chat-layout{grid-template-columns:minmax(0,760px);justify-content:center}.context-rail,.right-rail{display:none}}@media(max-width:680px){.chat-column{padding-top:16px}.prompt-panel{padding:20px 17px}.categories{grid-template-columns:repeat(3,1fr)}.prompt-list{grid-template-columns:1fr}}
</style></head><body><div class="scene"><div class="aurora" aria-hidden="true"></div><header class="chrome"><a class="brand" href="index.html"><img src="ptah-icon.png" alt="">Ptah</a><div class="chrome-actions"><span class="crumb">Chat / New conversation</span><button class="theme-toggle" id="theme" type="button" aria-label="Switch theme"><svg data-icon="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></svg><svg data-icon="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg><span>Theme</span></button></div></header><main class="shell chat-layout"><aside class="context-rail" aria-hidden="true"><div class="rail-title">Workspace</div><div class="rail-item"><svg viewBox="0 0 24 24"><path d="M3 7h18v13H3zM3 7V5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2"/></svg> Project space</div><div class="rail-item"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8m-8 4h5"/></svg> New conversation</div></aside><section class="chat-column"><div class="chat-hero"><div class="logo-orbit"><img src="ptah-icon.png" alt="Ptah"></div><h1>Ptah</h1><p>Ancient Wisdom • Master Craftsman</p></div><div class="glass prompt-panel"><div class="section-topline"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v15H4zM8 9h8m-8 4h7m-7 4h4"/></svg>Get started</div><div class="categories" role="tablist" aria-label="Prompt categories"><button class="category" role="tab" aria-selected="true" data-category="build" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2 7 7 3-7 2-2 8-2-8-7-2 7-3 2-7Z"/></svg>Build</button><button class="category" role="tab" aria-selected="false" data-category="fix" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8a8 8 0 1 0 1 6m0-11v5h-5M12 8v4l3 2"/></svg>Fix</button><button class="category" role="tab" aria-selected="false" data-category="review" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Review</button><button class="category" role="tab" aria-selected="false" data-category="agents" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2"/><path d="M2 20v-3a6 6 0 0 1 12 0v3H2Zm13-6a5 5 0 0 1 7 4v2h-5"/></svg>Agents</button><button class="category" role="tab" aria-selected="false" data-category="explore" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5m-10-13v6m-3-3h6"/></svg>Explore</button><button class="category" role="tab" aria-selected="false" data-category="creative" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h2a2 2 0 0 0 1-4 2 2 0 0 1 1-4h2a3 3 0 0 0 3-3A9 9 0 0 0 12 3Z"/><path d="M7 10h.01M10 7h.01M15 7h.01M6 15h.01"/></svg>Creative</button></div><div class="prompt-list" id="prompts" role="tabpanel" aria-live="polite"></div><p class="selected-prompt" id="selection" aria-live="polite">Choose a prompt to preview its full command.</p></div><div class="chat-foot" aria-hidden="true">✦ · ✦ · ✦</div></section><div class="right-rail" aria-hidden="true"></div></main></div><script>
const prompts={
build:[['Orchestrate a feature','Plan, implement, review','/orchestrate Build [describe your feature] with full workflow orchestration'],['Bootstrap SaaS workspace','Nx + NestJS + Angular','/saas-workspace-initializer Initialize a new SaaS project with Nx, NestJS, and Angular'],['Design NestJS feature','Controller-service-Prisma','/nestjs-backend-patterns Design a NestJS feature module for [domain] with provider pattern and Prisma'],['Add Angular component','Signals, OnPush, split','/angular-frontend-patterns Add a new Angular component with signals, OnPush, and smart/dumb split'],['Generate project harness','Setup wizard scan','Open the Setup Wizard, scan this workspace, analyze the project, and generate a harness.']],
fix:[['Fix a bug','Diagnose, fix, verify',"/orchestrate BUGFIX: Fix [describe the bug you're seeing]"],['Run fix fleet','Multi-agent bugfix batch','/orchestrate TASK_A TASK_B Run a multi-agent fix fleet'],['Humanize messy library','Refactor for readability','/humanize-library Refactor [library path] into single-responsibility files with clear names and no duplication'],['Extract UI feature','Move feature to component','/extract-and-relocate-angular-component-feature Move [feature] from [source component] into a new self-contained component in [destination]']],
review:[['Code quality review','Style, patterns, best practices','/review-code'],['Logic correctness review','Business logic & edge cases','/review-logic'],['Security vulnerability scan','OWASP top 10, auth, injection','/review-security'],['Code review tribunal','Multi-vendor cited verdict','/tribunal Review [module] with a multi-vendor panel and synthesize a cited verdict'],['Audit UX','Accessibility and hierarchy','/impeccable Audit the UX of [page/component] for accessibility, visual hierarchy, and performance']],
agents:[['Spawn CLI agent lane','Background implementation worker','/agent-lanes Spawn a background CLI agent lane to implement [task]'],['Run headless Ptah','JSON-RPC CI pipeline','/ptah-cli-usage Run a headless Ptah CLI session over JSON-RPC to [execute task/serve MCP]'],['Start tribunal panel','Council, Forge, or Crucible','/tribunal Start a tribunal panel for [topic] and render a cited verdict'],['Deploy fix fleet','Parallel agent task swarm','/orchestrate TASK_A TASK_B Coordinate a fix fleet with judge and commit']],
explore:[['Analyze architecture','Dependency graph deep dive','/orchestrate RESEARCH: Analyze the codebase architecture, map the dependency graph, and document key patterns and boundaries'],['Index workspace','Symbols and quality metrics','Use Workspace Indexing to scan this workspace and report symbols, dependencies, and code quality metrics.'],['View task board','.ptah/specs statuses','Show the .ptah/specs task board and report tasks grouped by status.'],['Browse marketplace','Plugins and skills','Open the Ptah Marketplace and list available plugins or skills for [category].'],['Search memory','Prior decisions','Search the Memory Curator for prior decisions and context about [topic].']],
creative:[['Design landing page','Brand discovery and tokens','/ui-ux-designer Design a landing page for [product] with brand discovery and design tokens'],['Add 3D scene','Three.js Angular scene','/angular-3d-scene-crafter Create a 3D hero scene with neon lights and floating geometric shapes'],['Add scroll animation','GSAP ScrollTrigger effects','/angular-gsap-animation-crafter Add scroll-triggered animations with parallax to [section]'],['Write technical content','Blog grounded in code','/technical-content-writer Write a technical blog post about [topic] grounded in our codebase'],['Record video showcase','Narrated product demo','/video-showcase Record a narrated marketing demo of [feature]']]};
const list=document.getElementById('prompts'),selection=document.getElementById('selection');function render(key){list.replaceChildren();prompts[key].forEach(([title,subtitle,command])=>{const b=document.createElement('button');b.type='button';b.className='prompt-card';b.title=command;const body=document.createElement('span'),strong=document.createElement('strong'),small=document.createElement('small');strong.textContent=title;small.textContent=subtitle;body.append(strong,small);b.append(body);const arrow=document.createElementNS('http://www.w3.org/2000/svg','svg');arrow.setAttribute('viewBox','0 0 24 24');arrow.setAttribute('aria-hidden','true');arrow.innerHTML='<path d="M5 12h14m-6-6 6 6-6 6"/>';b.append(arrow);b.onclick=()=>{selection.textContent=command};list.append(b)})}render('build');document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-category]').forEach(t=>t.setAttribute('aria-selected',String(t===b)));selection.textContent='Choose a prompt to preview its full command.';render(b.dataset.category)});document.getElementById('theme').onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'};
</script></body></html>
