<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>B · Focus + rail — Orchestra Canvas prototype</title>
<link rel="stylesheet" href="shared.css" />
<style>
  body { display: grid; grid-template-rows: 48px 1fr; height: 100vh; overflow: hidden; }
  .main { display: grid; grid-template-columns: 296px 1fr 320px; min-height: 0; }
  .main.rail-collapsed { grid-template-columns: 56px 1fr 320px; }
  .rail { background: var(--s1); border-right: 1px solid var(--line); overflow-y: auto; min-height: 0; padding: 8px; }
  .group-h {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 8px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted);
  }
  .group-h span { letter-spacing: 0; font-weight: 400; color: var(--faint); }
  .row {
    display: grid; grid-template-columns: 10px 1fr auto; column-gap: 8px; row-gap: 2px;
    align-items: center; padding: 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent;
  }
  .row:hover { background: var(--s2); }
  .row[aria-current='true'] { background: var(--s3); border-color: rgba(212, 175, 55, 0.45); }
  .row .title { font-weight: 500; }
  .row .meta { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .row .act { grid-column: 2 / -1; font-size: 12px; color: var(--muted); }
  .row .act b { color: var(--text); font-weight: 500; }
  .row .pips { grid-column: 2 / -1; display: flex; gap: 3px; align-items: center; }
  .pip { width: 14px; height: 4px; border-radius: 2px; background: var(--idle); }
  .pip.running { background: var(--run); }
  .pip.waiting { background: var(--need); }
  .pip.error { background: var(--err); }
  .pip.done { background: var(--done); opacity: 0.55; }
  .pip.stopped { background: var(--faint); opacity: 0.4; }
  .row .ask { grid-column: 2 / -1; display: flex; gap: 6px; margin-top: 4px; }
  .rail-collapsed .row { grid-template-columns: 1fr; justify-items: center; padding: 10px 0; }
  .rail-collapsed .row > :not(.dot), .rail-collapsed .group-h span, .rail-collapsed .new { display: none; }
  .rail-collapsed .group-h { justify-content: center; font-size: 0; padding: 6px 0; border-top: 1px solid var(--line); }
  .center { display: flex; flex-direction: column; min-height: 0; }
  .center-h { display: flex; align-items: center; gap: 10px; padding: 0 18px; height: 48px; border-bottom: 1px solid var(--line); }
  .center-h .title { font-weight: 600; font-size: 14px; }
  .center .live { max-width: 860px; width: 100%; margin: 0 auto; }
  .new { width: 100%; margin: 8px 0; height: 30px; }
  .switcher { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; place-items: start center; padding-top: 14vh; z-index: 80; }
  .switcher.open { display: grid; }
  .switcher-box { width: 520px; background: var(--s2); border: 1px solid var(--line-2); border-radius: 12px; overflow: hidden; }
  .switcher-box input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 12px 14px; color: var(--text); font: inherit; outline: none; }
  .switcher-box .row { margin: 4px; }
  kbd { font: 10px var(--mono); border: 1px solid var(--line-2); border-radius: 3px; padding: 0 4px; color: var(--muted); }
</style>
</head>
<body>
  <header class="appbar">
    <a href="index.html" class="chip" style="text-decoration:none">← Prototypes</a>
    <button class="icon-btn" id="toggle-rail" title="Collapse rail" aria-label="Collapse session rail">◧</button>
    <h1>Orchestra</h1>
    <span class="chip">▢ ptah-extension</span>
    <span class="faint" style="font-size:11px"><kbd>Ctrl</kbd>+<kbd>K</kbd> switch · <kbd>Alt</kbd>+<kbd>↑↓</kbd> next session</span>
    <span class="spacer"></span>
    <div id="attention"></div>
  </header>
  <div class="main" id="main">
    <nav class="rail" id="rail" aria-label="Sessions"></nav>
    <section class="center">
      <div class="center-h" id="center-h"></div>
      <div id="live-host" style="flex:1;min-height:0;display:flex"></div>
    </section>
    <aside class="inspector" id="inspector" aria-label="Focused session details"></aside>
  </div>
  <div class="switcher" id="switcher" role="dialog" aria-label="Switch session">
    <div class="switcher-box"><input id="switcher-q" placeholder="Go to session…" aria-label="Filter sessions" /><div id="switcher-list"></div></div>
  </div>

<script src="shared.js"></script>
<script>
  const store = Proto.createStore({ count: 9 });
  const params = new URLSearchParams(location.search);
  let focused = store.get(params.get('s')) ? params.get('s') : store.sessions[0].id;
  let live = null;
  const rail = document.getElementById('rail');
  const inspector = Proto.createInspector(document.getElementById('inspector'), store);
  Proto.createAttention(document.getElementById('attention'), store, { onOpen: focus });
  Proto.createHud(store, () => ({ live: live ? 1 : 0 }));

  const GROUPS = [['needs', 'Needs you'], ['error', 'Errors'], ['running', 'Running'], ['done', 'Done']];

  function rowHtml(s) {
    const active = Proto.activeAgents(s).length;
    return `<div class="row st-${s.state}" data-id="${s.id}" role="button" tabindex="0" aria-current="${s.id === focused}">
      <span class="dot"></span><span class="title truncate">${Proto.esc(s.title)}</span>
      <span class="meta">${s.state === 'done' ? Proto.fmtCost(s.cost) : `${active} · ${Proto.fmtElapsed(Date.now() - s.startedAt)}`}</span>
      <span class="act truncate">${s.permission ? `<b>${Proto.esc(s.permission.agent)}</b> · <code class="mono">${Proto.esc(s.permission.cmd)}</code>` : s.error ? Proto.esc(s.error) : Proto.currentActivity(s)}</span>
      <span class="pips" title="${s.agents.map((a) => `${a.name}: ${a.status}`).join('\n')}">${Proto.cardAgents(s).map((a) => `<i class="pip ${a.status}"></i>`).join('')}</span>
      ${s.permission ? '<span class="ask"><button class="btn btn-allow" data-act="allow">Allow</button><button class="btn btn-deny" data-act="deny">Deny</button></span>' : ''}
    </div>`;
  }

  let pressing = false;
  rail.addEventListener('pointerdown', () => { pressing = true; });
  document.addEventListener('pointerup', () => { pressing = false; });

  function renderRail() {
    if (pressing) return;
    const all = store.sorted('attention');
    rail.innerHTML = GROUPS.map(([key, label]) => {
      const items = all.filter((s) => s.state === key);
      if (!items.length) return '';
      return `<div class="group-h">${label} <span>${items.length}</span></div>${items.map(rowHtml).join('')}`;
    }).join('') + '<button class="btn new">＋ New session</button>';
    store.notePatch();
  }

  function renderCenterHeader() {
    const s = store.get(focused);
    const needs = store.attention().filter((x) => x.permission).length;
    document.getElementById('center-h').innerHTML = `<span class="title">${Proto.esc(s.title)}</span>
      <span class="chip mono">⑂ ${Proto.esc(s.branch)}</span><span class="spacer" style="flex:1"></span>
      <span class="pill ${s.state}">${Proto.STATE_LABEL[s.state]}</span>
      ${needs ? `<span class="chip" style="color:var(--need);border-color:rgba(245,158,11,.5)">${needs} need${needs === 1 ? 's' : ''} you</span>` : ''}`;
  }

  function focus(id) {
    if (!store.get(id)) return;
    focused = id;
    history.replaceState(null, '', `?s=${id}`);
    live?.destroy();
    live = Proto.createLive(document.getElementById('live-host'), store.get(id), store);
    inspector.set(id);
    renderRail();
    renderCenterHeader();
  }

  store.onSample((ids) => {
    renderRail();
    if (ids.includes(focused)) renderCenterHeader();
  });
  setInterval(renderRail, 1000);

  rail.addEventListener('click', (e) => {
    const row = e.target.closest('[data-id]');
    if (!row) return;
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'allow') { store.allow(row.dataset.id); renderRail(); return; }
    if (act === 'deny') { store.deny(row.dataset.id); renderRail(); return; }
    focus(row.dataset.id);
  });
  rail.addEventListener('keydown', (e) => { const r = e.target.closest('.row'); if (r && e.key === 'Enter') focus(r.dataset.id); });
  document.getElementById('toggle-rail').addEventListener('click', () => document.getElementById('main').classList.toggle('rail-collapsed'));

  // Quick switcher
  const sw = document.getElementById('switcher');
  const q = document.getElementById('switcher-q');
  const list = document.getElementById('switcher-list');
  const renderSwitcher = () => {
    const term = q.value.toLowerCase();
    list.innerHTML = store.sorted('attention').filter((s) => s.title.toLowerCase().includes(term) || s.branch.includes(term)).map(rowHtml).join('');
  };
  q.addEventListener('input', renderSwitcher);
  list.addEventListener('click', (e) => { const r = e.target.closest('[data-id]'); if (r) { sw.classList.remove('open'); focus(r.dataset.id); } });
  q.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const r = list.querySelector('[data-id]'); if (r) { sw.classList.remove('open'); focus(r.dataset.id); } } });
  sw.addEventListener('click', (e) => { if (e.target === sw) sw.classList.remove('open'); });
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); sw.classList.add('open'); q.value = ''; renderSwitcher(); q.focus(); }
    if (e.key === 'Escape') sw.classList.remove('open');
    if (e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      const ids = store.sorted('attention').map((s) => s.id);
      const i = ids.indexOf(focused) + (e.key === 'ArrowDown' ? 1 : -1);
      focus(ids[(i + ids.length) % ids.length]);
    }
  });

  focus(focused);
</script>
</body>
</html>
