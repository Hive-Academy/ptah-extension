<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A · Mission board — Orchestra Canvas prototype</title>
<link rel="stylesheet" href="shared.css" />
<style>
  body { display: grid; grid-template-rows: 48px 1fr; height: 100vh; overflow: hidden; }
  .board {
    overflow-y: auto;
    padding: 14px 14px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    grid-auto-rows: auto;
    gap: 12px;
    align-content: start;
    scroll-padding: 14px;
  }
  .slot { position: relative; min-width: 0; height: 244px; }
  .board.all-live .slot { height: 380px; }
  .slot.open > .bcard { border-color: rgba(212, 175, 55, 0.7); box-shadow: 0 0 0 1px rgba(212, 175, 55, 0.3); cursor: zoom-out; }
  /* Notch that ties the open card to the detail row below it */
  .slot.open::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -13px;
    width: 14px;
    height: 14px;
    transform: translateX(-50%) rotate(45deg);
    background: var(--s1);
    border-left: 1px solid rgba(212, 175, 55, 0.7);
    border-top: 1px solid rgba(212, 175, 55, 0.7);
    z-index: 2;
  }
  .detail {
    grid-column: 1 / -1;
    /* Fits one card row plus the detail in the viewport */
    height: clamp(420px, calc(100vh - 48px - 244px - 52px), 720px);
    display: grid;
    grid-template-rows: auto 1fr;
    min-height: 0;
    background: var(--s1);
    border: 1px solid rgba(212, 175, 55, 0.55);
    border-radius: 12px;
    overflow: hidden;
    animation: open 0.18s ease-out;
  }
  @keyframes open { from { opacity: 0; transform: translateY(-6px); } }
  .detail-h { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--s2); min-width: 0; }
  .detail-h .title { font-weight: 600; font-size: 14px; }
  .detail-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; }
  .detail-main { display: flex; flex-direction: column; min-height: 0; }
  .detail-view { flex: 1; min-height: 0; display: flex; }
  .detail-view > * { flex: 1; }
  .detail .inspector { border-left: 1px solid var(--line); }
  .live-tile { display: flex; flex-direction: column; height: 100%; background: var(--s1); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .live-tile .composer { display: none; }
  .live-tile .tile-h { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--s2); border-bottom: 1px solid var(--line); }
  .legend { font-size: 11px; color: var(--faint); }
  kbd { font: 10px var(--mono); border: 1px solid var(--line-2); border-radius: 3px; padding: 0 4px; color: var(--muted); }
</style>
</head>
<body>
  <header class="appbar">
    <a href="index.html" class="chip" style="text-decoration:none">← Prototypes</a>
    <h1>Orchestra Canvas</h1>
    <span class="chip">▢ ptah-extension</span>
    <span class="legend">Click a card: details open <b>below its row</b> · click a lane for its output · <kbd>Esc</kbd> close · <kbd>←</kbd><kbd>→</kbd> next session</span>
    <span class="spacer"></span>
    <span class="seg-label">Fidelity</span>
    <div class="seg" id="fidelity">
      <button data-v="cards" aria-pressed="true">Cards (proposed)</button>
      <button data-v="all" aria-pressed="false">All live (today)</button>
    </div>
    <div id="attention"></div>
  </header>
  <section class="board" id="board" aria-label="Sessions"></section>

<script src="shared.js"></script>
<script>
  const store = Proto.createStore({ count: 6 });
  const board = document.getElementById('board');
  const state = { open: null, lane: 'orchestrator', fidelity: 'cards' };
  /** Stable slot per session. The order never changes on click. */
  const slots = new Map();
  let detail = null; // { el, id, view, inspector, renderTabs }

  Proto.createAttention(document.getElementById('attention'), store, {
    onOpen(id) {
      const s = store.get(id);
      const lane = s.permission ? s.permission.agentId : (s.agents.find((a) => a.status === 'error') || {}).id;
      openDetail(id, lane || 'orchestrator');
    },
  });
  Proto.createHud(store, () => ({
    live: state.fidelity === 'all' ? store.sessions.length : detail ? 1 : 0,
  }));

  // ---------- Slots (cards or, in "today" mode, live tiles) ----------
  let pressing = false;
  board.addEventListener('pointerdown', () => { pressing = true; });
  document.addEventListener('pointerup', () => { pressing = false; });

  function renderSlot(id) {
    const slot = slots.get(id);
    const s = store.get(id);
    slot.className = `slot st-${s.state}${state.open === id ? ' open' : ''}`;
    if (state.fidelity === 'all') return slot.live?.update();
    if (pressing) return;
    slot.card.innerHTML = Proto.boardCardHtml(s);
    store.notePatch();
  }

  function buildSlots() {
    slots.forEach((slot) => { slot.live?.destroy(); slot.remove(); });
    slots.clear();
    for (const s of store.sessions) {
      const slot = document.createElement('div');
      slot.dataset.id = s.id;
      if (state.fidelity === 'all') {
        const tile = document.createElement('div');
        tile.className = 'live-tile';
        tile.innerHTML = `<div class="tile-h"><span class="dot ${s.state}"></span><b class="truncate">${Proto.esc(s.title)}</b></div>`;
        const live = Proto.createLive(tile, s, store, { composer: false });
        slot.live = { update() {}, destroy: () => live.destroy() };
        slot.appendChild(tile);
      } else {
        const card = document.createElement('article');
        card.className = 'bcard';
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `Open ${s.title}`);
        slot.card = card;
        slot.appendChild(card);
      }
      slots.set(s.id, slot);
      board.appendChild(slot);
      renderSlot(s.id);
    }
  }

  // ---------- Detail row ----------
  function columns() {
    return getComputedStyle(board).gridTemplateColumns.split(' ').filter(Boolean).length;
  }

  /** Put the detail row right after the last card of the open card's row. */
  function placeDetail() {
    if (!detail) return;
    const ids = store.sessions.map((s) => s.id);
    const cols = columns();
    const ix = ids.indexOf(detail.id);
    const rowEnd = Math.min(ids.length - 1, Math.floor(ix / cols) * cols + cols - 1);
    const after = slots.get(ids[rowEnd]);
    if (after.nextSibling !== detail.el) after.after(detail.el);
  }

  function laneTabsHtml(s) {
    const groups = [['sub', 'Sub-agents'], ['cli', 'CLI lanes'], ['bg', 'Background']];
    const tab = (id, label, status, icon) =>
      `<button class="lane-tab" role="tab" data-lane="${id}" aria-selected="${state.lane === id}"><span class="faint">${icon}</span>${Proto.esc(label)}${status ? `<span class="dot ${status}" title="${status}"></span>` : ''}</button>`;
    return tab('orchestrator', 'Orchestrator', s.state === 'done' ? 'done' : 'running', '◆') +
      groups.map(([kind, label]) => {
        const lanes = s.agents.filter((a) => a.kind === kind);
        if (!lanes.length) return '';
        return `<span class="grp">${label}</span>` + lanes.map((a) => tab(a.id, a.name, a.status, Proto.KIND_ICON[a.kind])).join('');
      }).join('');
  }

  function mountView() {
    detail.view?.destroy();
    const host = detail.el.querySelector('.detail-view');
    const s = store.get(detail.id);
    detail.view = state.lane === 'orchestrator'
      ? Proto.createLive(host, s, store)
      : Proto.createLaneView(host, s, state.lane, store);
  }

  function renderDetailChrome() {
    if (!detail || pressing) return;
    const s = store.get(detail.id);
    detail.el.querySelector('.detail-h').innerHTML = `<span class="dot ${s.state}"></span><span class="title truncate">${Proto.esc(s.title)}</span>
      <span class="chip mono">⑂ ${Proto.esc(s.branch)}</span><span class="pill ${s.state}">${Proto.STATE_LABEL[s.state]}</span>
      <span class="faint" style="font-size:12px">${Proto.laneSummary(s)}</span><span style="flex:1"></span>
      <button class="btn" data-act="close" title="Close (Esc)">Close ✕</button>`;
    detail.el.querySelector('.lane-tabs').innerHTML = laneTabsHtml(s);
  }

  function openDetail(id, lane = 'orchestrator') {
    if (state.fidelity === 'all') return;
    const prev = state.open;
    if (detail && detail.id !== id) closeDetail(false);
    state.open = id;
    state.lane = lane;
    if (!detail) {
      const el = document.createElement('section');
      el.className = 'detail';
      el.setAttribute('aria-label', 'Session detail');
      el.innerHTML = `<div class="detail-h"></div><div class="detail-body"><div class="detail-main"><div class="lane-tabs" role="tablist" aria-label="Lanes"></div><div class="detail-view"></div></div><aside class="inspector"></aside></div>`;
      detail = { el, id };
      detail.inspector = Proto.createInspector(el.querySelector('.inspector'), store, { noHeader: true, hideAgents: true });
    }
    placeDetail();
    renderDetailChrome();
    mountView();
    detail.inspector.set(id);
    if (prev) renderSlot(prev);
    renderSlot(id);
    requestAnimationFrame(() => {
      slots.get(id).scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      detail.el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });
  }

  function closeDetail(render = true) {
    if (!detail) return;
    const id = detail.id;
    detail.view?.destroy();
    detail.inspector.destroy();
    detail.el.remove();
    detail = null;
    state.open = null;
    if (render) renderSlot(id);
  }

  function selectLane(lane) {
    state.lane = lane;
    renderDetailChrome();
    mountView();
  }

  // ---------- Events ----------
  board.addEventListener('click', (e) => {
    const actEl = e.target.closest('[data-act]');
    const act = actEl?.dataset.act;
    if (detail && detail.el.contains(e.target)) {
      const tab = e.target.closest('.lane-tab');
      if (tab) return selectLane(tab.dataset.lane);
      if (act === 'close') return closeDetail();
      if (act === 'allow') store.allow(detail.id);
      if (act === 'deny') store.deny(detail.id);
      if (act === 'stop-lane') store.stopLane(detail.id, state.lane);
      if (act) renderDetailChrome();
      return;
    }
    const slot = e.target.closest('.slot');
    if (!slot) return;
    const id = slot.dataset.id;
    if (act === 'allow') { store.allow(id); return renderSlot(id); }
    if (act === 'deny') { store.deny(id); return renderSlot(id); }
    if (act === 'retry') { store.retry(id); return renderSlot(id); }
    if (act === 'lane' && actEl.dataset.lane) return openDetail(id, actEl.dataset.lane);
    if (state.open === id && (!act || act === 'expand')) return closeDetail();
    openDetail(id);
  });
  board.addEventListener('keydown', (e) => {
    const card = e.target.closest('.bcard');
    if (card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); card.click(); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeDetail();
    const ids = store.sessions.map((s) => s.id);
    if (detail && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const i = ids.indexOf(detail.id) + (e.key === 'ArrowRight' ? 1 : -1);
      openDetail(ids[(i + ids.length) % ids.length]);
    }
    const n = Number(e.key);
    if (n >= 1 && n <= 9 && ids[n - 1]) openDetail(ids[n - 1]);
  });
  new ResizeObserver(placeDetail).observe(board);

  store.onSample((ids) => {
    ids.forEach(renderSlot);
    if (detail && ids.includes(detail.id)) renderDetailChrome();
  });
  setInterval(() => slots.forEach((_, id) => renderSlot(id)), 1000); // elapsed timers

  document.getElementById('fidelity').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    closeDetail();
    state.fidelity = b.dataset.v;
    for (const x of e.currentTarget.children) x.setAttribute('aria-pressed', String(x === b));
    board.classList.toggle('all-live', state.fidelity === 'all');
    buildSlots();
  });

  buildSlots();
  openDetail(store.sessions[0].id);
</script>
</body>
</html>
