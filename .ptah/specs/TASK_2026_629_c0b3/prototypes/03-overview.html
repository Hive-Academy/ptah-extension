<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C · Zoomed-out overview — Orchestra Canvas prototype</title>
<link rel="stylesheet" href="shared.css" />
<style>
  body { display: grid; grid-template-rows: 48px auto 1fr; height: 100vh; overflow: hidden; }
  .kpi-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
  .kpi { background: var(--s1); padding: 12px 18px; }
  .kpi strong { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; }
  .kpi.hot strong { color: var(--need); }
  .wrap { overflow: auto; min-height: 0; padding: 10px 14px 60px; }
  table { width: 100%; border-collapse: separate; border-spacing: 0 4px; table-layout: fixed; }
  th { text-align: left; font-size: 11px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 10px; }
  td { background: var(--s2); padding: 9px 10px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); vertical-align: middle; font-variant-numeric: tabular-nums; }
  td:first-child { border-left: 1px solid var(--line); border-radius: 10px 0 0 10px; }
  td:last-child { border-right: 1px solid var(--line); border-radius: 0 10px 10px 0; }
  tr.srow { cursor: pointer; }
  tr.srow:hover td { background: var(--s3); }
  tr.st-needs td { border-color: rgba(245, 158, 11, 0.4); }
  tr.st-error td { border-color: rgba(239, 68, 68, 0.4); }
  tr.st-done td { opacity: 0.7; }
  .t-title { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .t-title b { font-weight: 600; }
  .t-sub { font-size: 11px; color: var(--faint); padding-left: 16px; }
  .act { color: var(--muted); font-size: 12px; }
  .act b { color: var(--text); font-weight: 500; }
  .lanes { display: flex; gap: 3px; flex-wrap: wrap; }
  .lane { height: 18px; min-width: 18px; padding: 0 5px; border-radius: 4px; font-size: 10px; display: inline-flex; align-items: center; gap: 3px; background: var(--s3); color: var(--muted); border: 1px solid var(--line-2); }
  .lane.running { border-color: rgba(91,140,255,.5); color: var(--run); }
  .lane.waiting { border-color: rgba(245,158,11,.6); color: var(--need); }
  .lane.error { border-color: rgba(239,68,68,.6); color: var(--err); }
  .lane.done, .lane.stopped { opacity: 0.45; }
  .bar { height: 5px; background: var(--s3); border-radius: 3px; overflow: hidden; }
  .bar b { display: block; height: 100%; background: var(--muted); }
  .bar.ctx b { background: var(--gold); }
  .bar.ctx.high b { background: var(--need); }
  .small { font-size: 11px; color: var(--faint); margin-top: 3px; }
  .acts { display: flex; gap: 6px; justify-content: flex-end; }
</style>
</head>
<body>
  <header class="appbar">
    <a href="index.html" class="chip" style="text-decoration:none">← Prototypes</a>
    <h1>All sessions</h1>
    <span class="chip">▢ ptah-extension</span>
    <span class="faint" style="font-size:11px">Zoomed-out level: no transcripts mounted. Click a row to open it in the focus view.</span>
    <span class="spacer"></span>
    <div class="seg" id="filter">
      <button data-v="all" aria-pressed="true">All</button>
      <button data-v="attention" aria-pressed="false">Needs attention</button>
      <button data-v="running" aria-pressed="false">Running</button>
    </div>
    <div id="attention"></div>
  </header>
  <section class="kpi-strip" id="kpis" aria-label="Totals"></section>
  <div class="wrap">
    <table aria-label="Sessions">
      <colgroup><col style="width:22%"><col style="width:24%"><col style="width:22%"><col style="width:8%"><col style="width:8%"><col style="width:6%"><col style="width:10%"></colgroup>
      <thead><tr><th>Session</th><th>Now</th><th>Agents</th><th>Todos</th><th>Context</th><th>Cost</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

<script src="shared.js"></script>
<script>
  const store = Proto.createStore({ count: 9 });
  const rows = document.getElementById('rows');
  let filter = 'all';
  Proto.createAttention(document.getElementById('attention'), store, { onOpen: open });
  Proto.createHud(store, () => ({ live: 0 }));

  function open(id) { location.href = `02-focus-rail.html?s=${id}`; }

  function rowHtml(s) {
    const done = s.todos.filter((t) => t.done).length;
    const pct = Proto.ctxPct(s);
    const act = s.permission
      ? `<b>${Proto.esc(s.permission.agent)}</b> asks to run <code class="mono">${Proto.esc(s.permission.cmd)}</code>`
      : s.error ? `<span style="color:var(--err)">${Proto.esc(s.error)}</span>` : Proto.currentActivity(s);
    const actions = s.permission
      ? '<button class="btn btn-allow" data-act="allow">Allow</button><button class="btn btn-deny" data-act="deny">Deny</button>'
      : s.error ? '<button class="btn" data-act="retry">Retry</button>' : '<button class="btn" data-act="open">Open</button>';
    return `<tr class="srow st-${s.state}" data-id="${s.id}" tabindex="0">
      <td><div class="t-title"><span class="dot ${s.state}"></span><b class="truncate">${Proto.esc(s.title)}</b></div>
        <div class="t-sub mono truncate">${Proto.esc(s.branch)} · ${Proto.esc(s.model)} · ${Proto.fmtElapsed(Date.now() - s.startedAt)}</div></td>
      <td><div class="act truncate">${act}</div></td>
      <td><div class="lanes">${Proto.cardAgents(s).map((a) => `<span class="lane ${a.status}" title="${Proto.esc(a.name)} — ${a.status} · ${Proto.esc(a.line)}">${Proto.KIND_ICON[a.kind]} ${Proto.esc(a.name.split(' ')[0].slice(0, 10))}</span>`).join('')}</div></td>
      <td><div class="bar"><b style="width:${(done / s.todos.length) * 100}%"></b></div><div class="small">${done} of ${s.todos.length}</div></td>
      <td><div class="bar ctx ${pct > 75 ? 'high' : ''}"><b style="width:${pct}%"></b></div><div class="small">${pct}%</div></td>
      <td>${Proto.fmtCost(s.cost)}<div class="small"><span class="git-add">+${s.git.add}</span> <span class="git-del">−${s.git.del}</span></div></td>
      <td><div class="acts">${actions}</div></td>
    </tr>`;
  }

  let pressing = false;
  rows.addEventListener('pointerdown', () => { pressing = true; });
  document.addEventListener('pointerup', () => { pressing = false; });

  function render() {
    if (pressing) return;
    const list = store.sorted('attention').filter((s) =>
      filter === 'all' ? true : filter === 'attention' ? s.permission || s.error : s.state === 'running');
    rows.innerHTML = list.map(rowHtml).join('') || '<tr><td colspan="7" class="muted" style="text-align:center">No sessions match this filter.</td></tr>';
    const all = store.sessions;
    const agentsActive = all.reduce((n, s) => n + Proto.activeAgents(s).length, 0);
    const attention = store.attention().length;
    const spend = all.reduce((n, s) => n + s.cost, 0);
    const tokens = all.reduce((n, s) => n + s.tokens, 0);
    document.getElementById('kpis').innerHTML = `
      <div class="kpi"><strong>${all.filter((s) => s.state !== 'done').length} / ${all.length}</strong><span>Sessions active</span></div>
      <div class="kpi"><strong>${agentsActive}</strong><span>Agents active</span></div>
      <div class="kpi ${attention ? 'hot' : ''}"><strong>${attention}</strong><span>Need you</span></div>
      <div class="kpi"><strong>${Proto.fmtTokens(tokens)}</strong><span>Tokens</span></div>
      <div class="kpi"><strong>${Proto.fmtCost(spend)}</strong><span>Spend</span></div>`;
    store.notePatch();
  }

  store.onSample(render);
  rows.addEventListener('click', (e) => {
    const tr = e.target.closest('[data-id]');
    if (!tr) return;
    const id = tr.dataset.id;
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'allow') store.allow(id);
    else if (act === 'deny') store.deny(id);
    else if (act === 'retry') store.retry(id);
    else open(id);
    render();
  });
  rows.addEventListener('keydown', (e) => { const tr = e.target.closest('[data-id]'); if (tr && e.key === 'Enter') open(tr.dataset.id); });
  document.getElementById('filter').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    filter = b.dataset.v;
    for (const x of e.currentTarget.children) x.setAttribute('aria-pressed', String(x === b));
    render();
  });
  render();
</script>
</body>
</html>
