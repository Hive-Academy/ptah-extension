pre{background:var(--b3);padding:8px;border-radius:6px;overflow:auto;white-space:pre-wrap;word-break:break-all;font-size:12px;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spin{width:14px;height:14px;border:2px solid var(--bm);border-top-color:var(--bc);border-radius:50%;animation:sp 1s linear infinite;display:inline-block}

@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.toast{min-height:20px;margin:6px 0}
.err-t{color:var(--bc);font-weight:600}

.sr{position:absolute;left:-9999px}
</style>
</head>
