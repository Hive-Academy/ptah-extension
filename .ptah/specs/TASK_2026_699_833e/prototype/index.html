<!doctype html>
<html lang="en" data-theme="anubis" data-theme-mode="dark">
<head>
<meta charset="utf-8" />
<title>Inspector side dock + Plan Limits cards - prototype (TASK_2026_699_833e)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!--
  Static prototype. No build step. Every value below is copied from a project token or class;
  the Tailwind / DaisyUI class it stands for is written in a comment next to the rule.
  Theme values: apps/ptah-extension-webview/tailwind.config.js (anubis, anubis-light)
  Surface tokens: apps/ptah-extension-webview/src/styles.css:148-165

  URL hash options: #theme=dark|light  #view=1440|760  #tab=open|closed  #expand=0|1
-->
<style>
  /* ---------- Theme tokens (tailwind.config.js themes anubis / anubis-light) ---------- */
  :root, [data-theme="anubis"] {
    --b1: #131317; --b2: #1a1a20; --b3: #242430; --bc: #e8e6e1;
    --bcm: oklch(66.509856% 0.007403 31.090978);
    --p: #2563eb; --pc: #f8f7f4;
    --info: #3b82f6; --success: #16a34a; --warning: #f97316; --error: #dc2626;
    --elev-shadow-raised: 0 12px 30px oklch(0% 0 0 / 0.42);  /* styles.css:163 */
  }
  [data-theme="anubis-light"] {
    --b1: oklch(97.788% 0.004 56.375); --b2: oklch(93.982% 0.007 61.449);
    --b3: oklch(91.586% 0.006 53.44);  --bc: oklch(23.574% 0.066 313.189);
    --bcm: oklch(48.955188% 0.044796 348.478612);
    --p: oklch(85% 0.138 181.071); --pc: oklch(36% 0.078 188.216);
    --info: oklch(68% 0.169 237.323); --success: oklch(69% 0.17 162.48);
    --warning: oklch(72% 0.18 55); --error: oklch(64% 0.246 16.439);
    --elev-shadow-raised: 0 8px 24px color-mix(in oklch, var(--bc) 18%, transparent); /* styles.css:157 */
  }
  :root {
    /* styles.css:149-155 */
    --surface-0: var(--b1);
    --surface-1: color-mix(in oklch, var(--b2) 88%, var(--b1));
    --surface-border: color-mix(in oklch, var(--bc) 14%, transparent);
    --ptah-ease-soft: cubic-bezier(0.22, 0.61, 0.36, 1); /* styles.css:41 */
  }
  /* Tailwind opacity helpers, spelled out */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0b0b0e; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { color: var(--bc); }
  .stage { padding: 0; }
  .toolbar { position: fixed; right: 8px; bottom: 8px; z-index: 99; display: flex; gap: 6px; font-size: 11px; }
  .toolbar button { background: #242430; color: #e8e6e1; border: 1px solid #555; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  body.shot .toolbar { display: none; }

  /* ---------- Electron frame (window = viewport width) ---------- */
  .win { display: flex; height: 880px; background: var(--b1); color: var(--bc); overflow: hidden; font-size: 14px; }
  .ws { width: 220px; flex-shrink: 0; background: var(--surface-1); border-right: 1px solid var(--surface-border); padding: 12px; }
  .ws h4 { margin: 0 0 8px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--bcm); }
  .ws li { list-style: none; padding: 6px 8px; font-size: 12px; border-radius: 4px; }
  .ws li.on { background: color-mix(in oklch, var(--bc) 8%, transparent); }
  .ws ul { margin: 0; padding: 0; }

  /* ---------- ptah-sidebar-tab (sidebar-tab.component.ts) ---------- */
  .tab { display: flex; flex-shrink: 0; }
  .tab button {                       /* group relative flex items-center justify-center h-full w-8 border-l bg-base-200/60 */
    position: relative; display: flex; align-items: center; justify-content: center; width: 32px; height: 100%;
    background: color-mix(in oklch, var(--b2) 60%, transparent); border: 0; cursor: pointer; padding: 0;
    border-left: 1px solid color-mix(in oklch, var(--bc) 10%, transparent);
    transition: background-color 200ms; color: inherit; font: inherit;
  }
  .tab.left button { border-left: 0; border-right: 1px solid color-mix(in oklch, var(--bc) 10%, transparent); }
  .tab button:hover { background: color-mix(in oklch, var(--b3) 80%, transparent); } /* hover:bg-base-300/80 */
  .tab button:focus-visible { outline: 2px solid var(--bc); outline-offset: -2px; }
  .tab .lbl { writing-mode: vertical-rl; white-space: nowrap; letter-spacing: .1em; text-transform: uppercase;
    font-size: 10px; font-weight: 600; user-select: none; color: var(--bcm); transition: color 200ms; }
  .tab.left .lbl { transform: rotate(180deg); }
  .tab button:hover .lbl { color: var(--bc); }
  .tab.open .lbl { color: var(--p); }
  .tab.open button::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 2px; background: var(--p); } /* right tab: left-0 */
  .tab.left.open button::before { left: auto; right: 0; }
  .tab .dot { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 8px; height: 8px; border-radius: 9999px; background: var(--warning); }
  .tab[inert] { opacity: .5; }

  /* ---------- chat view ---------- */
  .chat { flex: 1 1 0; min-width: 0; display: flex; height: 100%; position: relative; }
  .cs-shell { flex: 1 1 0; min-width: 0; display: flex; position: relative; height: 100%; container-type: inline-size; }
  .main { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
  .hdr { height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--surface-border); font-size: 13px; font-weight: 600; }
  .hdr .sp { flex: 1; }
  .hdr .ibtn { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--surface-border); background: transparent; color: var(--bc); cursor: pointer; }
  .hdr .ibtn[aria-pressed="true"] { background: color-mix(in oklch, var(--bc) 10%, transparent); }
  .msgs { flex: 1; overflow: hidden; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .bubble { max-width: 640px; border-radius: 10px; padding: 10px 14px; font-size: 13px; line-height: 1.5; background: var(--surface-1); border: 1px solid var(--surface-border); }
  .bubble.me { align-self: flex-end; background: color-mix(in oklch, var(--p) 18%, var(--surface-1)); }
  .composer { margin: 0 24px 20px; height: 56px; border-radius: 10px; border: 1px solid var(--surface-border); background: var(--surface-1); color: var(--bcm); font-size: 13px; display: flex; align-items: center; padding: 0 14px; flex-shrink: 0; }

  /* ---------- Resize handle (ptah-split-handle + RESIZE_HANDLE_STYLES) ----------
     GEOMETRY (revision 2): overlay, zero layout width. .split-slot is a 0 px flex item between the main column
     and the dock; the 12 px hit area sits entirely inside the dock's leading edge (left-0 w-3: 1 px border + 11 px of the dock's 16 px padding), so it never overlaps the chat pane or its scrollbar; grip is centred in the hit area, 1 px line at the dock edge.
     Main column + dock widths therefore sum to the shell width exactly: dockMax = shellWidth - 624. */
  .split-slot { width: 0; flex: none; height: 100%; position: relative; z-index: 10; }
  .split { position: absolute; top: 0; bottom: 0; left: 0; width: 12px; display: flex; align-items: center; justify-content: flex-start;
    cursor: col-resize; outline: none; touch-action: none; background: transparent; transition: background-color 150ms; }  /* absolute inset-y-0 left-0 w-3: whole hit area on the dock side, never over the chat pane */
  .split::after { content: ""; width: 1px; height: 100%; border-radius: 9999px; background: color-mix(in oklch, var(--bc) 15%, transparent); transition: background-color 150ms; } /* bg-base-content/15 (decorative; the dock border-left is the boundary) */
  .split:hover::after { background: color-mix(in oklch, var(--p) 60%, transparent); }   /* group-hover:bg-primary/60 */
  .split.dragging, .split:active { background: color-mix(in oklch, var(--p) 20%, transparent); }
  .split.dragging::after, .split:active::after { background: var(--p); }                /* group-active:bg-primary */
  /* REST-STATE GRIP (revision 2): 4x32 pill, base-content/60 = 5.94:1 dark / 4.45:1 light on base-100, 4.18 / 3.35 on the dock border; >= 3:1 (WCAG 1.4.11) */
  .split .grip { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 4px; height: 32px; border-radius: 9999px;
    background: color-mix(in oklch, var(--bc) 60%, transparent); transition: background-color 150ms; pointer-events: none; }  /* w-1 h-8 rounded-full bg-base-content/60 */
  .split:hover .grip { background: color-mix(in oklch, var(--bc) 80%, transparent); }   /* bc/80: 9.75 / 8.70 */
  .split.dragging .grip, .split:active .grip { background: var(--bc); }                  /* solid: 14.86 / 15.91 */
  /* NEW vs git dock: focus-visible = solid base-content outline (14.86 dark / 15.91 light vs base-100), not bg-primary/20 (1.4:1 in light) */
  .split:focus-visible { outline: 2px solid var(--bc); outline-offset: -1px; background: color-mix(in oklch, var(--bc) 8%, transparent); }
  .split.kbd-force { outline: 2px solid var(--bc); outline-offset: -1px; background: color-mix(in oklch, var(--bc) 8%, transparent); }
  .split .tip { display: none; position: absolute; top: 16px; left: 18px; white-space: nowrap; background: var(--b3); color: var(--bc); border: 1px solid var(--surface-border); border-radius: 4px; padding: 2px 6px; font-size: 11px; font-variant-numeric: tabular-nums; pointer-events: none; }
  .split.dragging .tip, .split:focus-visible .tip, .split.kbd-force .tip { display: block; }

  /* ---------- Inspector (chat-view.component.css .cs-inspector) ---------- */
  .cs-inspector { flex-shrink: 0; height: 100%; min-height: 0; border-left: 1px solid var(--surface-border); background: var(--b1);
    display: block; overflow: hidden; animation: csInspectorIn 220ms var(--ptah-ease-soft) both; }
  .cs-inspector.dragging-now { animation: none; }
  .cs-inspector--sheet { position: absolute; inset-block: 0; right: 0; z-index: 30; width: min(336px, 100%); box-shadow: var(--elev-shadow-raised); }
  .cs-inspector--full { width: 100%; border-left: 0; }
  .cs-scrim { position: absolute; inset: 0; z-index: 20; background: rgb(0 0 0 / .3); }
  @keyframes csInspectorIn { from { opacity: 0; transform: translateX(8px);} to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .cs-inspector { animation: none; } }

  .insp { height: 100%; overflow-y: auto; scrollbar-width: thin; }
  .insp-hd { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; position: sticky; top: 0; background: var(--b1); z-index: 2; }
  .insp-hd h2 { margin: 0; font-size: 13px; font-weight: 600; }
  .insp-hd button { width: 24px; height: 24px; border-radius: 4px; border: 0; background: transparent; color: var(--bc); cursor: pointer; }
  .insp-hd button:hover { background: color-mix(in oklch, var(--bc) 10%, transparent); }
  .sec { padding: 16px; border-top: 1px solid var(--surface-border); }                 /* p-4 border-t border-surface-border */
  .sec-label { margin: 0 0 8px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--bcm); }
  .kv { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; }
  .kv span:last-child { font-variant-numeric: tabular-nums; }
  .agent { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 6px 0; }
  .agent i { width: 8px; height: 8px; border-radius: 9999px; background: var(--info); }
  .muted { color: var(--bcm); }                                                       /* text-base-content-muted */

  /* ---------- Plan caption row + chips (stats-tile.styles.ts) ---------- */
  .prov { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 11px; color: var(--bcm); }
  .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 4px; border: 1px solid; padding: 1px 4px; font-size: 10px; line-height: 1.25; color: var(--bc); white-space: nowrap; }
  .chip.neutral { border-color: color-mix(in oklch, var(--bc) 20%, transparent); }
  .chip.warning { border-color: var(--warning); background: color-mix(in oklch, var(--warning) 15%, transparent); }
  .chip.info { border-color: var(--info); background: color-mix(in oklch, var(--info) 15%, transparent); }
  .src { display: inline-block; border-radius: 4px; border: 1px solid color-mix(in oklch, var(--bc) 20%, transparent); padding: 0 4px; font-size: 10px; line-height: 1.25; color: var(--bc); }
  .src.dashed { border-style: dashed; font-style: italic; }

  /* ---------- NEW: plan-limit card (variant="inspector") ---------- */
  .grid { display: grid; gap: 8px; }                                                  /* grid gap-2 (unchanged) */
  /* Card = container div (border, accent, surface). Header button inside; expanded detail inside below the footer. */
  .card { display: block; width: 100%; position: relative; overflow: hidden;
    border-radius: 6px; border: 1px solid var(--surface-border); border-left: 2px solid transparent; /* rounded-md border border-surface-border + ROW_ACCENT */
    background: var(--surface-1); }                                                       /* bg-surface-1 */
  .card.tone-warning { border-left-color: var(--warning); }
  .card.tone-info { border-left-color: var(--info); }
  .card-static { display: block; padding: 10px; }                                       /* status / local-usage: non-interactive, same p-2.5 face */
  .card-btn { display: block; width: 100%; text-align: left; color: inherit; font: inherit; cursor: pointer; border: 0; background: transparent;
    padding: 10px; transition: background-color 150ms; }                                  /* block w-full text-left p-2.5 */
  .card-btn:hover { background: color-mix(in oklch, var(--bc) 5%, transparent); }          /* hover:bg-base-content/5 */
  .card-btn:focus-visible { outline: 2px solid var(--bc); outline-offset: -2px; }         /* ROW_FACE focus ring (inset so overflow-hidden does not clip it) */
  .card-hd { display: flex; align-items: center; gap: 8px; min-width: 0; }               /* row 1 */
  .card-hd .label { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--bc); }
  .card-hd .chip { flex-shrink: 0; }
  .card-hd .chev { flex-shrink: 0; width: 12px; height: 12px; color: var(--bcm); transition: transform 150ms; }
  .card-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .card-center { display: block; margin-top: 8px; }                                       /* row 2: full width */
  .card-center .status { display: block; font-size: 11px; line-height: 1.4; color: var(--bcm); overflow-wrap: anywhere; }
  .bar-row { display: flex; align-items: center; gap: 8px; }
  .bar { display: block; position: relative; flex: 1 1 0; height: 8px; overflow: hidden; border-radius: 9999px; background: color-mix(in oklch, var(--bc) 10%, transparent); }  /* h-2 (was h-1.5) */
  .bar > i { display: block; height: 100%; border-radius: 9999px; }
  .bar > i.ok { background: var(--success); } .bar > i.warn { background: var(--warning); }
  .bar-row .val { flex-shrink: 0; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .reset { display: block; margin-top: 4px; font-size: 11px; line-height: 1.25; color: var(--bcm); }
  .card-ft { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 6px; font-size: 10px; color: var(--bcm); line-height: 1.25; }
  .panel { margin: 0; border-top: 1px solid var(--surface-border); padding: 8px 10px 10px; font-size: 12px; }  /* border-t border-surface-border px-2.5 pt-2 pb-2.5; replaces ROW_PANEL box */
  .panel[hidden] { display: none; }
  .panel .fact { font-size: 11px; color: var(--bcm); margin-top: 2px; }
  .panel b { font-size: 12px; }
  .panel .bar { height: 6px; margin-top: 4px; }
  .panel .bar > i { background: color-mix(in oklch, var(--bc) 70%, transparent); border-radius: 4px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="stage"><div class="win" id="win"></div></div>
<div class="toolbar">
  <button data-act="theme">theme</button><button data-act="view">1440/760</button>
  <button data-act="tab">toggle inspector</button><button data-act="expand">expand card</button>
</div>

<script>
/* ======================== Constants (design-spec section 3) ======================== */
const MIN_W = 300, MAX_W = 560, MAIN_MIN = 624, STEP = 16, STEP_BIG = 48;
const DOCKED_MIN = 960, SHEET_MIN = 640;                  // INSPECTOR_DOCKED_MIN_WIDTH / _SHEET_MIN_WIDTH (unchanged)
const defaultWidth = shell => shell >= 1500 ? 448 : shell >= 1100 ? 400 : 336;

const hash = Object.fromEntries(location.hash.slice(1).split('&').filter(Boolean).map(p => p.split('=')));
const S = {
  theme: hash.theme === 'light' ? 'light' : 'dark',
  view: hash.view === '760' ? 760 : 1440,
  open: hash.tab !== 'closed',
  expand: hash.expand === '0' ? false : true,
  stored: null,                       // persisted width (null = default)
  force: hash.focus === 'handle',     // screenshot helper: show keyboard focus state
};
document.body.classList.toggle('shot', hash.shot === '1');

const BAR = (pct, cls) => `<span class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="plan usage"><i class="${cls}" style="width:${pct}%"></i></span>`;
const CHEV = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>`;

// Rule: only EXPANDABLE plan-window kinds get the disclosure button + panel. kind 'status' / 'local-usage'
// render a non-interactive card: no <button>, no chevron, no aria-expanded/aria-controls, no panel.
function card(id, label, chip, center, footer, panel, tone, open, kind = 'plan-window') {
  if (kind !== 'plan-window') {
    return `<div class="card ${tone}" data-tile-id="${id}" data-kind="${kind}"><div class="card-static" data-testid="plan-limit-tile">
    <span class="card-hd"><span class="label" title="${label}">${label}</span>${chip}</span>
    <span class="card-center">${center}</span>
    ${footer}
  </div></div>`;
  }
  return `<div class="card ${tone}" data-tile-id="${id}"><button type="button" class="card-btn" aria-expanded="${open}" aria-controls="p-${id}" data-testid="plan-limit-tile">
    <span class="card-hd"><span class="label" title="${label}">${label}</span>${chip}${CHEV}</span>
    <span class="card-center">${center}</span>
    ${footer}
  </button><div class="panel" id="p-${id}" ${open ? '' : 'hidden'} data-testid="plan-limit-panel">${panel}</div></div>`;
}

function inspectorHtml() {
  const open2 = S.expand;
  return `<div class="insp"><div class="insp-hd"><h2>This session</h2><button aria-label="Close session details" data-close>&#10005;</button></div>
  <div class="sec" style="border-top:0"><h3 class="sec-label">Session</h3>
    <div class="kv"><span class="muted">Context</span><span>62%</span></div>
    <div class="kv"><span class="muted">Tokens</span><span>184,220</span></div>
    <div class="kv"><span class="muted">Cost</span><span>$1.42</span></div></div>
  <div class="sec"><h3 class="sec-label">Agents</h3>
    <div class="agent"><i></i>orchestrator <span class="muted">running</span></div>
    <div class="agent"><i></i>frontend-developer <span class="muted">running</span></div></div>
  <section class="sec" aria-labelledby="pl"><h3 class="sec-label" id="pl">PLAN LIMITS</h3>
    <div class="prov"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Claude plan windows</span><span class="src">Live event</span><span class="src">Provider API</span></div>
    <div class="grid">
      ${card('w5', '5-hour', '<span class="chip neutral" data-testid="plan-limit-chip"><span aria-hidden="true">?</span> Usage unknown</span>',
        '<span class="status" data-testid="plan-limit-status">unknown · resets today 02:40 GMT+3 · in 2h 30m</span>', '',
        '<div class="fact">No usage figure was reported for this window yet.</div>', 'tone-neutral', false)}
      ${card('w7', 'Weekly', '<span class="chip neutral" data-testid="plan-limit-chip">50% used</span>',
        `<span class="bar-row">${BAR(50,'ok')}<span class="val" data-testid="plan-limit-tile-value">50%</span></span><span class="reset">resets Fri 02:40 GMT+3 · in 4d 2h</span>`, '',
        '', 'tone-neutral', false)}
      ${card('w7s', 'Weekly Sonnet', '<span class="chip warning" data-testid="plan-limit-chip">82% used</span>',
        `<span class="bar-row">${BAR(82,'warn')}<span class="val" data-testid="plan-limit-tile-value">82%</span></span><span class="reset">resets Fri 02:40 GMT+3 · in 4d 2h</span>`,
        `<span class="card-ft"><span>Per-model weekly window</span><span class="src dashed">estimated</span></span>`,
        `<div class="fact"><b>Used: 82% of weekly Sonnet allowance</b></div><span class="bar" aria-hidden="true"><i style="width:82%"></i></span><div class="fact">Window length: 7 days</div><div class="fact">Last updated 1 min ago</div>`, 'tone-warning', open2)}
      ${card('lu', 'Local usage', '<span class="chip neutral" data-testid="plan-limit-chip">Local</span>',
        '<span class="status" data-testid="plan-limit-status">Measured on this machine · not a plan window</span>', '', '', 'tone-neutral', false, 'local-usage')}
    </div>
  </section>
  <div class="sec"><h3 class="sec-label">Lanes</h3><div class="kv"><span class="muted">2 lanes · 5 runs</span><span></span></div></div>
  <div class="sec"><h3 class="sec-label">Task</h3><div style="font-size:12px">TASK_2026_699 - inspector side dock</div></div>
  <div class="sec"><h3 class="sec-label">Git</h3><div class="kv"><span class="muted">feat/inspector-side-dock</span><span>+212 −34</span></div></div>
  </div>`;
}

function render() {
  document.documentElement.dataset.theme = S.theme === 'light' ? 'anubis-light' : 'anubis';
  document.documentElement.dataset.themeMode = S.theme;
  const win = document.getElementById('win');
  win.style.width = S.view + 'px';
  const wsOpen = S.view >= 1440;
  const TAB = 32;
  // shell width = window - ws tab - (ws sidebar) - session tab - git tab
  const shellW = S.view - TAB - (wsOpen ? 220 : 0) - TAB - TAB;
  const band = shellW >= DOCKED_MIN ? 'docked' : shellW >= SHEET_MIN ? 'sheet' : 'full';
  const effMax = Math.max(MIN_W, Math.min(MAX_W, shellW - MAIN_MIN));
  const base = S.stored ?? defaultWidth(shellW);
  const width = Math.max(MIN_W, Math.min(effMax, base));
  S.shellW = shellW; S.effMax = effMax; S.width = width; S.band = band;

  const showDock = S.open && band === 'docked';
  const showSheet = S.open && band !== 'docked';
  const inspector = `<aside class="cs-inspector ${band === 'sheet' ? 'cs-inspector--sheet' : band === 'full' ? 'cs-inspector--sheet cs-inspector--full' : ''}" id="inspector"
      ${band === 'docked' ? `aria-label="This session" style="width:${width}px"` : 'role="dialog" aria-modal="true" aria-label="This session"'}>${inspectorHtml()}</aside>`;
  win.innerHTML = `
    <div class="tab left ${wsOpen ? 'open' : ''}"><button type="button" aria-expanded="${wsOpen}"><span class="lbl">Workspaces</span></button></div>
    ${wsOpen ? `<div class="ws"><h4>Workspaces</h4><ul><li class="on">ptah-extension</li><li>docs-site</li><li>billing-api</li></ul></div>` : ''}
    <div class="chat">
      <div class="cs-shell" id="shell" style="width:${shellW}px;flex:none">
        <div class="main" ${showSheet ? 'inert' : ''}>
          <div class="hdr">Inspector side dock<span class="sp"></span><button class="ibtn" aria-pressed="${S.open}" aria-controls="inspector" aria-label="${S.open ? 'Hide' : 'Show'} session details" data-toggle>&#9776;</button></div>
          <div class="msgs"><div class="bubble me">Move the session inspector into a resizable side dock.</div>
            <div class="bubble">Plan: add a vertical Session tab on the right edge, a drag handle between the chat column and the dock, and card layout for plan limits.</div>
            <div class="bubble">Widths clamp between 300 and 560 px; the chat column never drops under 624 px.</div></div>
          <div class="composer">Message the orchestrator</div>
        </div>
        ${showDock ? `<div class="split-slot"><div class="split ${S.force ? 'kbd-force' : ''}" id="split" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize session details"
              aria-valuenow="${Math.round(width)}" aria-valuemin="${MIN_W}" aria-valuemax="${Math.round(effMax)}" title="Drag to resize · double-click to reset"><span class="grip"></span><span class="tip">${Math.round(width)} px</span></div></div>${inspector}` : ''}
        ${showSheet ? `<div class="cs-scrim" data-close aria-hidden="true"></div>${inspector}` : ''}
      </div>
      <div class="tab right ${S.open ? 'open' : ''}" ${showSheet ? 'inert' : ''}><button type="button" aria-label="Session details${S.open ? ', open' : ''}" aria-expanded="${S.open}" title="${S.open ? 'Hide' : 'Show'} Session" data-toggle>
        <span class="lbl">Session</span>${!S.open ? '<span class="dot" aria-hidden="true"></span>' : ''}</button></div>
    </div>
    <div class="tab right"><button type="button" aria-expanded="false"><span class="lbl">Git</span></button></div>`;
  wire();
}

function wire() {
  const win = document.getElementById('win');
  win.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => { S.open = !S.open; render(); });
  win.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { S.open = false; render(); });
  win.querySelectorAll('.card-btn[aria-controls]').forEach(c => c.onclick = () => {
    const open = c.getAttribute('aria-expanded') === 'true';
    c.setAttribute('aria-expanded', String(!open));
    document.getElementById(c.getAttribute('aria-controls')).hidden = open;
  });
  const split = document.getElementById('split'); if (!split) return;
  const clamp = v => Math.max(MIN_W, Math.min(S.effMax, v));
  const apply = v => { S.width = clamp(v); const insp = document.getElementById('inspector'); insp.style.width = S.width + 'px';
    split.setAttribute('aria-valuenow', Math.round(S.width)); split.querySelector('.tip').textContent = Math.round(S.width) + ' px'; };
  split.addEventListener('pointerdown', e => {
    e.preventDefault(); const start = S.width; split.setPointerCapture(e.pointerId); split.classList.add('dragging');
    document.getElementById('inspector').classList.add('dragging-now'); document.body.style.cursor = 'col-resize';
    const rightEdge = document.getElementById('inspector').getBoundingClientRect().right;
    const mv = ev => apply(rightEdge - ev.clientX);
    const up = () => { split.classList.remove('dragging'); document.body.style.cursor = ''; S.stored = S.width; split.removeEventListener('pointermove', mv); split.removeEventListener('pointerup', up); };
    split.addEventListener('pointermove', mv); split.addEventListener('pointerup', up);
    split.addEventListener('keydown', k => { if (k.key === 'Escape') { apply(start); S.stored = start; up(); } }, { once: true });
  });
  split.addEventListener('keydown', e => {
    const step = e.shiftKey ? STEP_BIG : STEP; let n = null;
    if (e.key === 'ArrowLeft') n = S.width + step; else if (e.key === 'ArrowRight') n = S.width - step;   // dock grows toward the left
    else if (e.key === 'Home') n = MIN_W; else if (e.key === 'End') n = S.effMax;
    if (n !== null) { e.preventDefault(); apply(n); S.stored = S.width; }
  });
  split.addEventListener('dblclick', () => { S.stored = null; render(); });
}

document.querySelectorAll('.toolbar button').forEach(b => b.onclick = () => {
  const a = b.dataset.act;
  if (a === 'theme') S.theme = S.theme === 'dark' ? 'light' : 'dark';
  if (a === 'view') S.view = S.view === 1440 ? 760 : 1440;
  if (a === 'tab') S.open = !S.open;
  if (a === 'expand') S.expand = !S.expand;
  render();
});
render();
</script>
</body>
</html>
