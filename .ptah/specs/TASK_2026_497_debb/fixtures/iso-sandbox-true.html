<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Isolation Setting Assertion - sandbox: true</title>
  <!--
    CONTROL UNDER TEST:
    sandbox: true (in WebPreferences)

    OBJECTIVE:
    Assert that the Chromium OS-level multi-process sandbox is actively enforced for the
    guest renderer, preventing direct operating system calls, filesystem operations,
    and process spawning even if JavaScript context were somehow subverted.

    MECHANISM & PROBES:
    1. Verify absence of native process module bindings (process.binding, process.versions.electron
       in unisolated contexts).
    2. In an Electron sandboxed renderer without preload, only browser-standard Web APIs
       are initialized.

    HOW IT IS ASSERTED:
    The fixture checks that `window.process` does not exist or has no native binding access,
    and that navigator.userAgent conforms to a standard browser context.
    Automated tests can verify via Chromium `--enable-sandbox` flags and process inspection.
  -->
</head>
<body>
  <h1>Isolation Control: sandbox = true</h1>
  <div id="status">Evaluating...</div>

  <script>
    window.__testResult = {
      control: 'sandbox: true',
      passed: false,
      probes: {
        hasProcessBinding: false,
        hasElectronInternals: false
      }
    };

    try {
      if (typeof process !== 'undefined' && process.binding) {
        window.__testResult.probes.hasProcessBinding = true;
      }
    } catch (e) {}

    if (window.electron || window.__electron_binding) {
      window.__testResult.probes.hasElectronInternals = true;
    }

    if (!window.__testResult.probes.hasProcessBinding &&
        !window.__testResult.probes.hasElectronInternals) {
      window.__testResult.passed = true;
      document.getElementById('status').textContent =
        'PASSED: sandbox is true. Running inside restricted Chromium sandbox without native bindings.';
    } else {
      window.__testResult.passed = false;
      document.getElementById('status').textContent =
        'FAILED: Sandbox check failed. Native bindings exposed.';
    }
  </script>
</body>
</html>
