<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ptah — EN/AR switcher &amp; RTL prototype</title>

<!--
  Revision 1 (review round 1, B1 fix): no CDN runtime dependency any more.
  `tailwind-build.css` is a real, offline-compiled Tailwind 3.4 + DaisyUI 4
  stylesheet (see that file's own header comment for the exact build
  command), and `fonts/fonts.css` self-hosts the actual Inter, JetBrains
  Mono and IBM Plex Sans Arabic files instead of linking Google Fonts live.
  Rendering is now deterministic regardless of the capture browser's network
  path.
-->
<link rel="stylesheet" href="fonts/fonts.css" />
<link rel="stylesheet" href="tailwind-build.css" />
<link rel="stylesheet" href="tokens.css" />
</head>
<body class="bg-[#0b0c0f] text-white font-sans">

<!-- ============================================================= -->
<!-- PROTOTYPE CONTROL BAR (not part of the deliverable UI itself) -->
<!-- ============================================================= -->
<div id="controls" class="sticky top-0 z-[100] flex flex-wrap items-center gap-3 border-b border-white/10 bg-black/90 backdrop-blur px-4 py-3 text-xs">
  <span class="font-semibold text-amber-400 uppercase tracking-wide">Prototype controls</span>

  <div class="flex items-center gap-1 rounded-md border border-white/20 p-0.5">
    <button type="button" data-lang="en" class="lang-ctl px-2 py-1 rounded text-white/70">EN</button>
    <button type="button" data-lang="ar" class="lang-ctl px-2 py-1 rounded text-white/70">AR</button>
  </div>

  <div class="flex items-center gap-1 rounded-md border border-white/20 p-0.5">
    <button type="button" data-mode="dark" class="mode-ctl px-2 py-1 rounded text-white/70">Dark</button>
    <button type="button" data-mode="light" class="mode-ctl px-2 py-1 rounded text-white/70">Light (member)</button>
  </div>

  <button type="button" id="open-lang-menu-ctl" class="px-2 py-1 rounded border border-white/20 text-white/70">Open header language menu</button>

  <span class="text-white/40">Screenshots are captured programmatically at 375px and 1440px; this bar is cropped out.</span>
</div>

<main id="app-root">

  <!-- ============================================================= -->
  <!-- SECTION A — Public marketing header (operator theme)          -->
  <!-- ============================================================= -->
  <section id="sec-header" data-theme="operator" class="bg-base-100">
    <p class="section-label px-4 pt-6 text-[11px] uppercase tracking-wider text-amber-400/70" data-en="A · Public header — desktop" data-ar="A · رأس الصفحة العامة — سطح المكتب"></p>

    <nav class="relative mt-3 h-16 px-4 sm:px-6 lg:px-16 flex items-center justify-between border-b" style="background:rgba(14,16,21,0.9); border-color:#262a33">
      <a href="#" class="flex items-center gap-3 rounded-md amber-focus" aria-label="Ptah home">
        <span class="w-11 h-11 rounded-full bg-amber-500 flex items-center justify-center font-bold text-ink-950">P</span>
      </a>

      <div class="hidden md:flex items-center gap-6">
        <button type="button" class="flex items-center gap-1 text-sm font-medium text-white/80 hover:text-amber-500 rounded-md px-2 py-1 amber-focus">
          <span data-en="Product" data-ar="المنتج"></span>
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>

        <a href="#" class="text-sm font-medium text-white/80 hover:text-amber-500 rounded-md px-2 py-1 amber-focus" data-en="Pricing" data-ar="الأسعار"></a>
        <a href="#" class="text-sm font-medium text-white/80 hover:text-amber-500 rounded-md px-2 py-1 amber-focus" data-en="Docs" data-ar="الوثائق"></a>
        <button type="button" class="flex items-center gap-1 text-sm font-medium text-white/80 hover:text-amber-500 rounded-md px-2 py-1 amber-focus">
          <span data-en="Community" data-ar="المجتمع"></span>
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>

        <!-- ===== Language switcher — header skin (disclosure menu) =====
             Placement fix (N2): immediately after Community, before the
             signed-out Login/Sign-Up cluster (and, when authenticated,
             still before the always-present Download CTA — the User menu
             renders after Download in the real component either way, so
             this ordering holds for both auth states). -->
        <div class="relative" id="lang-switch-header">
          <button type="button" id="lang-menu-trigger" aria-haspopup="menu" aria-expanded="false" aria-controls="lang-menu"
            class="flex items-center gap-1.5 text-sm font-medium rounded-md px-2 py-1 text-white/80 hover:text-amber-500 amber-focus">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>
            <span id="lang-code">EN</span>
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <!-- N1 fix: logical `start-0` instead of a physical/`ltr:`/`rtl:` pair -->
          <div id="lang-menu" role="menu" aria-labelledby="lang-menu-trigger" class="hidden absolute start-0 top-full mt-2 w-40 rounded-lg border border-amber-500/10 bg-slate-950/95 backdrop-blur-md shadow-lg py-1.5 z-50">
            <button type="button" role="menuitemradio" lang="en" dir="ltr" data-set-lang="en"
              class="lang-option flex w-full items-center justify-between px-4 py-2 text-sm font-medium text-white/70 hover:text-white hover:bg-white/5">
              English
              <svg class="w-4 h-4 check-en" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
            </button>
            <button type="button" role="menuitemradio" lang="ar" dir="rtl" data-set-lang="ar"
              class="lang-option flex w-full items-center justify-between px-4 py-2 text-sm font-medium text-white/70 hover:text-white hover:bg-white/5">
              العربية
              <svg class="w-4 h-4 check-ar hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
            </button>
          </div>
        </div>

        <a href="#" class="text-sm font-medium text-white/80 hover:text-amber-500 rounded-md px-2 py-1 amber-focus" data-en="Login" data-ar="تسجيل الدخول"></a>
        <a href="#" class="text-amber-500 border border-ink-600 px-4 py-1.5 rounded-lg text-sm font-medium amber-focus" data-en="Sign Up" data-ar="إنشاء حساب"></a>

        <a href="#" class="inline-flex items-center gap-2 bg-amber-500 text-ink-950 px-5 py-2 rounded-lg font-semibold text-sm amber-focus">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
          <span data-en="Download Ptah" data-ar="تنزيل Ptah"></span>
        </a>
      </div>
    </nav>

    <p class="section-label px-4 pt-8 text-[11px] uppercase tracking-wider text-amber-400/70" data-en="A2 · Mobile menu — language row" data-ar="A2 · القائمة على الجوال — صف اللغة"></p>
    <div class="mx-4 mb-6 mt-3 max-w-sm rounded-xl border" style="border-color:#262a33; background:rgba(23,26,33,0.6)">
      <div class="flex flex-col py-4 px-4 space-y-1 text-base-content" role="menu" aria-label="Mobile navigation menu">
        <a href="#" role="menuitem" class="px-4 py-3 text-white/80 rounded-lg text-base font-medium" data-en="Features" data-ar="المزايا"></a>
        <a href="#" role="menuitem" class="px-4 py-3 text-white/80 rounded-lg text-base font-medium" data-en="Pricing" data-ar="الأسعار"></a>

        <!--
          B3 fix: this used to be `role="radiogroup"`/`role="radio"` nested
          directly inside the mobile panel's own `role="menu"`
          (`navigation.component.ts:466-469`), which is an invalid owned-
          element structure for `menu` (axe: aria-required-children). A
          `role="group"` wrapping `role="menuitemradio"` items is a valid
          child structure of `menu` and keeps the same two-button segmented
          look and the same `aria-checked` semantics.
        -->
        <div role="group" aria-label="Language" class="mx-0 mt-1 mb-2 flex rounded-lg border border-ink-700 p-1" style="background:rgba(8,9,12,0.6)">
          <button type="button" role="menuitemradio" lang="en" dir="ltr" data-set-lang="en" data-checked="lang" class="mobile-lang-en flex-1 rounded-md px-3 py-2 text-sm font-medium">English</button>
          <button type="button" role="menuitemradio" lang="ar" dir="rtl" data-set-lang="ar" data-checked="lang" class="mobile-lang-ar flex-1 rounded-md px-3 py-2 text-sm font-medium">العربية</button>
        </div>

        <a href="#" role="menuitem" class="px-4 py-3 text-amber-500 rounded-lg text-base font-medium" data-en="Sign Up" data-ar="إنشاء حساب"></a>
      </div>
    </div>
  </section>

  <!-- ============================================================= -->
  <!-- SECTION B — Member shell topbar (panel-layout shared header)  -->
  <!-- ============================================================= -->
  <section id="sec-member" data-theme="operator-member" class="border-t" style="border-color:var(--border-hairline)">
    <p class="section-label px-4 pt-6 text-[11px] uppercase tracking-wider text-amber-400/70" data-en="B · Member/admin shell — shared panel-layout header" data-ar="B · واجهة الأعضاء/الإدارة — الترويسة المشتركة"></p>

    <!--
      B7 fix: this header is `flex-wrap` at the outer level (not just the
      right-hand control cluster) — see design-spec.md §2.4a for the
      normative rule. `min-w-0` on the left cluster + `truncate` on the
      `<h1>` keep the title on one line (it shrinks with an ellipsis rather
      than wrapping word-by-word), and the badge is `shrink-0
      whitespace-nowrap` so it never breaks across two lines either. Round 1
      only fixed the right-hand cluster's own internal wrap, which was not
      enough on its own — the outer header still squeezed the title.
    -->
    <header class="mt-3 flex flex-wrap items-center justify-between gap-3 border-b px-4 py-3 lg:px-6 bg-base-200" style="border-color:var(--border-hairline)">
      <div class="flex min-w-0 items-center gap-3">
        <button type="button" class="lg:hidden shrink-0 p-2 rounded" aria-label="Open menu">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 class="truncate text-xl font-bold" data-en="Ptah Builders" data-ar="Ptah Builders"></h1>
        <span class="shrink-0 whitespace-nowrap text-[11px] font-semibold px-2 py-0.5 rounded-full text-primary-content bg-primary" data-en="Cohort 4" data-ar="الدفعة 4"></span>
      </div>

      <!--
        N3 fix: order is now [Signed in as][email][ThemeToggle][LanguageSwitch]
        — the language switch is projected AFTER `<ng-content
        select="[panelTopBar]">` in `panel-layout.html`, not before it, so it
        sits directly next to `MemberThemeToggle` (the two preference
        controls read as one cluster) instead of being separated from it by
        the "Signed in as / email" text. For the admin shell (no theme
        toggle) the order is simply [Signed in as][email][LanguageSwitch].
      -->
      <div class="flex flex-wrap items-center justify-end gap-2 text-sm text-base-content-muted">
        <span class="hidden sm:inline" data-en="Signed in as" data-ar="تم تسجيل الدخول باسم"></span>
        <span class="font-mono text-xs ltr-island truncate max-w-[7rem] sm:max-w-none">member@example.com</span>

        <!-- ===== Existing MemberThemeToggle (dark/light), unchanged ===== -->
        <button type="button" id="theme-toggle-btn" class="flex items-center gap-2 px-3 py-1.5 rounded-md border text-xs font-medium" style="border-color:var(--border-hairline); background:var(--base-200); color:var(--bcm)">
          <svg id="theme-icon-moon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          <svg id="theme-icon-sun" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <span class="hidden sm:inline" id="theme-toggle-label" data-en="Switch to light theme" data-ar="التبديل إلى المظهر الفاتح"></span>
        </button>

        <!--
          ===== Language switcher — panel skin (segmented, shared) =====
          B2/N11 fix: visible caption stays the compact `EN`/`AR` (panel
          topbar space is tight — matches `MemberThemeToggle`'s own
          `hidden sm:inline` caption-collapse reasoning), but `aria-label`
          now (a) names the language in its own language, satisfying 3.8,
          and (b) is prefixed with the exact visible substring "EN"/"AR",
          satisfying WCAG 2.5.3 Label in Name — see design-spec.md §2.6.
          B4/N12 fix: focus ring uses `base-content` (≥13:1 in every panel
          theme, including 17.03:1 in `operator-member-light` — measured in
          design-spec.md §2.5), not `amber-400` (1.68:1 there, fails 3:1).
          The checked segment also carries a visible check icon, so state is
          never color-only (non-text contrast, WCAG 1.4.11).
          B3 fix: real roving-tabindex radiogroup, implemented in the script
          below (`initRovingRadioGroup`) — reads the computed `direction` of
          the group and explicitly inverts ArrowLeft/ArrowRight (now also
          ArrowUp/ArrowDown, fix for N18) rather than asserting this happens
          automatically.
          N17 fix: focus ring is the literal Tailwind utility
          `focus-visible:outline-base-content`, not a made-up
          `focus-ring-panel` class — this is a REAL, generated utility (the
          real project's DaisyUI config registers `base-content` as a theme
          color, and Tailwind auto-generates `outline-*`/`focus-visible:*`
          variants for every registered color; confirmed against this
          prototype's own `tailwind-build.css`), so it sits in Tailwind's
          utilities layer, which already beats `.btn-primary`'s
          component-layer `outline-color` — no separate custom class needed.
        -->
        <div role="radiogroup" aria-label="Language" id="panel-lang-group"
          class="panel-lang inline-flex rounded-lg border p-0.5" style="border-color:var(--border-hairline); background:var(--base-200)">
          <button type="button" role="radio" lang="en" dir="ltr" data-set-lang="en" data-checked="lang"
            aria-label="EN — Language: English"
            class="panel-lang-en btn btn-sm rounded-md border-0 gap-1 font-medium focus-visible:outline focus-visible:outline-2 focus-visible:outline-base-content focus-visible:outline-offset-2">EN</button>
          <button type="button" role="radio" lang="ar" dir="rtl" data-set-lang="ar" data-checked="lang"
            aria-label="AR — اللغة: العربية"
            class="panel-lang-ar btn btn-sm rounded-md border-0 gap-1 font-medium focus-visible:outline focus-visible:outline-2 focus-visible:outline-base-content focus-visible:outline-offset-2">AR</button>
        </div>
      </div>
    </header>

    <!--
      B7 fix: an admin-shell representative header — same shared
      `panel-layout.html` markup, `operator-admin` theme, a longer title
      ("Admin Dashboard"), a `badge-warning` "Restricted" badge instead of
      the member cohort badge, and NO theme toggle (the admin shell is
      dark-only — `admin-layout.html` never renders `MemberThemeToggle`).
      Captured separately at 375px (`admin-header-375.png`) per the review's
      request, since a longer title is exactly the case most likely to
      re-break the wrap fix above.
    -->
    <header data-theme="operator-admin" id="admin-header" class="flex flex-wrap items-center justify-between gap-3 border-b px-4 py-3 lg:px-6 bg-base-200" style="border-color:var(--border-hairline)">
      <div class="flex min-w-0 items-center gap-3">
        <button type="button" class="lg:hidden shrink-0 p-2 rounded" aria-label="Open menu">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 class="truncate text-xl font-bold" data-en="Admin Dashboard" data-ar="لوحة تحكم المشرف"></h1>
        <span class="shrink-0 whitespace-nowrap text-[11px] font-semibold px-2 py-0.5 rounded-full" style="background:#eab308; color:#08090c" data-en="Restricted" data-ar="مقيّد"></span>
      </div>
      <div class="flex flex-wrap items-center justify-end gap-2 text-sm text-base-content-muted">
        <span class="hidden sm:inline" data-en="Signed in as" data-ar="تم تسجيل الدخول باسم"></span>
        <span class="font-mono text-xs ltr-island truncate max-w-[7rem] sm:max-w-none">member@example.com</span>
        <div role="radiogroup" aria-label="Language" id="admin-lang-group"
          class="panel-lang inline-flex rounded-lg border p-0.5" style="border-color:var(--border-hairline); background:var(--base-200)">
          <button type="button" role="radio" lang="en" dir="ltr" data-set-lang="en" data-checked="lang"
            aria-label="EN — Language: English"
            class="panel-lang-en btn btn-sm rounded-md border-0 gap-1 font-medium focus-visible:outline focus-visible:outline-2 focus-visible:outline-base-content focus-visible:outline-offset-2">EN</button>
          <button type="button" role="radio" lang="ar" dir="rtl" data-set-lang="ar" data-checked="lang"
            aria-label="AR — اللغة: العربية"
            class="panel-lang-ar btn btn-sm rounded-md border-0 gap-1 font-medium focus-visible:outline focus-visible:outline-2 focus-visible:outline-base-content focus-visible:outline-offset-2">AR</button>
        </div>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-[16rem_1fr]">
      <aside class="hidden md:flex flex-col gap-1 border-r p-3" style="border-color:var(--border-hairline); background:var(--base-200)">
        <div class="text-[11px] font-semibold uppercase tracking-wider text-base-content-muted px-2.5 py-1" data-en="Community" data-ar="المجتمع"></div>
        <a href="#" class="px-2.5 py-1.5 rounded text-sm" style="background:var(--surface-high)" data-en="Dashboard" data-ar="لوحة التحكم"></a>
        <a href="#" class="px-2.5 py-1.5 rounded text-sm text-base-content-muted" data-en="Discussions" data-ar="النقاشات"></a>
        <a href="#" class="px-2.5 py-1.5 rounded text-sm text-base-content-muted" data-en="Courses" data-ar="الدورات"></a>
      </aside>
      <main class="p-4 lg:p-6">
        <p class="text-base-content-muted text-sm" data-en="Member content area." data-ar="منطقة محتوى الأعضاء."></p>
      </main>
    </div>
  </section>

  <!-- ============================================================= -->
  <!-- SECTION C — Landing hero (representative)                     -->
  <!-- ============================================================= -->
  <section id="sec-hero" data-theme="operator" class="relative overflow-hidden bg-base-100 py-20 px-4 sm:px-6 lg:px-16">
    <p class="section-label text-[11px] uppercase tracking-wider text-amber-400/70 mb-4" data-en="C · Landing hero" data-ar="C · قسم البطل الرئيسي"></p>
    <div class="pointer-events-none absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[700px] bg-amber-500/[0.06] rounded-full blur-[150px]"></div>
    <div class="relative max-w-3xl">
      <h2 class="text-4xl sm:text-6xl font-extrabold leading-tight" data-en="It Knows Your Architecture. It Ships the SaaS." data-ar="يعرف بنية نظامك. وينشر تطبيق SaaS الخاص بك."></h2>
      <p class="mt-6 text-lg text-base-content-muted max-w-xl" data-en="The AI dev team that ships production-shaped SaaS — multi-tenant, billing-integrated, security-reviewed." data-ar="فريق التطوير بالذكاء الاصطناعي الذي ينشر تطبيقات SaaS جاهزة للإنتاج — متعددة المستأجرين، متكاملة مع الفوترة، ومُراجَعة أمنيًا."></p>
      <div class="mt-8 flex items-center gap-4">
        <a href="#" class="inline-flex items-center gap-2 bg-amber-500 text-ink-950 px-6 py-3 rounded-lg font-semibold">
          <span data-en="Get started" data-ar="ابدأ الآن"></span>
          <svg class="w-4 h-4 dir-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
        <a href="#" class="inline-flex items-center gap-2 text-white/80 font-medium">
          <span data-en="Read the docs" data-ar="اقرأ الوثائق"></span>
          <svg class="w-4 h-4 dir-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </div>
  </section>

  <!-- ============================================================= -->
  <!-- SECTION D — Pricing card                                      -->
  <!-- ============================================================= -->
  <section id="sec-pricing" data-theme="operator" class="bg-base-100 py-16 px-4 sm:px-6 lg:px-16">
    <p class="section-label text-[11px] uppercase tracking-wider text-amber-400/70 mb-4" data-en="D · Pricing card (USD stays Western numerals, both languages)" data-ar="D · بطاقة الأسعار (تبقى الأرقام غربية بالدولار في اللغتين)"></p>
    <div class="max-w-sm rounded-xl border p-6" style="border-color:#262a33; background:#171a21">

      <p class="mt-2 flex items-baseline gap-1">
        <span class="text-4xl font-extrabold ltr-island">$29</span>
        <span class="text-base-content-muted" data-en="/mo" data-ar="‏/شهريًا"></span>
      </p>
      <p class="mt-1 text-xs text-base-content-muted">
        <span class="ltr-island">$290</span>

      <ul class="mt-4 space-y-2 text-sm text-base-content-muted">

        <li data-en="Member skill packs" data-ar="حزم مهارات الأعضاء"></li>

      <a href="#" class="mt-5 block text-center bg-amber-500 text-ink-950 px-5 py-2.5 rounded-lg font-semibold text-sm" data-en="Join Builders" data-ar="انضم إلى Builders"></a>
    </div>
  </section>

  <!-- ============================================================= -->
  <!-- SECTION E — Code / CLI block (LTR island)                     -->
  <!-- ============================================================= -->
  <section id="sec-code" data-theme="operator" class="bg-base-100 py-16 px-4 sm:px-6 lg:px-16">
    <p class="section-label text-[11px] uppercase tracking-wider text-amber-400/70 mb-4" data-en="E · CLI block — LTR island inside RTL page" data-ar="E · كتلة سطر الأوامر — جزيرة LTR داخل صفحة RTL"></p>
    <p class="max-w-2xl text-base-content-muted mb-4" data-en="Install the Ptah CLI, then run your first session from any repository." data-ar="ثبّت واجهة سطر الأوامر Ptah، ثم شغّل أول جلسة من أي مستودع."></p>
    <pre class="ltr-island max-w-xl rounded-lg border p-4 font-mono text-sm overflow-x-auto" style="border-color:#262a33; background:#171a21"><code>$ npm install -g @ptah/cli
$ ptah session start --repo .
&gt; Ptah v2.4.0 — session_01PnRXJnJhg...</code></pre>
  </section>

</main>

<script>
(function () {
  var html = document.documentElement;
  var state = { lang: 'en', mode: 'dark' };

  function applyLang(lang) {
    state.lang = lang;
    html.lang = lang;
    html.dir = lang === 'ar' ? 'rtl' : 'ltr';

    document.querySelectorAll('[data-en]').forEach(function (el) {
      el.textContent = lang === 'ar' ? (el.getAttribute('data-ar') || '') : (el.getAttribute('data-en') || '');
    });

    document.getElementById('lang-code').textContent = lang === 'ar' ? 'AR' : 'EN';

    document.querySelectorAll('.lang-option').forEach(function (btn) {
      var isCurrent = btn.getAttribute('lang') === lang;
      btn.setAttribute('aria-checked', String(isCurrent));
      btn.classList.toggle('text-amber-500', isCurrent);
      btn.classList.toggle('text-white/70', !isCurrent);
    });
    document.querySelector('.check-en').classList.toggle('hidden', lang !== 'en');
    document.querySelector('.check-ar').classList.toggle('hidden', lang !== 'ar');

    document.querySelectorAll('[data-checked="lang"]').forEach(function (btn) {
      var isCurrent = btn.getAttribute('lang') === lang;
      btn.setAttribute('aria-checked', String(isCurrent));
      var isMobile = btn.classList.contains('mobile-lang-en') || btn.classList.contains('mobile-lang-ar');
      var isPanel = btn.classList.contains('panel-lang-en') || btn.classList.contains('panel-lang-ar');
      if (isMobile) {
        btn.classList.toggle('bg-amber-500', isCurrent);
        btn.classList.toggle('text-ink-950', isCurrent);
        btn.classList.toggle('text-white/70', !isCurrent);
      } else if (isPanel) {
        btn.classList.toggle('btn-primary', isCurrent);
        btn.classList.toggle('btn-ghost', !isCurrent);
        // Non-color state signal (B4/N12): a check mark appended to the
        // selected segment's own label, not just a fill color.
        var existingCheck = btn.querySelector('.panel-check');
        if (isCurrent && !existingCheck) {
          var check = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          check.setAttribute('class', 'panel-check w-3 h-3');
          check.setAttribute('viewBox', '0 0 24 24');
          check.setAttribute('fill', 'none');
          check.setAttribute('stroke', 'currentColor');
          check.setAttribute('stroke-width', '3');
          check.innerHTML = '<path d="M20 6L9 17l-5-5"/>';
          btn.appendChild(check);
        } else if (!isCurrent && existingCheck) {
          existingCheck.remove();
        }
      }
    });
    // Roving tabindex must be recomputed every time selection changes.
    rovingGroups.forEach(setRovingTabIndex);

    document.querySelectorAll('.dir-arrow').forEach(function (svg) {
      svg.style.transform = lang === 'ar' ? 'scaleX(-1)' : 'none';
    });

    closeHeaderMenu();

    document.querySelectorAll('.lang-ctl').forEach(function (b) {
      var on = b.getAttribute('data-lang') === lang;
      b.classList.toggle('bg-amber-500', on);
      b.classList.toggle('text-ink-950', on);
      b.classList.toggle('text-white/70', !on);
    });
  }

  function applyMode(mode) {
    state.mode = mode;
    var memberTheme = mode === 'light' ? 'operator-member-light' : 'operator-member';
    document.getElementById('sec-member').setAttribute('data-theme', memberTheme);
    var isDark = mode !== 'light';
    document.getElementById('theme-icon-moon').classList.toggle('hidden', !isDark);
    document.getElementById('theme-icon-sun').classList.toggle('hidden', isDark);
    var label = document.getElementById('theme-toggle-label');
    label.setAttribute('data-en', isDark ? 'Switch to light theme' : 'Switch to dark theme');
    label.setAttribute('data-ar', isDark ? 'التبديل إلى المظهر الفاتح' : 'التبديل إلى المظهر الداكن');
    label.textContent = state.lang === 'ar' ? label.getAttribute('data-ar') : label.getAttribute('data-en');

    document.querySelectorAll('.mode-ctl').forEach(function (b) {
      var on = b.getAttribute('data-mode') === mode;
      b.classList.toggle('bg-amber-500', on);
      b.classList.toggle('text-ink-950', on);
      b.classList.toggle('text-white/70', !on);
    });
  }

  // ---- Header (menu) skin: Tab-order only, same as the existing Product /
  // Community / User disclosure menus (navigation.component.ts) — no
  // auto-focus-into-menu, no arrow-roving. Escape and outside-click close
  // it; the "closeMenuAndRefocus" behavior on Escape is native browser
  // behavior here (focus never left the trigger). Selecting an option is a
  // new, explicit path (`selectHeaderLanguage`) that closes the menu AND
  // refocuses the trigger, matching the text in design-spec.md §2.6 exactly
  // (fix for B3's snippet/prose mismatch).
  function openHeaderMenu() {
    document.getElementById('lang-menu').classList.remove('hidden');
    document.getElementById('lang-menu-trigger').setAttribute('aria-expanded', 'true');
  }
  function closeHeaderMenu() {
    document.getElementById('lang-menu').classList.add('hidden');
    document.getElementById('lang-menu-trigger').setAttribute('aria-expanded', 'false');
  }
  function selectHeaderLanguage(lang) {
    applyLang(lang);
    closeHeaderMenu();
    document.getElementById('lang-menu-trigger').focus();
  }
  document.getElementById('lang-menu-trigger').addEventListener('click', function () {
    var isOpen = !document.getElementById('lang-menu').classList.contains('hidden');
    if (isOpen) { closeHeaderMenu(); } else { openHeaderMenu(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      var open = !document.getElementById('lang-menu').classList.contains('hidden');
      if (open) {
        closeHeaderMenu();
        document.getElementById('lang-menu-trigger').focus();
      }
    }
  });
  document.addEventListener('click', function (e) {
    var wrap = document.getElementById('lang-switch-header');
    if (!wrap.contains(e.target)) { closeHeaderMenu(); }
  });
  document.querySelectorAll('#lang-menu [data-set-lang]').forEach(function (btn) {
    btn.addEventListener('click', function () { selectHeaderLanguage(this.getAttribute('data-set-lang')); });
  });

  // Mobile segmented row + panel segmented row: plain click handlers (real
  // <button> elements are natively Tab-reachable and Enter/Space-operable
  // regardless of the `role` attribute, so B3's structural fix (role="group"
  // + role="menuitemradio") did not need new keyboard code for the mobile
  // row — only the panel radiogroup below gets bespoke roving-tabindex code,
  // because it is a real standalone ARIA `radiogroup`, not a menu item.)
  document.querySelectorAll('.mobile-lang-en, .mobile-lang-ar').forEach(function (btn) {
    btn.addEventListener('click', function () { applyLang(this.getAttribute('data-set-lang')); });
  });

  // ---- Panel (segmented) skin: a real ARIA `radiogroup` — roving tabindex
  // (one tab stop, on the checked radio) plus explicit Arrow-key handling
  // that reads the group's OWN computed `direction` and inverts
  // ArrowLeft/ArrowRight accordingly. ArrowUp/ArrowDown (fix for N18 — APG
  // radio groups move on both axes) are direction-independent: Down always
  // moves to the next radio, Up to the previous, regardless of `dir`. This
  // is the concrete implementation B3 asked for in place of the
  // "browser-native, automatic" claim. Both the member/admin shell's own
  // radiogroup (`#panel-lang-group`) and the admin-shell demo header's
  // (`#admin-lang-group`) share this same function.
  var rovingGroups = [];
  function setRovingTabIndex(group) {
    var radios = Array.prototype.slice.call(group.querySelectorAll('[role="radio"]'));
    radios.forEach(function (r) {
      r.tabIndex = r.getAttribute('aria-checked') === 'true' ? 0 : -1;
    });
  }
  function initRovingRadioGroup(group) {
    rovingGroups.push(group);
    setRovingTabIndex(group);
    group.addEventListener('keydown', function (e) {
      var radios = Array.prototype.slice.call(group.querySelectorAll('[role="radio"]'));
      var isRtl = getComputedStyle(group).direction === 'rtl';
      var delta = 0;
      if (e.key === 'ArrowRight') { delta = isRtl ? -1 : 1; }
      else if (e.key === 'ArrowLeft') { delta = isRtl ? 1 : -1; }
      else if (e.key === 'ArrowDown') { delta = 1; }
      else if (e.key === 'ArrowUp') { delta = -1; }
      else { return; }
      e.preventDefault();
      var idx = radios.indexOf(document.activeElement);
      if (idx === -1) { idx = 0; }
      var next = radios[(idx + delta + radios.length) % radios.length];
      next.focus();
      applyLang(next.getAttribute('data-set-lang'));
    });
  }
  document.querySelectorAll('.panel-lang-en, .panel-lang-ar').forEach(function (btn) {
    btn.addEventListener('click', function () { applyLang(this.getAttribute('data-set-lang')); });
  });
  initRovingRadioGroup(document.getElementById('panel-lang-group'));
  initRovingRadioGroup(document.getElementById('admin-lang-group'));

  document.querySelectorAll('.lang-ctl').forEach(function (b) {
    b.addEventListener('click', function () { applyLang(this.getAttribute('data-lang')); });
  });
  document.querySelectorAll('.mode-ctl').forEach(function (b) {
    b.addEventListener('click', function () { applyMode(this.getAttribute('data-mode')); });
  });
  document.getElementById('open-lang-menu-ctl').addEventListener('click', function () { openHeaderMenu(); });

  // Expose for Playwright screenshot script
  window.__proto = { applyLang: applyLang, applyMode: applyMode, openHeaderMenu: openHeaderMenu, closeHeaderMenu: closeHeaderMenu };

  applyLang('en');
  applyMode('dark');
})();
</script>
</body>
</html>
