<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ptah attention rail â€” Gate 1.7 prototype</title>
  <style>
    *{box-sizing:border-box}html{font-family:Inter,ui-sans-serif,system-ui,sans-serif}body{margin:0;background:#101014;color:#e8e6e1}button{font:inherit;cursor:pointer}button:disabled{cursor:not-allowed}button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}.intro{max-width:1580px;margin:auto;padding:24px 24px 8px}.intro h1{font-size:23px;margin:0 0 5px}.intro p{margin:0;color:#b8b5b2;font-size:13px}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;max-width:1580px;margin:auto;padding:18px 24px 36px}.theme{--b1:#131317;--b2:#1a1a20;--b3:#242430;--bc:#e8e6e1;--muted:oklch(66.509856% .007403 31.090978);--need:#f97316;--err:#ef4444;--primary:#2563eb;--primary-content:#f8f7f4;--focus:#7da9ff;--border:rgba(232,230,225,.14);--highlight:rgba(232,230,225,.06);--shadow:0 12px 30px rgba(0,0,0,.42);background:var(--b1);color:var(--bc);border:1px solid var(--border);border-radius:18px;overflow:hidden;min-width:0}.theme.light{--b1:oklch(97.788% .004 56.375);--b2:oklch(93.982% .007 61.449);--b3:oklch(91.586% .006 53.44);--bc:oklch(23.574% .066 313.189);--muted:oklch(48.955188% .044796 348.478612);--need:#8f5200;--err:#b4232a;--primary:oklch(85% .138 181.071);--primary-content:oklch(36% .078 188.216);--focus:#136b72;--border:rgba(47,35,53,.16);--highlight:rgba(47,35,53,.055);--shadow:0 8px 24px rgba(47,35,53,.16)}.theme-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--b2);border-bottom:1px solid var(--border)}.theme-head strong{font-size:13px}.theme-head span{font-size:11px;color:var(--muted)}.theme-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:14px;padding:14px}.surface-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 8px}.snackbar-stack,.rail{min-width:0}.stack{display:grid;gap:8px}.card{position:relative;min-width:0;border:1px solid var(--border);border-radius:16px;background:var(--b3);box-shadow:var(--shadow);padding:12px 11px 11px 15px;overflow:hidden}.card:hover,.queue-row:hover{box-shadow:var(--shadow);background:color-mix(in oklch,var(--b3) 94%,var(--bc))}.card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 4px 4px 0;background:var(--need)}.card.failure::before{background:var(--err)}.card-top{display:flex;gap:8px;align-items:flex-start}.kind-icon{font-size:16px;line-height:18px;color:var(--need);flex:none}.failure .kind-icon{color:var(--err)}.card-main{min-width:0;flex:1}.kind{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted);line-height:16px}.session-name{font-size:13px;line-height:19px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;align-items:center;gap:6px;min-width:0;font-size:11px;color:var(--muted);margin-top:2px}.workspace{display:inline-block;max-width:125px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--border);border-radius:6px;background:var(--b2);padding:2px 5px;color:var(--bc)}.time{white-space:nowrap;color:var(--muted);font-size:10px}.dismiss,.icon-btn{flex:none;border:0;background:transparent;color:var(--bc);border-radius:7px;width:28px;height:28px;padding:0}.dismiss:hover,.icon-btn:hover{background:var(--highlight)}.detail{font-size:11px;color:var(--muted);margin:8px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.btn{min-height:36px;padding:6px 9px;border:1px solid transparent;border-radius:7px;font-size:11px;font-weight:650;line-height:16px;background:transparent;color:var(--bc)}.btn:hover{background:var(--highlight)}.btn.primary{background:var(--primary);color:var(--primary-content)}.btn.primary:hover{filter:brightness(.95)}.btn:disabled{background:var(--b2);border-color:var(--border);color:var(--muted);opacity:1}.status{font-size:11px;color:var(--muted);margin:7px 0 0}.more{display:block;margin-left:auto;border:0;background:transparent;color:var(--bc);font-size:11px;font-weight:650;padding:5px}.bell{grid-column:1 / -1;border:1px solid var(--border);border-radius:16px;background:var(--b2);overflow:hidden}.bell-head{display:flex;align-items:center;gap:7px;padding:10px 12px;background:var(--b3);border-bottom:1px solid var(--border)}.bell-head strong{font-size:13px;flex:1}.count{display:inline-flex;justify-content:center;align-items:center;border-radius:99px;background:var(--need);color:var(--b1);font-size:10px;font-weight:800;min-width:19px;height:19px;padding:0 4px}.light .count{color:#fff}.clear{font-size:11px;border:0;background:transparent;color:var(--bc);padding:6px;border-radius:6px}.clear:hover{background:var(--highlight)}.clear:disabled{color:var(--muted)}.bell-body{padding:10px;max-height:520px;overflow:auto}.section-head{display:flex;align-items:center;justify-content:space-between;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;font-size:10px;padding:4px 2px 8px}.section-head:not(:first-child){margin-top:12px}.bell .card{box-shadow:0 1px 2px rgba(0,0,0,.14);border-radius:12px;margin-bottom:7px;background:var(--b2)}.bell .card:hover{background:var(--b3)}.bell .card:not(.failure) .dismiss{display:none}.bell .card .actions{margin-top:7px}.bell .card .btn{min-height:32px}.rail-shell{background:var(--b2);border:1px solid var(--border);border-radius:15px;padding:11px;min-height:235px}.rail-heading{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;margin-bottom:9px}.rail-heading small{font-size:10px;color:var(--muted);font-weight:500}.rail-section{border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:10px}.queue-row{border:1px solid var(--border);background:var(--b2);border-radius:9px;padding:8px;margin-bottom:5px}.queue-row .line{display:flex;gap:6px;min-width:0;align-items:center}.queue-row .line strong{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.queue-row p{font-size:10px;color:var(--muted);margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.queue-row .actions{margin-top:5px}.queue-row .btn{min-height:30px;padding:3px 7px;font-size:10px}.rail .section-head{padding:0 0 7px}.session-card{border:1px solid var(--border);border-radius:10px;background:var(--b3);padding:10px}.session-card .top{display:flex;align-items:center;gap:6px;justify-content:space-between}.session-card strong{font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.need-chip{color:var(--need);font-size:10px;font-weight:700;white-space:nowrap}.session-card p{font-size:10px;color:var(--muted);margin:6px 0 0}.session-card .actions{margin-top:8px}.session-card .btn{min-height:30px;padding:4px 7px}.empty{font-size:11px;color:var(--muted);margin:7px 0}.toast-note{font-size:10px;color:var(--muted);margin:9px 0 0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:1200px){.comparison{grid-template-columns:1fr}}@media(max-width:620px){.theme-grid{grid-template-columns:1fr}.bell{grid-column:auto}.comparison,.intro{padding-left:8px;padding-right:8px}.theme{border-radius:8px}}@media(prefers-reduced-motion:no-preference){.card{transition:background 120ms ease,box-shadow 120ms ease}}
  </style>
</head>
<body>
  <header class="intro"><h1>Attention where the work is</h1><p>Gate 1.7 proposal Â· dark and light are shown together. Answer simulates completing the canvas question; Allow, Deny, Dismiss, Clear, and Reset show the shared lifecycle.</p></header>
  <main class="comparison" id="comparison"></main>
  <script>
    const initial=[
      {id:'q1',kind:'question',title:'Question needs an answer',session:'Fix login flow',provider:'Claude',workspace:'ptah-extension',detail:'Should we keep the existing sign-in redirect?',time:'2m ago'},
      {id:'p1',kind:'permission',title:'Permission required',session:'Refactor auth API',provider:'Codex',workspace:'ptah-extension',detail:'Tool: Bash Â· run targeted auth tests',time:'4m ago'},
      {id:'l1',kind:'lane',title:'Lane permission required',session:'Polish settings UI',provider:'Claude Â· frontend lane',workspace:'ptah-extension',detail:'Tool: Bash Â· inspect generated styles',time:'6m ago'}
    ];
    const states={dark:{items:initial.map(x=>({...x})),recent:true,hidden:new Set(),message:''},light:{items:initial.map(x=>({...x})),recent:true,hidden:new Set(),message:''}};
    const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const icon={question:'â—‡',permission:'â¬¡',lane:'â—ˆ',failure:'!'};
    function actions(item,theme,small=false){
      const primary=item.kind==='question'?'Answer':'Allow';
      return `<div class="actions"><button class="btn primary" data-act="${item.kind==='question'?'open':'allow'}" data-id="${item.id}" data-theme="${theme}" aria-label="${primary} ${escapeHtml(item.title)} for ${escapeHtml(item.session)} in ${escapeHtml(item.workspace)}">${primary}</button>${item.kind==='question'?'':`<button class="btn" data-act="deny" data-id="${item.id}" data-theme="${theme}" aria-label="Deny ${escapeHtml(item.title)} for ${escapeHtml(item.session)} in ${escapeHtml(item.workspace)}">Deny</button>`}<button class="btn" data-act="show" data-id="${item.id}" data-theme="${theme}" aria-label="Show ${escapeHtml(item.session)} in canvas">Show in canvas</button></div>`
    }
    function card(item,theme,place){return `<article class="card" role="listitem" aria-label="${escapeHtml(item.title)}, ${escapeHtml(item.session)}, ${escapeHtml(item.workspace)}"><div class="card-top"><span class="kind-icon" aria-hidden="true">${icon[item.kind]}</span><div class="card-main"><div class="kind">${escapeHtml(item.title)}</div><div class="session-name" title="${escapeHtml(item.session)}">${escapeHtml(item.session)}</div><div class="meta"><span>${escapeHtml(item.provider)}</span><span class="workspace" title="${escapeHtml(item.workspace)}">${escapeHtml(item.workspace)}</span></div></div><span class="time" title="2026-10-20 10:18">${item.time}</span><button class="dismiss" data-act="dismiss" data-place="${place}" data-id="${item.id}" data-theme="${theme}" aria-label="Dismiss ${escapeHtml(item.title)} for ${escapeHtml(item.session)}" title="Dismiss presentation">Ã—</button></div><p class="detail" title="${escapeHtml(item.detail)}">${escapeHtml(item.detail)}</p>${actions(item,theme)}</article>`}
    function renderTheme(theme){const st=states[theme],items=st.items,visible=items.filter(x=>!st.hidden.has(x.id));const q=items.find(x=>x.id==='q1');return `<section class="theme ${theme==='light'?'light':''}" aria-label="${theme} theme"><header class="theme-head"><strong>${theme==='dark'?'Dark Â· anubis':'Light Â· anubis-light'}</strong><span>Same request identity across surfaces</span></header><p class="status" style="min-height:16px;margin:6px 14px 0" role="status">${escapeHtml(st.message)}</p><div class="theme-grid"><section class="snackbar-stack" aria-label="Snackbar stack"><h2 class="surface-title">Snackbar stack</h2><div class="stack" role="list">${visible.map(x=>card(x,theme,'snack')).join('')||'<p class="empty">No active snackbars</p>'}</div><p class="toast-note">Visible session suppresses its own snackbar; the request remains in bell and rail.</p></section><section class="rail" aria-label="Canvas Sessions rail"><h2 class="surface-title">Canvas Sessions rail</h2><div class="rail-shell"><div class="rail-heading">Sessions <small>1 / 3 running</small></div><section class="rail-section" aria-label="Needs you queue"><div class="section-head"><span>Needs you</span><span>${items.length}</span></div>${items.slice(0,3).map(x=>`<div class="queue-row"><div class="line"><span class="kind-icon" aria-hidden="true">${icon[x.kind]}</span><strong>${escapeHtml(x.session)}</strong></div><p>${escapeHtml(x.detail)}</p>${actions(x,theme,true)}</div>`).join('')||'<p class="empty">âœ“ All clear</p>'}${items.length>3?`<button class="more" data-act="more" data-theme="${theme}">+${items.length-3} more</button>`:''}</section><article class="session-card"><div class="top"><strong>Fix login flow</strong>${q?'<span class="need-chip">â—‡ Needs you</span>':'<span class="toast-note">Idle</span>'}</div><p>Claude Â· ptah-extension</p>${q?`<p>${escapeHtml(q.detail)}</p>${actions(q,theme,true)}`:'<p>No pending requests for this session</p>'}</article></div></section><section class="bell" aria-label="Bell notification panel"><header class="bell-head"><strong>Notifications</strong>${items.length?`<span class="count" aria-label="${items.length} unresolved requests">${items.length}</span>`:''}<button class="icon-btn" aria-label="Mute notification sounds" title="Sound control">â—–</button><button class="clear" data-act="clear" data-theme="${theme}" ${st.recent?'':'disabled'}>Clear all notices</button></header><div class="bell-body"><div class="section-head"><span>Needs you</span><span>${items.length}</span></div><div role="list">${items.map(x=>card(x,theme,'bell')).join('')||'<p class="empty">Nothing needs your response</p>'}</div><div class="section-head"><span>Recent notices</span><span>${st.recent?1:0}</span></div>${st.recent?`<article class="card failure"><div class="card-top"><span class="kind-icon" aria-hidden="true">!</span><div class="card-main"><div class="kind">Session failed</div><div class="session-name">Index docs</div><div class="meta"><span>Claude</span><span class="workspace">ptah-extension</span></div></div><span class="time">9m ago</span><button class="dismiss" data-act="clear" data-theme="${theme}" aria-label="Dismiss Session failed for Index docs">Ã—</button></div><p class="detail">The session stopped before finishing.</p><div class="actions"><button class="btn" data-act="show" data-id="recent" data-theme="${theme}">Show in canvas</button></div></article>`:'<p class="empty">No recent notices</p>'}</div></section></div><div style="padding:0 14px 14px"><button class="btn" data-act="reset" data-theme="${theme}">Reset ${theme} example</button></div></section>`}
    function render(){document.getElementById('comparison').innerHTML=renderTheme('dark')+renderTheme('light')}
    document.addEventListener('click',e=>{const button=e.target.closest('button[data-act]');if(!button)return;const theme=button.dataset.theme,act=button.dataset.act,id=button.dataset.id,st=states[theme];if(act==='reset'){st.items=initial.map(x=>({...x}));st.hidden=new Set();st.recent=true;st.message='Example reset.'}else if(act==='clear'){st.recent=false;st.message='Recent notices cleared. Pending requests remain.'}else if(act==='dismiss'){if(button.dataset.place==='snack')st.hidden.add(id);else st.items=st.items.filter(x=>x.id!==id);st.message='Presentation dismissed.'}else if(act==='allow'||act==='deny'){const item=st.items.find(x=>x.id===id);st.items=st.items.filter(x=>x.id!==id);st.hidden.delete(id);st.message=`${item?.session||'Request'} ${act==='allow'?'allowed':'denied'}. All surfaces updated.`}else if(act==='open'){const item=st.items.find(x=>x.id===id);st.items=st.items.filter(x=>x.id!==id);st.hidden.delete(id);st.message=(item?.session||'Question')+' answered in canvas. All surfaces updated.'}else if(act==='show'||act==='more'){st.message=act==='more'?'Bell Needs you opened.':'Session shown in canvas; request remains pending.'}render()});
    render();
  </script>
</body>
</html>
