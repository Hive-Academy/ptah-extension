<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual dashboard demo</title>
<style>
:root{color-scheme:dark;--bg:#171b25;--fg:#f3f5fa;--card:#252c3b;--accent:#8ab4ff;--muted:#bdc8d9}
*{box-sizing:border-box}body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}h1{font-size:20px;margin:0 0 18px}small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:var(--card);border-radius:12px;padding:16px;min-width:0}.label{color:var(--muted)}.value{font-size:26px;font-weight:700;margin-top:8px}section{margin-top:12px}svg{width:100%;height:170px;display:block}rect{fill:var(--accent)}@media(max-width:480px){body{padding:12px}.grid{grid-template-columns:1fr}h1{font-size:18px}}
</style>
<header><h1>Workspace activity</h1><small id="mode">Waiting for theme</small></header><div class="grid"><div class="card"><div class="label">Completed tasks</div><div class="value">128</div></div><div class="card"><div class="label">Build health</div><div class="value">98%</div></div><div class="card"><div class="label">Time saved</div><div class="value">42h</div></div></div><section class="card"><div class="label">Weekly activity</div><svg viewBox="0 0 600 170" role="img" aria-label="Activity bars increasing through the week"><rect x="32" y="92" width="52" height="58" rx="5"/><rect x="114" y="72" width="52" height="78" rx="5"/><rect x="196" y="84" width="52" height="66" rx="5"/><rect x="278" y="45" width="52" height="105" rx="5"/><rect x="360" y="62" width="52" height="88" rx="5"/><rect x="442" y="23" width="52" height="127" rx="5"/><rect x="524" y="37" width="52" height="113" rx="5"/></svg></section>
<script>addEventListener('message',e=>{const d=e.data;if(d?.type!=='theme')return;document.documentElement.style.colorScheme=d.mode;document.getElementById('mode').textContent=d.mode+' theme';const v=d.vars||{};const root=document.documentElement.style;const pick=(n,f)=>{const s=v[n];return s?(/^[\d.\s%]+$/.test(s)?'oklch('+s+')':s):f};root.setProperty('--bg',pick('--b1',d.mode==='dark'?'#171b25':'#f8fafc'));root.setProperty('--fg',pick('--bc',d.mode==='dark'?'#f3f5fa':'#17202c'));root.setProperty('--card',pick('--b2',d.mode==='dark'?'#252c3b':'#e8edf4'));root.setProperty('--accent',pick('--p','#537ce8'));root.setProperty('--muted',pick('--bc',d.mode==='dark'?'#bdc8d9':'#465365'));});</script></html>
