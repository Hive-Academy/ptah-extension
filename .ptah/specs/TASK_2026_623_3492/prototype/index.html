  --dp-text-mix:35%;--dp-fill-mix:0%;--dp-dock:oklch(var(--b1));--dp-card:oklch(var(--b2));--dp-well:oklch(var(--b3));--dp-bar-dim:color-mix(in oklab,oklch(var(--bc)) 20%,oklch(var(--b2)));

/* ===== Display tokens (renderer-only; measured, see design-spec.md section 9) ===== */
[data-theme]{
  --dp-border:color-mix(in oklab,oklch(var(--bc)) 14%,transparent);
  --dp-border-strong:color-mix(in oklab,oklch(var(--bc)) 24%,transparent);
  --dp-muted:oklch(var(--bcm));
  --dp-fg:oklch(var(--bc));
  --dp-su-fill:color-mix(in oklab,oklch(var(--su)) calc(100% - var(--dp-fill-mix)),oklch(var(--bc)) var(--dp-fill-mix));
  --dp-wa-fill:color-mix(in oklab,oklch(var(--wa)) calc(100% - var(--dp-fill-mix)),oklch(var(--bc)) var(--dp-fill-mix));
  --dp-er-fill:color-mix(in oklab,oklch(var(--er)) calc(100% - var(--dp-fill-mix)),oklch(var(--bc)) var(--dp-fill-mix));
  --dp-in-fill:color-mix(in oklab,oklch(var(--in)) calc(100% - var(--dp-fill-mix)),oklch(var(--bc)) var(--dp-fill-mix));
  --dp-su-text:color-mix(in oklab,oklch(var(--su)) calc(100% - var(--dp-text-mix)),oklch(var(--bc)) var(--dp-text-mix));
  --dp-wa-text:color-mix(in oklab,oklch(var(--wa)) calc(100% - var(--dp-text-mix)),oklch(var(--bc)) var(--dp-text-mix));
  --dp-er-text:color-mix(in oklab,oklch(var(--er)) calc(100% - var(--dp-text-mix)),oklch(var(--bc)) var(--dp-text-mix));
  --dp-in-text:color-mix(in oklab,oklch(var(--in)) calc(100% - var(--dp-text-mix)),oklch(var(--bc)) var(--dp-text-mix));
  --dp-su-tint:color-mix(in oklab,oklch(var(--su)) 16%,oklch(var(--b3)));
  --dp-wa-tint:color-mix(in oklab,oklch(var(--wa)) 16%,oklch(var(--b3)));
  --dp-er-tint:color-mix(in oklab,oklch(var(--er)) 16%,oklch(var(--b3)));
  --dp-in-tint:color-mix(in oklab,oklch(var(--in)) 16%,oklch(var(--b3)));
  --dp-n-tint:oklch(var(--b3));

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;background:oklch(var(--b1));color:var(--dp-fg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:'JetBrains Mono','Fira Code',Menlo,monospace}
.muted{color:var(--dp-muted)}
svg.i{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--dp-fg);outline-offset:2px;box-shadow:0 0 0 4px oklch(var(--b1))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}

/* ===== Harness chrome (not part of the product) ===== */
.harness{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--dp-border);background:oklch(var(--b2));position:sticky;top:0;z-index:50;font-size:12px}
.harness label{display:flex;gap:6px;align-items:center;color:var(--dp-muted)}
.harness select{background:oklch(var(--b3));color:var(--dp-fg);border:1px solid var(--dp-border-strong);border-radius:6px;padding:3px 6px;font:inherit}
body.shot .harness{display:none}
.stage{padding:20px 16px;display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.frame-wrap h2{font-size:12px;font-weight:500;color:var(--dp-muted);margin:0 0 6px}
.frame{width:var(--w);max-width:100%;container-type:inline-size;container-name:frame;display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--bgf,oklch(var(--b1)));border:1px dashed var(--dp-border-strong);border-radius:10px}
.frame.panel{--bgf:var(--dp-dock)}
body.shot .stage{padding:0}
body.shot .frame-wrap h2{display:none}

/* ===== Card, section, pill, badge ===== */
.dp-card{background:var(--dp-card);border:1px solid var(--dp-border);border-radius:var(--rounded-box);box-shadow:var(--dp-shadow),inset 0 1px 0 var(--dp-rim);min-width:0;position:relative}
.dp-card.dhero{background:linear-gradient(135deg,color-mix(in oklab,oklch(var(--s)) 12%,var(--dp-card)),var(--dp-card) 62%)}
.row{display:flex;gap:8px;align-items:center;min-width:0}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.wrap{flex-wrap:wrap}
.grow{flex:1 1 0;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pill{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;line-height:18px;white-space:nowrap;font-variant-numeric:tabular-nums;background:var(--tint);color:var(--txt);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--txt) 22%,transparent)}
.pill.su{--tint:var(--dp-su-tint);--txt:var(--dp-su-text)} .pill.wa{--tint:var(--dp-wa-tint);--txt:var(--dp-wa-text)}
.pill.er{--tint:var(--dp-er-tint);--txt:var(--dp-er-text)} .pill.in{--tint:var(--dp-in-tint);--txt:var(--dp-in-text)}
.pill.n{--tint:var(--dp-n-tint);--txt:var(--dp-fg)}
.dot{width:8px;height:8px;border-radius:99px;background:var(--c);flex:none}
.dot.su{--c:var(--dp-su-fill)}.dot.wa{--c:var(--dp-wa-fill)}.dot.er{--c:var(--dp-er-fill)}.dot.in{--c:var(--dp-in-fill)}.dot.n{--c:var(--dp-muted)}
.eyebrow{font-size:12px;font-weight:500;color:var(--dp-muted);letter-spacing:.01em}
.title{font-size:14px;font-weight:600}
.h-num{font-size:clamp(1.5rem,11cqi,2.125rem);line-height:1.05;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.h-unit{font-size:.9rem;font-weight:500;color:var(--dp-muted);letter-spacing:0}

/* ===== Collapse mechanism (grid rows) ===== */
.clp{display:grid;grid-template-rows:0fr;visibility:hidden}
.clp>div{overflow:hidden;min-height:0}
[data-open='true']>.clp,.clp[data-open='true']{grid-template-rows:1fr;visibility:visible}
@media (prefers-reduced-motion:no-preference){.clp{transition:grid-template-rows .22s ease,visibility 0s linear .22s}[data-open='true']>.clp,.clp[data-open='true']{transition:grid-template-rows .22s ease,visibility 0s}}
.chev{transition:none}
[data-open='true']>.tgl .chev,[data-open='true']>.hdr>.tgl .chev,[data-open='true']>.pv-head .chev{transform:rotate(180deg)}
@media (prefers-reduced-motion:no-preference){.chev{transition:transform .2s}}
.tgl{display:flex;width:100%;align-items:center;gap:8px;border-radius:inherit;min-height:32px}

/* ===== Stat card ===== */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,128px),1fr));gap:8px}
@container frame (min-width:700px){.stat-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.dstat{container-type:inline-size;container-name:stat}
.dstat[data-open='true']{grid-column:1/-1}
.stat-head{display:flex;flex-direction:column;gap:6px;padding:12px 12px 10px;width:100%;border-radius:inherit}
.stat-top{display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0}
.stat-top .lbl{display:flex;gap:6px;align-items:center;min-width:0}
.stat-mid{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;min-width:0}
.spark{display:flex;align-items:flex-end;gap:3px;height:30px}
.spark i{flex:1 1 0;min-width:3px;max-width:14px;border-radius:3px 3px 1px 1px;background:var(--dp-bar-dim);height:var(--h)}
.spark i.hl{background:var(--hl,var(--dp-hl))}
.stat-detail{padding:0 12px 12px}
.stat-detail .well{background:var(--dp-well);border-radius:calc(var(--rounded-box) - 4px);padding:10px 12px}
@container frame (min-width:700px){
  .dstat[data-open='true']{display:grid;grid-template-columns:minmax(200px,38%) minmax(0,1fr);align-items:start}
  .dstat[data-open='true'] .stat-detail{grid-column:2;grid-row:1;padding:12px 12px 12px 0}
  .dstat[data-open='true']>.clp{grid-column:2;grid-row:1}
}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:12px}
.kv dt{color:var(--dp-muted)} .kv dd{margin:0;overflow-wrap:anywhere;text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.split{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--dp-well);gap:2px}
.split b{display:block;height:100%}
progress.bar{appearance:none;-webkit-appearance:none;width:100%;height:6px;border:0;border-radius:99px;background:color-mix(in oklab,oklch(var(--bc)) 16%,transparent);color:var(--c);overflow:hidden;display:block}
progress.bar::-webkit-progress-bar{background:transparent}
progress.bar::-webkit-progress-value{background:var(--c);border-radius:99px}
progress.bar::-moz-progress-bar{background:var(--c);border-radius:99px}
progress.su{--c:var(--dp-su-fill)}progress.wa{--c:var(--dp-wa-fill)}progress.er{--c:var(--dp-er-fill)}progress.in{--c:var(--dp-in-fill)}

/* ===== Section card (display) ===== */
.sec>.hdr{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px}
.sec>.hdr .tgl{padding:4px 0}
.sec-body{padding:2px 12px 12px;display:flex;flex-direction:column;gap:10px}
.iconbtn{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;color:var(--dp-muted)}
.iconbtn:hover{background:var(--dp-well);color:var(--dp-fg)}
.iconbtn[aria-pressed='true']{color:var(--dp-fg);background:var(--dp-well)}
.btn2{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;min-height:28px;border:1px solid var(--dp-border-strong);background:transparent;white-space:nowrap}
.btn2:hover{background:var(--dp-well)}
.btn2 .lbl-s{display:inline}
@container frame (max-width:419px){.btn2.collapse-label .lbl-s{display:none}.btn2.collapse-label{padding:3px 7px}}

/* ===== Agents ===== */
.avatar-d{position:relative;width:32px;height:32px;border-radius:99px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;background:var(--tint);color:var(--txt);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--txt) 26%,transparent)}
.avatar-d .st{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:99px;border:2px solid var(--dp-card);background:var(--c)}
.agent{border-radius:calc(var(--rounded-box) - 2px);background:var(--dp-well);}
.agent-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 10px;width:100%;border-radius:inherit}
.agent-head .meta{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--dp-muted)}
.agent-head .use{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:12px}
.agent-head .use progress{flex:1 1 0;min-width:40px}
.agent-detail{padding:2px 10px 10px 52px;font-size:12px}
@container frame (max-width:419px){.agent-detail{padding-left:10px}}
.pulse-dot{animation:none}
@media (prefers-reduced-motion:no-preference){.pulse-dot{animation:pd 1.6s ease-in-out infinite}@keyframes pd{50%{opacity:.35}}}

/* ===== Note ===== */
.note{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:10px 12px;border-radius:calc(var(--rounded-box) - 2px);background:var(--tint);border:1px solid color-mix(in oklab,var(--txt) 24%,transparent);color:var(--dp-fg)}
.note .ic{color:var(--txt);grid-row:1/3;margin-top:2px;font-size:16px}
.note b{font-size:13px}.note p{margin:0;font-size:12.5px;color:var(--dp-fg)}
.note.su{--tint:var(--dp-su-tint);--txt:var(--dp-su-text)}.note.wa{--tint:var(--dp-wa-tint);--txt:var(--dp-wa-text)}.note.er{--tint:var(--dp-er-tint);--txt:var(--dp-er-text)}.note.in{--tint:var(--dp-in-tint);--txt:var(--dp-in-text)}

/* ===== Chat chips ===== */
.chip{background:oklch(var(--b2));}
.chip .tgl{padding:8px 10px;align-items:flex-start}
.chip-top{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;min-width:0;flex:1}
.chip-actions{padding:0 10px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip.stale{border-style:dashed}
.chip.stale .title{color:var(--dp-fg)}
.chip-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,104px),1fr));gap:8px;padding:0 10px 10px}
.mini{background:var(--dp-well);border-radius:10px;padding:8px 10px;min-width:0}
.mini .v{font-size:1.125rem;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.chipmetrics{display:flex;flex-wrap:wrap;gap:4px 6px}

/* ===== Previews ===== */
.pv{background:oklch(var(--b2));overflow:hidden}
.pv-head{display:flex;align-items:center;gap:8px;padding:8px 10px;min-width:0}
.pv-head .tgl{padding:0;min-height:28px}
.pv-code{margin:0;padding:8px 0;font-size:12.5px;line-height:1.6;background:var(--dp-well);border-top:1px solid var(--dp-border);overflow-x:visible;white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%}
.pv-code.wrapcode{white-space:pre-wrap;overflow-wrap:anywhere;overflow-x:visible}
.ln{display:grid;grid-template-columns:3.2ch 2ch minmax(0,1fr);gap:0 6px;padding:0 10px;min-width:0}
.ln>span:last-child{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.ln .n{color:var(--dp-muted);text-align:right;user-select:none}
.ln .g{text-align:center;user-select:none;font-weight:700}
.ln.add{background:var(--dp-su-tint)}.ln.add .g{color:var(--dp-su-text)}
.ln.del{background:var(--dp-er-tint)}.ln.del .g{color:var(--dp-er-text)}
.cmd{padding:8px 10px 10px;display:flex;gap:8px;font-size:12.5px;align-items:flex-start;border-top:1px solid var(--dp-border)}
.cmd code{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.cmd.one code{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.path{display:flex;flex-wrap:wrap;min-width:0;font-size:12.5px}
.path .dir{color:var(--dp-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto;min-width:0}
.path .name{font-weight:600;overflow-wrap:anywhere;flex:0 1 auto;min-width:0}


/* ===== r2: file rows, test runs, previews, highlight ===== */
.fst{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font:700 11px/1 'JetBrains Mono',monospace;background:var(--tint);color:var(--txt);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--txt) 26%,transparent);flex:none}
.fst.su{--tint:var(--dp-su-tint);--txt:var(--dp-su-text)}.fst.in{--tint:var(--dp-in-tint);--txt:var(--dp-in-text)}.fst.er{--tint:var(--dp-er-tint);--txt:var(--dp-er-text)}.fst.n{--tint:var(--dp-n-tint);--txt:var(--dp-fg)}.fst.wa{--tint:var(--dp-wa-tint);--txt:var(--dp-wa-text)}
.frow{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-top:1px solid var(--dp-border)}
.frow:first-child{border-top:0;padding-top:0}
.cnt{font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.btn2.sm{min-height:24px;padding:1px 8px;font-size:12px;font-weight:500}
.alertline{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--dp-er-text)}
.group{border-top:1px solid var(--dp-border);padding-top:8px}
.group summary,.det summary{cursor:pointer;font-size:12px;color:var(--dp-muted);min-height:24px;display:flex;align-items:center;gap:6px}
.det{font-size:12px}.det code{display:block;margin-top:4px;padding:6px 8px;border-radius:8px;background:oklch(var(--b1));white-space:pre-wrap;overflow-wrap:anywhere}
.run{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-top:1px solid var(--dp-border)}
.run:first-of-type{border-top:0;padding-top:0}
.fails{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:12px}
.fails li{display:flex;gap:6px;align-items:flex-start}.fails span.mono{overflow-wrap:anywhere;min-width:0}
.hk{color:var(--dp-in-text)}.hs{color:var(--dp-su-text)}.hc{color:var(--dp-muted);font-style:italic}.hn{color:var(--dp-wa-text)}
.limit{max-height:9.6em;overflow:hidden;position:relative}
.limit.open{max-height:none}
.limit::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2.4em;background:linear-gradient(transparent,var(--dp-well));pointer-events:none}
.limit.open::after{display:none}
.pv-meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:6px 10px;border-top:1px solid var(--dp-border);font-size:12px;color:var(--dp-muted)}
.pv-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px 8px;font-size:12px;color:var(--dp-muted)}
.pv-bar .sp{flex:1 1 auto}
.pv-head{display:flex;align-items:flex-start;gap:2px;padding:0 6px 0 0;min-width:0}
.pv-head .tgl{padding:8px 4px 8px 10px;min-height:36px;flex:1 1 0;min-width:0;align-items:flex-start}
.pv-head .iconbtn{margin-top:4px;flex:none}
[data-open='true']>.pv-head .chev{transform:rotate(180deg)}
.pvh-in{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0;flex:1}
.pvh-in .path{flex:1 1 120px;min-width:0}
.dock-pane{display:flex;flex-direction:column;flex:1;min-height:0}
.agent-detail .kv{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

[hidden]{display:none !important}
/* ===== Dock (R1) ===== */
.win{display:flex;width:var(--ww);height:var(--wh);border:1px solid var(--dp-border-strong);border-radius:12px;overflow:hidden;background:oklch(var(--b1));position:relative;container-type:inline-size}
.chatcol{flex:1 1 0;min-width:0;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.skel{height:10px;border-radius:99px;background:var(--dp-well)}
.bubble{background:oklch(var(--b2));border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dock{width:var(--dw,400px);flex:none;background:var(--dp-dock);border-left:1px solid var(--dp-border-strong);display:flex;flex-direction:column;min-width:0;position:relative}
.dock.overlay{position:absolute;inset:0;width:auto;border-left:0;z-index:5}
.resize{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;display:grid;place-items:center}
.resize::after{content:'';width:2px;height:36px;border-radius:2px;background:var(--dp-border-strong)}
.resize:hover::after,.resize:focus-visible::after{background:var(--dp-fg);height:56px}
.dock-top{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--dp-border)}
.seg{display:inline-flex;background:var(--dp-well);border-radius:99px;padding:2px;gap:2px}
.seg button{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;color:var(--dp-muted);min-height:28px;white-space:nowrap}
.seg button[aria-selected='true']{background:var(--dp-card);color:var(--dp-fg);box-shadow:var(--dp-shadow)}
.count{font-size:11.5px;font-weight:700;border-radius:99px;padding:0 6px;background:oklch(var(--b1));color:var(--dp-fg);box-shadow:inset 0 0 0 1px var(--dp-border-strong);min-width:20px;text-align:center}
.dtabs{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--dp-border)}
.dtab{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:500;border:1px solid var(--dp-border);white-space:nowrap;position:relative;min-height:28px;max-width:180px}
.dtab[aria-selected='true']{background:var(--dp-card);border-color:var(--dp-border-strong);font-weight:600;box-shadow:var(--dp-shadow)}
.dtab .new{width:8px;height:8px;border-radius:99px;background:var(--dp-hl);position:relative;flex:none}
.dtab .new::after{content:'';position:absolute;inset:-4px;border-radius:99px;border:2px solid var(--dp-hl);opacity:0}
@media (prefers-reduced-motion:no-preference){.dtab .new::after{animation:ring 1.4s ease-out 2}}
@keyframes ring{0%{opacity:.9;transform:scale(.5)}100%{opacity:0;transform:scale(1.5)}}
.dock-body{padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto;flex:1;min-height:0}
.empty{margin:auto;max-width:280px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:24px 8px}
.empty .orb{width:56px;height:56px;border-radius:99px;display:grid;place-items:center;font-size:24px;background:radial-gradient(circle at 30% 25%,color-mix(in oklab,oklch(var(--s)) 28%,var(--dp-card)),var(--dp-well));box-shadow:var(--dp-shadow),inset 0 1px 0 var(--dp-rim);color:var(--dp-fg)}
.kbd{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--dp-well);border-radius:8px;padding:6px 10px;display:inline-block}
.legend td,.legend th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--dp-border);font-size:12.5px;vertical-align:top}
</style>
</head>
<body>
<div class="harness" id="harness" role="toolbar" aria-label="Prototype controls">
  <strong>Prototype controls</strong>
  <label>Screen <select id="c-screen"></select></label>
  <label>Theme <select id="c-theme"><option value="dark">dark (anubis)</option><option value="light">light (anubis-light)</option></select></label>
  <label>Width <select id="c-w"></select></label>
  <label>State <select id="c-state"><option value="collapsed">collapsed (cards closed)</option><option value="expanded">expanded (all open)</option><option value="closed">closed (sections closed too)</option></select></label>
  <span class="muted">Query params: screen, theme, w, state, shot=1</span>
</div>
<main class="stage" id="stage"></main>

<script>
/* ---------- helpers ---------- */
const P = new URLSearchParams(location.search);
const q = (k, d) => P.get(k) || d;
const ICON = {
  chevron:'<path d="m6 9 6 6 6-6"/>', x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  pin:'<path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>',
  files:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
  diff:'<path d="M12 3v14"/><path d="M5 10h14"/><path d="M5 21h14"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  cost:'<circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/>',
  tokens:'<path d="M4 9h16"/><path d="M4 15h16"/><path d="M10 3 8 21"/><path d="m16 3-2 18"/>',
  flask:'<path d="M10 2v7.5a2 2 0 0 1-.2.9L4.7 20.5a1 1 0 0 0 .9 1.5h12.8a1 1 0 0 0 .9-1.5L14.2 10.4a2 2 0 0 1-.2-.9V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/>',
  bot:'<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>',
  term:'<path d="m4 17 6-6-6-6"/><path d="M12 19h8"/>',
  panel:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/>',
  dash:'<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
  up:'<path d="M7 17 17 7"/><path d="M7 7h10v10"/>', down:'<path d="m7 7 10 10"/><path d="M17 7v10H7"/>',
  check:'<path d="M20 6 9 17l-5-5"/>', info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  warn:'<path d="m21.7 18-8-14a2 2 0 0 0-3.5 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  err:'<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>',
  copy:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  ext:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
};
const ic = (n, extra = '') => `<svg class="i ${extra}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
let uid = 0; const id = p => `${p}-${++uid}`;
const state = q('state', 'collapsed');
const openStat = state !== 'collapsed' || false;       // stat/agent/chip level
const openSec = state !== 'closed';                      // section level
const openLeaf = state === 'expanded';                   // anything collapsible below a section
const spark = (vals, label, hl = vals.length - 1, cls = '') => {
  const m = Math.max(...vals);
  return `<span class="spark" role="img" aria-label="${label}" ${cls}>${vals.map((v, i) => `<i class="${i === hl ? 'hl' : ''}" style="--h:${Math.max(14, Math.round(v / m * 100))}%"></i>`).join('')}</span>`;
};
const pill = (kind, icon, text) => `<span class="pill ${kind}">${icon ? ic(icon) : ''}${text}</span>`;
const badge = (kind, text, dot) => `<span class="pill ${kind}">${dot ? `<span class="dot ${kind} ${dot === 'pulse' ? 'pulse-dot' : ''}"></span>` : ''}${text}</span>`;

/* collapsible: header button + hidden region; open => aria-expanded true */
function collapsible({ cls, head, body, open, pre = 'c', headCls = 'tgl', tag = 'div' }) {
  const rid = id(pre);
  return `<${tag} class="${cls}" data-open="${open}">
    <button type="button" class="${headCls}" aria-expanded="${open}" aria-controls="${rid}" data-toggle>${head}</button>
    <div class="clp" id="${rid}" role="region" ${open ? '' : 'inert'}><div>${body}</div></div>
  </${tag}>`;
}

/* ---------- data ---------- */
const files = [
  ['libs/frontend/chat/src/lib/components/organisms/','display-panel.component.ts','+148','−0','new'],
  ['libs/shared/src/mcp-apps-contracts/','ptah-ui-parser.ts','+96','−12','mod'],
  ['libs/frontend/chat-ui/src/lib/molecules/turn-recap/','turn-summary-chip.component.ts','+74','−31','mod'],
  ['libs/frontend/chat/src/lib/services/','display-panel.store.ts','+61','−0','new'],
];

const FILES = [
  {st:'A',kind:'su',label:'Added',dir:'libs/frontend/chat/src/lib/components/organisms/',name:'display-panel.component.ts',add:'+148',del:'−0'},
  {st:'M',kind:'in',label:'Modified',dir:'libs/shared/src/mcp-apps-contracts/',name:'ptah-ui-parser.ts',add:'+96',del:'−12'},
  {st:'R',kind:'n',label:'Renamed',dir:'libs/frontend/chat-ui/src/lib/molecules/turn-summary/',name:'turn-summary-chip.component.ts',orig:'libs/frontend/chat-ui/src/lib/molecules/turn-recap/turn-recap-chip.component.ts',add:'+74',del:'−31'},
  {st:'D',kind:'er',label:'Deleted',dir:'libs/frontend/chat-ui/src/lib/molecules/turn-recap/',name:'turn-tests-row.component.ts',add:'?',del:'?'},
  {st:'M',kind:'in',label:'Modified',dir:'apps/ptah-extension-webview/src/assets/',name:'dp-preview.png',binary:true},
];
function fileRow(f, extra='') {
  const cnt = f.binary ? '<span class="cnt muted">binary</span>' : `<span class="cnt"><span style="color:var(--dp-su-text)">${f.add}</span> <span style="color:var(--dp-er-text)">${f.del}</span></span>`;
  return `<div class="frow">
    <div class="row" style="align-items:flex-start;gap:8px"><span class="fst ${f.kind}" title="${f.label}" aria-label="${f.label}" role="img">${f.st}</span>
      <span class="col grow" style="gap:2px"><span class="path" title="${f.dir}${f.name}"><span class="dir">${f.dir}</span><span class="name">${f.name}</span></span>${f.orig ? `<span class="eyebrow" style="overflow-wrap:anywhere">renamed from <span class="mono">${f.orig}</span></span>` : ''}</span>${cnt}</div>
    <div class="row wrap" style="gap:4px 6px;padding-left:28px"><button class="btn2 sm" type="button" aria-label="Open ${f.name}">${ic('ext')}Open file</button><button class="btn2 sm" type="button" aria-label="Show ${f.name} in review">${ic('diff')}Review</button>${extra}</div></div>`;
}
function filesDetail(v='normal') {
  if (v === 'normal') return `<div class="well col" style="gap:0">${FILES.slice(0,4).map(f=>fileRow(f)).join('')}<div class="row wrap" style="gap:6px;border-top:1px solid var(--dp-border);padding-top:8px"><button class="btn2 sm" type="button">${ic('diff')}Review all</button><span class="eyebrow">+3 more files not listed</span></div></div>`;
  const conflict = {st:'U',kind:'er',label:'Conflicted',dir:'libs/shared/src/mcp-apps-contracts/',name:'surface-catalog.ts',add:'+9',del:'−2'};
  return `<div class="well col" style="gap:0">
    <div class="note wa" role="note" style="margin-bottom:8px"><span class="ic">${ic('warn')}</span><b>May include changes made before this turn</b><p>The baseline for this turn was not recorded.</p></div>
    ${fileRow(conflict, `<button class="btn2 sm" type="button" aria-label="Resolve surface-catalog.ts">${ic('check')}Resolve</button>`)}
    ${FILES.map(f=>fileRow(f)).join('')}
    <details class="group"><summary>${ic('chevron')}No longer changes HEAD (2)</summary><div class="col" style="gap:0;margin-top:6px">${fileRow({st:'M',kind:'n',label:'Modified, reconciled',dir:'libs/shared/src/',name:'index.ts',add:'+1',del:'−1'})}${fileRow({st:'M',kind:'n',label:'Modified, reconciled',dir:'libs/shared/src/',name:'types.ts',add:'+2',del:'−0'})}</div></details>
    <div class="alertline" role="alert" style="margin-top:6px">${ic('err')}<span>Could not open surface-catalog.ts: the review panel is not available.</span></div>
    <div class="row wrap" style="gap:6px;border-top:1px solid var(--dp-border);padding-top:8px;margin-top:6px"><button class="btn2 sm" type="button">${ic('diff')}Review all</button><button class="btn2 sm" type="button">Show more (50 per page)</button><span class="eyebrow">+12 more files not listed</span></div></div>`;
}
const RUNS = [
  {k:'su',icon:'check',out:'Passed',label:'chat-ui',cmd:'npx nx test chat-ui --testPathPattern=turn-recap --coverage=false --maxWorkers=2',sum:'38 passed, 38 total'},
  {k:'er',icon:'err',out:'Failed',label:'shared',cmd:'npx nx test shared --testPathPattern=ptah-ui-parser --coverage=false --maxWorkers=2',sum:'2 failed, 61 passed',fails:['ptah-ui-parser.spec.ts > rejects nested display fence','display-panel.store.spec.ts > pins a display across turns']},
  {k:'in',icon:'clock',out:'Running in background',label:'npx jest -c libs/frontend/chat/jest.config.ts',cmd:'npx jest -c libs/frontend/chat/jest.config.ts display-panel --coverage=false --maxWorkers=2',sum:'started 40s ago'},
  {k:'n',icon:'info',out:'Unknown',label:'npm test',cmd:'npm test -- --silent',sum:'outcome could not be parsed'},
];
function testsDetail(v='normal') {
  const runs = v === 'normal' ? RUNS.slice(0,2) : RUNS;
  return `<div class="well col" style="gap:8px"><progress class="bar su" max="100" value="${v==='normal'?95:88}" aria-label="Test progress"></progress>
    <div class="col" style="gap:0">${runs.map(r=>`<div class="run"><div class="row" style="align-items:flex-start;gap:6px"><span style="color:var(--dp-${r.k==='n'?'muted':r.k+'-text'})" role="img" aria-label="${r.out}">${ic(r.icon)}</span><span class="col grow" style="gap:1px"><span class="title mono" style="font-size:12.5px;overflow-wrap:anywhere">${r.label}</span><span class="eyebrow">${r.out} · ${r.sum}</span></span></div>
      ${r.fails ? `<ul class="fails" style="padding-left:22px">${r.fails.map(f=>`<li><span style="color:var(--dp-er-text)">${ic('err')}</span><span class="mono">${f}</span></li>`).join('')}</ul>` : ''}
      <details class="det" style="padding-left:22px"><summary>Full command</summary><code class="mono">${r.cmd}</code></details></div>`).join('')}</div></div>`;
}
function statCard(k, over = {}) {
  const S0 = {
    files:{lbl:'Files',icon:'files',num:'7',unit:'changed',pill:pill('in','up','3 new'),spark:spark([2,3,2,4,3,5,7],'Files changed per turn, last 7 turns; latest 7')},
    lines:{lbl:'Lines',icon:'diff',num:'+412',unit:'−96',pill:pill('su','up','+316 net'),spark:spark([40,90,30,120,60,200,412],'Lines added per turn, last 7 turns; latest 412'),
      detail:`<div class="well col"><div class="split" role="img" aria-label="412 lines added, 96 removed"><b style="flex:412;background:var(--dp-su-fill)"></b><b style="flex:96;background:var(--dp-er-fill)"></b></div><dl class="kv"><dt>Added</dt><dd>412</dd><dt>Removed</dt><dd>96</dd><dt>Largest change</dt><dd>display-panel.component.ts</dd></dl></div>`},
    tokens:{lbl:'Tokens',icon:'tokens',num:'184.2k',unit:'',pill:pill('wa','up','12%'),spark:spark([22,31,18,44,27,52,41],'Tokens per message; latest 41k'),
      detail:`<div class="well col"><dl class="kv"><dt>Input</dt><dd>131.8k</dd><dt>Output</dt><dd>14.6k</dd><dt>Cache read</dt><dd>37.8k</dd><dt>Messages</dt><dd>9</dd></dl></div>`},
    cost:{lbl:'Cost',icon:'cost',num:'$1.84',unit:'',pill:pill('su','down','8%'),spark:spark([1.2,2.1,0.9,2.4,1.5,2.0,1.84],'Cost per turn, last 7 turns; latest $1.84'),
      detail:`<div class="well col"><dl class="kv"><dt>claude-sonnet</dt><dd>$1.52</dd><dt>subagents (3)</dt><dd>$0.32</dd><dt>Per 1k output</dt><dd>$0.126</dd></dl></div>`},
    time:{lbl:'Duration',icon:'clock',num:'4m 12s',unit:'',pill:pill('n','','vs 3m 40s'),spark:spark([3.1,2.2,4.8,3.7,2.9,3.6,4.2],'Turn duration in minutes; latest 4.2'),
      detail:`<div class="well col"><div class="split" role="img" aria-label="62 percent tool time, 38 percent model time"><b style="flex:62;background:var(--dp-in-fill)"></b><b style="flex:38;background:var(--dp-muted)"></b></div><dl class="kv"><dt>Tools</dt><dd>2m 36s</dd><dt>Model</dt><dd>1m 36s</dd><dt>Slowest tool</dt><dd>Bash, 48s</dd></dl></div>`},
    tests:{lbl:'Tests',icon:'flask',num:'38/40',unit:'pass',pill:pill('er','err','2 failed'),spark:spark([40,40,38,40,39,40,38],'Passing tests per run; latest 38 of 40',6,'style="--hl:var(--dp-er-fill)"')},
  };
  const S = Object.assign({}, S0[k], over);
  if (!S.detail) S.detail = k === 'files' ? filesDetail('normal') : k === 'tests' ? testsDetail('normal') : '';
  const open = over.forceOpen ? true : openLeaf;
  const head = `<span class="stat-head">
    <span class="stat-top"><span class="lbl eyebrow">${ic(S.icon)}<span class="trunc">${S.lbl}</span></span><span style="color:var(--dp-muted)">${ic('chevron','chev')}</span></span>
    <span class="stat-mid"><span class="h-num">${S.num}</span>${S.unit ? `<span class="h-unit">${S.unit}</span>` : ''}</span>
    <span class="row wrap" style="gap:4px 8px;justify-content:space-between;align-items:center">${S.pill}</span>
    ${S.spark || ''}
  </span>`;
  return collapsible({ cls: 'dp-card dstat', head, headCls: 'tgl stat-hd', open, pre: 'st',
    body: `<div class="stat-detail">${S.detail}</div>` });
}

/* the stat head must not have a flex row wrapper from .tgl; override */
const style2 = document.createElement('style');
style2.textContent = `.stat-hd{display:block;padding:0;min-height:0}`;
document.head.appendChild(style2);

function sectionCard({ title, sub, icon, body, right = '', open = openSec, extra = '' }) {
  const rid = id('sec');
  return `<section class="dp-card sec ${extra}" data-open="${open}" aria-label="${title}">
    <div class="hdr"><button type="button" class="tgl grow" style="min-width:0" aria-expanded="${open}" aria-controls="${rid}" data-toggle>
      <span style="color:var(--dp-muted);font-size:16px">${ic(icon)}</span>
      <span class="col grow" style="gap:0"><span class="title trunc">${title}</span>${sub ? `<span class="eyebrow" style="overflow-wrap:anywhere" title="${sub}">${sub}</span>` : ''}</span>
      <span style="color:var(--dp-muted)">${ic('chevron','chev')}</span></button>${right}</div>
    <div class="clp" id="${rid}" role="region" ${open ? '' : 'inert'}><div><div class="sec-body">${body}</div></div></div>
  </section>`;
}

/* ---------- R6 turn summary (panel) ---------- */
function summaryDisplay() {
  return sectionCard({ title: 'Turn summary', sub: 'Turn 12 · finished 2 min ago · host-built', icon: 'dash', extra: 'dhero',
    right: `<span class="pill n" title="Host-owned, always first">${ic('pin')}<span>Host</span></span>`,
    body: `<div class="stat-grid">${['files','lines','tokens','cost','time','tests'].map(statCard).join('')}</div>` });
}

/* ---------- R5 $agents ---------- */

const agents = [
  {n:'code-explorer',init:'Ex',st:'Running',k:'in',pulse:true,tokN:48.1,tok:'48.1k',cost:'$0.21',time:'1m 48s'},
  {n:'planner',init:'Pl',st:'Done',k:'su',tokN:61.3,tok:'61.3k',cost:'$0.08',time:'52s'},
  {n:'code-reviewer',init:'Rv',st:'Failed',k:'er',tokN:74.8,tok:'74.8k',cost:'$0.03',time:'2m 05s'},
];
const TOTAL_TOK = agents.reduce((a,b)=>a+b.tokN,0);
function agentRow(a) {
  const share = Math.round(a.tokN / TOTAL_TOK * 100);
  const head = `<span class="agent-head">

function hl(line) {
  const re = /(\/\/.*$)|('[^']*')|\b(const|export|import|from|as|type|function|return|interface)\b|\b(\d+)\b/g;
  let out = '', last = 0, m; const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  while ((m = re.exec(line))) { out += esc(line.slice(last, m.index)); out += `<span class="${m[1]?'hc':m[2]?'hs':m[3]?'hk':'hn'}">${esc(m[0])}</span>`; last = m.index + m[0].length; }
  return out + esc(line.slice(last));
}
function codeLines(arr, start = 1, mark = {}) {
  return arr.map((t, i) => { const n = start + i, m = mark[i] || ' ';
    return `<div class="ln ${m==='+'?'add':m==='−'?'del':''}"><span class="n mono">${n}</span><span class="g mono" ${m!==' '?`aria-label="${m==='+'?'added':'removed'}"`:'aria-hidden="true"'}>${m===' '?'':m}</span><span class="mono">${hl(t)}</span></div>`; }).join('');
}

['c-screen','c-theme','c-w','c-state'].forEach(i => document.getElementById(i).addEventListener('change', () => {
  const n = new URLSearchParams({ screen: cs.value, theme: document.getElementById('c-theme').value, w: cw.value, state: document.getElementById('c-state').value });
  location.search = n.toString();
}));

/* interaction: toggles (click, Enter, Space via native button) */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-toggle]'); if (!b) return;
  const host = b.closest('[data-open]'); const open = host.dataset.open !== 'true';
  host.dataset.open = open; b.setAttribute('aria-expanded', open);
  const r = document.getElementById(b.getAttribute('aria-controls'));
  if (r) { open ? r.removeAttribute('inert') : r.setAttribute('inert', ''); }
  const cmd = host.querySelector('[data-cmd]'); if (cmd) cmd.classList.toggle('one', !open);
});
/* tablist: roving tabindex, arrows wrap, Home/End; selection follows focus and shows the controlled tabpanel, hiding its siblings */
function selectTab(tl, tabs, i) {
  const scope = tl.closest('.dock') || document;
  tabs.forEach((t, k) => { t.setAttribute('aria-selected', k === i); t.tabIndex = k === i ? 0 : -1;
    const panel = scope.querySelector('#' + t.getAttribute('aria-controls')); if (panel) panel.hidden = k !== i; });
}
document.addEventListener('keydown', e => {
  const tl = e.target.closest && e.target.closest('[data-tablist]'); if (!tl || !e.target.matches('[role=tab]')) return;
  const tabs = [...tl.querySelectorAll('[role=tab]')]; let i = tabs.indexOf(e.target);
  if (e.key === 'ArrowRight') i = (i + 1) % tabs.length; else if (e.key === 'ArrowLeft') i = (i - 1 + tabs.length) % tabs.length;
  else if (e.key === 'Home') i = 0; else if (e.key === 'End') i = tabs.length - 1; else return;
  e.preventDefault(); selectTab(tl, tabs, i); tabs[i].focus();
});
document.addEventListener('click', e => { const t = e.target.closest && e.target.closest('[role=tab]'); if (!t) return;
  const tl = t.closest('[data-tablist]'); const tabs = [...tl.querySelectorAll('[role=tab]')]; selectTab(tl, tabs, tabs.indexOf(t)); });
/* height-limited blocks: show full / show less */
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-more]'); if (!b) return;
  const box = b.closest('.clp').querySelector('.limit'); const open = !box.classList.contains('open');
  box.classList.toggle('open', open); b.setAttribute('aria-expanded', open); b.textContent = open ? b.dataset.lessLabel : b.dataset.moreLabel; });
/* Escape collapses the enclosing R9 component and returns focus to its toggle */
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return;
  const host = e.target.closest && e.target.closest('[data-open="true"]'); if (!host) return;
  const t = host.querySelector(':scope > [data-toggle], :scope > .pv-head > [data-toggle], :scope > .hdr > [data-toggle]'); if (!t) return;
  t.click(); t.focus(); });
/* separator: arrows +/-16 px, Home/End min/max, Enter or double-click resets to 400, aria-valuetext announces the width */
(function () {
  const set = (sep, w) => { w = Math.max(300, Math.min(960, w)); sep.setAttribute('aria-valuenow', w); sep.setAttribute('aria-valuetext', `Panel width ${w} pixels`); sep.closest('.win').style.setProperty('--dw', w + 'px'); };
  document.addEventListener('keydown', e => { const s = e.target.closest && e.target.closest('.resize'); if (!s) return; let w = Number(s.getAttribute('aria-valuenow'));
    if (e.key === 'ArrowLeft') w += 16; else if (e.key === 'ArrowRight') w -= 16; else if (e.key === 'Home') w = 300; else if (e.key === 'End') w = 960; else if (e.key === 'Enter') w = 400; else return;
    e.preventDefault(); set(s, w); });
  document.addEventListener('dblclick', e => { const s = e.target.closest && e.target.closest('.resize'); if (s) set(s, 400); });
})();
/* tab self-test (harness only): ?selftest=1 */
if (q('selftest')) {
  const out = []; const dock = document.querySelector('.dock'); const strip = dock.querySelector('.dtabs'); const tabs = [...strip.querySelectorAll('[role=tab]')];
  const vis = () => tabs.map(t => { const pn = dock.querySelector('#' + t.getAttribute('aria-controls')); return (t.getAttribute('aria-selected') === 'true' ? 'S' : '-') + (pn.hidden ? 'h' : 'v') + t.tabIndex; }).join(' ');
  out.push('init ' + vis());
  tabs[0].focus();
  ['ArrowRight', 'End', 'ArrowRight', 'Home'].forEach(k => { document.activeElement.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true })); out.push(k + ' ' + vis() + ' focus=' + document.activeElement.id.replace(/-\d+$/, '')); });
  const seg = [...dock.querySelectorAll('.seg [role=tab]')]; seg[0].focus(); seg[0].dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
  out.push('seg ' + seg.map(t => { const pn = dock.querySelector('#' + t.getAttribute('aria-controls')); return t.getAttribute('aria-selected') + '/' + (pn.hidden ? 'hidden' : 'shown'); }).join(' '));
  const o = document.createElement('pre'); o.id = 'selftest'; o.textContent = 'SELFTEST|' + out.join('|'); document.body.appendChild(o);
}
/* contrast probe (harness only): ?contrast=1 */
if (q('contrast')) {
  const cv = document.createElement('canvas').getContext('2d');
  const rgb = c => { cv.clearRect(0,0,1,1); cv.fillStyle = '#000'; cv.fillStyle = c; cv.fillRect(0,0,1,1); const d = cv.getImageData(0,0,1,1).data; return [d[0],d[1],d[2]]; };
  const lum = ([r,g,b]) => { const f = v => { v/=255; return v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4); }; return .2126*f(r)+.7152*f(g)+.0722*f(b); };
  const cr = (a,b) => { const x=lum(a), y=lum(b); return ((Math.max(x,y)+.05)/(Math.min(x,y)+.05)); };
  const probe = document.createElement('div'); document.body.appendChild(probe);
  const res = v => { probe.style.color = v; return getComputedStyle(probe).color; };
  const pairs = [['fg on card','--dp-fg','--dp-card'],['muted on card','--dp-muted','--dp-card'],['muted on dock','--dp-muted','--dp-dock'],['muted on well','--dp-muted','--dp-well'],['fg on well','--dp-fg','--dp-well']];
  ['su','wa','er','in'].forEach(k => { pairs.push([k+' text on '+k+' tint','--dp-'+k+'-text','--dp-'+k+'-tint']); pairs.push([k+' text on card','--dp-'+k+'-text','--dp-card']); pairs.push([k+' fill vs card (non-text 3:1)','--dp-'+k+'-fill','--dp-card']); });
  ['su','wa','in'].forEach(k => pairs.push(['syntax '+k+' text on well','--dp-'+k+'-text','--dp-well']));
  pairs.push(['highlight bar vs card','--dp-hl','--dp-card'],['bar-dim vs card (decor)','--dp-bar-dim','--dp-card']);
  const out = pairs.map(([n,a,b]) => { const ca = res('var('+a+')'), cb = res('var('+b+')'); return n + ' = ' + cr(rgb(ca), rgb(cb)).toFixed(2); });
  const o = document.createElement('pre'); o.id='contrast'; o.textContent = 'CONTRAST|' + out.join('|'); document.body.appendChild(o);
}
/* R9.5 width check (harness only): ?check=1 appends a result block */
if (q('check')) {
  const bad = [];
  document.querySelectorAll('[data-frame] *, .win *').forEach(el => { if (el.scrollWidth > el.clientWidth + 1 && getComputedStyle(el).overflowX === 'visible' && el.clientWidth > 0 && !el.closest('.dtabs') && !el.closest('.trunc') ) bad.push(el.tagName + '[' + el.textContent.slice(0,20) + ']' + el.className + ':' + el.scrollWidth + '>' + el.clientWidth); });
  const roots = [...document.querySelectorAll('[data-frame]')].map(f => f.dataset.frame + ':' + (f.scrollWidth <= f.clientWidth + 1 ? 'ok' : 'OVERFLOW ' + f.scrollWidth));
  const o = document.createElement('pre'); o.id = 'check'; o.textContent = 'CHECK roots=' + roots.join(',') + ' bad=' + JSON.stringify(bad.slice(0, 12)); document.body.appendChild(o);
}
