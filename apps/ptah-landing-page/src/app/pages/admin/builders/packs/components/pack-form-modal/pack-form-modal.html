@if (open()) {
  <dialog class="modal modal-open" aria-labelledby="pack-form-title">
    <div class="modal-box max-w-xl">
      <header class="mb-4 flex items-start justify-between gap-4">
        <div>
          <h3 id="pack-form-title" class="text-lg font-semibold">
            {{ isEdit() ? 'Edit Pack' : 'New Pack' }}
          </h3>
          <p class="text-sm opacity-70">
            Records which GitHub repository was shared with which cohort.
            Saving this form does not grant anyone access.
          </p>
        </div>
        <button
          type="button"
          class="btn btn-ghost btn-sm btn-square"
          aria-label="Close"
          [disabled]="saving()"
          (click)="onCloseClick()"
        >
          ✕
        </button>
      </header>

      <form (submit)="onSubmit($event)" class="flex flex-col gap-4">
        @if (errorMessage(); as msg) {
          <div class="alert alert-error text-sm">
            <span>{{ msg }}</span>
          </div>
        }

        <label class="form-control w-full">
          <div class="label">
            <span class="label-text">Slug</span>
            @if (!isEdit()) {
              <span class="label-text-alt">lowercase-slug</span>
            }
          </div>
          <input
            type="text"
            class="input input-bordered input-sm font-mono"
            [class.input-error]="!isEdit() && slug().length > 0 && !slugValid()"
            [value]="slug()"
            (input)="onSlugInput($event)"
            [disabled]="isEdit() || saving()"
            placeholder="e.g. saas-starter"
            maxlength="64"
          />
          @if (isEdit()) {
            <div class="label">
              <span class="label-text-alt opacity-60">
                Immutable after creation.
              </span>
            </div>
          } @else if (slug().length > 0 && !slugValid()) {
            <div class="label">
              <span class="label-text-alt text-error">
                2-64 chars of lowercase letters, digits, and hyphens.
              </span>
            </div>
          }
        </label>

        <label class="form-control w-full">
          <div class="label">
            <span class="label-text">Title</span>
          </div>
          <input
            type="text"
            class="input input-bordered input-sm"
            [value]="title()"
            (input)="onTitleInput($event)"
            [disabled]="saving()"
            placeholder="e.g. SaaS Starter Pack"
            maxlength="160"
          />
        </label>

        <label class="form-control w-full">
          <div class="label">
            <span class="label-text">Description</span>
          </div>
          <textarea
            class="textarea textarea-bordered textarea-sm"
            rows="2"
            [value]="description()"
            (input)="onDescriptionInput($event)"
            [disabled]="saving()"
            placeholder="What is in this repository?"
            maxlength="1000"
          ></textarea>
        </label>

        <label class="form-control w-full">
          <div class="label">
            <span class="label-text">Repository URL</span>
            <span class="label-text-alt">one repo per pack</span>
          </div>
          <input
            type="url"
            class="input input-bordered input-sm font-mono"
            [class.input-error]="repoUrl().length > 0 && !repoUrlValid()"
            [value]="repoUrl()"
            (input)="onRepoUrlInput($event)"
            [disabled]="saving()"
            placeholder="https://github.com/owner/repo"
            maxlength="300"
          />
          @if (repoUrl().length > 0 && !repoUrlValid()) {
            <div class="label">
              <span class="label-text-alt text-error">
                Must be a https://github.com/owner/repo URL.
              </span>
            </div>
          }
        </label>

        <!--
          L12 mitigation. The null option must NOT read "All Builders" or
          anything else implying a visibility scope: this field decides nothing
          about who can reach the repo. Wording and helper text are the whole
          mitigation, since there is no technical enforcement to point at.
        -->
        <label class="form-control w-full">
          <div class="label">
            <span class="label-text">Cohort</span>
            <span class="label-text-alt">label only</span>
          </div>
          <select
            class="select select-bordered select-sm"
            [value]="cohortKey()"
            (change)="onCohortChange($event)"
            [disabled]="saving() || groupsLoading()"
          >
            <option value="">Not tied to a cohort</option>
            @for (g of groups(); track g.id) {
              <option [value]="g.key">{{ g.name }}</option>
            }
          </select>
          <div class="label">
            <span class="label-text-alt opacity-60">
              @if (groupsLoading()) {
                Loading cohorts…
              } @else {
                Label only — sharing is done on GitHub. Changing this grants
                and revokes nothing.
              }
            </span>
          </div>
          @if (groupsError(); as gErr) {
            <div class="label">
              <span class="label-text-alt text-warning">{{ gErr }}</span>
            </div>
          }
        </label>

        <label class="form-control w-full">
          <div class="label">
            <span class="label-text">Tags</span>
            <span class="label-text-alt">comma-separated, optional</span>
          </div>
          <input
            type="text"
            class="input input-bordered input-sm"
            [value]="tagsText()"
            (input)="onTagsInput($event)"
            [disabled]="saving()"
            placeholder="e.g. nestjs, prisma, mcp"
            maxlength="300"
          />
          @if (parsedTags().length > 0) {
            <div class="label">
              <div class="flex flex-wrap gap-1">
                @for (t of parsedTags(); track t) {
                  <span class="badge badge-outline badge-sm">{{ t }}</span>
                }
              </div>
            </div>
          }
        </label>

        <label class="form-control w-full">
          <div class="label">
            <span class="label-text">Notes</span>
            <span class="label-text-alt">internal, optional</span>
          </div>
          <textarea
            class="textarea textarea-bordered textarea-sm"
            rows="2"
            [value]="notes()"
            (input)="onNotesInput($event)"
            [disabled]="saving()"
            placeholder="e.g. invited @founding-cohort as a GitHub team on 2026-08-01"
            maxlength="1000"
          ></textarea>
          <div class="label">
            <span class="label-text-alt opacity-60">
              Your own record of the manual step taken. Never shown to a member.
            </span>
          </div>
        </label>

        <div class="modal-action">
          <button
            type="button"
            class="btn btn-ghost"
            [disabled]="saving()"
            (click)="onCloseClick()"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="btn btn-primary px-8"
            [disabled]="!canSubmit()"
          >
            @if (saving()) {
              <span class="loading loading-spinner loading-sm"></span>
              Saving…
            } @else {
              {{ isEdit() ? 'Save Changes' : 'Create Pack' }}
            }
          </button>
        </div>
      </form>
    </div>
    <button
      type="button"
      class="modal-backdrop"
      aria-label="Close modal"
      [disabled]="saving()"
      (click)="onCloseClick()"
    >
      close
    </button>
  </dialog>
}
