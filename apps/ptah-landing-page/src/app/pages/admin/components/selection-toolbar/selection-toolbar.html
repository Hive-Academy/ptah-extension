@if (count() > 0) {
  <div
    class="toolbar-enter flex items-center justify-between gap-3 rounded-md border border-amber-500/20 bg-amber-500/10 px-3 py-2 text-sm"
    role="region"
    aria-label="Bulk actions"
  >
    <div class="flex items-center gap-3">
      <span class="font-medium tabular-nums text-amber-400">
        {{ countLabel() }}
      </span>
      <button
        type="button"
        class="btn btn-ghost btn-xs"
        (click)="cleared.emit()"
      >
        Clear
      </button>
    </div>

    <div class="flex flex-wrap items-center justify-end gap-2">
      <ng-content />
    </div>
  </div>
}
