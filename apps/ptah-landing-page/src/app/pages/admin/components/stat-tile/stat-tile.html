@if (link(); as target) {
  <a
    [routerLink]="target"
    [queryParams]="linkQueryParams()"
    class="group flex flex-col gap-1 rounded-lg border border-base-300 bg-base-200 p-4 transition-colors hover:border-ink-600 hover:bg-base-300"
  >
    <ng-container [ngTemplateOutlet]="body" />
  </a>
} @else {
  <div
    class="flex flex-col gap-1 rounded-lg border border-base-300 bg-base-200 p-4"
  >
    <ng-container [ngTemplateOutlet]="body" />
  </div>
}

<ng-template #body>
  <div class="flex items-center justify-between gap-2">
    <span class="text-xs font-semibold uppercase tracking-wide text-ink-400">
      {{ label() }}
    </span>
    @if (link()) {
      <lucide-angular
        [img]="ChevronRightIcon"
        class="h-4 w-4 shrink-0 text-ink-500 transition-transform group-hover:translate-x-0.5"
        aria-hidden="true"
      />
    }
  </div>

  <span [class]="valueClass()">{{ valueText() }}</span>

  @if (delta(); as d) {
    <span [class]="deltaClass()">{{ d }}</span>
  }
</ng-template>
