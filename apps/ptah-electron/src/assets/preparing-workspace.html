<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ptah — Preparing workspace</title>
    <link rel="stylesheet" href="./preparing-workspace.css" />
    <script src="./preparing-workspace.js" defer></script>
  </head>
  <body>
    <main id="shell" aria-busy="true" aria-labelledby="title">
      <div id="progress" class="progress">
        <div
          id="ring"
          class="ring"
          data-mode="indeterminate"
          role="img"
          aria-label="Preparing"
        >
          <svg
            class="ring-svg"
            width="150"
            height="150"
            viewBox="0 0 150 150"
            aria-hidden="true"
            focusable="false"
          >
            <circle class="ring-track" cx="75" cy="75" r="70" />
            <circle
              id="ring-arc"
              class="ring-arc"
              cx="75"
              cy="75"
              r="70"
              stroke-dasharray="110 439.82"
              transform="rotate(-90 75 75)"
            />
          </svg>
          <div class="ring-center" aria-hidden="true">
            <span id="ring-percent" class="ring-percent num" hidden></span>
            <span id="ring-step" class="cap">step 1 of 3</span>
          </div>
        </div>
      </div>

      <h1 id="title" class="title">Preparing workspace</h1>
      <p id="detail" class="detail" role="status">
        Verifying local state before Ptah starts.
      </p>
      <p id="error-code" class="error-code" hidden></p>

      <ol id="steps" class="steps" aria-label="Startup steps">
        <li class="step" data-step="verify" data-state="active">
          <span class="step-icon" aria-hidden="true">
            <svg class="icon icon-step" viewBox="0 0 24 24" focusable="false">
              <path
                d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
              />
              <path d="m9 12 2 2 4-4" />
            </svg>
            <svg class="icon icon-done" viewBox="0 0 24 24" focusable="false">
              <path d="M20 6 9 17l-5-5" />
            </svg>
            <svg class="icon icon-failed" viewBox="0 0 24 24" focusable="false">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 8v4" />
              <path d="M12 16h.01" />
            </svg>
          </span>
          <span class="step-body">
            <span class="step-label">Verify local state</span>
            <span class="meter" aria-hidden="true" hidden><i></i></span>
          </span>
          <span class="step-figure cap num"></span>
        </li>
        <li class="step" data-step="restore" data-state="pending">
          <span class="step-icon" aria-hidden="true">
            <svg class="icon icon-step" viewBox="0 0 24 24" focusable="false">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
              <path d="M12 7v5l4 2" />
            </svg>
            <svg class="icon icon-done" viewBox="0 0 24 24" focusable="false">
              <path d="M20 6 9 17l-5-5" />
            </svg>
            <svg class="icon icon-failed" viewBox="0 0 24 24" focusable="false">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 8v4" />
              <path d="M12 16h.01" />
            </svg>
          </span>
          <span class="step-body">
            <span class="step-label">Restore workspace history</span>
            <span class="meter" aria-hidden="true" hidden><i></i></span>
          </span>
          <span class="step-figure cap num"></span>
        </li>
        <li class="step" data-step="agents" data-state="pending">
          <span class="step-icon" aria-hidden="true">
            <svg class="icon icon-step" viewBox="0 0 24 24" focusable="false">
              <path d="M12 8V4H8" />
              <rect width="16" height="12" x="4" y="8" rx="2" />
              <path d="M2 14h2" />
              <path d="M20 14h2" />
              <path d="M15 13v2" />
              <path d="M9 13v2" />
            </svg>
            <svg class="icon icon-done" viewBox="0 0 24 24" focusable="false">
              <path d="M20 6 9 17l-5-5" />
            </svg>
            <svg class="icon icon-failed" viewBox="0 0 24 24" focusable="false">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 8v4" />
              <path d="M12 16h.01" />
            </svg>
          </span>
          <span class="step-body">
            <span class="step-label">Start agents</span>
            <span class="meter" aria-hidden="true" hidden><i></i></span>
          </span>
          <span class="step-figure cap num"></span>
        </li>
      </ol>
    </main>
  </body>
</html>
