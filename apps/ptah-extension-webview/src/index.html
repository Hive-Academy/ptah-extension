<!DOCTYPE html>
<html lang="en" data-theme="ptah-glass" data-theme-mode="dark" data-glass="on" data-glass-mode="dark">
  <head>
    <meta charset="utf-8" />
    <title>PtahCode</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Carrier for the deferred theme sheet's URL. `rel` is deliberately NOT
      "stylesheet" / "preload": no browser fetches a link with an unknown rel,
      so a default-theme user never pays for this. Its only job is to let the
      HOST resolve the URL for us — the VS Code webview rewrites every href in
      this document to a `vscode-resource:` URI, and Electron's copy-renderer
      rewrites the base href from "/" to "./" for the file: origin. Reading
      `marker.href` therefore yields a correct absolute URL in both hosts
      without this document ever constructing one itself.
    -->
    <link
      id="ptah-theme-extra"
      rel="ptah-deferred-stylesheet"
      href="theme-extra.css"
    />
    <!--
      Pre-paint theme boot.

      `anubis`, `anubis-light`, and the Ptah glass pair are compiled into styles.css. The other
      32 daisyUI themes are emitted to `theme-extra.css`, which the build does
      NOT link from this document (project.json -> styles -> inject:false).

      A user whose persisted theme is one of those 32 must get that sheet
      BEFORE the first painted frame, or they see a frame of Ptah glass first.
      Inserting a render-blocking stylesheet link into the head while the
      parser is still running is exactly that guarantee. A user on the default
      must never fetch it at all.

      The persisted theme is read SYNCHRONOUSLY from, in order:
        1. window.vscode.getState()['theme-v2'] — available in Electron, where
           the contextBridge preload runs before any document script and backs
           getState with ipcRenderer.sendSync('get-state').
        2. localStorage 'ptah-theme-v2' — the mirror ThemeService writes on
           every setTheme(). This is the only source available inside the VS
           Code webview, where the host's `acquireVsCodeApi()` call is injected
           at the END of <body> and so has not run yet at <head> parse time.
        3. Only when NEITHER -v2 key is present: the pre-glass keys (state
           'theme', then localStorage 'ptah-theme'), mapped onto the glass pair
           by lightness — the one-time migration to the Ptah glass default.
           Nothing writes the -v2 keys at boot, so this re-derives the same
           result every launch until the user picks. A present but unknown
           -v2 value keeps the default instead: the user already chose.
      This is the same order, with the same mapping, as initializeTheme() and
      migrateLegacyTheme() in ThemeService; a difference shows up as a repaint
      one frame after boot.

      Keep the name lists below in sync with DAISYUI_THEMES and EAGER_THEMES in
      libs/frontend/core/src/lib/services/theme.service.ts —
      apps/ptah-extension-webview/src/app/theme-boot-lists.spec.ts asserts they
      still match, and theme-pre-paint-parity.spec.ts runs this script against
      ThemeService.
    -->
    <script>
      (function () {
        var EAGER = 'anubis anubis-light ptah-glass ptah-glass-light';
        var DEFERRED =
          'light dark cupcake bumblebee emerald corporate synthwave retro cyberpunk valentine halloween garden forest aqua lofi pastel fantasy wireframe black luxury dracula cmyk autumn business acid lemonade night coffee winter dim nord sunset';
        var DARK =
          'anubis ptah-glass dark synthwave halloween forest aqua black luxury dracula business night coffee dim sunset';
        var GLASS = 'ptah-glass ptah-glass-light dark nord cupcake dracula';
        var ACCENT = 'gold rose moonstone';
        var SCENE = 'aurora ember tide horizon';

        function has(list, name) {
          return (' ' + list + ' ').indexOf(' ' + name + ' ') !== -1;
        }

        function apply(theme) {
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.setAttribute(
            'data-theme-mode',
            has(DARK, theme) ? 'dark' : 'light',
          );
          if (has(GLASS, theme)) {
            root.setAttribute('data-glass', 'on');
            root.setAttribute('data-glass-mode', has(DARK, theme) ? 'dark' : 'light');
          } else {
            root.removeAttribute('data-glass');
            root.removeAttribute('data-glass-mode');
          }
        }

        function known(name) {
          return has(EAGER, name) || has(DEFERRED, name);
        }

        // State first, then the localStorage mirror, for one key pair. Same
        // `??` semantics as ThemeService: a present state value answers even
        // when it is not a usable name, and null means neither is present.
        function read(state, stateKey, hintKey) {
          if (state && state[stateKey] != null) {
            return state[stateKey];
          }
          try {
            return localStorage.getItem(hintKey);
          } catch (e) {
            return null;
          }
        }

        var state = null;
        try {
          state =
            window.vscode && typeof window.vscode.getState === 'function'
              ? window.vscode.getState()
              : null;
        } catch (e) {}
        var theme = read(state, 'theme-v2', 'ptah-theme-v2');
        if (theme != null) {
          if (!known(theme)) theme = null;
        } else {
          var legacy = read(state, 'theme', 'ptah-theme');
          theme = known(legacy)
            ? has(DARK, legacy)
              ? 'ptah-glass'
              : 'ptah-glass-light'
            : null;
        }

        var accent = state && state['ptah-accent'];
        if (!has(ACCENT, accent)) {
          try { accent = localStorage.getItem('ptah-accent'); } catch (e) {}
        }
        if (accent === 'rose' || accent === 'moonstone') {
          document.documentElement.setAttribute('data-accent', accent);
        }

        var scene = state && state['ptah-scene'];
        if (SCENE.split(' ').indexOf(scene) === -1) {
          try { scene = localStorage.getItem('ptah-scene'); } catch (e) {}
        }
        if ((scene === 'ember' || scene === 'tide' || scene === 'horizon') &&
            (!theme || theme === 'ptah-glass' || theme === 'ptah-glass-light')) {
          document.documentElement.setAttribute('data-scene', scene);
        }

        // Nothing persisted, or an unrecognised value: leave the
        // <html data-theme="ptah-glass"> default in place and fetch nothing.
        if (!theme) return;
        if (has(EAGER, theme)) {
          apply(theme);
          return;
        }
        if (!has(DEFERRED, theme)) return;

        apply(theme);

        var marker = document.getElementById('ptah-theme-extra');
        if (!marker) return;
        var sheet = document.createElement('link');
        sheet.id = 'ptah-theme-extra-sheet';
        sheet.rel = 'stylesheet';
        // Explicit render-blocking (Chromium 105+). Head-inserted stylesheets
        // block rendering anyway while the parser is active; this states it.
        sheet.setAttribute('blocking', 'render');
        sheet.href = marker.href;
        // ORDER CONTRACT: the deferred sheet must sit BEFORE styles.css.
        // Both sheets carry (0,1,0) selectors, so order alone decides. The
        // deferred sheet leads with daisyUI's `:root` copy of the `light`
        // theme; styles.css must come after it to win back `anubis` and
        // `anubis-light` via their own `[data-theme=...]` blocks. Keep this in
        // step with ThemeService.insertDeferredSheet.
        //
        // Nothing has been inserted at this point in the parse, so this
        // appends — the build's styles.css link lands after it either way.
        var firstSheet = document.head.querySelector('link[rel="stylesheet"]');
        if (firstSheet) {
          document.head.insertBefore(sheet, firstSheet);
        } else {
          document.head.appendChild(sheet);
        }
      })();
    </script>
  </head>
  <body>
    <ptah-root></ptah-root>
  </body>
</html>
