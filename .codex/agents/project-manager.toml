## 🔍 Project-Specific Investigation Strategy

**Detected Project Type**: Nx 22 monorepo — multi-tenant real-estate CRM with a NestJS 11 backend, three Angular 21 SPAs (admin/tenant/saas), a storybook workbench, and an AI agent layer (LangChain/LangGraph + Composio + Memgraph). 3,451 tracked files across `apps/` and scoped `libs/`.

### Investigation entry points (in order)

1. **Start with the architecture contract, not the code.** Read `ARCHITECTURE_CONTRACT.md` and root `CLAUDE.md` first — they are the locked source of truth. The `.nitro/` directory (`profile.md`, `architecture.md`, `conventions.md`, `data-model.md`, `security.md`) holds domain-specific reference. Any task touching boundaries, imports, or enums must be validated against these before planning.
2. **Resolve scope before touching libs.** Every lib carries exactly one `scope:` + one `type:` tag in its `project.json`. The dependency matrix in `CLAUDE.md` is enforced by `@nx/enforce-module-boundaries`. Before proposing a change, confirm source→target scope is legal (e.g. `scope:api` may target `api`, `shared-server`, `shared`, `common` only) — a boundary violation is the most common plan-breaker here.
3. **Trace the data path through the ORM source of truth.** Enums and Prisma types come solely from `@pro-estate/common/data-access-orm` (re-exported Prisma client + 11 `.zmodel` ZenStack schemas under `libs/common/data-access-orm/schemas`). Never read enums from `@pro-estate/common/models` (interfaces only). If a field looks missing, run `npm run db:generate` before assuming it doesn't exist.
4. **Frontend tasks: follow the enforced UI contract.** Angular libs must wrap `eslint.angular.cjs` and enforce signals-first rules as errors (`input()`/`viewChild()`/`model()`, OnPush, `@if`/`@for`). All form inputs go through `@pro-estate/shared/client/ui` (`<ph-form-field>`, `<ph-labeled-input>`, `<ph-select>`). All HTTP via `BaseApiService` — the only `HttpClient` holder. All strings via Transloco keys, feedback via `ToastService`. The admin command-center look is built from `<ph-card appearance=\"command\">`, `<ph-stat-card>`, `<ph-page-header>` — legacy `.admin-*` utility classes trigger ESLint errors.
5. **Backend tasks: respect the DI and tenancy rules.** Every NestJS constructor param needs an explicit `@Inject(...)` — implicit injection deadlocks module init silently. Multi-tenant queries must filter by `organizationId`; raw `prisma.xxx.findMany()` without a tenant filter is a defect. ZenStack `enhance()` is the cross-tenant policy backstop (active per recent commits).
6. **AI/agent tasks: a separate subsystem.** The LangGraph stack (`@langchain/langgraph ^1.3.2`, Postgres checkpoint), `deepagents`, Composio tools, `@a2ui/angular` generative UI, and Memgraph graph memory live alongside the CRM domains — treat the voice-agent branch work as its own investigation track, not a standard NestJS domain.

### Verification before plan approval
- `npm run lint:all` + `npm run typecheck` (boundary + signals enforcement)
- `npm run db:generate` if the task touches Prisma/ZenStack
- Check `tsconfig.base.json` paths — new libs must register there or imports fail

