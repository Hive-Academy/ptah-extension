## 📝 Detected Code Conventions

Based on analysis of the NestJS 11 + Prisma 6 + ZenStack 2 backend in this Nx monorepo:

- **TypeScript `strict: true`**, `target`/`lib` ES2021, `experimentalDecorators` + `emitDecoratorMetadata` on, `moduleResolution: node`. Workspace compiles at 0 errors / 0 warnings — keep it that way; `npm run typecheck` runs across all projects.
- **Explicit `@Inject(...)` on every constructor param** (non-negotiable — see the NestJS DI note in `CLAUDE.md`). Implicit injection silently deadlocks here.
- **Import paths are the authoritative `tsconfig.base.json` paths.** Use `@pro-estate/...` aliases, never relative paths that cross lib boundaries. Re-export enums and `PrismaService` from `@pro-estate/common/data-access-orm`.
- **Consistent response envelope** `{ success, data, meta }` and structured errors `{ code, i18nKey, ... }`. Error codes map to Transloco keys **only** on the frontend `BaseApiService` — backend returns the key, never a hard-coded user-facing string.
- **Validation via class-validator** on all DTOs; use `@nestjs/mapped-types` for derivation. Never trust inbound payload shapes.
- **Security primitives are non-negotiable:** SSRF guard with DNS re-validation at delivery (`webhook.service.ts`), `timingSafeEqual` HMAC with pre-compare length check (`zernio-webhook.controller.ts`), server-side HTML/CSS sanitization (`sanitize-html`, `dompurify`, `@noble/ciphers`), and JWT as `Authorization: Bearer` (not cookies — if that changes, add CSRF first).
- **Testing:** Jest 29 / ts-jest for backend (`*.spec.ts`); ~98 spec files under `libs/api` covering access-scoping and agent security. Use `supertest` + `@nestjs/testing` for HTTP-level tests. Run `npm run test:all` (or `:affected`); `npm run quality` = lint + typecheck + test.
- **Commits follow `@commitlint/config-conventional`** (`feat(api):`, `fix(api):`, `refactor(web):`); husky + lint-staged gate staged files. Match the observed style in `git log`.
- **No silent catch blocks.** Parse/import errors return structured i18n error keys (e.g. `leads.import.error.parseError`), never swallowed.
- **Reference the skills** `nestjs-backend-patterns`, `resilient-nestjs-patterns`, `webhook-architecture`, and `saas-platform-patterns` before wiring providers, retries, inbound webhooks, or subscription/license flows.

