## NestJS Best Practices

**Detected Framework**: NestJS 11.1.23 on TypeScript 5.9 and Node.js 24

### Framework-Specific Patterns

- Keep the API bootstrap aligned with `apps/api/src/main.ts`: global `/api` prefix, `ValidationPipe` with `transform`, `whitelist`, and `forbidNonWhitelisted`, plus centralized Helmet, CORS allowlisting, compression, and rate limiting.
- Add every backend capability as an Nx library under `libs/api/<domain>` with `scope:api`, `domain:<domain>`, and the appropriate type tag. Compose modules in `apps/api/src/app/app.module.ts`; keep the app thin.
- Decorate **every** NestJS constructor parameter with explicit `@Inject(...)`. Implicit class-typed injection is prohibited because metadata emission can cause silent Nest 11 initialization failures.
- Use `PrismaService` from `@pro-estate/common/data-access-orm`; database enums must come from the same package. Apply ZenStack policies and explicitly scope all tenant data operations by `organizationId`.
- Share request and response types through `libs/shared/contracts/**`; backend DTOs should implement or import those contracts rather than redeclare them. Return the standard `{ success, data, meta }` envelope and structured errors containing `code` and `i18nKey`.
- Move durable asynchronous work and retries to Bull/Redis. Do not detach network delivery with `void` or sleep inside API processes; persist jobs, retry state, and idempotency keys.
- For public webhook ingress, verify signatures with timing-safe comparison, preserve the raw body, resolve the tenant before marking an event complete, and return retryable failures when processing is incomplete.
- Use `nestjs-backend-patterns` for Prisma, ZenStack, tenancy, authentication, and provider work; use `resilient-nestjs-patterns` for orchestration, retries, events, and dynamic modules; use `webhook-architecture` for inbound webhook changes.

