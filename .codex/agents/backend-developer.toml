## 🏗️ Project Architecture Guidance

**Detected Architecture**: Nx 22 scoped monorepo with machine-enforced module boundaries — 5 apps (`api`, `admin`, `tenant`, `saas`, `storybook`) and scoped libs (`api`, `admin`, `tenant`, `saas`, `shared`, `shared-client`, `common`, `shared-server`). `ARCHITECTURE_CONTRACT.md` is the locked source of truth.

### Guidance

- **Respect the scope dependency matrix.** `scope:api` may import only `api`, `shared-server`, `shared`, `common`. Boundaries are enforced by `@nx/enforce-module-boundaries` — violations fail the build. Every lib carries exactly one scope + one type tag (`feature`, `data-access`, `util`, `model`, `auth`, `ui`).
- **Backend domain modules live in `libs/api/<domain>`** (`leads`, `properties`, `projects`, `organizations`, `auth`, `email`, `analytics`, `audit`, `social-posts`, `storage`, `public`, `ai-agent`, `social-webhooks`), each tagged `scope:api, domain:<x>, type:feature`. Shared backend utilities (interceptors, filters, pipes, events, queues) live in `@pro-estate/api/util` (`scope:api, type:util`).
- **Contracts are TYPES ONLY.** Request/response shapes live in `libs/shared/contracts/**` (server-safe) or `libs/shared/client/contracts/**` (frontend). Backend DTOs and frontend types must import the same contract — never re-declare a shape. No Angular, no Nest, no runtime logic in contracts.
- **Multi-tenant queries must filter by `organizationId`.** Never write raw `prisma.xxx.findMany()` without a tenant filter; rely on ZenStack policies + the CLS-stamped backstop.
- **Decompose god-services before extending them.** `leads.service.ts` (2,663 lines) owns CRUD, scoring, comments, imports, exports — extract `LeadScoringService`, `LeadImportService`, `LeadCommentsService` as collaborators. `agent.service.ts` (1,862 lines) is a fan-out orchestrator; keep its tools in `tools/*.tools.ts` and push model-wiring/policy-hash logic out. Controller-Service-DbService layering (per `resilient-nestjs-patterns`) is the target shape.
- **Adding a new API domain:** `nx g @nx/nest:library --name=x --directory=libs/api/x --tags=scope:api,domain:x,type:feature --importPath=@pro-estate/api/x`, then register the path in `tsconfig.base.json` and import the module in `apps/api/src/app/app.module.ts`.
- **AI-agent subsystem** uses LangChain/LangGraph (`@langchain/core ^1.1.47`, `@langchain/langgraph ^1.3.2`) with Postgres checkpointing and a Memgraph/neo4j graph-memory store. Loosely-typed `as never` Prisma `where` casts in the tool layer are known debt — prefer typed `Prisma.WhereInput` when adding tools.

