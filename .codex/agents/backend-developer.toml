## 🚀 NestJS 11 Best Practices

**Detected Framework**: NestJS 11.x (Express adapter, port 3000) on Node 24, inside an Nx 22 monorepo.

### Framework-Specific Patterns

- **Explicit `@Inject(...)` on every constructor parameter.** This codebase has a TS metadata-emission issue that makes implicit class-typed injection silently fail, and mixing implicit + explicit params on sibling params deadlocks Nest 11 module init with no error. Always decorate `PrismaService`, `EventEmitter2`, `ConfigService`, and every sibling service — never rely on `design:paramtypes`.
- **ZenStack 2 as the access-control layer.** Prisma is wrapped by `@zenstackhq/runtime` enhancements; `@pro-estate/common/data-access-orm` is the **single source of truth** for Prisma models, enums (`MembershipRole`, `LeadStatus`, `PropertyType`), and `PrismaService`. Import enums from there — never from `@pro-estate/common/models`. ZenStack `enhance()` is now an active cross-tenant policy backstop (recent commits `889d4ed2`, `fdbd70ca`); system listeners are stamped with the org-owner CLS context.
- **nestjs-cls for request/tenant context.** Async context is propagated via `nestjs-cls ^4.0.0`. Use it to carry `organizationId` and the authenticated user rather than threading them through every call.
- **Bull queues + EventEmitter2 for side-effects.** `@nestjs/bull` on Redis 7 for jobs; `@nestjs/event-emitter` for in-process domain events (`DOMAIN_EVENTS`, `QUEUE_NAMES` come from `@pro-estate/api/util`). Fire-and-forget dispatch must never block the request thread (see the resilient delivery pattern in `webhook.service.ts`).
- **class-validator + class-transformer on every DTO.** Validation is mandatory at controller boundaries; the response envelope is `{ success, data, meta }` with structured errors `{ code, i18nKey, ... }`.
- **Raw SQL is always Prisma tagged-template `$queryRaw`.** Parameterized by construction — the two raw-count sites in `agent.service.ts` (`:1147`, `:1329`) are safe; never build SQL by string concatenation.
- **Webhook security is fail-closed.** Outgoing SSRF guard (`webhook.service.ts:427–480`) re-validates URLs at delivery time with `maxRedirects: 0`; inbound HMAC (`zernio-webhook.controller.ts:221–261`) uses `timingSafeEqual` with a length check before compare and rejects missing secrets in production.
- **Use the `nestjs-backend-patterns` and `resilient-nestjs-patterns` skills** for provider/DbService/Controller layering, retry with backoff, and dynamic `forRoot` modules.

