## Detected Code Conventions

Based on analysis of the Property Hub Nx monorepo:

- Write strict TypeScript targeting ES2021. Avoid `any`, unchecked non-null assertions, broad casts, and duplicated DTO shapes; keep generated integration types intact.
- Use repository aliases such as `@pro-estate/api/*`, `@pro-estate/common/*`, and `@pro-estate/shared/contracts/*`; do not bypass a library public entry point with deep imports.
- Name backend files using NestJS conventions: `*.module.ts`, `*.controller.ts`, `*.service.ts`, `*.guard.ts`, `*.dto.ts`, and colocated `*.spec.ts`.
- Add explicit `@Inject(...)` to every constructor parameter in providers, controllers, and guards, including `PrismaService`, `ConfigService`, and `EventEmitter2`.
- Import Prisma types, generated enums, and `PrismaService` from `@pro-estate/common/data-access-orm`. Use `@pro-estate/common/models` only for interfaces such as `IUserContext`.
- Scope tenant-owned Prisma operations by `organizationId`. Preserve access-policy checks and never introduce an unscoped `findMany`, aggregate, relation lookup, update, or delete.
- Validate external input with `class-validator` and explicit transformation where needed. Prefer explicit `@Type()` conversion over relying on global implicit conversion.
- Return the standard success envelope and structured errors. Do not expose raw provider errors, secrets, tokens, internal URLs, or unbounded response bodies.
- For outbound HTTP, use finite timeouts, disabled redirects where SSRF-sensitive, public-address DNS validation, bounded response capture, and durable queue retries. For inbound webhooks, require signature verification and idempotent processing.
- Match the existing test split: Jest for NestJS units, Supertest/API E2E under `apps/api`, and focused regression tests for tenant isolation, authorization, webhook retry/idempotency, and failure paths.
- Run affected lint, typecheck, and tests through Nx before completion; use the full `npm run quality` or `npm run test:e2e` when the change crosses shared contracts or infrastructure.

