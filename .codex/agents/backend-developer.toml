## Project Architecture Guidance

**Detected Architecture**: Domain-oriented Nx monorepo with layered NestJS libraries, shared contracts, Prisma/ZenStack persistence, and event/queue infrastructure

- Treat `ARCHITECTURE_CONTRACT.md` as authoritative. Preserve Nx scope and type boundaries enforced by `@nx/enforce-module-boundaries`.
- Backend features belong in `libs/api/**`; cross-cutting persistence, configuration, storage, models, social integrations, and Zernio clients belong in `libs/common/**`. Cross-runtime API shapes belong in `libs/shared/contracts/**` and must contain types only.
- Respect the technical layer graph: feature libraries may use feature, data-access, util, model, and auth libraries; data-access may use data-access, util, and model; model libraries have no dependencies.
- Keep controllers focused on transport validation and authorization. Put workflows in focused services and persistence behind clear data-access boundaries. Avoid expanding existing god units such as `LeadsService` or `ZernioClient`; extract by business responsibility when directly required by the task.
- Define transaction boundaries around state transitions. Emit domain events only after successful persistence, and use Bull for restart-safe retries and horizontally coordinated background processing.
- Treat tenancy as an invariant: every organization-owned read, write, aggregate, relation lookup, queue payload, and webhook resolution must carry and validate `organizationId`.
- Keep integrations behind providers with typed request/response boundaries. Do not weaken generated OpenAPI clients with `as any`; validate external data and map it into shared contracts.
- Invoke `orchestration` for every implementation task. Use `nx-workspace-architect` for library placement or boundary changes, `ddd-architecture` when introducing bounded contexts or aggregates, and `nestjs-deployment` for container or production-hardening work.

