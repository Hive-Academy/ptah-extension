<!doctype html>
<!--
  G18 — cut through the hype.
  Hand-authored for builder-invitation, timeline 12:44.4-13:03.4 (19.0 s).
  Structure, palette handling and timeline discipline follow the worked
  example at ../../g02-two-paths/compositions/two-paths.html.

  SIDE PANEL, not a takeover. The speaker sits centre-right and must stay
  visible, so every painted pixel lives inside one opaque --ink card at
  x 90-845, y 280-611 in state one and y 280-702 in state two. The right 54%
  of frame (x >= 883) is never touched: the card's drop shadow uses a
  negative spread, so its right extent is 845 - 24 + 22 = 843, and its
  lowest bottom extent is 702 + 26 - 24 + 22 = 726, clear of the 186px
  caption band that starts at y 894.

  The A-roll behind the left third is an orange wall, so --amber never
  carries meaning here. The headline leads with --text-strong and the one
  accent is --emerald.

  SYNC CONTRACT — timeline seconds minus 764.4 gives local time:
    "software developers ... vibe coded tools"  765.50-773.36 -> 1.10-8.96
    "والhype" (the hype)                        777.38        -> 12.98

  Two states only. State one is the statement of intent, landing on
  "software developers". State two is the payoff on "hype": an --emerald
  rule cuts through the word and the supporting line arrives under it.
  Everything between 2.0 and 12.98 is a deliberate, motionless hold.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Cut through the hype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div
      id="cut-the-hype"
      data-composition-id="cut-the-hype"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="19"
    >
      <div class="card">
        <div class="bar"></div>
        <p class="eyebrow">Build it with me</p>

        <h1 class="headline">
          <span class="line">Cut through</span>
          <span class="line"
            >the <span class="hype-word">hype<span class="strike"></span></span
            >.</span
          >
        </h1>

        <!-- Deliberately clipped by the card until the card grows at 12.98. -->
        <div class="footer" data-layout-allow-overflow>
          <div class="footer-rule"></div>
          <p class="support">Show the truth. Show the work.</p>
        </div>
      </div>

      <style>
        [data-composition-id="cut-the-hype"] {
          --ink: #08090c;
          --ink-raised: #0e1015;
          --amber: #f5a524;
          --amber-light: #ffbb4d;
          --amber-deep: #c97e0e;
          --emerald: #34d399;
          --emerald-light: #6ee7b7;
          --text-strong: #ffffff;
          --text-soft: rgba(255, 255, 255, 0.72);
          --text-faint: rgba(255, 255, 255, 0.45);
          --grid: rgba(255, 255, 255, 0.08);
          --card-border: rgba(255, 255, 255, 0.13);
          --shadow: rgba(0, 0, 0, 0.72);

          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
        }

        /* The ONLY opaque surface. x 90-845, y 280-714. The shadow's
           negative spread keeps its right extent at 843, safely inside the
           transparent right 54% (x >= 883), and its bottom extent at 738,
           clear of the caption band (y >= 894). */
        [data-composition-id="cut-the-hype"] .card {
          position: absolute;
          left: 90px;
          top: 280px;
          width: 755px;
          /* State one is sized to its content exactly, so there is no
             reserved hole under the headline during the 11 s hold. At 12.98
             the card grows to 422px to make room for the supporting line —
             overflow is hidden so the footer is clipped until then, and
             every child is flex:none so none of them shrink to fit. */
          height: 331px;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          padding: 40px 44px 38px;
          border-radius: 26px;
          border: 1px solid var(--card-border);
          background:
            radial-gradient(120% 80% at 18% 0%, var(--ink-raised) 0%, var(--ink) 68%),
            var(--ink);
          box-shadow: 0 26px 44px -24px var(--shadow);
          opacity: 0;
        }

        [data-composition-id="cut-the-hype"] .bar {
          flex: none;
          width: 78px;
          height: 6px;
          border-radius: 3px;
          background: var(--emerald);
          transform-origin: left center;
          transform: scaleX(0);
        }

        [data-composition-id="cut-the-hype"] .eyebrow {
          flex: none;
          margin-top: 26px;
          font-size: 23px;
          font-weight: 600;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: var(--text-faint);
          white-space: nowrap;
          opacity: 0;
        }

        [data-composition-id="cut-the-hype"] .headline {
          flex: none;
          margin-top: 26px;
          font-size: 76px;
          font-weight: 800;
          line-height: 1.1;
          letter-spacing: -0.018em;
          color: var(--text-strong);
        }

        [data-composition-id="cut-the-hype"] .line {
          display: block;
          white-space: nowrap;
          opacity: 0;
        }

        /* The emphasis target. inline-block so it can be scaled, and the
           strike rule is a child so it scales with the word. */
        [data-composition-id="cut-the-hype"] .hype-word {
          position: relative;
          display: inline-block;
          transform-origin: left center;
        }

        [data-composition-id="cut-the-hype"] .strike {
          position: absolute;
          left: -6px;
          right: -6px;
          top: 52%;
          height: 7px;
          border-radius: 4px;
          background: var(--emerald);
          transform-origin: left center;
          transform: scaleX(0);
        }

        [data-composition-id="cut-the-hype"] .footer {
          flex: none;
          margin-top: 30px;
        }

        [data-composition-id="cut-the-hype"] .footer-rule {
          height: 1px;
          background: var(--card-border);
          transform-origin: left center;
          transform: scaleX(0);
        }

        [data-composition-id="cut-the-hype"] .support {
          margin-top: 24px;
          font-size: 30px;
          font-weight: 600;
          letter-spacing: -0.01em;
          color: var(--text-soft);
          white-space: nowrap;
          opacity: 0;
        }
      </style>

      <script>
        (function () {
          const ROOT = '[data-composition-id="cut-the-hype"]';
          const root = document.querySelector(ROOT);
          const qa = (sel) => Array.from(root.querySelectorAll(sel));
          const tl = gsap.timeline({ paused: true });

          // Every entrance is an explicit fromTo with immediateRender:false,
          // so no later tween can stamp its start value at build time and the
          // timeline stays correct under non-linear seeking. Nothing is
          // measured, at build time or inside a callback.
          const enter = (target, from, to, at) => {
            tl.fromTo(
              target,
              Object.assign({ opacity: 0 }, from),
              Object.assign(
                { opacity: 1, duration: 0.45, ease: "power2.out", immediateRender: false },
                to,
              ),
              at,
            );
          };

          const lines = qa(".line");

          // ---- STATE ONE ------------------------------------------------
          // 0.00-0.50 — the panel pushes in from the left edge.
          enter(
            `${ROOT} .card`,
            { x: -46, scale: 0.985 },
            { x: 0, scale: 1, duration: 0.5, ease: "power3.out" },
            0,
          );
          tl.fromTo(
            `${ROOT} .bar`,
            { scaleX: 0 },
            { scaleX: 1, duration: 0.5, ease: "power3.out", immediateRender: false },
            0.22,
          );
          enter(`${ROOT} .eyebrow`, { y: -10 }, { y: 0, duration: 0.4 }, 0.34);

          // 1.10 — "software developers ... vibe coded tools". The statement
          // of intent lands on the phrase it belongs to.
          lines.forEach((el, i) =>
            enter(el, { y: 22 }, { y: 0, duration: 0.55, ease: "power3.out" }, 1.1 + i * 0.16),
          );

          // 2.0-12.98 — held. No motion at all. This is the confident hold.

          // ---- STATE TWO ------------------------------------------------
          // 12.98 — "والhype". The rule cuts through the word, the word takes
          // a small pop, and the supporting line arrives under it.
          const H = 12.98;
          // The card earns its extra height rather than reserving it.
          tl.fromTo(
            `${ROOT} .card`,
            { height: 331 },
            { height: 422, duration: 0.55, ease: "power3.out", immediateRender: false },
            H,
          );
          tl.fromTo(
            `${ROOT} .strike`,
            { scaleX: 0 },
            { scaleX: 1, duration: 0.42, ease: "power3.inOut", immediateRender: false },
            H,
          );
          tl.fromTo(
            `${ROOT} .hype-word`,
            { scale: 1 },
            { scale: 1.045, duration: 0.2, ease: "power2.out", immediateRender: false },
            H,
          );
          tl.fromTo(
            `${ROOT} .hype-word`,
            { scale: 1.045 },
            { scale: 1, duration: 0.42, ease: "power2.inOut", immediateRender: false },
            H + 0.2,
          );
          tl.fromTo(
            `${ROOT} .footer-rule`,
            { scaleX: 0 },
            { scaleX: 1, duration: 0.62, ease: "power2.inOut", immediateRender: false },
            H + 0.22,
          );
          enter(`${ROOT} .support`, { y: 14 }, { y: 0, duration: 0.5 }, H + 0.4);

          // 13.9-17.70 — the second hold, then the panel releases the frame.
          // Exit completes at 18.40, clear of the 19.00 s slot end.
          tl.fromTo(
            `${ROOT} .card`,
            { opacity: 1, x: 0, scale: 1 },
            {
              opacity: 0,
              x: -34,
              scale: 0.99,
              duration: 0.7,
              ease: "power2.in",
              immediateRender: false,
            },
            17.7,
          );

          tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines["cut-the-hype"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
