<!doctype html>
<!--
  G13 — one harness, every provider.
  Hand-authored for builder-invitation, timeline 7:40.2-7:58.0 (17.8 s).
  Palette handling and timeline discipline follow the worked example at
  ../../g10-saas-chips/compositions/saas-chips.html.

  TREATMENT — overlay chips, NOT a takeover. There is no backdrop element at
  all: the screen capture underneath stays fully visible, and every card
  carries its own --ink fill plus a border so it is legible over any UI.
  No box-shadow anywhere — a soft shadow's outer reach would land inside the
  reserved caption band.

  LAYOUT CONTRACT
    x 0-470   webcam picture-in-picture  -> nothing may enter it
    y 894+    Arabic caption band (186px) -> nothing may enter it
    Usable band here: x 632-1700, y 560-848. Hard edges only, so those
    numbers are the true extents.

  SYNC CONTRACT — timeline seconds minus 460.2 gives local composition time:
    "Claude Code" (Whisper heard "cloud code")  462.75 -> 2.55
    "الانتي جرافيتي" / Antigravity              465.39 -> 5.19
    "وكوديكس" / and Codex                       467.88 -> 7.68
    "نفس الهارنس" / the same harness            472.54 -> 12.34
    The payoff at 12.34 draws stems down from all three chips into one rail
    and hangs the shared-setup card off it — the relationship, not a fourth
    chip. Hold, then the whole strip clears by 17.3, inside the 17.8 s slot.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Providers harness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div
      id="providers-harness"
      data-composition-id="providers-harness"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="17.8"
    >
      <div class="strip">
        <div class="chip chip-main" id="chip-claude">
          <span class="dot"></span>
          <span class="chip-text">Claude Code</span>
          <span class="tag">Main</span>
        </div>
        <div class="chip chip-alt" id="chip-antigravity">
          <span class="dot"></span>
          <span class="chip-text">Antigravity</span>
        </div>
        <div class="chip chip-alt" id="chip-codex">
          <span class="dot"></span>
          <span class="chip-text">Codex</span>
        </div>

        <!-- The binding element: three stems into one rail into one card. -->
        <span class="stem stem-1" id="stem-1"></span>
        <span class="stem stem-2" id="stem-2"></span>
        <span class="stem stem-3" id="stem-3"></span>
        <span class="rail" id="rail"></span>
        <span class="drop" id="drop"></span>

        <div class="payoff" id="payoff">
          <span class="payoff-mark"></span>
          <span class="payoff-text">One harness. One setup.</span>
        </div>
      </div>

      <style>
        [data-composition-id="providers-harness"] {
          --ink: #08090c;
          --ink-raised: #0e1015;
          --amber: #f5a524;
          --amber-light: #ffbb4d;
          --amber-deep: #c97e0e;
          --emerald: #34d399;
          --emerald-light: #6ee7b7;
          --text-strong: #ffffff;
          --text-soft: rgba(255, 255, 255, 0.72);
          --text-faint: rgba(255, 255, 255, 0.45);
          --grid: rgba(255, 255, 255, 0.08);
          --card-border: rgba(255, 255, 255, 0.22);

          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
        }

        /* The strip owns only its own band. No full-frame backdrop exists, so
           the screen capture underneath is never covered. x 632-1700,
           y 560-848 — clear of the webcam PiP and the caption band. */
        [data-composition-id="providers-harness"] .strip {
          position: absolute;
          left: 632px;
          top: 560px;
          width: 1068px;
          height: 288px;
        }

        [data-composition-id="providers-harness"] .chip {
          position: absolute;
          top: 0;
          height: 96px;
          display: inline-flex;
          align-items: center;
          gap: 16px;
          padding: 0 28px;
          border-radius: 18px;
          border: 2px solid var(--card-border);
          background: var(--ink);
          opacity: 0;
        }

        /* Fixed widths keep the stem x-positions deterministic — no DOM
           measurement anywhere in this composition. */
        [data-composition-id="providers-harness"] #chip-claude {
          left: 0;
          width: 420px;
        }

        [data-composition-id="providers-harness"] #chip-antigravity {
          left: 464px;
          width: 340px;
        }

        [data-composition-id="providers-harness"] #chip-codex {
          left: 848px;
          width: 220px;
        }

        [data-composition-id="providers-harness"] .chip-text {
          font-size: 38px;
          font-weight: 600;
          letter-spacing: -0.01em;
          color: var(--text-strong);
          white-space: nowrap;
        }

        [data-composition-id="providers-harness"] .dot {
          display: block;
          width: 16px;
          height: 16px;
          border-radius: 50%;
          flex: none;
        }

        /* The main brain reads amber and carries the only tag. */
        [data-composition-id="providers-harness"] .chip-main {
          border-color: var(--amber-deep);
          border-width: 3px;
        }

        [data-composition-id="providers-harness"] .chip-main .dot {
          background: var(--amber-light);
        }

        [data-composition-id="providers-harness"] .tag {
          margin-left: auto;
          font-size: 17px;
          font-weight: 700;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: var(--amber-light);
          border: 1px solid var(--amber-deep);
          border-radius: 7px;
          padding: 5px 10px;
          white-space: nowrap;
        }

        [data-composition-id="providers-harness"] .chip-alt .dot {
          background: var(--text-soft);
        }

        /* Stems fall from each chip's centre to the rail at y 150. */
        [data-composition-id="providers-harness"] .stem {
          position: absolute;
          top: 96px;
          width: 3px;
          height: 54px;
          margin-left: -1.5px;
          background: var(--emerald);
          transform: scaleY(0);
          transform-origin: 50% 0%;
        }

        [data-composition-id="providers-harness"] .stem-1 {
          left: 210px;
        }

        [data-composition-id="providers-harness"] .stem-2 {
          left: 634px;
        }

        [data-composition-id="providers-harness"] .stem-3 {
          left: 958px;
        }

        [data-composition-id="providers-harness"] .rail {
          position: absolute;
          left: 210px;
          top: 150px;
          width: 748px;
          height: 4px;
          border-radius: 2px;
          background: var(--emerald);
          transform: scaleX(0);
          transform-origin: 50% 50%;
        }

        [data-composition-id="providers-harness"] .drop {
          position: absolute;
          left: 584px;
          top: 154px;
          width: 3px;
          height: 42px;
          margin-left: -1.5px;
          background: var(--emerald);
          transform: scaleY(0);
          transform-origin: 50% 0%;
        }

        /* The payoff card: y 756-848 absolute, 46px clear of the caption
           band. */
        [data-composition-id="providers-harness"] .payoff {
          position: absolute;
          left: 314px;
          top: 196px;
          width: 540px;
          height: 92px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 18px;
          border-radius: 16px;
          border: 2px solid var(--emerald);
          background: var(--ink);
          opacity: 0;
        }

        [data-composition-id="providers-harness"] .payoff-mark {
          display: block;
          width: 8px;
          height: 30px;
          border-radius: 4px;
          background: var(--emerald-light);
          flex: none;
        }

        [data-composition-id="providers-harness"] .payoff-text {
          font-size: 34px;
          font-weight: 700;
          letter-spacing: -0.005em;
          color: var(--text-strong);
          white-space: nowrap;
        }
      </style>

      <script>
        (function () {
          const ROOT = '[data-composition-id="providers-harness"]';
          const tl = gsap.timeline({ paused: true });

          // `at` is the local composition second the speaker names the tool.
          const CHIPS = [
            { id: "chip-claude", at: 2.55 },
            { id: "chip-antigravity", at: 5.19 },
            { id: "chip-codex", at: 7.68 },
          ];

          // Each chip lands ON its word. Explicit fromTo everywhere — every
          // element enters late, so gsap.from() would be unsafe under seek.
          CHIPS.forEach((chip) => {
            const el = document.getElementById(chip.id);
            tl.fromTo(
              el,
              { opacity: 0, y: 20, scale: 0.94 },
              {
                opacity: 1,
                y: 0,
                scale: 1,
                duration: 0.42,
                ease: "back.out(1.7)",
                immediateRender: false,
              },
              chip.at,
            );
            tl.fromTo(
              el.querySelector(".dot"),
              { scale: 0 },
              { scale: 1, duration: 0.34, ease: "back.out(2.6)", immediateRender: false },
              chip.at + 0.08,
            );
          });

          // The MAIN tag arrives a beat after its chip so "main brain" reads
          // as a claim about Claude Code, not as part of the chip's shape.
          tl.fromTo(
            `${ROOT} .tag`,
            { opacity: 0, scale: 0.7 },
            {
              opacity: 1,
              scale: 1,
              duration: 0.3,
              ease: "back.out(2)",
              immediateRender: false,
            },
            2.9,
          );

          // 12.34 — "the same harness". The payoff: stems drop out of all
          // three chips, one rail joins them, one card hangs beneath it.
          tl.fromTo(
            [`${ROOT} .stem-1`, `${ROOT} .stem-2`, `${ROOT} .stem-3`],
            { scaleY: 0 },
            {
              scaleY: 1,
              duration: 0.34,
              ease: "power2.out",
              stagger: 0.07,
              immediateRender: false,
            },
            12.34,
          );

          tl.fromTo(
            `${ROOT} .rail`,
            { scaleX: 0 },
            { scaleX: 1, duration: 0.55, ease: "power3.out", immediateRender: false },
            12.56,
          );

          tl.fromTo(
            `${ROOT} .drop`,
            { scaleY: 0 },
            { scaleY: 1, duration: 0.26, ease: "power2.out", immediateRender: false },
            12.98,
          );

          tl.fromTo(
            `${ROOT} .payoff`,
            { opacity: 0, y: 16, scale: 0.95 },
            {
              opacity: 1,
              y: 0,
              scale: 1,
              duration: 0.46,
              ease: "back.out(1.6)",
              immediateRender: false,
            },
            13.14,
          );

          // Hold on the bound set through 16.6, then clear the band by 17.3
          // so the 17.8 s slot ends on empty frames.
          tl.fromTo(
            `${ROOT} .strip`,
            { opacity: 1, y: 0 },
            { opacity: 0, y: -14, duration: 0.7, ease: "power2.in", immediateRender: false },
            16.6,
          );

          tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines["providers-harness"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
