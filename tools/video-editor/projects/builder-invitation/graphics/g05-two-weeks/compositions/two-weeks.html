<!doctype html>
<!--
  G05 — the invitation.
  Hand-authored. No registry block: the piece is three type elements on a
  vertical seam, which no block models. Structure, palette handling and
  timeline discipline follow g08-free-open-source/compositions/
  free-open-source.html (itself after g07-degradation-curve).

  Full-frame takeover for builder-invitation, timeline 2:13.0-2:28.3 (15.3 s).
  Sits over screen capture (near-black), so --amber is safe.
  The bottom 186px is reserved for Arabic captions and stays empty.

  The metaphor is a door opening, not a pitch: a vertical seam draws down the
  left edge of the column, the invitation slides out of it, and each promise
  swings open behind it as a left-to-right wipe.

  Word anchors (local seconds = timeline seconds - 133.0):
     1.78   "ادعو الناس"        — I invite people
     4.32   "trial"
     7.56   "اسبوعين"           — two weeks
     9.42   "SaaS application"
    12.12   "agentic harness"

  Three elements only, because 15.3 s of takeover cannot carry a fourth:
    1. the invitation line      (1.60-2.15)
    2. TWO WEEKS. / ONE SAAS.   (7.56 / 9.42)
    3. what is shared           (12.12)
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Two weeks, one SaaS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div
      id="two-weeks"
      data-composition-id="two-weeks"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="15.3"
    >
      <div class="backdrop"></div>

      <div class="scene-content">
        <div class="stage">
          <span class="seam"></span>

          <div class="column">
            <p class="invite">Come build one with me.</p>

            <div class="promise">
              <h1 class="promise-a">TWO WEEKS.</h1>
              <h1 class="promise-b">ONE SAAS.</h1>
              <span class="promise-rule"></span>
            </div>

            <div class="shared">
              <p class="shared-line shared-line-1">
                <span class="tick"></span>
                <span class="shared-text">One workflow.</span>
              </p>
              <p class="shared-line shared-line-2">
                <span class="tick"></span>
                <span class="shared-text">One agentic harness.</span>
              </p>
            </div>
          </div>
        </div>
      </div>

      <style>
        [data-composition-id="two-weeks"] {
          --ink: #08090c;
          --ink-raised: #0e1015;
          --amber: #f5a524;
          --amber-light: #ffbb4d;
          --amber-deep: #c97e0e;
          --emerald: #34d399;
          --emerald-light: #6ee7b7;
          --text-strong: #ffffff;
          --text-soft: rgba(255, 255, 255, 0.72);
          --text-faint: rgba(255, 255, 255, 0.45);
          --grid: rgba(255, 255, 255, 0.08);

          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
        }

        [data-composition-id="two-weeks"] .backdrop {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(105% 80% at 24% 34%, var(--ink-raised) 0%, var(--ink) 62%),
            var(--ink);
          opacity: 0;
        }

        /* Vertical budget: 156 top + 646 stage = 802, then 92 of slack before
           the 186px caption band at y=894. Nothing enters the band.
           Horizontal budget: 1920 - 400 padding = 1520 = 6 seam + 58 gap +
           1456 column. The widest line, TWO WEEKS. at 168px/800, measures
           ~1000px, so the column never has to shrink.
           Column stations, used as the seam's scaleY stops:
             invite bottom  ~150 -> 0.23
             TWO WEEKS      ~275 -> 0.43
             ONE SAAS+rule  ~490 -> 0.76
             shared         ~646 -> 1.00 */
        [data-composition-id="two-weeks"] .scene-content {
          position: relative;
          width: 100%;
          height: 100%;
          padding: 156px 200px 186px;
        }

        [data-composition-id="two-weeks"] .stage {
          display: flex;
          align-items: flex-start;
          gap: 58px;
          height: 646px;
        }

        /* The door edge. It draws downward before anything else appears, then
           opens further each time a new element lands, so it is never a long
           lonely rule beside one line of type. Its scaleY stops are the
           column's own vertical stations — see the timeline. Every seam tween
           after the first carries `immediateRender: false`: five fromTo()s on
           one element all resolve their from-values at build time otherwise,
           and the last one authored wins, which showed the seam fully open at
           t=0.8 before its first tween had started. */
        [data-composition-id="two-weeks"] .seam {
          flex: none;
          display: block;
          width: 6px;
          height: 646px;
          border-radius: 3px;
          background: linear-gradient(
            180deg,
            var(--amber) 0%,
            var(--amber-deep) 62%,
            rgba(201, 126, 14, 0) 100%
          );
          transform-origin: 50% 0%;
          transform: scaleY(0);
        }

        [data-composition-id="two-weeks"] .column {
          flex: none;
          width: 1456px;
        }

        /* ---- 1. the invitation ----------------------------------------- */

        [data-composition-id="two-weeks"] .invite {
          font-size: 52px;
          font-weight: 500;
          line-height: 1.1;
          letter-spacing: -0.005em;
          color: var(--text-soft);
          white-space: nowrap;
          opacity: 0;
        }

        /* ---- 2. the promise -------------------------------------------- */

        [data-composition-id="two-weeks"] .promise {
          margin-top: 42px;
        }

        [data-composition-id="two-weeks"] .promise-a,
        [data-composition-id="two-weeks"] .promise-b {
          font-size: 168px;
          font-weight: 800;
          line-height: 1.04;
          letter-spacing: -0.045em;
          white-space: nowrap;
          clip-path: inset(0 100% 0 0);
        }

        [data-composition-id="two-weeks"] .promise-a {
          color: var(--text-strong);
        }

        [data-composition-id="two-weeks"] .promise-b {
          color: var(--amber);
        }

        [data-composition-id="two-weeks"] .promise-rule {
          display: block;
          margin-top: 30px;
          width: 0;
          height: 8px;
          border-radius: 4px;
          background: var(--amber);
        }

        /* ---- 3. what is shared ------------------------------------------ */

        [data-composition-id="two-weeks"] .shared {
          margin-top: 40px;
          display: flex;
          flex-direction: column;
          gap: 14px;
        }

        [data-composition-id="two-weeks"] .shared-line {
          display: flex;
          align-items: center;
          gap: 24px;
          opacity: 0;
        }

        [data-composition-id="two-weeks"] .tick {
          flex: none;
          display: block;
          width: 30px;
          height: 5px;
          border-radius: 3px;
          background: var(--emerald);
          transform-origin: 0% 50%;
          transform: scaleX(0);
        }

        [data-composition-id="two-weeks"] .shared-text {
          font-size: 44px;
          font-weight: 500;
          line-height: 1.2;
          letter-spacing: -0.005em;
          color: var(--text-soft);
          white-space: nowrap;
        }
      </style>

      <script>
        (function () {
          const ROOT = '[data-composition-id="two-weeks"]';
          const tl = gsap.timeline({ paused: true });

          // ---- 0.0-2.2 : the door opens ---------------------------------
          tl.fromTo(
            `${ROOT} .backdrop`,
            { opacity: 0 },
            { opacity: 1, duration: 0.7, ease: "power2.out" },
            0,
          );
          // The seam draws down first, so the invitation reads as coming out
          // of an opening rather than fading onto a card. It opens only as
          // far as the invitation needs; each later element pushes it further.
          tl.fromTo(
            `${ROOT} .seam`,
            { scaleY: 0 },
            { scaleY: 0.23, duration: 0.62, ease: "power3.out" },
            1.34,
          );
          // 1.78 — "ادعو الناس". It steps out of the seam.
          tl.fromTo(
            `${ROOT} .invite`,
            { opacity: 0, x: -26 },
            { opacity: 1, x: 0, duration: 0.62, ease: "power2.out" },
            1.78,
          );

          // ---- 7.56 : "اسبوعين" — two weeks ------------------------------
          tl.fromTo(
            `${ROOT} .seam`,
            { scaleY: 0.23 },
            {
              scaleY: 0.43,
              duration: 0.6,
              ease: "power2.out",
              immediateRender: false,
            },
            7.46,
          );
          tl.fromTo(
            `${ROOT} .promise-a`,
            { clipPath: "inset(0 100% 0 0)", y: 22 },
            {
              clipPath: "inset(0 0% 0 0)",
              y: 0,
              duration: 0.66,
              ease: "power3.out",
            },
            7.56,
          );

          // ---- 9.42 : "SaaS application" --------------------------------
          tl.fromTo(
            `${ROOT} .seam`,
            { scaleY: 0.43 },
            {
              scaleY: 0.76,
              duration: 0.6,
              ease: "power2.out",
              immediateRender: false,
            },
            9.32,
          );
          tl.fromTo(
            `${ROOT} .promise-b`,
            { clipPath: "inset(0 100% 0 0)", y: 22 },
            {
              clipPath: "inset(0 0% 0 0)",
              y: 0,
              duration: 0.66,
              ease: "power3.out",
            },
            9.42,
          );
          tl.fromTo(
            `${ROOT} .promise-rule`,
            { width: 0 },
            { width: 520, duration: 0.6, ease: "power3.out" },
            9.86,
          );

          // ---- 12.12 : "agentic harness" — what is shared ----------------
          tl.fromTo(
            `${ROOT} .seam`,
            { scaleY: 0.76 },
            {
              scaleY: 1,
              duration: 0.6,
              ease: "power2.out",
              immediateRender: false,
            },
            12.02,
          );
          tl.fromTo(
            `${ROOT} .shared-line-1 .tick`,
            { scaleX: 0 },
            { scaleX: 1, duration: 0.3, ease: "power2.out" },
            12.12,
          );
          tl.fromTo(
            `${ROOT} .shared-line-1`,
            { opacity: 0, x: -14 },
            { opacity: 1, x: 0, duration: 0.42, ease: "power2.out" },
            12.12,
          );
          tl.fromTo(
            `${ROOT} .shared-line-2 .tick`,
            { scaleX: 0 },
            { scaleX: 1, duration: 0.3, ease: "power2.out" },
            12.4,
          );
          tl.fromTo(
            `${ROOT} .shared-line-2`,
            { opacity: 0, x: -14 },
            { opacity: 1, x: 0, duration: 0.42, ease: "power2.out" },
            12.4,
          );

          // ---- Exit. The door closes: seam retracts, then the frame
          //      releases over 1.1 s so the cut back is not a pop. ---------
          tl.fromTo(
            `${ROOT} .seam`,
            { scaleY: 1 },
            {
              scaleY: 0,
              duration: 0.5,
              ease: "power2.in",
              immediateRender: false,
            },
            14.06,
          );
          tl.to(
            `${ROOT} .scene-content`,
            { opacity: 0, duration: 0.8, ease: "power2.in" },
            14.2,
          );
          tl.to(
            `${ROOT} .backdrop`,
            { opacity: 0, duration: 1.1, ease: "power2.in" },
            14.2,
          );

          tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines["two-weeks"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
