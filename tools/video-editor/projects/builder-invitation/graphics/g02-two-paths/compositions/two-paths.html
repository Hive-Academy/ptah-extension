<!doctype html>
<!--
  G02 — two paths.
  Hand-authored for builder-invitation, timeline 0:10.5-0:28.2 (17.7 s).
  Structure, palette handling and timeline discipline follow the worked
  example at ../../g04-lifecycle-chain/compositions/lifecycle-chain.html.

  SIDE PANEL, not a takeover. The speaker sits centre-right and must stay
  visible, so every painted pixel lives inside one opaque --ink card at
  x 90-845, y 200-780. The right 54% of frame (x >= 883) is never touched,
  the card's drop shadow is spread-limited so it cannot bleed past x=875,
  and nothing enters the bottom 186px caption band (card bottom is 780).

  The A-roll behind the left third is an orange wall, so --amber never
  touches footage: it only ever sits on the opaque card.

  SYNC CONTRACT — timeline seconds minus 10.5 gives local time:
    "kMVP w prototype"                       10.78       -> 0.28
    "software development life cycle"        17.18-19.79 -> 6.68-9.29
    "a very big difference between the two"  ends 28.2   -> 17.7
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Two paths</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div
      id="two-paths"
      data-composition-id="two-paths"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="17.7"
    >
      <div class="card">
        <p class="eyebrow">Two ways to build</p>

        <div class="columns">
          <!-- Path one: the AI prototype. Amber, flat, provisional. -->
          <div class="col col-a">
            <div class="edge edge-a"></div>
            <div class="panel-body">
              <div class="bar bar-a"></div>
              <h2 class="title title-a">
                <span class="title-line">AI</span>
                <span class="title-line">Prototype</span>
              </h2>
              <ul class="items">
                <li class="item"><span class="dash dash-a"></span><span class="item-text">Days to demo</span></li>
                <li class="item"><span class="dash dash-a"></span><span class="item-text">No foundation</span></li>
                <li class="item"><span class="dash dash-a"></span><span class="item-text">Rewrite it later</span></li>
              </ul>
            </div>
          </div>

          <div class="divider"></div>

          <!-- Path two: the life cycle. Emerald, raised, durable. -->
          <div class="col col-b">
            <div class="ghost"></div>
            <div class="tint"></div>
            <div class="edge edge-b"></div>
            <div class="panel-body">
              <div class="bar bar-b"></div>
              <h2 class="title title-b">
                <span class="title-line">Software</span>
                <span class="title-line">Life cycle</span>
              </h2>
              <ul class="items">
                <li class="item"><span class="dash dash-b"></span><span class="item-text">Weeks to a base</span></li>
                <li class="item"><span class="dash dash-b"></span><span class="item-text">Built to extend</span></li>
                <li class="item"><span class="dash dash-b"></span><span class="item-text">Ready to scale</span></li>
              </ul>
            </div>
          </div>
        </div>

        <div class="footer">
          <div class="footer-rule"></div>
          <p class="footer-line">One demos. One holds up.</p>
        </div>
      </div>

      <style>
        [data-composition-id="two-paths"] {
          --ink: #08090c;
          --ink-raised: #0e1015;
          --amber: #f5a524;
          --amber-light: #ffbb4d;
          --amber-deep: #c97e0e;
          --emerald: #34d399;
          --emerald-light: #6ee7b7;
          --text-strong: #ffffff;
          --text-soft: rgba(255, 255, 255, 0.72);
          --text-faint: rgba(255, 255, 255, 0.45);
          --grid: rgba(255, 255, 255, 0.08);
          --card-border: rgba(255, 255, 255, 0.13);
          --panel-bg: rgba(255, 255, 255, 0.03);
          --ghost-border: rgba(255, 255, 255, 0.16);
          --emerald-edge: rgba(52, 211, 153, 0.62);
          --emerald-tint: rgba(52, 211, 153, 0.09);
          --amber-edge: rgba(201, 126, 14, 0.7);
          --shadow: rgba(0, 0, 0, 0.72);

          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
        }

        /* The ONLY opaque surface. x 90-845, y 200-780. The shadow uses a
           negative spread so its right extent stops at 845 - 24 + 44 = 865,
           safely inside the transparent right 54% (x >= 883). */
        [data-composition-id="two-paths"] .card {
          position: absolute;
          left: 90px;
          top: 200px;
          width: 755px;
          height: 580px;
          display: flex;
          flex-direction: column;
          padding: 34px 36px 30px;
          border-radius: 26px;
          border: 1px solid var(--card-border);
          background:
            radial-gradient(120% 80% at 18% 0%, var(--ink-raised) 0%, var(--ink) 68%),
            var(--ink);
          box-shadow: 0 26px 44px -24px var(--shadow);
          opacity: 0;
        }

        [data-composition-id="two-paths"] .eyebrow {
          flex: none;
          margin-bottom: 24px;
          font-size: 23px;
          font-weight: 600;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: var(--text-faint);
          white-space: nowrap;
          opacity: 0;
        }

        [data-composition-id="two-paths"] .columns {
          flex: 1;
          display: flex;
          align-items: stretch;
          gap: 0;
        }

        [data-composition-id="two-paths"] .col {
          position: relative;
          flex: 1;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding: 28px;
          border-radius: 18px;
          border: 1px solid var(--grid);
          background: var(--panel-bg);
        }

        [data-composition-id="two-paths"] .divider {
          flex: none;
          width: 1px;
          margin: 0 16px;
          border-radius: 1px;
          background: var(--card-border);
          transform-origin: top center;
          opacity: 0;
        }

        /* Accent edges ride on top of the neutral panel border so the
           colour can change weight without tweening a colour value. */
        [data-composition-id="two-paths"] .edge {
          position: absolute;
          inset: -1px;
          border-radius: 18px;
          border: 2px solid var(--grid);
          pointer-events: none;
          opacity: 0;
        }

        [data-composition-id="two-paths"] .edge-a {
          border-color: var(--amber-edge);
        }

        [data-composition-id="two-paths"] .edge-b {
          border-color: var(--emerald-edge);
          box-shadow: 0 0 34px -10px var(--emerald-edge);
        }

        [data-composition-id="two-paths"] .ghost {
          position: absolute;
          inset: -1px;
          border-radius: 18px;
          border: 2px dashed var(--ghost-border);
          pointer-events: none;
          opacity: 0;
        }

        [data-composition-id="two-paths"] .tint {
          position: absolute;
          inset: 0;
          border-radius: 17px;
          background: var(--emerald-tint);
          pointer-events: none;
          opacity: 0;
        }

        [data-composition-id="two-paths"] .panel-body {
          position: relative;
        }

        [data-composition-id="two-paths"] .bar {
          width: 78px;
          height: 6px;
          border-radius: 3px;
          transform-origin: left center;
          transform: scaleX(0);
        }

        [data-composition-id="two-paths"] .bar-a {
          background: var(--amber);
        }

        [data-composition-id="two-paths"] .bar-b {
          background: var(--emerald);
        }

        [data-composition-id="two-paths"] .title {
          margin-top: 22px;
          font-size: 38px;
          font-weight: 800;
          line-height: 1.16;
          letter-spacing: 0.005em;
          text-transform: uppercase;
        }

        [data-composition-id="two-paths"] .title-a {
          color: var(--amber-light);
        }

        [data-composition-id="two-paths"] .title-b {
          color: var(--emerald-light);
        }

        [data-composition-id="two-paths"] .title-line {
          display: block;
          white-space: nowrap;
          opacity: 0;
        }

        [data-composition-id="two-paths"] .items {
          margin-top: 26px;
          list-style: none;
        }

        [data-composition-id="two-paths"] .item {
          display: flex;
          align-items: center;
          gap: 14px;
          height: 34px;
          margin-bottom: 12px;
          opacity: 0;
        }

        [data-composition-id="two-paths"] .item:last-child {
          margin-bottom: 0;
        }

        [data-composition-id="two-paths"] .dash {
          flex: none;
          width: 16px;
          height: 3px;
          border-radius: 2px;
        }

        [data-composition-id="two-paths"] .dash-a {
          background: var(--amber-deep);
        }

        [data-composition-id="two-paths"] .dash-b {
          background: var(--emerald);
        }

        [data-composition-id="two-paths"] .item-text {
          font-size: 27px;
          font-weight: 500;
          letter-spacing: -0.005em;
          color: var(--text-soft);
          white-space: nowrap;
        }

        [data-composition-id="two-paths"] .footer {
          flex: none;
          margin-top: 24px;
        }

        [data-composition-id="two-paths"] .footer-rule {
          height: 1px;
          background: var(--card-border);
          transform-origin: left center;
          transform: scaleX(0);
        }

        [data-composition-id="two-paths"] .footer-line {
          margin-top: 20px;
          font-size: 30px;
          font-weight: 600;
          letter-spacing: -0.01em;
          color: var(--text-soft);
          white-space: nowrap;
          opacity: 0;
        }
      </style>

      <script>
        (function () {
          const ROOT = '[data-composition-id="two-paths"]';
          const root = document.querySelector(ROOT);
          const q = (sel) => root.querySelector(sel);
          const qa = (sel) => Array.from(root.querySelectorAll(sel));
          const tl = gsap.timeline({ paused: true });

          // Every entrance is an explicit fromTo with immediateRender:false,
          // so no later tween can stamp its start value at build time and the
          // timeline is safe under non-linear seeking. Nothing is measured.
          const enter = (target, from, to, at) => {
            tl.fromTo(
              target,
              Object.assign({ opacity: 0 }, from),
              Object.assign(
                { opacity: 1, duration: 0.45, ease: "power2.out", immediateRender: false },
                to,
              ),
              at,
            );
          };

          const fade = (target, fromOpacity, toOpacity, at, duration) => {
            tl.fromTo(
              target,
              { opacity: fromOpacity },
              { opacity: toOpacity, duration: duration, ease: "power2.out", immediateRender: false },
              at,
            );
          };

          const colB = q(".col-b");
          const itemsA = qa(".col-a .item");
          const itemsB = qa(".col-b .item");
          const titleA = qa(".col-a .title-line");
          const titleB = qa(".col-b .title-line");

          // ---- 0.00-0.30 — the panel pushes in from the left edge --------
          enter(`${ROOT} .card`, { x: -46, scale: 0.985 }, { x: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 0);
          enter(`${ROOT} .eyebrow`, { y: -10 }, { y: 0, duration: 0.4 }, 0.2);

          // ---- 0.30 — "kMVP w prototype". Path one lands. ----------------
          tl.fromTo(
            `${ROOT} .bar-a`,
            { scaleX: 0 },
            { scaleX: 1, duration: 0.5, ease: "power3.out", immediateRender: false },
            0.3,
          );
          titleA.forEach((el, i) => enter(el, { y: 16 }, { y: 0, duration: 0.46 }, 0.34 + i * 0.09));
          fade(`${ROOT} .edge-a`, 0, 1, 0.42, 0.5);
          itemsA.forEach((el, i) => enter(el, { x: -16 }, { x: 0, duration: 0.4 }, 0.78 + i * 0.14));

          // The second slot is held open as a dashed outline so the empty
          // half reads as "the other path, not yet" rather than dead space.
          fade(`${ROOT} .ghost`, 0, 1, 1.35, 0.55);

          // ---- 6.68 — "software development life cycle". Path two lands
          //      and the contrast sharpens: emerald edge, tint and glow come
          //      up while path one's amber edge and bar drop back. ---------
          const B = 6.68;
          fade(`${ROOT} .ghost`, 1, 0, B, 0.35);
          fade(`${ROOT} .tint`, 0, 1, B, 0.55);
          fade(`${ROOT} .edge-b`, 0, 1, B, 0.5);
          tl.fromTo(
            colB,
            { x: 26 },
            { x: 0, duration: 0.6, ease: "power3.out", immediateRender: false },
            B,
          );
          tl.fromTo(
            `${ROOT} .bar-b`,
            { scaleX: 0 },
            { scaleX: 1, duration: 0.5, ease: "power3.out", immediateRender: false },
            B,
          );
          titleB.forEach((el, i) => enter(el, { y: 16 }, { y: 0, duration: 0.46 }, B + 0.06 + i * 0.09));
          itemsB.forEach((el, i) => enter(el, { x: -16 }, { x: 0, duration: 0.4 }, B + 0.5 + i * 0.14));

          enter(
            `${ROOT} .divider`,
            { scaleY: 0.04 },
            { scaleY: 1, duration: 0.6, ease: "power2.inOut" },
            B,
          );

          // Path one steps back. Only non-text elements dim, so no label
          // ever loses its contrast ratio.
          fade(`${ROOT} .edge-a`, 1, 0.34, B + 0.25, 0.6);
          fade(`${ROOT} .bar-a`, 1, 0.55, B + 0.25, 0.6);

          // ---- 13.60 — "a very big difference between the two cases" -----
          tl.fromTo(
            `${ROOT} .footer-rule`,
            { scaleX: 0 },
            { scaleX: 1, duration: 0.65, ease: "power2.inOut", immediateRender: false },
            13.6,
          );
          enter(`${ROOT} .footer-line`, { y: 12 }, { y: 0, duration: 0.5 }, 13.75);

          // ---- 16.90-17.55 — the panel releases the frame, complete
          //      before the 17.70 hand-off to the next graphic. ------------
          tl.fromTo(
            `${ROOT} .card`,
            { opacity: 1, x: 0, scale: 1 },
            {
              opacity: 0,
              x: -34,
              scale: 0.99,
              duration: 0.65,
              ease: "power2.in",
              immediateRender: false,
            },
            16.9,
          );

          tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines["two-paths"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
