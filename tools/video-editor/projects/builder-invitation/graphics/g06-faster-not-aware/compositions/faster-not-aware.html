<!doctype html>
<!--
  G06 — the pull quote.
  Hand-authored. Structure, palette handling and timeline discipline follow
  g03-what-you-lose/compositions/what-you-lose.html, which in turn follows
  g07-degradation-curve/compositions/quality-over-time.html.

  LOWER THIRD for builder-invitation, timeline 2:56.5-3:13.6 (17.1 s).
  The line is "AI makes you faster. It does not make you aware." The turn
  between the two halves is the whole point, so the halves are staged apart
  and the accent bar changes hands (--amber -> --emerald) on the turn.

  Beats land on the narration (local = timeline - 176.5):
    "faster"                 187.07 -> local 10.57
    "still ... aware"    188.17-190.29 -> local 11.67-13.79

  LAYOUT CONSTRAINTS — this is a lower third over screen capture, not a
  takeover. Nothing paints full frame.
    * Webcam PiP, bottom-left: x 0-430. Nothing may enter x 0-470.
      The card starts at x=520 and there is no box-shadow, so the painted
      bounds are exactly the card bounds.
    * Arabic caption band: the bottom 186px, i.e. y 894-1080.
      The card runs y 640-880 and stops 14px clear of it.
    * The card carries its own --scrim so the text stays legible over any UI
      behind it. It does not rely on the footage being dark.

  No DOM geometry is measured anywhere. Every reveal is a transform, an
  opacity, or a clip-path percentage the browser resolves itself.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>AI makes you faster. It does not make you aware.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div
      id="faster-not-aware"
      data-composition-id="faster-not-aware"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="17.1"
    >
      <div class="card">
        <span class="bar bar-amber"></span>
        <span class="bar bar-emerald"></span>

        <div class="lines">
          <p class="line line-1">
            <span class="lead">AI makes you</span>
            <span class="hit hit-faster">faster</span><span class="stop stop-1"
              >.</span
            >
          </p>
          <p class="line line-2">
            It does not make you
            <span class="hit hit-aware"
              >aware<span class="mark mark-aware"></span></span
            ><span class="stop stop-2">.</span>
          </p>
        </div>
      </div>

      <style>
        [data-composition-id="faster-not-aware"] {
          --ink: #08090c;
          --ink-raised: #0e1015;
          --amber: #f5a524;
          --amber-light: #ffbb4d;
          --amber-deep: #c97e0e;
          --emerald: #34d399;
          --emerald-light: #6ee7b7;
          --text-strong: #ffffff;
          --text-soft: rgba(255, 255, 255, 0.72);
          --text-faint: rgba(255, 255, 255, 0.45);
          --grid: rgba(255, 255, 255, 0.08);
          /* The card scrim. --ink and --ink-raised at 0.96 so the card reads
             as glass sitting on the capture rather than a hole punched in
             it, while still burying whatever UI is behind it. */
          --scrim-top: rgba(14, 16, 21, 0.96);
          --scrim-base: rgba(8, 9, 12, 0.96);
          --edge: rgba(255, 255, 255, 0.12);

          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
        }

        /* The card is the whole painted area of this graphic.
           x 520-1808  (PiP zone x 0-470 stays clear by 50px)
           y 640-880   (caption band y 894-1080 stays clear by 14px)
           No box-shadow: a shadow would bleed into both reserved zones. */
        [data-composition-id="faster-not-aware"] .card {
          position: absolute;
          left: 520px;
          top: 640px;
          width: 1288px;
          height: 240px;
          padding: 38px 56px 38px 61px;
          border: 1px solid var(--edge);
          border-radius: 10px;
          background: linear-gradient(
            180deg,
            var(--scrim-top) 0%,
            var(--scrim-base) 78%
          );
          opacity: 0;
          overflow: hidden;
        }

        /* Two stacked bars so the turn is a cross-fade, not a colour tween. */
        [data-composition-id="faster-not-aware"] .bar {
          position: absolute;
          left: 0;
          top: 0;
          width: 5px;
          height: 240px;
          transform-origin: top center;
        }

        [data-composition-id="faster-not-aware"] .bar-amber {
          background: var(--amber);
          transform: scaleY(0);
        }

        [data-composition-id="faster-not-aware"] .bar-emerald {
          background: var(--emerald);
          opacity: 0;
        }

        [data-composition-id="faster-not-aware"] .lines {
          position: relative;
          display: flex;
          flex-direction: column;
          width: 100%;
        }

        [data-composition-id="faster-not-aware"] .line {
          font-size: 66px;
          line-height: 82px;
          font-weight: 700;
          letter-spacing: -0.015em;
          color: var(--text-strong);
          white-space: nowrap;
        }

        /* The first half is the concession: lighter, quieter. */
        [data-composition-id="faster-not-aware"] .line-1 {
          font-weight: 500;
          color: var(--text-soft);
        }

        [data-composition-id="faster-not-aware"] .lead {
          display: inline-block;
          opacity: 0;
        }

        /* The second half is the correction: full weight, full white,
           and it is wiped in from the left rather than faded. */
        [data-composition-id="faster-not-aware"] .line-2 {
          clip-path: inset(0 100% 0 0);
        }

        [data-composition-id="faster-not-aware"] .hit {
          position: relative;
          display: inline-block;
          font-weight: 800;
        }

        [data-composition-id="faster-not-aware"] .hit-faster {
          color: var(--amber);
          opacity: 0;
        }

        [data-composition-id="faster-not-aware"] .hit-aware {
          color: var(--emerald);
        }

        [data-composition-id="faster-not-aware"] .stop {
          display: inline-block;
          font-weight: 800;
        }

        [data-composition-id="faster-not-aware"] .stop-1 {
          color: var(--amber);
          opacity: 0;
        }

        [data-composition-id="faster-not-aware"] .stop-2 {
          color: var(--emerald);
        }

        /* Underline under "aware" only. Spans its own word by CSS, so
           nothing is measured. */
        [data-composition-id="faster-not-aware"] .mark {
          position: absolute;
          left: -4px;
          right: -4px;
          bottom: 2px;
          height: 6px;
          border-radius: 3px;
          background: var(--emerald);
          transform: scaleX(0);
          transform-origin: left center;
        }
      </style>

      <script>
        (function () {
          const ROOT = '[data-composition-id="faster-not-aware"]';
          const tl = gsap.timeline({ paused: true });

          // ---- The card arrives just before he says "faster" (8.2-9.0) ----
          // 2.4 s of empty card is anticipation, not dead air: the frame is
          // claimed before the sentence lands in it.
          // The y offset is NEGATIVE on purpose: the card settles downward
          // into place and lifts away again. Entering from below would put
          // its bottom edge at y=898 for the first frames of the fade, which
          // is 4px inside the reserved caption band.
          tl.fromTo(
            `${ROOT} .card`,
            { opacity: 0, y: -18 },
            { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" },
            8.2,
          );
          tl.fromTo(
            `${ROOT} .bar-amber`,
            { scaleY: 0 },
            { scaleY: 1, duration: 0.7, ease: "power3.out" },
            8.45,
          );

          // ---- Half one: the concession -----------------------------------
          // "AI makes you" leads, then "faster" lands on the word at 10.57.
          tl.fromTo(
            `${ROOT} .lead`,
            { opacity: 0, x: -16 },
            { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
            10.05,
          );
          tl.fromTo(
            `${ROOT} .hit-faster`,
            { opacity: 0, y: 18, scale: 0.94 },
            { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "power3.out" },
            10.57,
          );
          tl.fromTo(
            `${ROOT} .stop-1`,
            { opacity: 0 },
            { opacity: 1, duration: 0.3, ease: "power2.out" },
            10.78,
          );

          // ---- The turn: the correction wipes in over it (11.67) ----------
          // He says "but he stays aware" at 11.67. The wipe is a rebuttal
          // moving left to right; power4.inOut commits and stops.
          tl.fromTo(
            `${ROOT} .line-2`,
            { clipPath: "inset(0 100% 0 0)" },
            {
              clipPath: "inset(0 0% 0 0)",
              duration: 0.72,
              ease: "power4.inOut",
            },
            11.67,
          );

          // The accent bar changes hands on the turn.
          tl.fromTo(
            `${ROOT} .bar-emerald`,
            { opacity: 0 },
            { opacity: 1, duration: 0.55, ease: "power2.inOut" },
            11.85,
          );

          // The first half steps back so the second half carries the frame.
          tl.to(
            `${ROOT} .line-1`,
            { opacity: 0.55, duration: 0.6, ease: "power2.out" },
            11.95,
          );

          // "aware" is underlined last — the final press on the point.
          tl.fromTo(
            `${ROOT} .mark-aware`,
            { scaleX: 0 },
            { scaleX: 1, duration: 0.5, ease: "power4.inOut" },
            12.5,
          );

          // ---- Hold 13.0-15.7: 3.3 s on the finished line, which is 47
          //      characters — enough to read it twice. -------------------

          // ---- Release the frame back to the footage (15.7-16.8) ----------
          // Fully clear at 16.8, inside the 17.1 s slot with 0.3 s to spare.
          tl.to(
            `${ROOT} .lines`,
            { opacity: 0, duration: 0.7, ease: "power2.in" },
            15.7,
          );
          tl.to(
            `${ROOT} .card`,
            { opacity: 0, y: -10, duration: 1.0, ease: "power2.in" },
            15.8,
          );

          tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines["faster-not-aware"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
