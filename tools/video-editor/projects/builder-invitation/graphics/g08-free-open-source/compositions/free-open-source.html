<!doctype html>
<!--
  G08 — free and open source.
  Hand-authored (no registry block used; the surface list is a plain flex
  stack, not a chart or a card block). Structure, palette handling and
  timeline discipline follow g07-degradation-curve/compositions/
  quality-over-time.html.

  Full-frame takeover for builder-invitation, timeline 4:13.0-4:37.4 (24.4 s).
  The bottom 186px is reserved for Arabic captions and stays empty.

  Word anchors (local seconds = timeline seconds - 253.0):
    2.05   "totally free"
    6.61   Electron, the recommended surface
    9.73   VS Code extension
   11.25   CLI tool
   16.34   "open source"
   23.26   "Builders community"
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Free and open source</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div
      id="free-open-source"
      data-composition-id="free-open-source"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="24.4"
    >
      <div class="backdrop"></div>

      <div class="scene-content">
        <div class="stage">
          <div class="headline-col">
            <p class="eyebrow">Everything you just saw is</p>

            <div class="free-block">
              <h1 class="free-word">FREE.</h1>
              <span class="free-rule"></span>
            </div>
            <p class="free-note">No trial. No card.</p>

            <div class="os-block">
              <h2 class="os-word">OPEN SOURCE.</h2>
              <span class="os-rule"></span>
            </div>
            <p class="os-note">Every line of it, public.</p>
          </div>

          <div class="surfaces-col">
            <p class="surfaces-label">Ships on three surfaces</p>

            <div class="card card-lead">
              <span class="card-rule"></span>
              <div class="card-body">
                <span class="card-title">Electron desktop app</span>
                <span class="card-sub">The full experience. Start here.</span>
              </div>
              <span class="card-badge">RECOMMENDED</span>
            </div>

            <div class="card card-vscode">
              <span class="card-rule"></span>
              <div class="card-body">
                <span class="card-title">VS Code extension</span>
                <span class="card-sub">Inside the editor you use</span>
              </div>
            </div>

            <div class="card card-cli">
              <span class="card-rule"></span>
              <div class="card-body">
                <span class="card-title">CLI tool</span>
                <span class="card-sub">Headless, in any terminal</span>
              </div>
            </div>
          </div>
        </div>

        <div class="footer">
          <span class="footer-rule"></span>
          <span class="footer-text">Next door: the Builders community</span>
        </div>
      </div>

      <style>
        [data-composition-id="free-open-source"] {
          --ink: #08090c;
          --ink-raised: #0e1015;
          --amber: #f5a524;
          --amber-light: #ffbb4d;
          --amber-deep: #c97e0e;
          --emerald: #34d399;
          --emerald-light: #6ee7b7;
          --text-strong: #ffffff;
          --text-soft: rgba(255, 255, 255, 0.72);
          --text-faint: rgba(255, 255, 255, 0.45);
          --grid: rgba(255, 255, 255, 0.08);
          --card-fill: rgba(255, 255, 255, 0.035);
          --card-fill-lead: rgba(52, 211, 153, 0.07);
          --card-edge: rgba(255, 255, 255, 0.09);
          --card-edge-lead: rgba(52, 211, 153, 0.34);

          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
        }

        [data-composition-id="free-open-source"] .backdrop {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(115% 85% at 32% 30%, var(--ink-raised) 0%, var(--ink) 60%),
            var(--ink);
          opacity: 0;
        }

        /* Vertical budget: 96 top + 640 stage + 36 gap + 80 footer = 852, then
           42 of slack before the 186px caption band at y=894. Nothing enters
           the band.
           Horizontal budget: 1920 - 260 padding = 1660 = 700 + 70 + 890. The
           columns are `flex: none`, so a total over 1660 silently overflows
           the right margin instead of shrinking. */
        [data-composition-id="free-open-source"] .scene-content {
          position: relative;
          display: flex;
          flex-direction: column;
          width: 100%;
          height: 100%;
          padding: 96px 130px 186px;
          gap: 36px;
        }

        [data-composition-id="free-open-source"] .stage {
          flex: none;
          display: flex;
          align-items: flex-start;
          gap: 70px;
          height: 640px;
        }

        /* ---- Left column: the headline pair ---------------------------- */

        [data-composition-id="free-open-source"] .headline-col {
          flex: none;
          width: 700px;
          padding-top: 18px;
        }

        [data-composition-id="free-open-source"] .eyebrow {
          font-size: 30px;
          font-weight: 500;
          letter-spacing: 0.04em;
          color: var(--text-soft);
          white-space: nowrap;
          opacity: 0;
        }

        [data-composition-id="free-open-source"] .free-block {
          margin-top: 14px;
        }

        [data-composition-id="free-open-source"] .free-word {
          font-size: 200px;
          font-weight: 800;
          line-height: 1;
          letter-spacing: -0.045em;
          color: var(--amber);
          white-space: nowrap;
          transform-origin: 0% 60%;
          opacity: 0;
        }

        [data-composition-id="free-open-source"] .free-rule {
          display: block;
          margin-top: 20px;
          width: 0;
          height: 10px;
          border-radius: 5px;
          background: var(--amber);
        }

        [data-composition-id="free-open-source"] .free-note {
          margin-top: 20px;
          font-size: 30px;
          font-weight: 500;
          color: var(--text-soft);
          white-space: nowrap;
          opacity: 0;
        }

        [data-composition-id="free-open-source"] .os-block {
          margin-top: 92px;
        }

        [data-composition-id="free-open-source"] .os-word {
          font-size: 94px;
          font-weight: 700;
          line-height: 1;
          letter-spacing: -0.03em;
          color: var(--text-strong);
          white-space: nowrap;
          clip-path: inset(0 100% 0 0);
        }

        [data-composition-id="free-open-source"] .os-rule {
          display: block;
          margin-top: 18px;
          width: 0;
          height: 6px;
          border-radius: 3px;
          background: var(--emerald);
        }

        [data-composition-id="free-open-source"] .os-note {
          margin-top: 18px;
          font-size: 27px;
          font-weight: 400;
          color: var(--text-soft);
          white-space: nowrap;
          opacity: 0;
        }

        /* ---- Right column: the three surfaces -------------------------- */

        [data-composition-id="free-open-source"] .surfaces-col {
          flex: none;
          width: 890px;
          display: flex;
          flex-direction: column;
          gap: 30px;
          padding-top: 22px;
        }

        [data-composition-id="free-open-source"] .surfaces-label {
          font-size: 24px;
          font-weight: 600;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: var(--text-faint);
          white-space: nowrap;
          opacity: 0;
        }

        [data-composition-id="free-open-source"] .card {
          position: relative;
          display: flex;
          align-items: center;
          gap: 30px;
          width: 100%;
          height: 146px;
          padding: 0 32px 0 30px;
          border: 1px solid var(--card-edge);
          border-radius: 18px;
          background: var(--card-fill);
          opacity: 0;
        }

        [data-composition-id="free-open-source"] .card-lead {
          height: 196px;
          border-color: var(--card-edge-lead);
          background: var(--card-fill-lead);
          box-shadow:
            0 26px 60px rgba(0, 0, 0, 0.55),
            0 0 0 1px rgba(52, 211, 153, 0.12);
        }

        [data-composition-id="free-open-source"] .card-rule {
          flex: none;
          width: 6px;
          height: 72px;
          border-radius: 3px;
          background: var(--grid);
          transform-origin: 50% 0%;
        }

        [data-composition-id="free-open-source"] .card-lead .card-rule {
          width: 8px;
          height: 120px;
          background: var(--emerald);
        }

        [data-composition-id="free-open-source"] .card-body {
          flex: 1 1 auto;
          display: flex;
          flex-direction: column;
          gap: 8px;
          min-width: 0;
        }

        [data-composition-id="free-open-source"] .card-title {
          font-size: 40px;
          font-weight: 600;
          letter-spacing: -0.015em;
          color: var(--text-soft);
          white-space: nowrap;
        }

        [data-composition-id="free-open-source"] .card-lead .card-title {
          font-size: 52px;
          font-weight: 700;
          color: var(--text-strong);
        }

        [data-composition-id="free-open-source"] .card-sub {
          font-size: 25px;
          font-weight: 400;
          color: var(--text-faint);
          white-space: nowrap;
        }

        [data-composition-id="free-open-source"] .card-lead .card-sub {
          font-size: 28px;
          color: var(--emerald-light);
        }

        [data-composition-id="free-open-source"] .card-badge {
          flex: none;
          padding: 10px 20px;
          border: 1px solid var(--card-edge-lead);
          border-radius: 999px;
          font-size: 20px;
          font-weight: 700;
          letter-spacing: 0.14em;
          color: var(--emerald);
          background: rgba(52, 211, 153, 0.1);
          white-space: nowrap;
          opacity: 0;
        }

        /* ---- Footer: the hand-off -------------------------------------- */

        [data-composition-id="free-open-source"] .footer {
          flex: none;
          display: flex;
          align-items: center;
          gap: 26px;
          height: 80px;
        }

        [data-composition-id="free-open-source"] .footer-rule {
          display: block;
          width: 0;
          height: 4px;
          border-radius: 2px;
          background: var(--emerald);
        }

        [data-composition-id="free-open-source"] .footer-text {
          font-size: 34px;
          font-weight: 500;
          letter-spacing: -0.005em;
          color: var(--text-soft);
          white-space: nowrap;
          opacity: 0;
        }
      </style>

      <script>
        (function () {
          const ROOT = '[data-composition-id="free-open-source"]';
          const tl = gsap.timeline({ paused: true });

          // ---- 0.0-2.0 : the frame is taken over ------------------------
          tl.fromTo(
            `${ROOT} .backdrop`,
            { opacity: 0 },
            { opacity: 1, duration: 0.7, ease: "power2.out" },
            0,
          );
          tl.fromTo(
            `${ROOT} .eyebrow`,
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
            0.5,
          );

          // ---- 2.05 : "totally free" ------------------------------------
          // The single most important word in the beat. It lands hard.
          tl.fromTo(
            `${ROOT} .free-word`,
            { opacity: 0, scale: 0.78, y: 26 },
            { opacity: 1, scale: 1, y: 0, duration: 0.72, ease: "back.out(1.7)" },
            2.05,
          );
          tl.fromTo(
            `${ROOT} .free-rule`,
            { width: 0 },
            { width: 372, duration: 0.55, ease: "power3.out" },
            2.34,
          );
          tl.fromTo(
            `${ROOT} .free-note`,
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
            2.9,
          );

          // ---- 6.0-11.9 : the three surfaces ----------------------------
          tl.fromTo(
            `${ROOT} .surfaces-label`,
            { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
            5.95,
          );

          // 6.61 — Electron. Elevated, taller, emerald-ruled, badged.
          tl.fromTo(
            `${ROOT} .card-lead`,
            { opacity: 0, x: 46 },
            { opacity: 1, x: 0, duration: 0.62, ease: "power3.out" },
            6.61,
          );
          tl.fromTo(
            `${ROOT} .card-lead .card-rule`,
            { scaleY: 0 },
            { scaleY: 1, duration: 0.5, ease: "power2.out" },
            6.85,
          );
          tl.fromTo(
            `${ROOT} .card-badge`,
            { opacity: 0, scale: 0.86 },
            { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" },
            7.25,
          );

          // 9.73 — VS Code extension.
          tl.fromTo(
            `${ROOT} .card-vscode`,
            { opacity: 0, x: 40 },
            { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" },
            9.73,
          );
          tl.fromTo(
            `${ROOT} .card-vscode .card-rule`,
            { scaleY: 0 },
            { scaleY: 1, duration: 0.4, ease: "power2.out" },
            9.9,
          );

          // 11.25 — CLI.
          tl.fromTo(
            `${ROOT} .card-cli`,
            { opacity: 0, x: 40 },
            { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" },
            11.25,
          );
          tl.fromTo(
            `${ROOT} .card-cli .card-rule`,
            { scaleY: 0 },
            { scaleY: 1, duration: 0.4, ease: "power2.out" },
            11.42,
          );

          // ---- 16.34 : "open source" ------------------------------------
          tl.to(
            `${ROOT} .os-word`,
            { clipPath: "inset(0 0% 0 0)", duration: 0.85, ease: "power2.inOut" },
            16.34,
          );
          tl.fromTo(
            `${ROOT} .os-rule`,
            { width: 0 },
            { width: 300, duration: 0.6, ease: "power3.out" },
            16.9,
          );
          tl.fromTo(
            `${ROOT} .os-note`,
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
            17.25,
          );

          // ---- 23.26 : "Builders community" -----------------------------
          // A door opening, not the destination. Small, fast, then out.
          tl.fromTo(
            `${ROOT} .footer-rule`,
            { width: 0 },
            { width: 76, duration: 0.34, ease: "power3.out" },
            23.26,
          );
          tl.fromTo(
            `${ROOT} .footer-text`,
            { opacity: 0, x: -14 },
            { opacity: 1, x: 0, duration: 0.36, ease: "power2.out" },
            23.34,
          );

          // ---- Exit. Quick, because the last word lands at 23.26. --------
          tl.to(
            `${ROOT} .scene-content`,
            { opacity: 0, duration: 0.42, ease: "power2.in" },
            23.98,
          );
          tl.to(
            `${ROOT} .backdrop`,
            { opacity: 0, duration: 0.46, ease: "power2.in" },
            23.94,
          );

          tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines["free-open-source"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
