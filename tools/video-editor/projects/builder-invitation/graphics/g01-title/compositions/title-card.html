<!doctype html>
<!--
  G01 — opening title card.
  Hand-authored (no registry block applied): the shape is a single kinetic
  line, which the chart/stat blocks do not model. Structure, palette handling
  and timeline discipline follow G07's `quality-over-time.html`.

  Full-frame takeover for builder-invitation, timeline 0:00-0:08, over A-roll.
  --amber is deliberately absent: the A-roll orange wall fills the left third
  and amber sinks into it. The card leads with --text-strong and --emerald on
  an --ink backdrop.
  The bottom 186px is reserved for Arabic captions and stays empty.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>MVP is not production</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div
      id="title-card"
      data-composition-id="title-card"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="8"
    >
      <div class="backdrop"></div>

      <div class="scene-content">
        <div class="line-wrap">
          <div class="line">
            <span class="word word-mvp">MVP</span>
            <span class="op">&#8800;</span>
            <span class="word word-prod">PRODUCTION</span>
          </div>
          <span class="rule"></span>
        </div>
      </div>

      <div class="wordmark">PTAH</div>

      <style>
        [data-composition-id="title-card"] {
          --ink: #08090c;
          --ink-raised: #0e1015;
          --emerald: #34d399;
          --emerald-light: #6ee7b7;
          --text-strong: #ffffff;
          --text-soft: rgba(255, 255, 255, 0.72);
          --text-faint: rgba(255, 255, 255, 0.45);
          --grid: rgba(255, 255, 255, 0.08);

          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
        }

        [data-composition-id="title-card"] .backdrop {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(120% 90% at 50% 40%, var(--ink-raised) 0%, var(--ink) 62%),
            var(--ink);
          opacity: 0;
        }

        /* Bottom padding reserves the 186px Arabic caption band. The line is
           centred in the remaining 894px, so its optical centre sits slightly
           above frame centre — which is where a title wants to be. */
        [data-composition-id="title-card"] .scene-content {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 100%;
          padding: 0 150px 186px;
        }

        /* Shrink-wraps the line so the rule inherits exactly its width. */
        [data-composition-id="title-card"] .line-wrap {
          display: inline-flex;
          flex-direction: column;
          align-items: stretch;
        }

        [data-composition-id="title-card"] .line {
          display: flex;
          align-items: baseline;
          justify-content: center;
          white-space: nowrap;
        }

        [data-composition-id="title-card"] .word {
          font-size: 138px;
          line-height: 1.05;
        }

        /* Two weights of the same idea: the provisional thing is set light and
           soft, the shipped thing is set heavy and strong. */
        [data-composition-id="title-card"] .word-mvp {
          font-weight: 500;
          letter-spacing: 0.02em;
          color: var(--text-soft);
          opacity: 0;
        }

        [data-composition-id="title-card"] .word-prod {
          font-weight: 800;
          letter-spacing: -0.02em;
          color: var(--text-strong);
          opacity: 0;
        }

        [data-composition-id="title-card"] .op {
          /* The op holds its own gap from t=0 even while invisible, so the two
             words can converge without ever reading as one collided word. */
          margin: 0 54px;
          font-size: 122px;
          font-weight: 700;
          line-height: 1.05;
          color: var(--emerald);
          opacity: 0;
        }

        [data-composition-id="title-card"] .rule {
          margin-top: 40px;
          height: 5px;
          border-radius: 3px;
          background: linear-gradient(
            90deg,
            var(--emerald) 0%,
            var(--emerald-light) 55%,
            var(--grid) 100%
          );
          transform: scaleX(0);
          transform-origin: 0% 50%;
        }

        /* The wordmark settles in the quiet corner, clear of the caption band. */
        [data-composition-id="title-card"] .wordmark {
          position: absolute;
          left: 150px;
          bottom: 242px;
          font-size: 28px;
          font-weight: 600;
          letter-spacing: 0.42em;
          color: var(--text-faint);
          opacity: 0;
        }
      </style>

      <script>
        (function () {
          const ROOT = '[data-composition-id="title-card"]';
          const tl = gsap.timeline({ paused: true });

          // ---- Timeline (8s) ---------------------------------------------
          // 0.0-0.7 backdrop in | 0.5-2.5 the line lands | hold | 6.6-8.0 out.

          tl.fromTo(
            `${ROOT} .backdrop`,
            { opacity: 0 },
            { opacity: 1, duration: 0.7, ease: "power2.out" },
            0,
          );

          // The two halves arrive converged on the centre and settle apart.
          tl.fromTo(
            `${ROOT} .word-mvp`,
            { autoAlpha: 0, x: 42 },
            { autoAlpha: 1, x: 0, duration: 0.75, ease: "power3.out" },
            0.52,
          );
          tl.fromTo(
            `${ROOT} .word-prod`,
            { autoAlpha: 0, x: -42 },
            { autoAlpha: 1, x: 0, duration: 0.75, ease: "power3.out" },
            0.52,
          );

          // The pivot drops in between them...
          tl.fromTo(
            `${ROOT} .op`,
            { autoAlpha: 0, scale: 0.45, rotate: -14 },
            { autoAlpha: 1, scale: 1, rotate: 0, duration: 0.5, ease: "back.out(2.2)" },
            0.98,
          );

          // ...and snaps them apart by a hair. Sequential x tweens, never
          // overlapping, so the seek order cannot matter.
          tl.to(`${ROOT} .word-mvp`, { x: -16, duration: 0.34, ease: "power2.out" }, 1.28);
          tl.to(`${ROOT} .word-prod`, { x: 16, duration: 0.34, ease: "power2.out" }, 1.28);

          tl.fromTo(
            `${ROOT} .rule`,
            { scaleX: 0 },
            { scaleX: 1, duration: 0.8, ease: "power3.out" },
            1.52,
          );

          tl.fromTo(
            `${ROOT} .wordmark`,
            { autoAlpha: 0, y: 10 },
            { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" },
            1.95,
          );

          // Hold 2.55-6.6, then release the frame back to the footage.
          tl.to(
            `${ROOT} .scene-content`,
            { opacity: 0, y: -18, duration: 0.85, ease: "power2.in" },
            6.6,
          );
          tl.to(`${ROOT} .wordmark`, { opacity: 0, duration: 0.7, ease: "power2.in" }, 6.6);
          tl.to(`${ROOT} .backdrop`, { opacity: 0, duration: 1.1, ease: "power2.in" }, 6.75);

          tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines["title-card"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
