<!doctype html>
<!--
  ptah-ui/composer: the prompt input card that types a prompt and sends it (SPEC 4.8).
  Mirrors libs/frontend/chat/src/lib/components/molecules/chat-input/chat-input.component.ts:626-639 (card),
  :206-216 (textarea), :328-343 (mic), :360-375 (stop), :376-392 (send), :395-425 (status line);
  effort-selector.component.ts:126-141,240 (level bars), model-selector.component.ts:51-87 (model chip),
  libs/frontend/chat-ui/src/lib/molecules/chat-input/autopilot-popover.component.ts (Zap icon).

  States: empty (placeholder) -> typing (caret, send enabled on first char) -> sending (press, text leaves,
  stop button for busyFor) -> idle (placeholder, send disabled).
  Beats (seconds from mount start, override with `cues`):
    c0 0.00 card slide-settles, toolbar chips spring left to right (0.09 s stagger), status line settles
    c1 0.50 caret starts blinking
    c2 0.60 typing at typeRate (first character enables send: opacity .4 -> 1)
    c3 end of typing + 0.35: send press + primary ring pulse (typing speeds up if c3 is pinned earlier)
    c4 c3 + 0.25: prompt slides up 24 px and fades, placeholder returns, stop springs in for busyFor
  Design box 1500 x 320. Mount at that size for the 26 px type floor.
-->
<html
  lang="en"
  data-composition-id="ptah-ui-composer"
  data-composition-duration="6"
  data-composition-variables='[
    { "id": "prompt", "type": "string", "label": "Prompt", "default": "read the review comments and fix them" },
    { "id": "typeRate", "type": "number", "label": "Chars per second", "default": 16, "min": 2, "max": 80, "step": 1 },
    { "id": "model", "type": "string", "label": "Model chip", "default": "Default (recommended)" },
    { "id": "effort", "type": "enum", "label": "Effort", "default": "Medium", "options": [{ "value": "Default", "label": "Default" }, { "value": "Low", "label": "Low" }, { "value": "Medium", "label": "Medium" }, { "value": "High", "label": "High" }, { "value": "X-High", "label": "X-High" }, { "value": "Max", "label": "Max" }] },
    { "id": "mode", "type": "enum", "label": "Mode border", "default": "none", "options": [{ "value": "none", "label": "None" }, { "value": "autopilot", "label": "Autopilot" }, { "value": "plan", "label": "Plan" }] },
    { "id": "statusLine", "type": "boolean", "label": "Status line", "default": true },
    { "id": "autopilot", "type": "string", "label": "Autopilot chip", "default": "Full Auto (YOLO)" },
    { "id": "mcp", "type": "string", "label": "MCP count", "default": "7/12" },
    { "id": "mcpAttention", "type": "boolean", "label": "MCP needs attention", "default": true },
    { "id": "peer", "type": "boolean", "label": "Peer chip", "default": true },
    { "id": "auth", "type": "string", "label": "Auth label", "default": "Claude CLI" },
    { "id": "send", "type": "boolean", "label": "Animate send", "default": true },
    { "id": "busyFor", "type": "number", "label": "Stop button seconds", "default": 1.2, "min": 0, "max": 10, "step": 0.1 },
    { "id": "cues", "type": "string", "label": "Cues", "default": "" },
    { "id": "focus", "type": "enum", "label": "Focus part", "default": "", "options": [{ "value": "", "label": "None" }, { "value": "input", "label": "Input" }, { "value": "send", "label": "Send" }, { "value": "model", "label": "Model" }, { "value": "effort", "label": "Effort" }, { "value": "status-line", "label": "Status line" }] },
    { "id": "focusAt", "type": "number", "label": "Focus at", "default": -1 },
    { "id": "dimOthers", "type": "number", "label": "Dim others", "default": 0.38 },
    { "id": "vignette", "type": "boolean", "label": "Vignette", "default": false },
    { "id": "exit", "type": "enum", "label": "Exit", "default": "none", "options": [{ "value": "none", "label": "None" }, { "value": "fade", "label": "Fade" }, { "value": "up", "label": "Up" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>ptah-ui composer</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="ptah-ui-composer" data-duration="6" data-fps="30">
        <style>
          /*@include base.css*/
          .cp-card {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: calc(232 * var(--u));
            display: flex;
            flex-direction: column;
            border-radius: calc(32 * var(--u));
            border: calc(2 * var(--u)) solid rgba(232, 230, 225, 0.1);
            background: rgba(26, 26, 32, 0.6);
          }
          .cp-card.autopilot {
            border-color: rgba(37, 99, 235, 0.4);
          }
          .cp-card.plan {
            border-color: rgba(59, 130, 246, 0.5);
          }
          .cp-input {
            position: relative;
            flex: 1 1 auto;
            min-height: calc(80 * var(--u));
            padding: calc(24 * var(--u)) calc(28 * var(--u)) calc(4 * var(--u));
            font-size: calc(34 * var(--u));
            line-height: 1.625;
            overflow: hidden;
          }
          .cp-ph {
            position: absolute;
            left: calc(34 * var(--u));
            top: calc(24 * var(--u));
            color: var(--muted);
            white-space: nowrap;
          }
          .cp-line {
            position: relative;
            white-space: pre-wrap;
          }
          .cp-text {
            color: var(--fg);
          }
          .cp-toolbar {
            display: flex;
            align-items: center;
            gap: calc(8 * var(--u));
            padding: calc(8 * var(--u)) calc(16 * var(--u)) calc(16 * var(--u));
          }
          .cp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            border-radius: 999px;
            color: var(--muted);
          }
          .cp-attach {
            width: calc(48 * var(--u));
            height: calc(48 * var(--u));
          }
          .cp-chip {
            display: inline-flex;
            align-items: center;
            gap: calc(12 * var(--u));
            height: calc(56 * var(--u));
            padding: 0 calc(16 * var(--u));
            border-radius: 999px;
            color: var(--muted);
            font-size: calc(28 * var(--u));
            white-space: nowrap;
            flex: 0 1 auto;
            min-width: 0;
          }
          .cp-model {
            max-width: calc(440 * var(--u));
          }
          .cp-model .nm {
            min-width: 0;
          }
          .cp-bars {
            display: flex;
            align-items: flex-end;
            gap: calc(2 * var(--u));
            height: calc(28 * var(--u));
          }
          .cp-bars i {
            display: block;
            width: calc(4 * var(--u));
            border-radius: calc(2 * var(--u));
          }
          .cp-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: calc(12 * var(--u));
            position: relative;
          }
          .cp-mic {
            width: calc(48 * var(--u));
            height: calc(48 * var(--u));
          }
          .cp-round {
            width: calc(64 * var(--u));
            height: calc(64 * var(--u));
          }
          .cp-stop {
            position: absolute;
            right: calc(76 * var(--u));
            top: 0;
            background: rgba(220, 38, 38, 0.15);
            color: var(--error);
          }
          .cp-sendwrap {
            display: inline-flex;
            border-radius: 999px;
          }
          .cp-send {
            position: relative;
            background: var(--primary);
            color: #f8f7f4;
          }
          .cp-pulse {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            border: calc(4 * var(--u)) solid var(--primary);
          }
          .cp-status {
            position: absolute;
            left: calc(8 * var(--u));
            right: calc(16 * var(--u));
            top: calc(256 * var(--u));
            height: calc(56 * var(--u));
          }
          .cp-status .pu-chip {
            padding: 0 calc(12 * var(--u));
          }
          .cp-status .warn {
            color: var(--warning);
          }
          .cp-mcpdot {
            width: calc(12 * var(--u));
            height: calc(12 * var(--u));
          }
        </style>

        <div id="cp-clip" class="clip" data-start="0" data-duration="6" data-track-index="0" style="position: absolute; inset: 0">
          <div class="pu-stage" id="cp-stage"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
        <script>
          (function () {
            "use strict";
            /*@include runtime.js*/
            var root = document.getElementById("root");
            var K = ptahKit(root, { dw: 1500, dh: 320, id: "ptah-ui-composer" });
            var tl = K.tl;
            K.vignette();

            var prompt = K.str("prompt", "read the review comments and fix them");
            var typeRate = K.num("typeRate", 16, 2, 80);
            var model = K.str("model", "Default (recommended)");
            var effort = K.oneOf("effort", ["Default", "Low", "Medium", "High", "X-High", "Max"], "Medium");
            var mode = K.oneOf("mode", ["none", "autopilot", "plan"], "none");
            var statusLine = K.bool("statusLine", true);
            var autopilot = K.str("autopilot", "Full Auto (YOLO)");
            var mcp = K.str("mcp", "7/12");
            var mcpAttention = K.bool("mcpAttention", true);
            var peer = K.bool("peer", true);
            var auth = K.str("auth", "Claude CLI");
            var doSend = K.bool("send", true);
            var busyFor = K.num("busyFor", 1.2, 0, 10);
            var e = K.esc;

            // effort-selector.component.ts EFFORT_OPTIONS: bars filled + dot color; 5 slots, height 4 + i*2.5 (x2)
            var eff = {
              Default: { n: 0, c: "rgba(232,230,225,.4)" },
              Low: { n: 1, c: "#3b82f6" },
              Medium: { n: 2, c: "#16a34a" },
              High: { n: 3, c: "#f97316" },
              "X-High": { n: 4, c: "rgba(220,38,38,.8)" },
              Max: { n: 5, c: "#dc2626" },
            }[effort];
            var bars = "";
            for (var b = 0; b < 5; b++) {
              bars += '<i style="height:calc(' + (8 + b * 5) + " * var(--u));background:" + (b < eff.n ? eff.c : "rgba(232,230,225,.2)") + '"></i>';
            }

            var stage = document.getElementById("cp-stage");
            stage.innerHTML =
              '<div class="cp-card' + (mode !== "none" ? " " + mode : "") + '">' +
              '<div class="cp-input" data-ptah-part="input">' +
              '<span class="cp-ph" data-layout-allow-overlap>Ask a question or describe a task...</span>' +
              '<span class="cp-line"><span class="cp-text"></span><span class="pu-caret cp-caret"></span></span>' +
              "</div>" +
              '<div class="cp-toolbar">' +
              '<span class="cp-btn cp-attach">' + K.icon("plus", 28) + "</span>" +
              '<span class="cp-chip cp-model" data-ptah-part="model">' + K.icon("square", 28) + '<span class="nm trunc">' + e(model) + '</span><span style="opacity:.6">' + K.icon("chevron-down", 24) + "</span></span>" +
              '<span class="cp-chip cp-effort" data-ptah-part="effort"><span class="cp-bars">' + bars + "</span><span>" + e(effort) + '</span><span style="opacity:.6">' + K.icon("chevron-down", 24) + "</span></span>" +
              '<span class="cp-right">' +
              '<span class="cp-btn cp-mic">' + K.icon("mic", 28) + "</span>" +
              '<span class="cp-btn cp-round cp-stop">' + K.icon("square", 28) + "</span>" +
              '<span class="cp-sendwrap" data-ptah-part="send"><span class="cp-btn cp-round cp-send"><span class="cp-pulse"></span>' + K.icon("send", 32) + "</span></span>" +
              "</span></div></div>" +
              (statusLine
                ? '<div class="pu-status cp-status" data-ptah-part="status-line">' +
                  '<span class="pu-chip">' + K.icon("zap", 28, "#2563eb") + "<span>" + e(autopilot) + '</span><span style="opacity:.6">' + K.icon("chevron-down", 24) + "</span></span>" +
                  (mcp ? '<span class="pu-chip' + (mcpAttention ? " warn" : "") + '"><span class="pu-dot cp-mcpdot" style="background:' + (mcpAttention ? "#f97316" : "#16a34a") + '"></span><span>MCP</span><span class="tabular">' + e(mcp) + "</span></span>" : "") +
                  (peer ? '<span class="pu-chip">' + K.icon("message-square", 28) + "<span>Peer</span></span>" : "") +
                  (auth ? '<span class="auth trunc">' + e(auth) + "</span>" : "") +
                  "</div>"
                : "");

            var card = K.q(".cp-card");
            var ph = K.q(".cp-ph");
            var line = K.q(".cp-line");
            var text = K.q(".cp-text");
            var caret = K.q(".cp-caret");
            var send = K.q(".cp-send");
            var pulse = K.q(".cp-pulse");
            var stop = K.q(".cp-stop");
            var mic = K.q(".cp-mic");

            // cues: c3 follows the end of typing unless pinned; a pinned c3 speeds typing up so it still fits
            var given = String(K.vars.cues == null ? "" : K.vars.cues).split(",").map(function (s) {
              return s.trim() !== "" && isFinite(Number(s));
            });
            var c0 = K.cues([0, 0.5, 0.6]);
            var rate = typeRate;
            if (given[3]) {
              var room = Number(String(K.vars.cues).split(",")[3]) - 0.35 - c0[2];
              if (room > 0.2) rate = Math.max(typeRate, prompt.length / room);
            }
            var typeEnd = c0[2] + prompt.length / rate;
            var c = K.cues([0, 0.5, 0.6, typeEnd + 0.35, typeEnd + 0.6]);
            if (c[3] < typeEnd) c[3] = typeEnd;
            if (c[4] < c[3] + 0.14) c[4] = c[3] + 0.14;

            // stop/mic return and caret blink run on the component's own beats, not on the mount length
            // (root data-duration is not a reliable mount length once hosted)
            var busyOff = c[4] + Math.max(0.35, busyFor);
            var endT = Math.max(K.duration - 0.05, doSend && busyFor > 0 ? busyOff + 1 : c[4] + 1.5);
            K.focusFromVars(doSend ? c[3] : typeEnd + 0.5);

            // c0: card + chips left to right, status line
            K.settle(card, c[0]);
            K.qa(".cp-toolbar > .cp-btn, .cp-toolbar > .cp-chip, .cp-right > .cp-mic, .cp-sendwrap").forEach(function (el, i) {
              K.spring(el, c[0] + 0.12 + i * 0.09);
            });
            K.qa(".cp-status > *").forEach(function (el, i) {
              K.settle(el, c[0] + 0.2 + i * 0.09);
            });
            gsap.set(stop, { opacity: 0, scale: 0.6 });
            gsap.set(pulse, { opacity: 0, scale: 1 });
            // send is disabled (40%) until text exists (canSend(), chat-input.component.ts:381); the wrapper springs, the button dims
            gsap.set(send, { opacity: 0.4 });
            // c1: caret blink for the whole mount (steps, 0.25 s toggles)
            gsap.set(caret, { opacity: 0 });
            K.blink(caret, c[1], endT);
            // c2: placeholder off, typing, send enables on first char
            tl.set(ph, { opacity: 0 }, c[2]);
            K.type(text, prompt, c[2], rate);
            tl.fromTo(send, { opacity: 0.4 }, { opacity: 1, duration: 0.2, ease: "none", immediateRender: false }, c[2]);

            if (doSend) {
              // c3: press + ring pulse (12 px x2 growth over a 64 px button)
              K.press(send, c[3]);
              tl.fromTo(pulse, { opacity: 0.8, scale: 1 }, { opacity: 0, scale: 88 / 64, duration: 0.4, ease: "power3.out", immediateRender: false }, c[3] + 0.05);
              // c4: prompt leaves, placeholder returns, send disabled again
              tl.fromTo(line, { y: 0, opacity: 1 }, { y: -24 * K.U, opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, c[4]);
              tl.set(text, { textContent: "" }, c[4] + 0.32);
              tl.set(line, { y: 0, opacity: 1 }, c[4] + 0.32);
              tl.fromTo(ph, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none", immediateRender: false }, c[4] + 0.3);
              tl.fromTo(send, { opacity: 1 }, { opacity: 0.4, duration: 0.2, ease: "none", immediateRender: false }, c[4] + 0.3);
              if (busyFor > 0) {
                var shift = -76 * K.U;
                tl.fromTo(stop, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.6)", immediateRender: false }, c[4]);
                tl.fromTo(mic, { x: 0 }, { x: shift, duration: 0.45, ease: "power3.out", immediateRender: false }, c[4]);
                tl.fromTo(stop, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.6, duration: 0.25, ease: "power2.in", immediateRender: false }, busyOff);
                tl.fromTo(mic, { x: shift }, { x: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, busyOff + 0.1);
              }
            }
            K.finish(stage);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
