      <script>
          var B = 0.448;
          tl.fromTo("#f03-c1", { scale: 1.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "expo.out" }, T0);
          tl.fromTo("#f03-c2", { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, T0 + B);
          // The transcript slides out left (work leaves your session), the panel slides in from the right.
          tl.fromTo("#f03-in", { x: 0, opacity: 1 }, { x: -700, opacity: 0, duration: 0.45, ease: "expo.in" }, T0 + 2 * B);
          tl.fromTo("#f03-panel", { x: 500, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, T0 + 3 * B);
          tl.to("#f03-cap", { y: -40, opacity: 0, duration: 0.25, ease: "power3.in" }, T0 + 1.05);
          // After Glm completes: the panel leaves right, the transcript comes back.
          tl.to("#f03-panel", { x: 500, opacity: 0, duration: 0.25, ease: "expo.in" }, T0 + 4.75);
          tl.to("#f03-in", { x: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, T0 + 5.0);
