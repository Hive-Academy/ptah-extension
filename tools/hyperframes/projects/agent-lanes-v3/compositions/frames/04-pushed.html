<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Frame 04 - pushed back</title>
    <!-- Frame 04: Pushed back (STORYBOARD.md v2). 3.582 s = 2 bars.
         Bar 1: Glm is done; a gold packet travels left along its lane into "Your session", the node pulses.
         Bar 2: the result card grows out of the node (kit lane-completion-toast, a visualization of the pushed
         <agent-lane-completed> turn, eyebrow "PUSHED TO THE PARENT SESSION"); the verdict chip gets the focus ring.
         Rules: svg-path-draw (path follow), spring-pop-entrance, anchored-layout-expand. Diagram geometry is Frame 02's.
         Fragment for assemble.mjs: times are frame-local; the script runs on the main timeline at T0. -->
  </head>
  <body>
    <template>
      <style>
        #f04-node { transform-origin: 240px 620px; }
        /* Toast at u 1.6 (design 900 x 230), centred on the lane row of the node; grows from the node at (240, 620). */
        #f04-card { position: absolute; left: 300px; top: 436px; width: 1440px; height: 368px; transform-origin: -60px 184px; }
      </style>

      <div id="f04" class="scene" data-composition-id="f04" data-width="1920" data-height="1080" data-frame-start="10.746" data-frame-duration="3.582" data-seam-in="cut" data-duck="0">
        <div id="f04-vig" class="vig"></div>

        <svg id="f04-dia" class="dia" viewBox="0 0 1920 1080" aria-hidden="true">
          <path class="lnOn" d="M300 620 H640" />
          <path class="ln" d="M640 620 H1760" />
          <path class="ln" d="M640 620 C720 620 720 780 820 780 H1760" />
          <path class="ln" d="M640 620 C720 620 720 460 820 460 H1760" />
          <path class="lnOk" d="M640 620 C720 620 720 460 820 460 H1760" />
          <path id="f04-ride" d="M300 620 H640 C720 620 720 460 820 460 H1760" fill="none" stroke="none" />
          <path class="tick f04-tick" d="M820 620 H1760" />
          <path class="tick f04-tick" d="M820 780 H1760" />
          <circle class="ok" cx="848" cy="426" r="10" /><text class="lbl" x="870" y="438">Glm</text>
          <circle class="run" cx="848" cy="586" r="10" /><text class="lbl" x="870" y="598">Codex</text>
          <circle class="run" cx="848" cy="746" r="10" /><text class="lbl" x="870" y="758">Copilot</text>
          <circle id="f04-pkt" class="pkt" cx="1760" cy="460" r="14" opacity="0" />
          <text class="nlbl" x="240" y="726" text-anchor="middle">Your session</text>
        </svg>
        <!-- The node stays when the rest of the diagram steps out for the card. -->
        <svg id="f04-nodes" class="dia" viewBox="0 0 1920 1080" aria-hidden="true">
          <g id="f04-node">
            <circle class="node-ring" cx="240" cy="620" r="60" />
            <circle class="node-core" cx="240" cy="620" r="14" />
          </g>
        </svg>

        <div id="f04-card">
          <div id="f04-m1" class="clip fm" data-composition-id="ptah-ui-lane-completion-toast" data-composition-src="compositions/components/ptah-ui-lane-completion-toast.html" data-start="1.791" data-duration="1.791" data-track-index="1" data-variable-values='{"agent":"Glm","cli":"glm","status":"completed","task":"Review batch 5 code logic","verdict":"delivered","deliverable":".../reviews/batch-5.md","focus":"chip-verdict","focusAt":0.448,"dimOthers":1}' style="left: 0; top: 0; width: 1440px; height: 368px"></div>
        </div>

        <div id="f04-cap" class="cap"><span id="f04-c1">Results</span> <span id="f04-c2" class="g">come back</span> <span id="f04-c3">to you.</span></div>
        <div id="f04-sub" class="sub">Pushed to your session. No polling.</div>

        <audio id="sx-f04-hit" src="assets/sfx/impact-bass-1.mp3" data-start="0" data-duration="1.791" data-track-index="50" data-volume="0.55"></audio>
        <audio id="sx-f04-go" src="assets/sfx/pop.mp3" data-start="0" data-duration="0.5" data-track-index="51" data-volume="0.4"></audio>
        <audio id="sx-f04-in" src="assets/sfx/notification.mp3" data-start="0.896" data-duration="1.2" data-track-index="52" data-volume="0.5"></audio>
        <audio id="sx-f04-card" src="assets/sfx/whoosh-short.mp3" data-start="1.791" data-duration="0.575" data-track-index="53" data-volume="0.4"></audio>
        <audio id="sx-f04-chip" src="assets/sfx/sparkle.mp3" data-start="2.239" data-duration="0.9" data-track-index="54" data-volume="0.4"></audio>
      </div>

      <script>
          var B = 0.448, BAR = 1.791;
          var SPEED = 116.07, FLOW0 = 3.582;
          tl.fromTo(".f04-tick", { strokeDashoffset: -(10.746 - FLOW0) * SPEED }, { strokeDashoffset: -(14.328 - FLOW0) * SPEED, duration: 3.582, ease: "none" }, T0);

          // Caption on beat 1, sub-line on beat 2.
          tl.fromTo("#f04-c1", { scale: 1.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "expo.out" }, T0);
          tl.fromTo(["#f04-c2", "#f04-c3"], { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "expo.out", stagger: 0.09 }, T0 + B);
          tl.fromTo("#f04-sub", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, T0 + 2 * B);

          // The packet follows the Glm path from the lane end back to the node (a pure function of progress).
          var path = document.getElementById("f04-ride");
          var pkt = document.getElementById("f04-pkt");
          var len = path.getTotalLength();
          var ride = { p: 0 };
          function place() {
            var pt = path.getPointAtLength(len * (1 - ride.p));
            pkt.setAttribute("cx", pt.x.toFixed(1));
            pkt.setAttribute("cy", pt.y.toFixed(1));
          }
          place();
          tl.fromTo(pkt, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, T0);
          tl.fromTo(ride, { p: 0 }, { p: 1, duration: 0.896, ease: "sine.inOut", onUpdate: place }, T0);
          tl.to(pkt, { opacity: 0, duration: 0.08, ease: "none" }, T0 + 0.896);
          // Arrival: the node takes the packet.
          tl.fromTo("#f04-node", { scale: 1 }, { scale: 1.22, duration: 0.15, ease: "power2.out" }, T0 + 0.896);
          tl.to("#f04-node", { scale: 1, duration: 0.35, ease: "power3.out" }, T0 + 1.046);

          // Bar 2: the diagram steps out (only the node stays), the result card grows out of the node.
          tl.to("#f04-dia", { opacity: 0, duration: 0.25, ease: "power1.out" }, T0 + BAR);
          tl.fromTo("#f04-card", { scale: 0.08, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "expo.out" }, T0 + BAR);
      </script>
    </template>
  </body>
</html>
