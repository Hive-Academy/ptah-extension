<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Frame 2 - title, one prompt</title>
    <!-- Frame 2: Title "ONE PROMPT. / A WHOLE / AI TEAM." (STORYBOARD.md). 1.791 s = 1 bar; slams on beats 1-3, beat 4 holds.
         Fragment for assemble.mjs: times are frame-local; the script runs on the main timeline at T0. Rule: kinetic-beat-slam. -->
  </head>
  <body>
    <template>
      <style>
        #f02-vig { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 70% at 50% 42%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.45) 100%); }
        #f02-stage { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 160px; }
        .f02-line { font-family: "Archivo Black", sans-serif; font-size: 130px; line-height: 1.02; letter-spacing: -0.01em; color: #e8e6e1; text-transform: uppercase; white-space: nowrap; }
        #f02-l3 { color: #d4af37; align-self: flex-start; position: relative; }
        #f02-rule { position: absolute; left: 0; right: 0; bottom: -14px; height: 10px; background: #d4af37; transform-origin: 0 50%; }
      </style>

      <div id="f02" class="scene" data-composition-id="f02" data-width="1920" data-height="1080" data-frame-start="3.582" data-frame-duration="1.791" data-seam-in="glitch 0.35">
        <div id="f02-vig"></div>
        <div id="f02-stage">
          <div id="f02-l1" class="f02-line">One prompt.</div>
          <div id="f02-l2" class="f02-line">A whole</div>
          <div id="f02-l3" class="f02-line">AI team.<div id="f02-rule"></div></div>
        </div>
      </div>

      <script>
          // One beat array drives every hit (134 BPM). Distinct entrance per line; exactly one accent hue.
          var B = 0.448, BEATS = [0, B, 2 * B];
          tl.fromTo("#f02-l1", { scale: 1.45, filter: "blur(14px)", opacity: 0 }, { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.4, ease: "power4.out" }, T0 + BEATS[0]);
          tl.fromTo("#f02-l2", { x: 360, opacity: 0 }, { x: 0, opacity: 1, duration: 0.36, ease: "expo.out" }, T0 + BEATS[1]);
          tl.fromTo("#f02-l3", { y: 90, rotation: 5, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.42, ease: "circ.out" }, T0 + BEATS[2]);
          // Finale dressing on beat 4: the gold rule sweeps under "AI TEAM.", then the frame holds still.
          tl.fromTo("#f02-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "expo.out" }, T0 + 3 * B);
      </script>
    </template>
  </body>
</html>
