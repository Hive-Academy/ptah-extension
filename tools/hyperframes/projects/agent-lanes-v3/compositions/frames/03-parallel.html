<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Frame 03 - all at once</title>
    <!-- Frame 03: All at once (STORYBOARD.md v2). 5.373 s = 3 bars.
         Bar 1: the camera travels right along the three lanes. Bar 2: match cut, the lanes turn into the three
         columns of the real Agents panel, rows arrive on the same beat in all three. Bar 3 beat 3: Glm completes.
         Then the columns fold back into the lanes (Frame 04 opens on that diagram).
         Rules: viewport-change, card-morph-anchor, kinetic-beat-slam. Diagram geometry is Frame 02's.
         Fragment for assemble.mjs: times are frame-local; the script runs on the main timeline at T0. -->
  </head>
  <body>
    <template>
      <style>
        #f03-cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
        /* Agents panel at u 1.05 (design 1500 x 900). Lane columns: centres x 443 / 960 / 1476, y 253-906. */
        #f03-panel { position: absolute; left: 172px; top: 68px; width: 1575px; height: 945px; }
        .f03-bar { position: absolute; left: 400px; width: 940px; height: 6px; border-radius: 3px; background: #d4af37; transform-origin: 50% 50%; opacity: 0; }
        #f03-b1 { top: 457px; }
        #f03-b2 { top: 617px; }
        #f03-b3 { top: 777px; }
      </style>

      <div id="f03" class="scene" data-composition-id="f03" data-width="1920" data-height="1080" data-frame-start="5.373" data-frame-duration="5.373" data-seam-in="cut" data-duck="0">
        <div id="f03-vig" class="vig"></div>

        <div id="f03-cam">
          <svg id="f03-dia" class="dia" viewBox="0 0 1920 1080" aria-hidden="true">
            <path class="lnOn" d="M300 620 H640" />
            <path class="ln" d="M640 620 C720 620 720 460 820 460 H1760" />
            <path class="ln" d="M640 620 H1760" />
            <path class="ln" d="M640 620 C720 620 720 780 820 780 H1760" />
            <path id="f03-ok1" class="lnOk" d="M640 620 C720 620 720 460 820 460 H1760" opacity="0" />
            <path id="f03-k1" class="tick f03-tick" d="M820 460 H1760" />
            <path class="tick f03-tick" d="M820 620 H1760" />
            <path class="tick f03-tick" d="M820 780 H1760" />
            <circle class="run" cx="848" cy="426" r="10" /><circle id="f03-d1" class="ok" cx="848" cy="426" r="10" opacity="0" /><text class="lbl" x="870" y="438">Glm</text>
            <circle class="run" cx="848" cy="586" r="10" /><text class="lbl" x="870" y="598">Codex</text>
            <circle class="run" cx="848" cy="746" r="10" /><text class="lbl" x="870" y="758">Copilot</text>
            <circle class="node-ring" cx="240" cy="620" r="60" />
            <circle class="node-core" cx="240" cy="620" r="14" />
            <text class="nlbl" x="240" y="726" text-anchor="middle">Your session</text>
          </svg>
        </div>

        <div id="f03-panel">
          <div id="f03-m1" class="clip fm" data-composition-id="ptah-ui-agents-panel" data-composition-src="compositions/components/ptah-ui-agents-panel.html" data-start="1.791" data-duration="3.582" data-track-index="1" data-variable-values='{"count":3,"lane1Name":"Glm","lane1Status":"completed","lane2Name":"Codex","lane2Status":"running","lane3Name":"Copilot","lane3Status":"running","lane1Rows":"Read|stage.spec.ts;Bash|git status;Write|approval.md","lane1Text":"All checks pass.","lane2Rows":"Read|index.ts;Edit|composer.ts;Bash|nx test","lane3Rows":"Glob|*.spec.ts;Read|lane-layout.ts;Bash|nx lint","selected":1,"rowGap":0.448,"laneOffset":0,"cues":"0.2,0.25,0.3,0.5,2.0,2.687"}' style="left: 0; top: 0; width: 1575px; height: 945px"></div>
        </div>

        <div id="f03-b1" class="f03-bar"></div>
        <div id="f03-b2" class="f03-bar"></div>
        <div id="f03-b3" class="f03-bar"></div>

        <div id="f03-cap" class="cap"><span id="f03-c1">All</span> <span id="f03-c2" class="g">at once.</span></div>

        <audio id="sx-f03-hit" src="assets/sfx/impact-bass-2.mp3" data-start="0" data-duration="1.791" data-track-index="40" data-volume="0.55"></audio>
        <audio id="sx-f03-morph" src="assets/sfx/whoosh.mp3" data-start="1.791" data-duration="0.6" data-track-index="41" data-volume="0.45"></audio>
        <audio id="sx-f03-r1" src="assets/sfx/click-soft.mp3" data-start="2.291" data-duration="0.366" data-track-index="42" data-volume="0.5"></audio>
        <audio id="sx-f03-r2" src="assets/sfx/click-soft.mp3" data-start="2.739" data-duration="0.366" data-track-index="43" data-volume="0.5"></audio>
        <audio id="sx-f03-r3" src="assets/sfx/click-soft.mp3" data-start="3.187" data-duration="0.366" data-track-index="44" data-volume="0.5"></audio>
        <audio id="sx-f03-done" src="assets/sfx/ping.mp3" data-start="4.478" data-duration="0.6" data-track-index="45" data-volume="0.5"></audio>
        <audio id="sx-f03-fold" src="assets/sfx/whoosh-short.mp3" data-start="4.85" data-duration="0.523" data-track-index="46" data-volume="0.4"></audio>
      </div>

      <script>
          var B = 0.448, BAR = 1.791;
          // Work ticks: same film-time speed as Frame 02, so the cut does not jump.
          var SPEED = 116.07, FLOW0 = 3.582;
          tl.fromTo(".f03-tick", { strokeDashoffset: -(5.373 - FLOW0) * SPEED }, { strokeDashoffset: -(10.746 - FLOW0) * SPEED, duration: 5.373, ease: "none" }, T0);

          // Bar 1: caption, camera travels right along the lanes.
          tl.fromTo("#f03-c1", { scale: 1.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "expo.out" }, T0);
          tl.fromTo("#f03-c2", { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, T0 + B);
          tl.fromTo("#f03-cam", { x: 0 }, { x: -420, duration: 0.896, ease: "expo.inOut" }, T0);

          // Bar 2: the caption leaves, the lanes become the panel's three columns.
          tl.to("#f03-cap", { y: -40, opacity: 0, duration: 0.3, ease: "power3.in" }, T0 + BAR - 0.1);
          tl.to("#f03-cam", { opacity: 0, duration: 0.2, ease: "power1.out" }, T0 + BAR);
          var COLS = [443, 960, 1476], LANES = [460, 620, 780];
          ["#f03-b1", "#f03-b2", "#f03-b3"].forEach(function (id, i) {
            tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, T0 + BAR);
            // centre (870, lane) -> column centre (col, 580), vertical, 650 px long
            tl.fromTo(id, { x: 0, y: 0, rotation: 0, scaleX: 1 }, { x: COLS[i] - 870, y: 580 - LANES[i], rotation: 90, scaleX: 0.69, duration: 0.45, ease: "expo.inOut" }, T0 + BAR);
            tl.to(id, { opacity: 0, duration: 0.25, ease: "power1.in" }, T0 + BAR + 0.35);
          });

          // Fold (bar 3, after Glm completes): panel out, columns rotate back into the lanes, diagram returns at camera 0.
          var FOLD = 4.85;
          tl.to("#f03-panel", { opacity: 0, duration: 0.2, ease: "power1.in" }, T0 + FOLD);
          tl.set("#f03-cam", { x: 0 }, T0 + FOLD);
          tl.set(["#f03-ok1", "#f03-d1"], { opacity: 1 }, T0 + FOLD);
          tl.set("#f03-k1", { opacity: 0 }, T0 + FOLD);
          tl.set("#f03-b1", { backgroundColor: "#16a34a" }, T0 + FOLD);
          ["#f03-b1", "#f03-b2", "#f03-b3"].forEach(function (id, i) {
            tl.to(id, { opacity: 1, duration: 0.05, ease: "none" }, T0 + FOLD);
            // back to the full lane at camera 0: centre (1290, lane)
            tl.fromTo(id, { x: COLS[i] - 870, y: 580 - LANES[i], rotation: 90, scaleX: 0.69 }, { x: 420, y: 0, rotation: 0, scaleX: 1, duration: 0.4, ease: "expo.inOut", immediateRender: false }, T0 + FOLD + 0.03);
            tl.to(id, { opacity: 0, duration: 0.12, ease: "none" }, T0 + 5.25);
          });
          tl.to("#f03-cam", { opacity: 1, duration: 0.15, ease: "power1.out" }, T0 + 5.15);
      </script>
    </template>
  </body>
</html>
