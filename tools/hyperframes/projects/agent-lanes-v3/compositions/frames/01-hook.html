      <script>
          // Camera: one wrapper, transform-origin 0 0, screen = scale * world + (x, y).
          // Poses: macro 3.5 on slot 1's Bash badge (world 1150, 463) -> full window at the drop -> slow push.
          var BX = 1150, BY = 463, S0 = 3.5, S2 = 1.02;
          tl.fromTo("#f01-cam", { scale: S0, x: 960 - S0 * BX, y: 540 - S0 * BY }, {
            keyframes: [
              { scale: S0, x: 960 - S0 * BX, y: 540 - S0 * BY, duration: 0.591, ease: "none" },
              { scale: 1, x: 0, y: 0, duration: 1.2, ease: "expo.inOut" },
              { scale: S2, x: 960 - S2 * 960, y: 540 - S2 * 540, duration: 1.791, ease: "none" },
            ],
            ease: "none",
          }, T0);

          // Glitch: RGB split + slice displacement + blur on the lens, a pure function of quantized time.
          // Full strength until 0.591, bursts on beats 1-3, decays to clean at the drop (1.791).
          var lens = document.getElementById("f01-lens");
          var ro = document.getElementById("f01-ro");
          var bo = document.getElementById("f01-bo");
          var disp = document.getElementById("f01-disp");
          var turb = document.getElementById("f01-turb");
          var DROP = 1.791, BEATS = [0, 0.448, 0.896], STEP = 1 / 15;
          var decay = gsap.parseEase("power2.in");
          function hash(n) {
            var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return x - Math.floor(x);
          }
          function writeGlitch(t) {
            var base = t >= DROP ? 0 : t < 0.591 ? 1 : 1 - decay((t - 0.591) / 1.2);
            if (base <= 0.002) {
              lens.style.filter = "none";
              return;
            }
            var burst = 0;
            for (var i = 0; i < BEATS.length; i++) if (t >= BEATS[i]) burst = Math.max(burst, 1 - (t - BEATS[i]) / 0.18);
            var step = Math.floor(t / STEP);
            var sign = hash(step * 7 + 1) > 0.5 ? 1 : -1;
            var split = (10 + hash(step * 13 + 2) * 18) * base;
            ro.setAttribute("dx", (sign * split).toFixed(2));
            ro.setAttribute("dy", ((hash(step * 29 + 3) * 2 - 1) * split * 0.3).toFixed(2));
            bo.setAttribute("dx", (-sign * split * 0.8).toFixed(2));
            disp.setAttribute("scale", ((24 + 110 * burst) * base).toFixed(1));
            turb.setAttribute("seed", String(1 + (step % 97)));
            lens.style.filter = "url(#f01-glitch) blur(" + (3.5 * base).toFixed(2) + "px)";
          }
          var drive = { p: 0 };
          writeGlitch(0);
          tl.fromTo(drive, { p: 0 }, { p: 1, duration: DROP + 0.1, ease: "none", onUpdate: function () { writeGlitch(tl.time() - T0); } }, T0);
