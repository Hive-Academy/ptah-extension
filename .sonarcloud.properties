# SonarCloud automatic analysis settings.
#
# Excluded from analysis:
# - .ptah/**: task specs, design prototypes and their generated assets (for
#   example compiled Tailwind/DaisyUI CSS), which are documentation, not shipped code.
# - tools/**/__fixtures__/**: tool self-test fixtures, several of which are
#   deliberately invalid (unparsable templates, planted violations).
sonar.exclusions=.ptah/**,tools/**/__fixtures__/**
