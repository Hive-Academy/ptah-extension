# SonarCloud automatic-analysis settings (read from the default branch and PR heads).

# Vendored third-party bundles copied into HyperFrames video projects (minified upstream builds).
sonar.exclusions=tools/hyperframes/**/lib/**

# Copy-paste detection. The first three patterns mirror the project-level UI setting.
# tools/hyperframes is marketing video source (HyperFrames HTML/GSAP), not product code:
# its HyperFrames registry items and reference copies repeat by design (see tools/hyperframes/README.md).
sonar.cpd.exclusions=**/*.spec.ts,**/*.e2e.spec.ts,**/*.test.ts,tools/hyperframes/**
