# SonarCloud analysis scope.
# Test files repeat their arrange blocks on purpose. Copy-paste detection on them
# reports duplication that no reader would want removed, so exclude them from CPD
# only. They stay in scope for issues, coverage and security analysis.
sonar.cpd.exclusions=**/*.spec.ts,**/*.spec.js,**/*.e2e.spec.ts,**/*-spec.ts,**/*.test.ts
