<div class="flex flex-col gap-1.5">
  @if (label(); as heading) {
    <p class="text-sm font-semibold text-base-content">{{ heading }}</p>
  }

  <!--
    role="progressbar" carries the machine values; the visible text below
    carries the same facts for everyone else. The two are produced from one
    pair of counts so they cannot disagree.
  -->
  <div
    class="h-1.5 w-full overflow-hidden rounded-full bg-base-300"
    role="progressbar"
    [attr.aria-valuenow]="percent()"
    aria-valuemin="0"
    aria-valuemax="100"
    [attr.aria-label]="accessibleLabel()"
  >
    <div
      class="h-full rounded-full bg-primary transition-[width] duration-300"
      [style.width]="barWidth()"
    ></div>
  </div>

  <p
    class="flex items-center justify-between gap-2 font-mono text-xs text-base-content-muted"
  >
    <span>{{ percentLabel() }} complete</span>
    <span>{{ countLabel() }}</span>
  </p>
</div>
