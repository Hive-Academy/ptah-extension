@if (count() > 0) {
  <div
    class="toolbar-enter flex items-center justify-between gap-3 rounded-md border border-primary/20 bg-primary/10 px-3 py-2 text-sm"
    role="region"
    [attr.aria-label]="'panelUi.selectionToolbar.region' | transloco"
  >
    <div class="flex items-center gap-3">
      <span class="font-medium tabular-nums text-accent">
        {{
          countI18nKeys[pluralCategory(count())]
            | transloco
              : {
                  count: count(),
                  noun:
                    itemNoun() ?? ('panelUi.selectionToolbar.item' | transloco),
                }
        }}
      </span>
      <button
        type="button"
        class="btn btn-ghost btn-xs"
        (click)="cleared.emit()"
      >
        {{ 'panelUi.selectionToolbar.clear' | transloco }}
      </button>
    </div>

    <div class="flex flex-wrap items-center justify-end gap-2">
      <ng-content />
    </div>
  </div>
}
