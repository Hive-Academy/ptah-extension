@if (link(); as target) {
  <a
    [routerLink]="target"
    [queryParams]="linkQueryParams()"
    class="group flex flex-col gap-1 rounded-lg border border-hairline bg-base-200 p-4 transition-colors hover:border-primary/40 hover:bg-surface-high"
  >
    <ng-container [ngTemplateOutlet]="body" />
  </a>
} @else {
  <div
    class="flex flex-col gap-1 rounded-lg border border-hairline bg-base-200 p-4"
  >
    <ng-container [ngTemplateOutlet]="body" />
  </div>
}

<ng-template #body>
  <div class="flex items-center justify-between gap-2">
    <span
      class="text-xs font-semibold uppercase tracking-wide text-base-content-muted"
    >
      {{ label() }}
    </span>
    @if (link()) {
      <!--
        The RTL mirror sits on this wrapper, never on <lucide-angular>:
        lucide-angular copies the host's static classes onto its inner <svg>,
        so a host flip is applied twice and cancels (batches.md, "Icon
        mirroring mechanism").
      -->
      <span class="inline-flex shrink-0 rtl:scale-x-[-1]" aria-hidden="true">
        <!-- rtl-exempt: the parent wrapper's rtl:scale-x-[-1] flips this icon's x axis, so the positive hover nudge already points to reading-end in RTL; an rtl:-translate-x variant here would point it back to reading-start -->
        <lucide-angular
          [img]="ChevronRightIcon"
          class="h-4 w-4 shrink-0 text-base-content-muted transition-transform group-hover:translate-x-0.5"
          aria-hidden="true"
        />
      </span>
    }
  </div>

  <span [class]="valueClass()">{{ valueText() }}</span>

  @if (delta(); as d) {
    <span [class]="deltaClass()">{{ d }}</span>
  }
</ng-template>
