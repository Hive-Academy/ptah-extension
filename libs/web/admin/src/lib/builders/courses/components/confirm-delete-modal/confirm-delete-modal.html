@if (open()) {
  <dialog class="modal modal-open" aria-labelledby="confirm-delete-title">
    <div class="modal-box max-w-lg">
      <header class="mb-4 flex items-start justify-between gap-4">
        <h3 id="confirm-delete-title" class="text-lg font-semibold text-error">
          {{ title() }}
        </h3>
        <button
          type="button"
          class="btn btn-ghost btn-sm btn-square"
          aria-label="Close"
          [disabled]="deleting()"
          (click)="onCloseClick()"
        >
          ✕
        </button>
      </header>

      <form (submit)="onSubmit($event)" class="flex flex-col gap-4">
        @if (errorMessage(); as msg) {
          <div class="alert alert-error text-sm" role="alert">
            <span>{{ msg }}</span>
          </div>
        }

        <div class="rounded-lg border border-hairline p-3 text-sm">
          <div class="font-medium">{{ subject() }}</div>
          @if (detail(); as sub) {
            <div class="font-mono text-xs opacity-60">{{ sub }}</div>
          }
        </div>

        <div class="alert alert-warning text-sm" role="note">
          <span>{{ consequence() }}</span>
        </div>

        <div class="modal-action">
          <button
            type="button"
            class="btn btn-ghost"
            [disabled]="deleting()"
            (click)="onCloseClick()"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="btn btn-error px-8"
            [disabled]="deleting()"
          >
            @if (deleting()) {
              <span class="loading loading-spinner loading-sm"></span>
              Deleting…
            } @else {
              {{ confirmLabel() }}
            }
          </button>
        </div>
      </form>
    </div>
    <button
      type="button"
      class="modal-backdrop"
      aria-label="Close modal"
      [disabled]="deleting()"
      (click)="onCloseClick()"
    >
      close
    </button>
  </dialog>
}
