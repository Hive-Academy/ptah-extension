<div
  class="ptah-fc relative rounded-lg border border-base-300 bg-base-200 p-3"
  [class.opacity-60]="loading()"
>
  <full-calendar [options]="calendarOptions()" [events]="calendarEvents()" />

  @if (loading()) {
    <div
      class="pointer-events-none absolute inset-0 flex items-start justify-center pt-24"
      role="status"
      aria-live="polite"
    >
      <span class="loading loading-spinner loading-lg text-primary"></span>
      <span class="sr-only">Loading sessions</span>
    </div>
  }
</div>
