<div class="flex flex-col items-center justify-center gap-3 py-12 text-center">
  <lucide-angular
    [img]="icon()"
    class="h-10 w-10 text-ink-500"
    aria-hidden="true"
  />
  <p class="text-sm text-ink-400">{{ message() }}</p>
  @if (hint(); as h) {
    <p class="max-w-sm text-xs text-ink-500">{{ h }}</p>
  }
  <div class="mt-1 empty:hidden">
    <ng-content />
  </div>
</div>
