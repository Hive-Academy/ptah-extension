@if (hasPreview()) {
  <div class="flex flex-col">
    <div class="text-sm font-medium border-b border-base-300 pb-2 mb-2">
      <span class="text-base-content/60">Subject:</span>
      {{ previewSubject() || '(no subject)' }}
    </div>
    <iframe
      [attr.sandbox]="''"
      [srcdoc]="srcdoc()"
      title="Email preview"
      class="w-full h-[420px] rounded-md border border-base-300 bg-white"
    ></iframe>
  </div>
} @else {
  <ptah-admin-empty-state [icon]="EyeIcon" message="Nothing to preview yet" />
}
