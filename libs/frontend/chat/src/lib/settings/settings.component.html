<!--
  SettingsComponent - Compact VS Code Sidebar Design

  Visibility Rules:
  - Authentication: Always visible
  - Model Selection & Autopilot: Visible after auth configured
  - MCP Port & LLM Providers: Available to everyone

  Follows VS Code UX Guidelines:
  - Icons: 16-20px (was 24px+)
  - Headings: 14-16px (text-sm)
  - Padding: 12-16px (px-3, py-3)
  - Compact spacing: space-y-3, gap-2
-->

<div class="h-full overflow-y-auto bg-base-100">
  <div class="max-w-4xl mx-auto px-3 py-3 space-y-3 md:px-6 lg:px-8">
    <!-- Compact Header with back button -->
    <div class="flex items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <button
          class="btn btn-ghost btn-xs gap-1.5"
          (click)="backToChat()"
          aria-label="Back to Chat"
          data-testid="settings-back"
        >
          <lucide-angular [img]="ArrowLeftIcon" class="w-3.5 h-3.5" />
          <span class="text-xs">Back</span>
        </button>
        <h1 class="text-sm font-semibold">Settings</h1>
      </div>
    </div>

    <!-- Tab Bar (4 tabs: Providers, Agent Orchestration, Advanced, Search & Voice) -->
    <div class="tabs tabs-boxed bg-base-200/50 p-1 gap-1 flex-wrap">
      <button
        class="tab tab-sm flex-1 gap-1.5"
        [class.tab-active]="activeSettingsTab() === 'claude-auth'"
        (click)="setActiveTab('claude-auth')"
      >
        <lucide-angular [img]="KeyIcon" class="w-3 h-3" />
        <span class="text-xs">Providers</span>
      </button>
      <button
        class="tab tab-sm flex-1 gap-1.5"
        [class.tab-active]="activeSettingsTab() === 'orchestration'"
        (click)="setActiveTab('orchestration')"
      >
        <lucide-angular [img]="CpuIcon" class="w-3 h-3" />
        <span class="text-xs">Agent Orchestration</span>
      </button>
      <button
        class="tab tab-sm flex-1 gap-1.5"
        [class.tab-active]="activeSettingsTab() === 'pro-features'"
        (click)="setActiveTab('pro-features')"
      >
        <lucide-angular [img]="SparklesIcon" class="w-3 h-3" />
        <span class="text-xs">Advanced</span>
      </button>
      <button
        class="tab tab-sm flex-1 gap-1.5"
        [class.tab-active]="activeSettingsTab() === 'tools'"
        (click)="setActiveTab('tools')"
      >
        <lucide-angular [img]="GlobeIcon" class="w-3 h-3" />
        <span class="text-xs">Search &amp; Voice</span>
      </button>
    </div>

    <!-- ============================================ -->
    <!-- Tab 1: Claude Auth                          -->
    <!-- ============================================ -->
    @if (activeSettingsTab() === 'claude-auth') {
      <ptah-providers-settings [focusTarget]="providersTarget()" [requestedProviderId]="requestedProviderId() ?? ''" />
    }

    <!-- ============================================ -->
    <!-- Tab 2: Agent Orchestration                  -->
    <!-- ============================================ -->
    @if (activeSettingsTab() === 'orchestration') {
      <ptah-agent-orchestration-config />
    }

    <!-- ============================================ -->
    <!-- Tab 3: Advanced (System Prompt, MCP Port, VS Code LM) -->
    <!-- ============================================ -->
    @if (activeSettingsTab() === 'pro-features') {
    <!-- License Status Card -->
    <ptah-license-status-card />

    <!-- Data Portability -->
    <div class="border border-secondary/30 rounded-md bg-secondary/5">
      <div class="p-3">
        <div class="flex items-center gap-1.5 mb-2">
          <lucide-angular
            [img]="ArrowLeftRightIcon"
            class="w-3.5 h-3.5 text-secondary"
          />
          <h2 class="text-xs font-medium uppercase tracking-wide">
            Data Portability
          </h2>
        </div>
        <p class="text-xs text-base-content-muted mb-3">
          Export or import your settings, API keys, and preferences.
        </p>
        <div class="flex gap-2">
          <button
            class="btn btn-outline btn-xs gap-1 flex-1"
            [disabled]="isExporting()"
            (click)="exportSettings()"
            aria-label="Export settings"
          >
            @if (isExporting()) {
              <span class="loading loading-spinner loading-xs"></span>
            } @else {
              <lucide-angular [img]="UploadIcon" class="w-3 h-3" />
            }
            <span>Export</span>
          </button>
          <button
            class="btn btn-outline btn-xs gap-1 flex-1"
            [disabled]="isImporting()"
            (click)="importSettings()"
            aria-label="Import settings"
          >
            @if (isImporting()) {
              <span class="loading loading-spinner loading-xs"></span>
            } @else {
              <lucide-angular [img]="DownloadIcon" class="w-3 h-3" />
            }
            <span>Import</span>
          </button>
        </div>
      </div>
    </div>


      <ptah-enhanced-prompts-config />
      <ptah-output-style-config />
      <ptah-workflows-config />
      <ptah-mcp-port-config />
      <ptah-vscode-lm-config (modelChanged)="onModelChanged()" />
    }

    <!-- ============================================ -->
    <!-- Tab 4: Search & Voice (web search + voice transcription) -->
    <!-- ============================================ -->
    @if (activeSettingsTab() === 'tools') {
      <!-- Web Search Config (free for all users, not premium-gated) -->
      <ptah-web-search-config />

      @if (isElectron) {
        <ptah-voice-config />
      }
    }
  </div>
</div>
