<div class="flex flex-col h-full w-full">
  <!-- Header -->
  <header
    class="flex items-center gap-3 px-6 py-3 border-b border-base-300 bg-base-100 shrink-0"
  >
    <button
      class="btn btn-ghost btn-sm btn-circle"
      (click)="goBack()"
      aria-label="Back to chat"
    >
      <lucide-angular
        [img]="ArrowLeftIcon"
        class="w-4 h-4"
        aria-hidden="true"
      />
    </button>
    <div
      class="w-8 h-8 rounded-lg bg-primary/10 border border-primary/20 flex items-center justify-center"
    >
      <lucide-angular
        [img]="StoreIcon"
        class="w-4 h-4 text-primary"
        aria-hidden="true"
      />
    </div>
    <h1 class="text-base font-bold text-base-content">Marketplace</h1>
  </header>

  <!-- Content -->
  <main class="flex-1 overflow-y-auto p-6">
    <div class="max-w-3xl mx-auto">
      <ptah-native-tab-group
        [tabs]="sectionTabs"
        [activeId]="activeSection()"
        ariaLabel="Marketplace sections"
        (tabSelected)="onSection($event)"
      >
        <div class="pt-5">
          @switch (activeSection()) {
            @case ('connected') {
              <ptah-connected-surface
                [refreshTrigger]="refreshTrigger()"
                [connectorServers]="connectorServers()"
                (contentChanged)="onContentChanged()"
                (navigateRequested)="onNavigateRequested($event)"
              />
            }
            @case ('apps') {
              @if (activeSource(); as source) {
                <ptah-apps-section
                  [activeSource]="source"
                  [refreshTrigger]="refreshTrigger()"
                  [connectorServers]="connectorServers()"
                  (sourceSelected)="onSource($event)"
                  (contentChanged)="onContentChanged()"
                />
              }
            }
            @case ('skills') {
              @if (activeSource(); as source) {
                <ptah-skills-section
                  [activeSource]="source"
                  [refreshTrigger]="refreshTrigger()"
                  (sourceSelected)="onSource($event)"
                  (contentChanged)="onContentChanged()"
                />
              }
            }
          }
        </div>
      </ptah-native-tab-group>
    </div>
  </main>
</div>
