name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '.claude/**'
      - 'LICENSE.md'
      - '.do/**'

# Cancel in-progress runs for the same branch/PR — only the latest push matters
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  # 24, not 22: node 22 ships npm 10, which cannot resolve our npm-11 lockfile
  # and silently degrades `npm ci` into an unpinned `npm install` fallback.
  # Node 24 bundles npm 11, which is why package.json pins engines.node to
  # `24.x` and declares no engines.npm at all -- the DO buildpack string-
  # compares engines.npm and self-installs npm when it differs, which crashes.
  # The publish-* workflows stay on 22 deliberately -- they match release targets.
  NODE_VERSION: 24
  NX_TUI: false

jobs:
  main:
    runs-on: ubuntu-latest
    # 60, not 30: every run before 2026-08-19 died at the test step and never
    # reached "nx affected -t build", so 30 was only ever measured against a
    # failing job. The first fully-passing run was cut off mid-build at 30m.
    timeout-minutes: 60
    # Skip closed/merged PRs and bot bumps from publish-cli.yml,
    # publish-electron.yml, and publish-extension.yml: chore/bump-cli-v*,
    # chore/bump-electron-v*, and chore/bump-extension-v*. Human
    # chore/bump-<dep> branches run CI; PR #512 was skipped by the old broad guard.
    # Accepted residual: a human chore/bump-electron-v… branch still skips. On
    # pull_request, head_commit is null; keep its check for any future non-PR trigger.
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.state == 'open') &&
      !startsWith(github.head_ref, 'chore/bump-cli-v') &&
      !startsWith(github.head_ref, 'chore/bump-electron-v') &&
      !startsWith(github.head_ref, 'chore/bump-extension-v') &&
      !contains(github.event.head_commit.message, 'chore(release)')
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Cache node_modules directly — skips npm ci entirely on cache hit
      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        # Fall back to `npm install` if lockfile drift (npm/cli#4828:
        # Windows-generated lockfiles omit transitive deps under
        # sass-embedded's catch-all packages, breaking `npm ci` on Linux).
        run: npm ci || npm install --no-audit --no-fund

      # Always run — cached node_modules may be missing Linux platform
      # binaries (npm/cli#4828: package-lock.json generated on Windows omits
      # them). Without unrs-resolver, jest can't resolve preset paths.
      - name: Install Linux platform binaries
        run: npm install @rollup/rollup-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu --no-save --force

      # Cache key is keyed on package-lock.json only. When the runner Node
      # ABI changes (or when the cache was populated by a different OS), the
      # better-sqlite3 prebuilt binary fails to self-register at require()
      # time. Rebuilding it is cheap and idempotent — always run.
      - name: Rebuild native modules for runner Node ABI
        run: npm rebuild better-sqlite3

      # Cache Prisma generated client
      - name: Cache Prisma client
        id: cache-prisma
        uses: actions/cache@v4
        with:
          path: node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('apps/ptah-license-server/prisma/schema.prisma') }}

      - name: Generate Prisma client
        if: steps.cache-prisma.outputs.cache-hit != 'true'
        run: npx nx run ptah-license-server:prisma:generate

      # Nx task cache. `affected` only picks the task LIST; the cache decides
      # which of those tasks actually execute. Without this, every run starts
      # cold, so a PR that touches `libs/shared` re-runs ~80 projects from
      # scratch even though their own test/build inputs never changed
      # (measured on PR #464: 73 of 97 projects affected by the source files
      # alone, 97 once the root eslint.config.mjs is counted). The key carries
      # the SHA because GitHub cache entries are immutable — the prefix
      # restore-key is what actually reuses the previous run's results.
      - name: Cache Nx task results
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main

      # DI invariant gate — every @inject(token) must resolve to a
      # register*(token, ...) call somewhere. Also runs the meta self-test
      # against a planted fixture so a broken linter can't silently pass.
      - name: di-lint (DI invariant + self-test)
        run: |
          npx nx run di-lint:self-test
          npx nx run di-lint:lint

      # Degradation-audit ratchet (TASK_2026_383 Batch 3) — per-directory
      # inventory of silently swallowed catch/`.catch()` sites. Also runs its
      # own meta self-test against a planted fixture first, same discipline as
      # di-lint above: a broken detector must not silently pass.
      # Invoked through the local nx binary rather than `npx`, which can
      # install a package on demand and run its lifecycle scripts
      # (githubactions:S6505, S8543 — cwe:494, cwe:829). Applied only to these
      # two lines, new in this PR; the sibling di-lint step above is
      # pre-existing and deliberately left untouched.
      - name: degradation-audit (swallowed-failure ratchet + self-test)
        run: |
          node node_modules/nx/bin/nx.js run degradation-audit:self-test
          node node_modules/nx/bin/nx.js run degradation-audit:lint

      # Required coverage gate (TASK_2025_294 W8.B1). Per-project
      # `coverageThreshold` stanzas in each `jest.config.ts` are ratcheted
      # to the current baseline rounded down to the nearest 5. A drop below
      # the floor fails the job; specs are free to increase coverage.
      # `--maxWorkers=2`, because `--parallel=3` bounds the wrong thing. It caps
      # Nx TASKS; each task then starts its own Jest coordinator with its own
      # worker pool, so the two numbers multiply. Three tasks on a runner
      # therefore ask for three coordinators plus up to ~45 workers, under
      # coverage instrumentation, beside the real `node` children cli-engine's
      # auth specs spawn on purpose. That is the oversubscription behind suites
      # running 114-250 s in CI against seconds locally (TASK_2026_404_edeb).
      #
      # These two flags stay even though `jest.preset.js` now sets
      # `maxWorkers: '50%'` and `nx.json` sets `parallel: 2` (TASK_2026_486_3b7e,
      # which capped the LOCAL default after the same oversubscription starved a
      # developer's machine). A CLI flag beats both, so CI keeps the values
      # measured here rather than inheriting a default tuned for a 16-core
      # workstation — `'50%'` of a 4-core runner would be 2 by coincidence and
      # 1 on a 2-core runner.
      #
      # Measured on one host, warm: cli-engine coverage 16.9 s → 9.2 s at
      # `--maxWorkers=2`; agent-sdk 17.2 s → 8.1 s at `--maxWorkers=4`, and the
      # "worker process failed to exit gracefully" warning stopped appearing.
      # Capping is FASTER here, not a trade — an oversubscribed pool spends its
      # time context-switching.
      #
      # `--forceExit` is deliberately NOT used. Jest already force-exits a
      # worker that misses its 500 ms deadline, so the flag would only cut off
      # the coordinator's own coverage write, and TASK_2026_404_edeb measured no
      # leaked handle for it to paper over.
      # Invoked through the local nx binary rather than `npx` for the same
      # reason the degradation-audit step above is (githubactions:S6505, S8543
      # — cwe:494, cwe:829). This line was pre-existing and therefore exempt
      # until the worker cap edited it; an edited line is new code to the
      # scanner, so the exemption ended with the edit.
      - name: Run affected tests with coverage
        run: node node_modules/nx/bin/nx.js affected -t test --coverage --parallel=3 --maxWorkers=2

      # `scripts/` is not an Nx project, so the step above cannot see it and the
      # root `jest.config.ts` (`getJestProjectsAsync()`) cannot either. Run its
      # standalone config explicitly — `scripts/drain-observation-queue.spec.ts`
      # covers a script that DELETES rows from the production database, and an
      # un-run spec rots into a false green.
      - name: Run scripts/ tests
        run: npm run test:scripts

      - run: npx nx affected -t build
