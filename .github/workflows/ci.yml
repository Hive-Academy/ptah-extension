name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '.claude/**'
      - 'LICENSE.md'
      - '.do/**'

# Cancel in-progress runs for the same branch/PR — only the latest push matters
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # 24, not 22: node 22 ships npm 10, which cannot resolve our npm-11 lockfile
  # and silently degrades `npm ci` into an unpinned `npm install` fallback.
  # Node 24 bundles npm 11, which is why package.json pins engines.node to
  # `24.x` and declares no engines.npm at all -- the DO buildpack string-
  # compares engines.npm and self-installs npm when it differs, which crashes.
  # The publish-* workflows stay on 22 deliberately -- they match release targets.
  NODE_VERSION: 24
  NX_TUI: false

jobs:
  main:
    runs-on: ubuntu-latest
    # Minimal job-level permissions (githubactions:S8264: permissions moved
    # from workflow level to jobs): `contents: read` for the checkout,
    # `actions: read` for nrwl/nx-set-shas to read prior workflow-run SHAs.
    permissions:
      actions: read
      contents: read
    # 60, not 30: every run before 2026-08-19 died at the test step and never
    # reached "nx affected -t build", so 30 was only ever measured against a
    # failing job. The first fully-passing run was cut off mid-build at 30m.
    timeout-minutes: 60
    # Skip closed/merged PRs and bot bumps from publish-cli.yml,
    # publish-electron.yml, and publish-extension.yml: chore/bump-cli-v*,
    # chore/bump-electron-v*, and chore/bump-extension-v*. Human
    # chore/bump-<dep> branches run CI; PR #512 was skipped by the old broad guard.
    # Accepted residual: a human chore/bump-electron-v… branch still skips. On
    # pull_request, head_commit is null; keep its check for any future non-PR trigger.
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.state == 'open') &&
      !startsWith(github.head_ref, 'chore/bump-cli-v') &&
      !startsWith(github.head_ref, 'chore/bump-electron-v') &&
      !startsWith(github.head_ref, 'chore/bump-extension-v') &&
      !contains(github.event.head_commit.message, 'chore(release)')
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Cache node_modules directly — skips npm ci entirely on cache hit
      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        # Fall back to `npm install` if lockfile drift (npm/cli#4828:
        # Windows-generated lockfiles omit transitive deps under
        # sass-embedded's catch-all packages, breaking `npm ci` on Linux).
        run: npm ci || npm install --no-audit --no-fund

      # Always run — cached node_modules may be missing Linux platform
      # binaries (npm/cli#4828: package-lock.json generated on Windows omits
      # them). Without unrs-resolver, jest can't resolve preset paths.
      - name: Install Linux platform binaries
        run: npm install @rollup/rollup-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu --no-save --force

      # Cache key is keyed on package-lock.json only. When the runner Node
      # ABI changes (or when the cache was populated by a different OS), the
      # better-sqlite3 prebuilt binary fails to self-register at require()
      # time. Rebuilding it is cheap and idempotent — always run.
      - name: Rebuild native modules for runner Node ABI
        run: npm rebuild better-sqlite3

      # Cache Prisma generated client
      - name: Cache Prisma client
        id: cache-prisma
        uses: actions/cache@v4
        with:
          path: node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('apps/ptah-license-server/prisma/schema.prisma') }}

      - name: Generate Prisma client
        if: steps.cache-prisma.outputs.cache-hit != 'true'
        run: npx nx run ptah-license-server:prisma:generate

      # Nx task cache. `affected` only picks the task LIST; the cache decides
      # which of those tasks actually execute. Without this, every run starts
      # cold, so a PR that touches `libs/shared` re-runs ~80 projects from
      # scratch even though their own test/build inputs never changed
      # (measured on PR #464: 73 of 97 projects affected by the source files
      # alone, 97 once the root eslint.config.mjs is counted). The key carries
      # the SHA because GitHub cache entries are immutable — the prefix
      # restore-key is what actually reuses the previous run's results.
      - name: Cache Nx task results
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main

      # DI invariant gate — every @inject(token) must resolve to a
      # register*(token, ...) call somewhere. Also runs the meta self-test
      # against a planted fixture so a broken linter can't silently pass.
      - name: di-lint (DI invariant + self-test)
        run: |
          npx nx run di-lint:self-test
          npx nx run di-lint:lint

      # Degradation-audit ratchet (TASK_2026_383 Batch 3) — per-directory
      # inventory of silently swallowed catch/`.catch()` sites. Also runs its
      # own meta self-test against a planted fixture first, same discipline as
      # di-lint above: a broken detector must not silently pass.
      # Use npm's local binary shim rather than `npx`, which can install a
      # package on demand and run its lifecycle scripts (githubactions:S6505,
      # S8543 — cwe:494, cwe:829). Do not reach into Nx package internals:
      # Nx 23 removed `nx/bin/nx.js`, while this install-generated shim follows
      # the package's current `bin` field.
      - name: degradation-audit (swallowed-failure ratchet + self-test)
        run: |
          node_modules/.bin/nx run degradation-audit:self-test
          node_modules/.bin/nx run degradation-audit:lint

      # Required coverage gate (TASK_2025_294 W8.B1). Per-project
      # `coverageThreshold` stanzas in each `jest.config.ts` are ratcheted
      # to the current baseline rounded down to the nearest 5. A drop below
      # the floor fails the job; specs are free to increase coverage.
      # `--maxWorkers=2`, because `--parallel=3` bounds the wrong thing. It caps
      # Nx TASKS; each task then starts its own Jest coordinator with its own
      # worker pool, so the two numbers multiply. Three tasks on a runner
      # therefore ask for three coordinators plus up to ~45 workers, under
      # coverage instrumentation, beside the real `node` children cli-engine's
      # auth specs spawn on purpose. That is the oversubscription behind suites
      # running 114-250 s in CI against seconds locally (TASK_2026_404_edeb).
      #
      # These two flags stay even though `jest.preset.js` now sets
      # `maxWorkers: '50%'` and `nx.json` sets `parallel: 2` (TASK_2026_486_3b7e,
      # which capped the LOCAL default after the same oversubscription starved a
      # developer's machine). A CLI flag beats both, so CI keeps the values
      # measured here rather than inheriting a default tuned for a 16-core
      # workstation — `'50%'` of a 4-core runner would be 2 by coincidence and
      # 1 on a 2-core runner.
      #
      # Measured on one host, warm: cli-engine coverage 16.9 s → 9.2 s at
      # `--maxWorkers=2`; agent-sdk 17.2 s → 8.1 s at `--maxWorkers=4`, and the
      # "worker process failed to exit gracefully" warning stopped appearing.
      # Capping is FASTER here, not a trade — an oversubscribed pool spends its
      # time context-switching.
      #
      # `--forceExit` is deliberately NOT used. Jest already force-exits a
      # worker that misses its 500 ms deadline, so the flag would only cut off
      # the coordinator's own coverage write, and TASK_2026_404_edeb measured no
      # leaked handle for it to paper over.
      # Use npm's local binary shim rather than `npx`, which can install a
      # package on demand and run its lifecycle scripts (githubactions:S6505,
      # S8543 — cwe:494, cwe:829). Do not reach into Nx package internals:
      # Nx 23 removed `nx/bin/nx.js`, while this install-generated shim follows
      # the package's current `bin` field.
      - name: Run affected tests with coverage
        run: node_modules/.bin/nx affected -t test --coverage --parallel=3 --maxWorkers=2

      # `scripts/` is not an Nx project, so the step above cannot see it and the
      # root `jest.config.ts` (`getJestProjectsAsync()`) cannot either. Run its
      # standalone config explicitly — `scripts/drain-observation-queue.spec.ts`
      # covers a script that DELETES rows from the production database, and an
      # un-run spec rots into a false green.
      - name: Run scripts/ tests
        run: npm run test:scripts

      - run: npx nx affected -t build

  # Batch 8 (TASK_2026_576_e16a, Component 9 / R3): the real-git suites for
  # RC5 (git-watcher) and RC4/RC7 (git-info.service paths + diff-config) are
  # evidenced on Windows only in Batches 3 and 4 -- POSIX-only fixture names
  # (`a"b`, `a\b`, trailing space) are skipped there. This job proves the
  # same suites on Linux and macOS to close that carried risk. Selection is
  # by filename pattern, not an explicit file list, so every current and
  # future `*.real-git.spec.ts` file (including the ones Batch 5 is still
  # adding under vscode-core) is picked up without another edit here.
  git-real-git:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Minimal job-level permissions (githubactions:S8264): `contents: read`
    # for the checkout; this job reads no workflow-run metadata.
    permissions:
      contents: read
    # 30 min covers a from-scratch npm ci plus a native rebuild on the
    # slowest runner (windows-latest); the main job budgets 60 for the full
    # affected graph, this job only ever runs two projects' real-git specs.
    timeout-minutes: 30
    # Same skip guard as the main job: closed/merged PRs and the bot bump
    # branches from the publish-*.yml workflows never need this evidence.
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.state == 'open') &&
      !startsWith(github.head_ref, 'chore/bump-cli-v') &&
      !startsWith(github.head_ref, 'chore/bump-electron-v') &&
      !startsWith(github.head_ref, 'chore/bump-extension-v') &&
      !contains(github.event.head_commit.message, 'chore(release)')
    # Force bash everywhere: windows-latest defaults `run:` steps to pwsh,
    # and the `npm ci || npm install` fallback below relies on POSIX `||`
    # semantics being identical across all three runners. Git Bash ships on
    # windows-latest.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The real-git specs each set local (per-repo) user.name/user.email and
      # pin their own default branch via `git init -b main` or an explicit
      # `symbolic-ref HEAD refs/heads/main`, so they do not depend on this --
      # but a bare `git commit` still fails if no identity resolves at all on
      # a fresh runner, and Batch 5 is still adding real-git specs this job
      # does not control. Configuring the runner's global identity and
      # default branch is a cheap safety net so a future spec that forgets
      # its own local config does not fail with "unknown user" instead of a
      # real assertion.
      #
      # Round-1 review (moderate): setting `init.defaultBranch main` globally
      # could in principle mask a spec that relies on discovering the default
      # branch name instead of pinning it, hiding a defect that only shows up
      # on a user machine defaulting to `master`. Scoped to `git-real-git`
      # only (not the `main` job, not a user's machine) and every current
      # real-git spec pins its branch explicitly rather than reading the
      # default, so there is nothing today for this to mask; kept as a
      # runner-determinism safety net per the paragraph above, not removed,
      # per the reviewer's own "acceptable in CI" framing -- flagged here so
      # a future real-git spec that DOES rely on branch auto-detection is a
      # deliberate choice, not an accident of this step.
      - name: Configure git identity and default branch
        run: |
          git config --global user.email "ci-real-git@ptah.test"
          git config --global user.name "ptah-ci-real-git"
          git config --global init.defaultBranch main
          git config --global commit.gpgsign false

      # Same cache strategy as the main job (keyed on runner.os + lockfile
      # hash), but namespaced `node-modules-realgit-...` so this job's save
      # never collides with the main job's save of the plain
      # `node-modules-${{ runner.os }}-...` key when both run concurrently on
      # ubuntu-latest (round-1 review, serious finding: the two jobs
      # previously raced on the identical key, and `main` additionally
      # populates node_modules/.prisma via prisma:generate, which this job
      # does not run -- a shared cache entry could hand either job the
      # other's incomplete artifact set).
      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-realgit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        # Same fallback as the main job: npm/cli#4828 -- a Windows-generated
        # lockfile can omit transitive deps under sass-embedded's catch-all
        # packages, breaking a plain `npm ci` on Linux.
        run: npm ci || npm install --no-audit --no-fund

      - name: Install Linux platform binaries
        if: matrix.os == 'ubuntu-latest'
        # Pure binary packages with no lifecycle scripts, so --ignore-scripts
        # is safe. Versions pinned to the package-lock.json resolution -- bump
        # them together with rollup / unrs-resolver.
        run: npm install @rollup/rollup-linux-x64-gnu@4.63.4 @unrs/resolver-binding-linux-x64-gnu@1.12.2 --no-save --force --ignore-scripts

      # better-sqlite3 ships a prebuilt binary per Node ABI/OS; rebuilding is
      # cheap and idempotent, and guards a cache hit populated for a
      # different Node ABI or OS (same rationale as the main job's step).
      - name: Rebuild native modules for runner Node ABI
        run: npm rebuild better-sqlite3

      - name: Cache Nx task results
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/cache
          key: nx-realgit-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-realgit-${{ runner.os }}-

      # `nx test ptah-electron` already declares build-main,
      # build-embedder-worker, build-integrity-worker,
      # build-state-storage-worker, build-voice-worker and
      # build-workspace-watch-host as `dependsOn` (apps/ptah-electron/project.json:425-432),
      # so Nx builds the native watch host before running its real-git spec
      # on every OS without any extra step here.
      #
      # `--testPathPatterns` (plural) is deliberate, not a typo:
      # `@nx/jest:jest`'s schema (node_modules/@nx/jest/dist/src/executors/jest/schema.json:160)
      # only declares `testPathPatterns`; the singular `--testPathPattern`
      # Jest CLI spelling is not a recognized option, so Nx drops it into
      # `extraArgs` and jest.impl.js:66 still passes `testPathPatterns: []`
      # to `runCLI`, which Jest treats as "match everything" rather than
      # "match nothing". Proven locally (round-1 review caught this as
      # blocking): with the singular flag,
      # `nx test @ptah-extension/vscode-core --testPathPattern=real-git --listTests`
      # lists all 47 suites in the project; with the plural flag it lists
      # exactly the 4 `*.real-git.spec.ts` files that exist on disk today
      # (git-info.service.hooks/paths/diff-config/write-lock.real-git.spec.ts
      # -- the first and last are Batch 5's, proving new real-git specs are
      # picked up with no workflow edit). `nx test ptah-electron
      # --testPathPatterns=real-git --listTests` lists exactly
      # `git-watcher.real-git.spec.ts`.
      #
      # `--passWithNoTests=false` is explicit on both steps: neither
      # project.json sets it, but Jest's own default here is to exit 0 on
      # zero matches ("No tests found, exiting with code 0" -- verified
      # locally against a deliberately-unmatched pattern on both projects).
      # Without this flag a typo'd pattern, or every real-git file being
      # renamed out from under this filter, would report green having run
      # nothing. With the flag, the same unmatched-pattern run exits 1
      # (verified locally); the current real patterns are unaffected (still
      # 4 and 1 suites respectively).
      #
      # `slow` real-git cases (Task 5.2's 60 s hook timeout case, per
      # implementation-plan.md:488-494) are convention-tagged by including
      # the literal substring `[slow]` in the test name; `--testNamePattern`
      # excludes them everywhere except ubuntu-latest, matching Component 9's
      # "skips the slow tag except on ubuntu-latest". `--testNamePattern` is
      # a genuinely separate Jest/Nx option from the path filter above (both
      # singular and plural forms of that one are accepted by Jest itself;
      # only the path-pattern option is Nx-schema-restricted to the plural),
      # so it still reaches Jest unchanged under the corrected invocation.
      # Batch 5 owns adding `[slow]` to that test's `it(...)` description; if
      # it does not, the case simply runs on all three OSes instead of being
      # skipped on two, which fails closed (extra coverage) rather than open.
      # vscode-core: the default `test` target now ignores *.real-git.spec.ts
      # (jest.config.ts); `test-real-git` runs only those, --runInBand
      # (libs/backend/vscode-core/project.json, jest.real-git.config.ts).
      # runInBand and passWithNoTests=false are set in the target options.
      # Use npm's local binary shim rather than `npx`, which can install a
      # package on demand and run its lifecycle scripts (githubactions:S6505,
      # S8543 -- cwe:494, cwe:829), matching the main job's degradation-audit
      # and test steps. The sh shim works under this job's forced bash on all
      # three runners.
      - name: vscode-core real-git specs
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            node_modules/.bin/nx run @ptah-extension/vscode-core:test-real-git
          else
            node_modules/.bin/nx run @ptah-extension/vscode-core:test-real-git --testNamePattern='^(?!.*\[slow\]).*$'
          fi

      - name: ptah-electron real-git specs
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            node_modules/.bin/nx test ptah-electron --testPathPatterns=real-git --passWithNoTests=false
          else
            node_modules/.bin/nx test ptah-electron --testPathPatterns=real-git --passWithNoTests=false --testNamePattern='^(?!.*\[slow\]).*$'
          fi

      # TASK_2026_576 Batch 57: real-process spec for openMergeTool. It writes
      # its own fake `code` (POSIX, chmod 755) / `code.cmd` (Windows) shim into
      # a temp dir and passes its own PATH/PATHEXT to the spawn, so it needs no
      # runner setup and must run on all three OSes (the Windows .cmd path is
      # the point). Plural `--testPathPatterns` and `--passWithNoTests=false`
      # for the same reasons documented above; no `[slow]` cases, so no
      # `--testNamePattern` split.
      - name: platform-electron editor-merge real spec
        run: node_modules/.bin/nx test @ptah-extension/platform-electron --testPathPatterns=editor-merge.real --passWithNoTests=false
