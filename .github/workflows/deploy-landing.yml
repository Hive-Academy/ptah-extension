name: Deploy Landing Page

on:
  push:
    branches:
      - release/landing
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  NX_TUI: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # No npm pin step: node 24 ships npm 11, which reads our npm-11 lockfile
      # directly. This matches the DO buildpack, which uses the npm bundled with
      # the node it installs (see engines.node in the root package.json).

      # Cache node_modules — skips npm ci on cache hit
      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        # Workaround for npm/cli#4828: package-lock.json generated on Windows
        # omits Linux rollup platform binaries. Install them explicitly.
        # Fall back to `npm install` if `npm ci` fails on transitive drift.
        run: |
          npm ci || npm install --no-audit --no-fund
          npm install @rollup/rollup-linux-x64-gnu --no-save --force

      - name: Build landing page
        run: npx nx run-many -t build --projects=ptah-landing-page

      # Fail loudly if the SSG build silently degraded to an empty CSR shell.
      # Asserts the prerendered routes shipped real content instead of an empty
      # <app-root>, in English (TASK_2026_575, requirement 3.5): <html lang="en"
      # dir="ltr">, each route's known English headline, and no raw translation
      # key path rendered as text. The full-text comparison against the
      # committed baselines is tools/i18n-check/src/prerender/check-prerender.ts.
      # NOTE: the dir="ltr" grep only holds once the i18n app wiring renders
      # <html dir> (TASK_2026_575 Batch 9). The pre-i18n build has no dir
      # attribute, so a deploy from this commit alone fails that grep; the
      # task merges as one branch, with the wiring included.
      - name: Assert prerendered content
        run: |
          set -euo pipefail
          DIST="dist/ptah-landing-page/browser"
          fail() { echo "::error::prerender assertion failed: $1"; exit 1; }

          # The start of each route's "h1" in
          # apps/ptah-landing-page/prerender-baseline/<slug>.json. Home's h1 is
          # "It ships<br><span>the SaaS.</span>", so the text before the <br>.
          declare -A HEADLINE=(
            [index.html]="It ships"
            [download/index.html]="Downloads"
            [pricing/index.html]="Ptah Is Free"
            [terms-and-conditions/index.html]="Terms of Service"
            [privacy/index.html]="Privacy Policy"
            [refund/index.html]="Refund Policy"
          )
          # A text node that is a key path of a known i18n scope (anchored on
          # the scope names, because ">ptah.live<" is real copy).
          KEY_PATH='>[[:space:]]*(app|ui|core|landing|legal|pricing|auth|account|members|admin|panelUi)\.[A-Za-z0-9_.-]+[[:space:]]*<'

          for route in "index.html" "download/index.html" "pricing/index.html" \
            "terms-and-conditions/index.html" "privacy/index.html" "refund/index.html"; do
            [ -f "$DIST/$route" ] || fail "$route missing from build output"
            grep -qi "<h1" "$DIST/$route" || fail "$route has no <h1> (empty prerender?)"
            grep -Eq '<html[^>]*\blang="en"' "$DIST/$route" || fail "$route <html> is not lang=\"en\""
            grep -Eq '<html[^>]*\bdir="ltr"' "$DIST/$route" || fail "$route <html> is not dir=\"ltr\""
            grep -Eq "<h1[^>]*>[[:space:]]*${HEADLINE[$route]}" "$DIST/$route" \
              || fail "$route <h1> does not start with \"${HEADLINE[$route]}\""
            if grep -Eq "$KEY_PATH" "$DIST/$route"; then
              fail "$route renders a translation key path: $(grep -Eo "$KEY_PATH" "$DIST/$route" | head -1)"
            fi
            grep -q "<app-root></app-root>" "$DIST/$route" && fail "$route is an empty CSR shell"
          done

          # index.csr.html is the client-bootstrap fallback the catchall points to.
          [ -f "$DIST/index.csr.html" ] || fail "index.csr.html (catchall document) missing"

          # Home route must carry structured data for SEO/GEO.
          grep -q 'application/ld+json' "$DIST/index.html" || fail "index.html missing JSON-LD"

          echo "Prerender content assertion passed for 6 routes + catchall shell."

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Deploy
        run: |
          doctl apps update ${{ secrets.DO_APP_ID }} --spec .do/app.yaml
          doctl apps create-deployment ${{ secrets.DO_APP_ID }} --wait
