# Publish Electron App
#
# Cross-platform Electron builds for Windows, macOS, and Linux.
#
# Distribution channels:
#   * Windows ships ONLY through the Microsoft Store (MSIX/appx). There is no
#     NSIS installer, no code-signing step and nothing Windows-related in the
#     GitHub Release. Microsoft signs the package after certification.
#   * macOS (.dmg/.zip) and Linux (.AppImage/.deb) keep publishing to the
#     GitHub Release, unsigned (macOS signing needs an Apple Developer account).
#
# Workflow:
#   1. Push to release/electron (release-only branch, fed by a single PR from
#      main) OR trigger manually with a bump type.
#   2. Auto-bumps the version (computed in prepare, patched locally in build jobs)
#   3. Checks if the version tag already exists (prevents duplicate releases)
#   4. Builds for all 3 platforms in parallel
#   5. Creates git tag + GitHub Release with the macOS and Linux artifacts
#   6. Submits the Windows Store package to Microsoft Store (`store` job)
#   7. Opens a PR to merge the version bump into main
#
# Dry run: builds, packages, and verifies all three OS legs (including the
# Windows MSIX), while skipping the tag, bump PR, GitHub Release and Store
# submission. Dry-run artifacts must never be distributed.
#
# Version bump goes to a chore/ branch with a PR to main - never pushes back
# to release/electron (which would re-trigger this workflow in an infinite loop).
# A commit message filter provides extra safety.
#
# Microsoft Store (MSIX): every Windows run (dry-run included) builds
# win-unpacked, verifies its native modules, then packs an UNSIGNED Store
# package (*-store.appx) from that tree and uploads it as artifact
# ptah-msstore-<version>. It is never signed here. Identity values are committed in
# apps/ptah-electron/electron-builder.yml (appx block). In publish mode only, the
# `store` job submits it with the msstore CLI, after the GitHub Release. It needs
# repository variables MSSTORE_TENANT_ID, MSSTORE_CLIENT_ID, MSSTORE_SELLER_ID,
# MSSTORE_PRODUCT_ID and secret MSSTORE_CLIENT_SECRET; if any is missing the job
# only prints a notice. Runs upload a draft (no-commit) by default; only a dispatch
# with store-submission=commit submits for certification. The first Store
# submission is done manually in Partner Center.

name: Publish Electron

on:
  push:
    branches:
      - 'release/electron'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (none = release the committed version unchanged)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: patch
      store-submission:
        description: 'Microsoft Store: commit the submission, upload as draft only, or skip. Ignored in dry-run.'
        required: false
        type: choice
        options:
          - no-commit
          - commit
          - skip
        default: no-commit
      dry-run:
        description: 'Build, package and verify on all three OSes; no tag, bump PR, release or Store submission'
        required: false
        type: boolean
        default: false

concurrency:
  # Must match Resolve release mode: only a dry-run input of 'true' is dry-run.
  group: publish-electron-${{ github.event.inputs.dry-run == 'true' && 'dry-run' || 'publish' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: 22
  NX_TUI: false
  # nx.json caps local runs at one task. CI keeps its previous default of 2.
  NX_PARALLEL: 2

jobs:
  prepare:
    runs-on: ubuntu-latest
    # Skip version-bump commits to prevent infinite loop
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    outputs:
      version: ${{ steps.bump.outputs.new_version }}
      tag: ${{ steps.bump.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}
      # Every paid/outward step must positively require publish; missing means no signing/release.
      release_mode: ${{ steps.mode.outputs.release_mode }}
    steps:
      - name: Resolve release mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ github.event.inputs.dry-run }}
        run: |
          # Keep this input predicate in sync with concurrency.group above.
          if [ "$DRY_RUN" = "true" ]; then
            RELEASE_MODE="dry-run"
          else
            RELEASE_MODE="publish"
          fi

          echo "release_mode=$RELEASE_MODE" >> "$GITHUB_OUTPUT"
          echo "release_mode=$RELEASE_MODE" >> "$GITHUB_STEP_SUMMARY"

          if [ "$EVENT_NAME" = "push" ] && [ "$RELEASE_MODE" != "publish" ]; then
            echo "::error::Push releases must resolve to publish mode."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          BUMP_TYPE="${{ github.event.inputs.bump || 'patch' }}"
          OLD_VERSION=$(node -p "require('./apps/ptah-electron/package.json').version")

          # Strip any prerelease / build suffix before parsing so versions
          # like "1.2.3-rc.1" or "1.2.3+build" never produce NaN segments.
          NEW_VERSION=$(node -e "
            const base = '${OLD_VERSION}'.split(/[-+]/)[0];
            const parts = base.split('.').map(Number);
            if (parts.length !== 3 || parts.some(Number.isNaN)) {
              console.error('Invalid base version: ${OLD_VERSION} -> ' + base);
              process.exit(1);
            }
            const [major, minor, patch] = parts;
            const bump = '${BUMP_TYPE}';
            if (bump === 'none') console.log(\`\${major}.\${minor}.\${patch}\`);
            else if (bump === 'major') console.log(\`\${major+1}.0.0\`);
            else if (bump === 'minor') console.log(\`\${major}.\${minor+1}.0\`);
            else console.log(\`\${major}.\${minor}.\${patch+1}\`);
          ")

          # Store-valid, monotonic version guard (all modes): integer segments,
          # major >= 1, each segment <= 65535, and strictly greater than every
          # existing electron-v* tag (the Store only accepts increasing versions).
          NEW_VERSION="$NEW_VERSION" node -e "
            const v = process.env.NEW_VERSION;
            const seg = v.split('.');
            const fail = (m) => { console.error('::error::Version ' + v + ' rejected: ' + m); process.exit(1); };
            if (seg.length !== 3 || !seg.every((s) => /^[0-9]+\$/.test(s))) fail('must be X.Y.Z integers');
            const n = seg.map(Number);
            if (n[0] < 1) fail('major must be >= 1 (Microsoft Store rule)');
            if (n.some((x) => x > 65535)) fail('each segment must be <= 65535 (Microsoft Store rule)');
            const tags = require('child_process').execSync('git tag -l \"electron-v*\"', { encoding: 'utf8' })
              .split('\n').map((t) => t.trim().replace(/^electron-v/, '')).filter((t) => /^[0-9]+\.[0-9]+\.[0-9]+\$/.test(t));
            const cmp = (a, b) => { const x = a.split('.').map(Number), y = b.split('.').map(Number); for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i]; return 0; };
            const higher = tags.find((t) => cmp(t, v) >= 0);
            if (higher) fail('must be strictly greater than existing tag electron-v' + higher);
          "

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('apps/ptah-electron/package.json', 'utf8'));
            pkg.version = '${NEW_VERSION}';
            fs.writeFileSync('apps/ptah-electron/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          echo "old_version=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=electron-v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped $OLD_VERSION -> $NEW_VERSION ($BUMP_TYPE)"

      - name: Check if tag exists
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.bump.outputs.tag }}" | grep -q .; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::error::Tag ${{ steps.bump.outputs.tag }} already exists."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Abort if tag exists
        if: steps.check.outputs.should_release != 'true'
        run: exit 1

      # Version bump is NOT pushed back to release/electron (that would
      # re-trigger this workflow in an infinite loop). Build jobs receive the
      # new version via the prepare.outputs.version output and patch locally.

  # TASK_2026_437 (Batch 10 review fix — code-logic-review.md Serious/D10,
  # code-style-review.md Serious #2). What this matrix actually builds AND
  # PUBLISHES, precisely: neither `electron-builder.yml` nor the `build-args`
  # below pass an `arch:`/`--arm64`/`--x64` override for `mac:` or `win:`, so
  # electron-builder defaults to the HOST runner's own architecture for each
  # leg —
  #   - windows-latest -> win32-x64 (GitHub's Windows runners are x64)
  #   - macos-latest   -> darwin-arm64 (GitHub's macos-latest image is Apple
  #     Silicon; no darwin-x64 (Intel Mac) leg exists or is published)
  #   - ubuntu-latest   -> linux-x64
  # So darwin-x64 and windows-arm64 are NOT built and NOT published by this
  # workflow at all — nothing unproven ships under those two, because nothing
  # ships under them, period. The three OSes actually published (win32-x64,
  # darwin-arm64, linux-x64) ARE proven end-to-end by the
  # `verify-packed-native.js` steps below, including the `@parcel/watcher`
  # check added in Batch 10. If Windows-arm64 or darwin-x64 distribution is
  # ever added, it needs its own matrix leg AND its own native-deps proof —
  # do not assume the existing three legs cover it.
  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-args: --win
          - os: macos-latest
            build-args: --mac
          - os: ubuntu-latest
            build-args: --linux

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Patch version from prepare output
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('apps/ptah-electron/package.json', 'utf8'));
            pkg.version = '${{ needs.prepare.outputs.version }}';
            fs.writeFileSync('apps/ptah-electron/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Patched electron version to ${{ needs.prepare.outputs.version }}"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Cache node_modules per OS — skips npm ci on cache hit
      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        # Fall back to `npm install` if lockfile drift (npm/cli#4828).
        run: npm ci || npm install --no-audit --no-fund

      # Workaround for npm/cli#4828: package-lock.json generated on Windows
      # omits Linux rollup platform binaries. Install them explicitly.
      - name: Install rollup Linux binary (Linux only)
        if: runner.os == 'Linux'
        run: npm install @rollup/rollup-linux-x64-gnu --no-save --force

      # dmg-license is a required dep of dmg-builder but is macOS-native and was excluded
      # from the lock file (generated on Windows). Install it explicitly on macOS.
      - name: Install dmg-license (macOS only)
        if: runner.os == 'macOS'
        run: npm install dmg-license --no-save

      # The node_modules cache is keyed on package-lock.json only, so a cache hit
      # skips postinstall. Re-apply the Windows console-hide dependency patches
      # (idempotent) so a release never ships unpatched SDKs (TASK_2026_625).
      - name: Patch dependencies to hide Windows console windows
        run: node scripts/windows-hide-patch/patch-windows-hide-deps.js

      # Python 3.12+ removed distutils; setuptools restores it for node-gyp native builds
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix Python distutils (native module builds)
        run: 'python -m pip install --only-binary :all: setuptools==84.0.0'

      # Rebuild better-sqlite3 for the runner's Node ABI before the real-native
      # migration tests run, so Jest can require() it directly and the SQL-M
      # tests actually execute. It is recompiled for the Electron ABI by the
      # "Rebuild better-sqlite3 for Electron ABI (pre-pack, from source)" step
      # below, before electron-builder packs node_modules (npmRebuild: false).
      - name: Rebuild better-sqlite3 for runner Node ABI
        run: npm rebuild better-sqlite3

      # Cross-platform gate against Sentry NODE-NESTJS-46/47: runs the
      # persistence-sqlite suite against real better-sqlite3 + the platform's
      # sqlite-vec binary. The SQL-M block auto-detects native availability,
      # so this is the only path that exercises real vec0 DDL and the 0007
      # DROP+CREATE on Windows/macOS/Linux before we ship.
      - name: Run persistence-sqlite native tests (real better-sqlite3 + sqlite-vec)
        run: npx nx test persistence-sqlite

      # TASK_2026_240. The Electron app resolves ContentDownloadService the same
      # way the extension does, so it prunes ~/.ptah/plugins/ against this
      # manifest — a stale one deletes plugin files the user already has.
      - name: Content manifest is current
        run: npm run manifest:check

      - name: Build Electron app
        run: npx nx build ptah-electron

      # Pre-pack guard: refuses to publish if the platform's sqlite-vec
      # native binary is missing on disk — would otherwise ship a broken
      # installer (asarUnpack glob matches nothing) and crash on first run.
      - name: Validate native deps (sqlite-vec binary present)
        run: npx nx validate-deps ptah-electron

      - name: Copy renderer
        run: npx nx copy-renderer ptah-electron

      # CRITICAL: compile better-sqlite3 for the Electron ABI before packaging.
      # The `npm rebuild better-sqlite3` step above built it for the runner's
      # Node ABI so Jest could require() it for the native persistence tests.
      # electron-builder runs with `npmRebuild: false`, so it packs node_modules
      # as-is. better-sqlite3 ships NO Electron-40 prebuilt (only up to
      # electron-v136 / Electron 37), so rebuild-native.js compiles it from
      # source via @electron/rebuild. Without this the installer ships a
      # Node-ABI binary that crashes Electron 40 with NODE_MODULE_VERSION
      # mismatch (Memory/Skills/Cron/Gateway/Corpus all report
      # PERSISTENCE_UNAVAILABLE on first run — Sentry 124004638).
      - name: Rebuild better-sqlite3 for Electron ABI (pre-pack, from source)
        run: node apps/ptah-electron/scripts/rebuild-native.js
        env:
          _CL_: ${{ runner.os == 'Windows' && '/std:c++20' || '' }}
          CXXFLAGS: ${{ runner.os != 'Windows' && '-std=c++20' || '' }}

      # CRITICAL: re-copy the tree-sitter WASM immediately before packing.
      # `nx build` runs copy-wasm.js, but the intervening `nx validate-deps`
      # and `nx copy-renderer` steps depend on build-main, whose cached output
      # is the whole dist/apps/ptah-electron dir snapshotted BEFORE copy-wasm
      # ran — a cache restore wipes wasm/ from dist. Re-running copy-wasm here
      # (idempotent) guarantees the runtime + grammars are present for the asar.
      # Without it the workspace indexer and every AST feature silently no-op
      # (web-tree-sitter.wasm not found in app.asar).
      - name: Copy tree-sitter WASM (re-copy pre-pack)
        run: node scripts/copy-wasm.js dist/apps/ptah-electron

      # Same cache-restore hazard as the WASM re-copy above, one file over:
      # build-main's outputs include dist/apps/ptah-electron/package.json, so a
      # restore brings back the UNPRUNED manifest that Nx generated from the
      # project graph. Packing that manifest walks electron-builder into the
      # renderer's packages and it dies on
      #   production dependency not found  parent=monaco-editor
      #     dependency=dompurify version=3.2.7
      # because it does not read npm `overrides`. Re-run the prune (idempotent).
      # Same order as the local package target: reconcile the declared
      # onnxruntime-node version before packing so verify-packed-onnx.js below
      # guards the CI artifacts too.
      - name: Reconcile onnxruntime-node declared version (pre-pack)
        run: node apps/ptah-electron/scripts/patch-transformers-onnx-dep.js

      - name: Prune renderer-only deps from the packaged manifest (pre-pack)
        run: node apps/ptah-electron/scripts/prune-dist-deps.js

      # macOS / Linux: single-shot package (build app + distributable together).
      # Windows builds win-unpacked (--dir) below and packs the Store appx from it.
      - name: Package for platform
        if: runner.os != 'Windows'
        run: npx electron-builder --config electron-builder.yml --project dist/apps/ptah-electron --publish never ${{ matrix.build-args }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # tree-sitter 0.21.x binding.gyp forces C++17, but Electron V8 headers require C++20
          CXXFLAGS: '-std=c++20'

      # Post-pack gates for macOS/Linux (Windows runs its own copies inside the
      # Windows flow below). Prove the packed better-sqlite3 ABI and the
      # tree-sitter WASM assets are present before shipping.
      #
      # TASK_2026_437 (Batch 10, Task 10.5): verify-packed-native.js also
      # require()s and subscribes the packed @parcel/watcher (the workspace
      # watch host's native dep) from app.asar.unpacked on THIS runner's OS —
      # this leg proves darwin-arm64 (macos-latest) or linux-x64
      # (ubuntu-latest), the only two of those the Batch 1 spike could not
      # reach locally (win32-x64 was proven by hand there;
      # b1-spike-report.md "Platform risk (D10)"). It does NOT prove
      # darwin-x64 or windows-arm64 — see the matrix comment above this job
      # for why nothing ships under those two today.
      - name: Verify packed native deps (better-sqlite3 ABI + @parcel/watcher, macOS/Linux)
        if: runner.os != 'Windows'
        run: node apps/ptah-electron/scripts/verify-packed-native.js

      - name: Verify packed tree-sitter WASM (macOS/Linux)
        if: runner.os != 'Windows'
        run: node apps/ptah-electron/scripts/verify-packed-wasm.js

      - name: Verify packed onnxruntime-node (macOS/Linux)
        if: runner.os != 'Windows'
        run: node apps/ptah-electron/scripts/verify-packed-onnx.js

      # ---- Windows packaging (Store only) -----------------------------------
      # Build win-unpacked ONLY (--dir). No NSIS installer: the Store appx is
      # packed from this tree further below.
      - name: Package Windows (win-unpacked only, no installer)
        if: runner.os == 'Windows'
        run: npx electron-builder --config electron-builder.yml --project dist/apps/ptah-electron --publish never --win --dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          _CL_: /std:c++20

      # Gates: prove the packed better-sqlite3 ABI + tree-sitter WASM are
      # correct in win-unpacked BEFORE it is packed into the appx. verify-packed-native
      # scans dist/release recursively and finds win-unpacked/.../app.asar.unpacked
      # /node_modules/better-sqlite3/build/Release/better_sqlite3.node. WASM lives
      # inside win-unpacked/resources/app.asar (verify-packed-wasm scans for that).
      # TASK_2026_437 (Batch 10, Task 10.5): also verifies packed @parcel/watcher
      # (require + subscribe) — proves win32-x64 only (windows-latest is x64;
      # see the matrix comment above this job for windows-arm64).
      - name: Verify packed native deps (better-sqlite3 ABI + @parcel/watcher, win-unpacked)
        if: runner.os == 'Windows'
        run: node apps/ptah-electron/scripts/verify-packed-native.js

      - name: Verify packed tree-sitter WASM (win-unpacked)
        if: runner.os == 'Windows'
        run: node apps/ptah-electron/scripts/verify-packed-wasm.js

      - name: Verify packed onnxruntime-node (win-unpacked)
        if: runner.os == 'Windows'
        run: node apps/ptah-electron/scripts/verify-packed-onnx.js

      # ---- Microsoft Store package (unsigned; every Windows run) -------------
      - name: Check Store tile assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($n in 'StoreLogo','Square44x44Logo','Square150x150Logo','Wide310x150Logo') {
            $p = "dist/apps/ptah-electron/assets/appx/$n.png"
            if (-not (Test-Path $p)) { throw "Missing Store tile: $p (run apps/ptah-electron/scripts/generate-appx-assets.mjs)" }
          }

      # Packs the already-verified win-unpacked tree as an appx. NEVER sign it:
      # Microsoft re-signs after certification. Assumption: --prepackaged works
      # with the appx target. Fallback if it does not: drop --prepackaged (full
      # repack from dist/apps/ptah-electron) and re-run the three verify-packed-*
      # scripts after it.
      - name: Package Microsoft Store MSIX (appx, unsigned, from win-unpacked)
        if: runner.os == 'Windows'
        run: npx electron-builder --config electron-builder.yml --project dist/apps/ptah-electron --publish never --win appx --prepackaged "${{ github.workspace }}/dist/release/win-unpacked"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find Store package
        if: runner.os == 'Windows'
        id: find-appx
        shell: pwsh
        run: |
          $appx = @(Get-ChildItem -Path "dist\release" -Filter "*-store.appx")
          if ($appx.Count -ne 1) { throw "Expected exactly one *-store.appx in dist\release, found $($appx.Count)" }
          $item = $appx[0]
          Write-Host "Found Store package: $($item.FullName)"
          "appx_path=$($item.FullName)" >> $env:GITHUB_OUTPUT
          "appx_name=$($item.Name)" >> $env:GITHUB_OUTPUT
          "Store package: $($item.Name) ($([math]::Round($item.Length / 1MB, 1)) MB)" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Store package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ptah-msstore-${{ needs.prepare.outputs.version }}
          path: ${{ steps.find-appx.outputs.appx_path }}
          if-no-files-found: error
          retention-days: ${{ needs.prepare.outputs.release_mode == 'publish' && 30 || 5 }}

      # Windows ships only through the Store package uploaded above; nothing from
      # the Windows leg goes into the general (GitHub Release) artifacts.
      - name: Upload artifacts
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: |
            dist/release/
            !dist/release/*.appx
            !dist/release/__appx-*/
            !dist/release/win-unpacked/
            !dist/release/linux-unpacked/
            !dist/release/mac/
            !dist/release/mac-arm64/
          retention-days: ${{ needs.prepare.outputs.release_mode == 'publish' && 30 || 5 }}

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.release_mode == 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unless publishing
        env:
          RELEASE_MODE: ${{ needs.prepare.outputs.release_mode }}
        run: |
          if [ "$RELEASE_MODE" != "publish" ]; then
            echo "::error::Refusing release in mode: $RELEASE_MODE"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Create git tag and version bump PR to main
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          # Renaming this branch requires the same edit in the bump guards of ci.yml, electron-e2e.yml and vscode-e2e.yml.
          BRANCH="chore/bump-electron-v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Tag the release
          git tag -a "$TAG" -m "Electron Desktop App v${VERSION}"
          git push origin "$TAG"

          # Create a fresh branch from main with the version bump
          git fetch origin main
          git checkout -b "$BRANCH" origin/main
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('apps/ptah-electron/package.json', 'utf8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync('apps/ptah-electron/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          if git diff --quiet -- apps/ptah-electron/package.json; then
            echo "::notice::package.json already at v${VERSION} on main; skipping bump commit and PR (tag pushed)."
          else
            git add apps/ptah-electron/package.json
            git commit --no-verify -m "chore(release): electron v${VERSION}"
            git push origin "$BRANCH"

            # Create PR to main
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(release): electron v${VERSION}" \
              --body "Auto-generated version bump after publishing Electron Desktop v${VERSION}."
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Ptah Desktop v${{ needs.prepare.outputs.version }}
          draft: false
          # Old Windows installs show this body in their update dialog; it is
          # their only route to the Store build. Generated notes follow it.
          body: |
            > **Windows users:** from v2.0.0, Ptah for Windows installs and updates only through the
            > [Microsoft Store](https://apps.microsoft.com/detail/9N80K3HFX0JT). There is no `.exe` in
            > this release. Uninstall the old Ptah first, then install Ptah from the Store. Your data in
            > `~/.ptah` stays.
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/latest*.yml

  # Microsoft Store submission (publish only). Runs after the GitHub Release so
  # both channels share one version; a Store failure is re-runnable on its own
  # and never blocks the release. Certification takes days, so this job only
  # submits and reports the current status once.
  store:
    needs: [prepare, build, release]
    if: needs.prepare.outputs.release_mode == 'publish' && (github.event.inputs.store-submission || 'no-commit') != 'skip'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Push-triggered runs have no inputs and upload a draft only; 'commit'
      # happens only when a dispatch selects it.
      STORE_MODE: ${{ github.event.inputs.store-submission || 'no-commit' }}
    steps:
      - name: Refuse unless publishing
        shell: bash
        env:
          RELEASE_MODE: ${{ needs.prepare.outputs.release_mode }}
        run: |
          if [ "$RELEASE_MODE" != "publish" ]; then
            echo "::error::Refusing Store submission in mode: $RELEASE_MODE"
            exit 1
          fi

      - name: Check Store configuration
        id: cfg
        shell: pwsh
        env:
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_TENANT_ID: ${{ vars.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ vars.MSSTORE_CLIENT_ID }}
          MSSTORE_SELLER_ID: ${{ vars.MSSTORE_SELLER_ID }}
          MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
        run: |
          $missing = @()
          foreach ($n in 'MSSTORE_CLIENT_SECRET','MSSTORE_TENANT_ID','MSSTORE_CLIENT_ID','MSSTORE_SELLER_ID','MSSTORE_PRODUCT_ID') {
            if ([string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($n))) { $missing += $n }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::notice::Microsoft Store submission skipped: missing $($missing -join ', '). The MSIX is in artifact ptah-msstore-${{ needs.prepare.outputs.version }}."
            "configured=false" >> $env:GITHUB_OUTPUT
          } else {
            "configured=true" >> $env:GITHUB_OUTPUT
          }

      - name: Download Store package
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ptah-msstore-${{ needs.prepare.outputs.version }}
          path: store-pkg

      - name: Set up msstore CLI
        if: steps.cfg.outputs.configured == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Configure msstore
        if: steps.cfg.outputs.configured == 'true'
        shell: pwsh
        env:
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_TENANT_ID: ${{ vars.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ vars.MSSTORE_CLIENT_ID }}
          MSSTORE_SELLER_ID: ${{ vars.MSSTORE_SELLER_ID }}
        run: |
          msstore reconfigure --tenantId "$env:MSSTORE_TENANT_ID" --sellerId "$env:MSSTORE_SELLER_ID" --clientId "$env:MSSTORE_CLIENT_ID" --clientSecret "$env:MSSTORE_CLIENT_SECRET"
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed" }

      # Assumption: msstore publish accepts an .appx path for an MSIX product;
      # confirmed by the first real submission.
      - name: Submit to Microsoft Store
        if: steps.cfg.outputs.configured == 'true'
        shell: pwsh
        env:
          MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
        run: |
          $appx = @(Get-ChildItem -Path store-pkg -Filter "*.appx" -Recurse)
          if ($appx.Count -ne 1) { throw "Expected exactly one .appx in store-pkg, found $($appx.Count)" }
          $publishArgs = @('publish', $appx[0].FullName, '-id', $env:MSSTORE_PRODUCT_ID)
          if ($env:STORE_MODE -eq 'no-commit') { $publishArgs += '--noCommit' }
          "Microsoft Store submission mode: $env:STORE_MODE ($($appx[0].Name))" >> $env:GITHUB_STEP_SUMMARY
          & msstore @publishArgs
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed" }

      - name: Submission status
        if: steps.cfg.outputs.configured == 'true' && env.STORE_MODE == 'commit'
        continue-on-error: true
        shell: pwsh
        env:
          MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
        run: |
          $out = (msstore submission status $env:MSSTORE_PRODUCT_ID | Out-String)
          "### Store submission status" >> $env:GITHUB_STEP_SUMMARY
          $out >> $env:GITHUB_STEP_SUMMARY
