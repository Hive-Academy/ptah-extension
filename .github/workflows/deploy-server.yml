name: Deploy Server

on:
  push:
    branches:
      - release/server
  # Needed by the Sync Release Branch workflow: a push made with GITHUB_TOKEN
  # does not trigger other workflows, so after it fast-forwards release/server
  # it has to dispatch this one explicitly.
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name (lowercase)
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}/license-server' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ptah-license-server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      # Required: the scp step below ships docker-compose.prod.yml and
      # caddy/Caddyfile from the runner workspace. Without a checkout those
      # files are absent, the copy silently ships nothing but env.prod.tmp,
      # and the droplet keeps running whatever compose/Caddy config it already
      # had — compose and proxy changes never deploy.
      # Must stay the FIRST step: checkout cleans the workspace, which would
      # delete env.prod.tmp if it ran after the write step.
      - uses: actions/checkout@v4

      - name: Set image name (lowercase)
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}/license-server' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Sync .env.prod from the ENV_PROD_FILE secret (single source of truth).
      # Refresh the secret after any local .env.prod change:
      #   gh secret set ENV_PROD_FILE < .env.prod
      # NOTE: this overwrites the droplet copy on every deploy — never hand-edit
      # env on the droplet.
      - name: Write .env.prod from secret
        env:
          # Bound via `env:` rather than interpolated into `run:`. A direct
          # `${{ secrets.X }}` inside the script splices the secret's raw text
          # into the shell SOURCE before bash parses it, so a backtick, $(...)
          # or trailing backslash in .env.prod gets executed or swallows the
          # next line — silently corrupting the file written to the droplet.
          ENV_PROD_FILE: ${{ secrets.ENV_PROD_FILE }}
        run: |
          if [ -z "$ENV_PROD_FILE" ]; then
            echo "::error::ENV_PROD_FILE secret is not set — run: gh secret set ENV_PROD_FILE < .env.prod"
            exit 1
          fi
          printf '%s' "$ENV_PROD_FILE" > env.prod.tmp

      # scp-action tars whatever of `source` it finds and succeeds on a partial
      # match, so a missing or renamed file here ships nothing and still shows a
      # green deploy. Assert the set explicitly instead.
      - name: Verify deploy payload exists
        run: |
          for f in env.prod.tmp docker-compose.prod.yml caddy/Caddyfile; do
            if [ ! -f "$f" ]; then
              echo "::error::deploy payload missing: $f"
              exit 1
            fi
          done

      - name: Copy .env.prod to Droplet
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: env.prod.tmp,docker-compose.prod.yml,caddy/Caddyfile
          target: /opt/ptah-extension/

      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/ptah-extension
            mv -f env.prod.tmp .env.prod
            chmod 600 .env.prod
            docker compose --env-file .env.prod -f docker-compose.prod.yml pull license-server
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
            # Caddyfile is a SINGLE-FILE bind mount, so the container binds its
            # inode, not its path. The scp above extracts via tar, which unlinks
            # and recreates the file — new inode. `up -d` leaves caddy alone
            # (image and service config unchanged), so it would keep serving the
            # pre-deploy config forever. Recreate to re-resolve the mount.
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --force-recreate caddy
            docker image prune -f
