name: Electron E2E

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '.claude/**'
      - 'LICENSE.md'
      - '.do/**'
  workflow_dispatch:
    inputs:
      run_perf:
        description: Run the @perf benchmark only (the default for manual dispatch).
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '30 2 * * *'

concurrency:
  group: electron-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # 24, not 22: node 22 ships npm 10, which cannot resolve our npm-11 lockfile
  # and silently degrades `npm ci` into an unpinned `npm install` fallback.
  # Node 24 bundles npm 11, which is why package.json pins engines.node to
  # `24.x` and declares no engines.npm at all -- the DO buildpack string-
  # compares engines.npm and self-installs npm when it differs, which crashes.
  # The publish-* workflows stay on 22 deliberately -- they match release targets.
  NODE_VERSION: 24
  NX_TUI: false

jobs:
  electron-e2e-shard:
    name: electron-e2e (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    # 45, not 30: the suite only started running to completion once the 11
    # failing specs were fixed — earlier runs bailed early at 13-18m.
    # Four shards keep each test segment safely below 30 minutes; the former
    # single-shard suite needed 45 minutes once all 244 specs ran to completion.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Skip closed/merged PRs and bot bumps from publish-cli.yml,
    # publish-electron.yml, and publish-extension.yml: chore/bump-cli-v*,
    # chore/bump-electron-v*, and chore/bump-extension-v*. Human
    # chore/bump-<dep> branches run CI; PR #512 was skipped by the old broad guard.
    # Accepted residual: a human chore/bump-electron-v… branch still skips. On
    # pull_request, head_commit is null; workflow_dispatch head_ref is empty and runs.
    if: |
      github.event_name != 'schedule' &&
      !(github.event_name == 'workflow_dispatch' && inputs.run_perf) &&
      (github.event_name != 'pull_request' || github.event.pull_request.state == 'open') &&
      !startsWith(github.head_ref, 'chore/bump-cli-v') &&
      !startsWith(github.head_ref, 'chore/bump-electron-v') &&
      !startsWith(github.head_ref, 'chore/bump-extension-v') &&
      !contains(github.event.head_commit.message, 'chore(release)')
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          # v2: bust cache after corrupted entries (broken monaco-editor
          # symlinks, missing platform binaries) caused copy-renderer to fail.
          key: node-modules-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        # Lockfile only, no `npm install` fallback (githubactions:S8543).
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Always run — cached node_modules may be missing Linux platform
      # binaries (npm/cli#4828: package-lock.json generated on Windows omits
      # them). Without unrs-resolver, Angular's build emits incomplete
      # output (missing index.html in browser/), breaking copy-renderer.
      - name: Install Linux platform binaries
        run: npm install @rollup/rollup-linux-x64-gnu@4.63.4 @unrs/resolver-binding-linux-x64-gnu@1.12.2 --no-save --force --ignore-scripts

      # The install above skips lifecycle scripts, which also skips the root
      # postinstall. Run it explicitly on a fresh install: it builds
      # better-sqlite3 for the Electron ABI (not the Node ABI) and fetches the
      # Electron binary. A cache hit already holds that Electron build.
      - name: Rebuild native modules for Electron
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: |
          node apps/ptah-electron/scripts/rebuild-native.js
          node apps/ptah-electron/scripts/patch-transformers-onnx-dep.js

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # `_electron.launch()` does not need a Playwright browser, but
      # `--with-deps` installs the system libs Electron needs (libnss3,
      # libgbm, libasound2, ...). Cheaper than a separate apt step.
      - name: Install Playwright system deps
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Install xvfb (headless Electron needs an X server)
        run: sudo apt-get update && sudo apt-get install -y xvfb dbus

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main

      # Build the Electron app + renderer ahead of time. The e2e Nx target
      # also depends on these via `dependsOn`, but running them explicitly
      # here gives clearer log sections in CI and lets the e2e step focus
      # purely on Playwright execution.
      - name: Build Electron main + preload (development)
        run: node_modules/.bin/nx run ptah-electron:build-dev

      - name: Copy renderer assets into Electron dist
        run: node_modules/.bin/nx run ptah-electron:copy-renderer-dev

      - name: Run Electron E2E specs under xvfb
        run: xvfb-run --auto-servernum dbus-run-session -- node_modules/.bin/nx run ptah-electron-e2e:e2e --skip-nx-cache -- --grep-invert @perf --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-playwright-report-${{ matrix.shard }}
          path: dist/apps/ptah-electron-e2e/playwright-report/
          retention-days: 7

      - name: Upload test-results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-test-results-${{ matrix.shard }}
          path: dist/apps/ptah-electron-e2e/test-results/
          retention-days: 7

  electron-e2e:
    name: electron-e2e
    needs: [electron-e2e-shard]
    runs-on: ubuntu-latest
    permissions: {}
    # Nightly/manual perf runs skip both this summary and the normal shards;
    # electron-e2e-perf is their sole required job, avoiding a skipped
    # matrix result being treated as a normal-suite failure.
    if: |
      always() &&
      github.event_name != 'schedule' &&
      !(github.event_name == 'workflow_dispatch' && inputs.run_perf) &&
      (github.event_name != 'pull_request' || github.event.pull_request.state == 'open') &&
      !startsWith(github.head_ref, 'chore/bump-cli-v') &&
      !startsWith(github.head_ref, 'chore/bump-electron-v') &&
      !startsWith(github.head_ref, 'chore/bump-extension-v') &&
      !contains(github.event.head_commit.message, 'chore(release)')
    steps:
      - name: Require all Electron E2E shards
        env:
          SHARDS_RESULT: ${{ needs['electron-e2e-shard'].result }}
        shell: bash
        run: |
          if [ "$SHARDS_RESULT" != 'success' ]; then
            echo "electron-e2e-shard=$SHARDS_RESULT"
            exit 1
          fi

  electron-e2e-perf:
    name: electron-e2e-perf
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_perf)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Linux platform binaries
        run: npm install @rollup/rollup-linux-x64-gnu@4.63.4 @unrs/resolver-binding-linux-x64-gnu@1.12.2 --no-save --force --ignore-scripts

      # Lifecycle scripts were skipped above; run the root postinstall that
      # builds better-sqlite3 for the Electron ABI and fetches Electron.
      - name: Rebuild native modules for Electron
        run: |
          node apps/ptah-electron/scripts/rebuild-native.js
          node apps/ptah-electron/scripts/patch-transformers-onnx-dep.js

      - name: Install Playwright system deps
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb dbus

      - name: Build Electron main + preload (development)
        run: node_modules/.bin/nx run ptah-electron:build-dev

      - name: Copy renderer assets into Electron dist
        run: node_modules/.bin/nx run ptah-electron:copy-renderer-dev

      - name: Run Electron performance benchmark under xvfb
        run: xvfb-run --auto-servernum dbus-run-session -- node_modules/.bin/nx run ptah-electron-e2e:e2e --skip-nx-cache -- --grep @perf
