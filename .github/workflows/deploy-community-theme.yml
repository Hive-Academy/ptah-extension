name: Deploy Community Theme

# Promotion-gated, matching deploy-docs.yml / deploy-landing.yml: merge theme
# work to main freely, then push release/community to publish it to
# community.ptah.live. Path filter keeps unrelated release/community pushes
# from re-importing the theme.
on:
  push:
    branches:
      - release/community
    paths:
      - 'apps/ptah-discourse-theme/**'
      - '.github/workflows/deploy-community-theme.yml'
  workflow_dispatch:

concurrency:
  group: deploy-community-theme
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  NX_TUI: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # engines.npm >= 11; node 22 ships npm 10, which rejects our npm-11 lockfile.
      - name: Pin npm to 11
        run: npm install -g npm@^11.0.0

      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        # Workaround for npm/cli#4828: package-lock.json generated on Windows
        # omits Linux rollup platform binaries. Install them explicitly.
        run: |
          npm ci || npm install --no-audit --no-fund
          npm install @rollup/rollup-linux-x64-gnu --no-save --force

      # Validates about.json, locales/en.yml and every declared asset path, then
      # packages the bundle. Fails the job before anything touches the forum.
      - name: Validate and package theme
        run: npx nx build ptah-discourse-theme

      - name: Deploy to community.ptah.live
        env:
          DISCOURSE_THEME_API_KEY: ${{ secrets.DISCOURSE_THEME_API_KEY }}
          DISCOURSE_THEME_API_USERNAME: ${{ vars.DISCOURSE_THEME_API_USERNAME || 'system' }}
          # Pinning the id makes the import update the live theme in place
          # instead of creating a duplicate on every deploy.
          DISCOURSE_THEME_ID: ${{ vars.DISCOURSE_THEME_ID }}
        run: npx nx deploy ptah-discourse-theme --configuration=production

      - name: Smoke check
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://community.ptah.live/)
          echo "community.ptah.live -> $code"
          test "$code" = "200"
